// ===== fullscreen ===== the 3D renders across the whole window; the 2D HUD is
// drawn inside a centered, uniformly-scaled W×H box (contain). hudScale/Off map
// that box onto the real (device-pixel) HUD canvas; _toVirtual inverts it so
// clicks/taps still land on the right buttons.
let hudScale = 1, hudOffX = 0, hudOffY = 0;
function _toVirtual(clientX, clientY, r) {
  const s = Math.min(r.width / W, r.height / H);
  const ox = (r.width - W * s) / 2, oy = (r.height - H * s) / 2;
  return [(clientX - r.left - ox) / s, (clientY - r.top - oy) / s];
}

function __recordError(src, err) {
  const msg = (err && (err.stack || err.message)) ? (err.stack || err.message) : String(err);
  __lastError = { src, msg, at: Date.now() };
  try { console.error('[' + src + ']', err); } catch (_) {}
}
window.addEventListener('error', e => __recordError('window.onerror', e.error || e.message));
window.addEventListener('unhandledrejection', e => __recordError('unhandledrejection', e.reason));
function __safe(name, fn) {
  return function(...args) {
    try { return fn.apply(this, args); }
    catch (e) { __recordError(name, e); }
  };
}
function __drawErrorOverlay() {
  if (!__lastError) return;
  ctx.setTransform(typeof hudScale === 'number' ? hudScale : 1, 0, 0, typeof hudScale === 'number' ? hudScale : 1, hudOffX || 0, hudOffY || 0);
  const lines = __lastError.msg.split('\n').slice(0, 8);
  const boxH = 28 + lines.length * 14;
  ctx.fillStyle = 'rgba(120,0,0,0.92)';
  ctx.fillRect(0, H - boxH, W, boxH);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left';
  ctx.fillText('CAUGHT [' + __lastError.src + ']  (tap to dismiss)', 8, H - boxH + 14);
  ctx.font = '10px monospace';
  lines.forEach((ln, i) => ctx.fillText(ln.slice(0, 110), 8, H - boxH + 28 + i * 14));
}
canvasHud.addEventListener('click', () => { __lastError = null; });

async function claimUsername(desired) {

  if (!clean) return { ok: false, empty: true };

  try {
    await _initFirebase();
    if (!_fbDb || !_fbHelpers || !_fbHelpers.runTransaction) { _setUsername(clean); return { ok: true, offline: true }; }
    const uid = _playerUid();
    const ref = _fbHelpers.ref(_fbDb, 'usernames/' + key);

      if (cur === null) return { uid, name: clean, ts: Date.now() };  // free → claim it
      if (cur.uid === uid) return cur;                                 // already yours → keep
      return undefined;                                                // taken by someone else → abort

    // release your PREVIOUS name if it was different and still yours
    const oldKey = (playerName || '').toLowerCase();

      try { await _fbHelpers.runTransaction(_fbHelpers.ref(_fbDb, 'usernames/' + oldKey), (c) => (c && c.uid === uid) ? null : c); } catch (e) {}
    }

const CHEST_PALETTE = {
  common:    { base: '#9a9a9a', dark: '#5a5a5a', trim: '#cfcfcf', glow: '#cccccc', gem: null },
  uncommon:  { base: '#8a5a2b', dark: '#5a3a18', trim: '#b88040', glow: '#caa470', gem: null },
  rare:      { base: '#8a5a2b', dark: '#5a3a18', trim: '#4fc3f7', glow: '#4fc3f7', gem: null },
  epic:      { base: '#7e2db4', dark: '#4a1864', trim: '#cc44ff', glow: '#cc44ff', gem: null },
  legendary: { base: '#7e2db4', dark: '#4a1864', trim: '#ffd700', glow: '#ffe066', gem: '#22ff88' },
};
function drawChestArt(c, x, y, w, h, rarity, lidOpen) {
  const p = CHEST_PALETTE[rarity] || CHEST_PALETTE.common;
  const bodyH = h * 0.6;
  const bodyY = y + h * 0.4;
  // Body
  c.fillStyle = p.base; c.fillRect(x, bodyY, w, bodyH);
  c.strokeStyle = p.trim; c.lineWidth = 1.5;
  c.strokeRect(x, bodyY, w, bodyH);
  c.fillStyle = p.dark;
  c.fillRect(x, bodyY + bodyH * 0.42, w, bodyH * 0.10);
  c.fillRect(x + w / 2 - 1.5, bodyY, 3, bodyH);
  // Lid (rotates open via lidOpen 0..1)
  c.save();
  const hinge = bodyY;
  c.translate(x + w / 2, hinge);
  c.rotate(-(lidOpen || 0) * 1.45);
  c.translate(-(x + w / 2), -hinge);
  c.fillStyle = p.base;
  c.beginPath();
  c.moveTo(x, bodyY);
  c.lineTo(x, y + h * 0.16);
  c.quadraticCurveTo(x + w / 2, y - h * 0.05, x + w, y + h * 0.16);
  c.lineTo(x + w, bodyY);
  c.closePath(); c.fill();
  c.strokeStyle = p.trim; c.lineWidth = 1.5; c.stroke();
  // Lock plate
  c.fillStyle = p.trim;
  c.fillRect(x + w / 2 - 4, bodyY - h * 0.08, 8, h * 0.10);
  c.fillStyle = '#1a1a1a';
  c.fillRect(x + w / 2 - 1.2, bodyY - h * 0.05, 2.4, h * 0.05);
  // Emeralds for legendary
  if (p.gem) {
    c.fillStyle = p.gem;
    c.beginPath(); c.arc(x + w * 0.22, y + h * 0.18, Math.max(2, h * 0.05), 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(x + w * 0.78, y + h * 0.18, Math.max(2, h * 0.05), 0, Math.PI * 2); c.fill();
  }
  c.restore();
}

function checkQuestReset() {
  if (Date.now() - questResetAt >= QUEST_RESET_MS) {
    questProgress = {};

    localStorage.setItem('headon_quest_progress', '{}');
    localStorage.setItem('headon_quest_reset_at', questResetAt);
  }

function saveQuests() { localStorage.setItem('headon_quest_progress', JSON.stringify(questProgress)); }
function questDone(id) { const q=QUESTS.find(q=>q.id===id); return q && (questProgress[id]?.progress||0) >= q.goal; }
function addQP(id, amount) {
  const q=QUESTS.find(q=>q.id===id); if(!q||questProgress[id]?.claimed) return;
  if(!questProgress[id]) questProgress[id]={progress:0,claimed:false};
  questProgress[id].progress = Math.min(q.goal, questProgress[id].progress + amount);
  saveQuests();
}
function triggerQP(id, value) {
  const q=QUESTS.find(q=>q.id===id); if(!q||questProgress[id]?.claimed) return;
  if(!questProgress[id]) questProgress[id]={progress:0,claimed:false};
  if(value >= q.goal) questProgress[id].progress = q.goal;
  saveQuests();
}
function claimQuest(id) {
  if(!questDone(id)||questProgress[id]?.claimed) return;
  const q=QUESTS.find(q=>q.id===id);
  questProgress[id].claimed=true; setCoins(coins+q.reward); saveQuests();
  // Quests also grant XP toward your level — the reward value doubles as XP.
  playerXp += q.reward;
  while (playerXp >= xpForLevel(playerLevel)) { playerXp -= xpForLevel(playerLevel); playerLevel++; }
  localStorage.setItem('headon_xp', playerXp);
  localStorage.setItem('headon_level', playerLevel);
}

function makeRoadTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 1024;
  const r = c.getContext('2d');
  r.fillStyle = '#3a3a3a'; r.fillRect(0,0,256,1024);
  // alternating bands
  r.fillStyle = '#454545';
  for (let i = 0; i < 1024; i += 80) if ((Math.floor(i/80)%2)===0) r.fillRect(0,i,256,40);
  // dashed lane stripes (LANE_COUNT - 1 stripes)
  r.fillStyle = '#ffd54a';
  for (let s = 1; s < LANE_COUNT; s++) {
    const sx = (256 / LANE_COUNT) * s;
    for (let i = 0; i < 1024; i += 80) r.fillRect(sx - 4, i, 8, 40);
  }
  // rumble strips
  r.fillStyle = '#ffffff';
  for (let i = 0; i < 1024; i += 60) {
    if ((Math.floor(i/60)%2)===0) {
      r.fillRect(0, i, 6, 30);
      r.fillRect(250, i, 6, 30);
    } else {
      r.fillStyle = '#cc1f1f';
      r.fillRect(0, i, 6, 30);
      r.fillRect(250, i, 6, 30);
      r.fillStyle = '#ffffff';
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

// Build helpers in a (Depth, Perp) frame so the 3 wings share one code path.
// dAxis = which world axis is "depth" (outward): 'z' for the back wing, 'x' for side wings.
function _wallSeg(dAxis, dVal, pFrom, pTo) {        // wall perpendicular to the depth axis
  const len = Math.abs(pTo - pFrom), pc = (pFrom + pTo) / 2;
  if (dAxis === 'z') _wall(len, 0.3, pc, dVal); else _wall(0.3, len, dVal, pc);
}
function _sideWall(dAxis, dFrom, dTo, pVal) {       // wall running along the depth axis
  const len = Math.abs(dTo - dFrom), dc = (dFrom + dTo) / 2;
  if (dAxis === 'z') _wall(0.3, len, pVal, dc); else _wall(len, 0.3, dc, pVal);
}
function _floorBox(dAxis, dFrom, dTo, pHalf) {
  const len = Math.abs(dTo - dFrom), dc = (dFrom + dTo) / 2;
  if (dAxis === 'z') _floor(pHalf * 2, len, 0, dc); else _floor(len, pHalf * 2, dc, 0);
}
// One wing: doorway in the front-room wall → hallway → room, with mode pads inside.
function _wing(dAxis, sign, portals) {
  const H = LOBBY_HALF_X;
  const wallD = sign * H;
  const hallEnd = sign * (H + HALL_LEN);
  const roomFar = sign * (H + HALL_LEN + 2 * ROOM_HALF);
  const roomCtrD = sign * (H + HALL_LEN + ROOM_HALF);
  // front-room wall (two segments, central doorway)
  _wallSeg(dAxis, wallD, -H, -DOOR_HX);
  _wallSeg(dAxis, wallD,  DOOR_HX, H);
  // hallway: floor + side walls
  _floorBox(dAxis, wallD, hallEnd, DOOR_HX);
  _sideWall(dAxis, wallD, hallEnd, -DOOR_HX);
  _sideWall(dAxis, wallD, hallEnd,  DOOR_HX);
  // room: floor, near wall (doorway), far wall, side walls
  _floorBox(dAxis, hallEnd, roomFar, ROOM_HALF);
  _wallSeg(dAxis, hallEnd, -ROOM_HALF, -DOOR_HX);
  _wallSeg(dAxis, hallEnd,  DOOR_HX, ROOM_HALF);
  _wallSeg(dAxis, roomFar, -ROOM_HALF, ROOM_HALF);
  _sideWall(dAxis, hallEnd, roomFar, -ROOM_HALF);
  _sideWall(dAxis, hallEnd, roomFar,  ROOM_HALF);
  // room light
  const lx = dAxis === 'x' ? roomCtrD : 0, lz = dAxis === 'z' ? roomCtrD : 0;
  const al = new THREE.PointLight(0xffffff, 0.75, 80); al.position.set(lx, LOBBY_WALL_H * 0.4, lz); lobbyGroup.add(al);
  // mode pads pushed out AROUND the room walls (left → far → right), leaving the
  // doorway (near) wall clear. Distributed evenly along that U-shaped perimeter.
  const n = portals.length;
  const INSET = 4;
  const dNearI = sign * (H + HALL_LEN) + sign * INSET;        // just inside the doorway wall
  const dFarI  = sign * (H + HALL_LEN + 2 * ROOM_HALF) - sign * INSET; // just inside the far wall
  const pL = -ROOM_HALF + INSET, pR = ROOM_HALF - INSET;
  const segD = Math.abs(dFarI - dNearI), segP = Math.abs(pR - pL);
  const total = segD + segP + segD;
  portals.forEach((p, i) => {
    const dist = ((i + 0.5) / Math.max(1, n)) * total;
    let d, pp;
    if (dist < segD)              { const u = dist / segD;                   d = dNearI + (dFarI - dNearI) * u; pp = pL; }
    else if (dist < segD + segP)  { const u = (dist - segD) / segP;          d = dFarI;  pp = pL + (pR - pL) * u; }
    else                          { const u = (dist - segD - segP) / segD;   d = dFarI + (dNearI - dFarI) * u; pp = pR; }
    const px = dAxis === 'z' ? pp : d;
    const pz = dAxis === 'z' ? d  : pp;
    LOBBY_PORTALS.push({ id: p.id, label: p.label, color: p.color, x: px, z: pz, action: p.action });
  });
}

// Your equipped CAR trail also streams behind your walking avatar. Emits fading
// puffs (coloured by getTrailColor, so rainbow/fire/etc. all carry over) into
// `group` as the avatar moves, and ages out the old ones each frame.
const _avatarTrailGeo = new THREE.SphereGeometry(0.5, 8, 6);
function avatarTrailStep(group, x, z, heading, moving, t) {
  if (!group.userData._trail) group.userData._trail = [];
  const trail = group.userData._trail;
  if (moving > 0.6) {
    const back = 0.6;
    const px = x - Math.sin(heading) * back, pz = z - Math.cos(heading) * back;
    const m = new THREE.Mesh(_avatarTrailGeo, new THREE.MeshBasicMaterial({
      color: new THREE.Color(getTrailColor(t)), transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    m.position.set(px, 0.4 + Math.random() * 0.5, pz);
    const s = 0.5 + Math.random() * 0.3; m.scale.set(s, s, s);
    group.add(m);
    trail.push({ m, age: 0 });
    if (trail.length > 90) { const old = trail.shift(); group.remove(old.m); old.m.material.dispose(); }
  }
  const LIFE = 75;
  for (let i = trail.length - 1; i >= 0; i--) {
    const p = trail[i]; p.age++;
    if (p.age >= LIFE) { group.remove(p.m); p.m.material.dispose(); trail.splice(i, 1); continue; }
    const f = 1 - p.age / LIFE;
    p.m.material.opacity = 0.8 * f;
    const sc = p.m.scale.x * 0.985; p.m.scale.set(sc, sc, sc);
    p.m.position.y += 0.01;
  }
}

function updatePvpLobby(dt) {

  const fwd   = ((keys['arrowup']  ||keys['w']) ? 1 : 0) - ((keys['arrowdown']||keys['s']) ? 1 : 0);
  pvpCar.heading += steer * Math.min(1, Math.abs(pvpCar.vfwd) / 4) * 2.4 * dts;
  const targetV = fwd > 0 ? 11 : fwd < 0 ? -7 : 0;
  const accel = fwd !== 0 ? 16 : 12;
  pvpCar.vfwd += Math.max(-accel * dts, Math.min(accel * dts, targetV - pvpCar.vfwd));
  const sinH = Math.sin(pvpCar.heading), cosH = Math.cos(pvpCar.heading);
  let nx = pvpCar.x + sinH * pvpCar.vfwd * dts;
  let nz = pvpCar.z + cosH * pvpCar.vfwd * dts;
  const HC = 1.4;
  for (let pass = 0; pass < 2; pass++) for (const w of PVP_WALLS) {
    const ox = (HC + w.hx) - Math.abs(nx - w.cx);
    const oz = (HC + w.hz) - Math.abs(nz - w.cz);

  }

  pvpOnPodium = null;
  for (const p of PVP_PODIUMS) {
    const dx = pvpCar.x - p.x, dz = pvpCar.z - p.z;
    if (dx * dx + dz * dz < 2.6 * 2.6) { pvpOnPodium = p.id; break; }
  }
  // Driving onto a podium picks that match's mode (1v1 / 2v2) and opens the
  // weapon/map select screen.
  if (pvpOnPodium != null) {
    const pd = PVP_PODIUMS.find(p => p.id === pvpOnPodium);
    const pod = pd ? PVP_PODS[pd.pod] : null;
    pvpMatchMode = (pod && pod.mode) || '1v1';
    enterPvpSetup();
  }
  // walk onto the armory station → open the weapon gallery (edge-triggered)
  const onArm = Math.hypot(pvpCar.x - PVP_ARMORY.x, pvpCar.z - PVP_ARMORY.z) < 2.6;

}

// Ground support height from any PvP ramp under (px,pz), or -Infinity if none.
function pvpRampSupport(px, pz) {
  let best = -Infinity;
  for (const r of pvpRamps) {
    const dx = r.x1 - r.x0, dz = r.z1 - r.z0;
    const len2 = dx * dx + dz * dz || 1;
    let t = ((px - r.x0) * dx + (pz - r.z0) * dz) / len2;
    t = Math.max(0, Math.min(1, t));
    const cxp = r.x0 + dx * t, czp = r.z0 + dz * t;
    if (Math.hypot(px - cxp, pz - czp) <= r.width / 2) {
      const y = r.y0 + (r.y1 - r.y0) * t;
      if (y > best) best = y;
    }
  }
  return best;
}

// Is world point (x,y,z) inside a solid platform (below its top)? Used to stop
// bullets at walls and to keep fighters from walking through platforms.
function pvpSolidAt(x, y, z) {
  for (const pl of pvpPlatforms) {
    if (Math.abs(x - pl.x) < pl.hx && Math.abs(z - pl.z) < pl.hz && y > 0 && y < pl.top) return true;
  }
  return false;
}
// Push a fighter {x,z,y} out of any platform it's overlapping from the side
// (can't walk under/through a wall). Skips when it's standing on a ramp.
function pvpClampToPlatforms(ent) {
  const rs = pvpRampSupport(ent.x, ent.z);
  if (rs > -50 && ent.y <= rs + 1.6) return;
  for (const pl of pvpPlatforms) {
    if (ent.y < pl.top - 0.4) {
      const HC = 1.0;
      const ox = (pl.hx + HC) - Math.abs(ent.x - pl.x);
      const oz = (pl.hz + HC) - Math.abs(ent.z - pl.z);
      if (ox > 0 && oz > 0) {
        if (ox < oz) ent.x += (ent.x > pl.x ? ox : -ox);
        else ent.z += (ent.z > pl.z ? oz : -oz);
      }
    }
  }
}
// Is fighter f in the player's line of sight (not hidden behind a platform)?
function pvpEnemyVisible(f) {
  if (!f) return false;
  const ax = arenaPlayer.x, ay = arenaPlayer.y + 1.5, az = arenaPlayer.z;
  const bx = f.x, by = f.y + 1.4, bz = f.z;
  const N = 10;
  for (let i = 1; i < N; i++) {
    const t = i / N, px = ax + (bx - ax) * t, py = ay + (by - ay) * t, pz = az + (bz - az) * t;
    for (const pl of pvpPlatforms) {
      if (Math.abs(px - pl.x) < pl.hx && Math.abs(pz - pl.z) < pl.hz && py < pl.top) return false;
    }
  }
  return true;
}

// Resolve the map like an online lobby vote: your pick + one random pick per other
// player, then a random vote wins (so your pick has 1/players chance).
function pvpResolveMapVote() {
  const players = pvpMatchMode === '2v2' ? 4 : 2;
  const votes = [pvpMapId];
  for (let i = 1; i < players; i++) votes.push(Math.floor(Math.random() * PVP_MAPS.length));
  pvpMapId = votes[Math.floor(Math.random() * votes.length)];
}

// On-foot avatar movement — FPS style. The MOUSE turns you (handled in the
// mousemove/pointermove listeners, via relative deltas → arenaPlayer.heading +
// pvpLookPitch, so a still mouse never drifts). Movement keys STRAFE relative to
// where you face: W/S forward-back, A/D left-right. They do NOT turn you.
function updatePvpAvatarMove(dt) {
  if (pvpRoundOver || pvpPlayerHP <= 0 || pvpCountdown > 0) { arenaPlayer.vx = 0; arenaPlayer.vz = 0; arenaPlayer.fwd = 0; pvpAiming = false; return; } // frozen (start countdown / round-over / dead)
  pvpAiming = !!keys['e'] || pvpRmbAim || pvpPointerAim;
  if (arenaPlayer.onGround) pvpJumpsUsed = 0;            // grounded → jumps refresh
  if (pvpSlideTimer > 0) {                               // sliding overrides normal movement
    pvpSlideTimer -= dt;
    const t = Math.max(0, pvpSlideTimer / 480);
    arenaPlayer.vx = pvpSlideVX * (0.4 + 0.6 * t);
    arenaPlayer.vz = pvpSlideVZ * (0.4 + 0.6 * t);
    arenaPlayer.fwd = Math.hypot(arenaPlayer.vx, arenaPlayer.vz);
    pvpAiming = false;
    return;
  }
  const fwd    = ((keys['arrowup']   || keys['w']) ? 1 : 0) - ((keys['arrowdown']  || keys['s']) ? 1 : 0);
  const strafe = ((keys['arrowright']|| keys['d']) ? 1 : 0) - ((keys['arrowleft']  || keys['a']) ? 1 : 0);
  const wt = pvpWeaponWeight(pvpActiveWeapon());   // heavy guns slow you down, light ones speed you up
  const sp = PVP_FOOT_SPEED * (pvpAiming ? 0.5 : 1) * wt;
  const sinH = Math.sin(arenaPlayer.heading), cosH = Math.cos(arenaPlayer.heading);
  // strafe sign flipped so the RIGHT key moves you right (was reversed)
  arenaPlayer.vx = sinH * fwd * sp - cosH * strafe * sp;
  arenaPlayer.vz = cosH * fwd * sp + sinH * strafe * sp;
  arenaPlayer.fwd = fwd * sp;
}
// Apply a relative look delta (mouse pointer-lock movement, or a touch drag).
function pvpLook(dx, dy) {
  arenaPlayer.heading -= dx * 0.0034;   // mouse left → look left (a bit quicker turn)
  pvpLookPitch = Math.max(-1.35, Math.min(1.35, pvpLookPitch - dy * 0.0022)); // near straight up/down
}

// Fire the chosen main weapon forward (called on F or click).
function pvpActiveWeapon() {
  if (pvpActiveSlot === 2) return pvpLoadout.secondary;
  if (pvpActiveSlot === 3) return pvpLoadout.melee;
  if (pvpActiveSlot === 4) return pvpLoadout.utility;
  return pvpLoadout.primary; // slot 1
}
function reloadPvp() {
  if (pvpRoundOver || pvpReloading > 0) return;
  const id = pvpActiveWeapon(), w = PVP_WEAPONS[id];
  if (w.kind === 'melee') return;
  const am = pvpAmmo[id];
  if (!am || am.mag >= w.mag || am.reserve <= 0) return;
  pvpReloading = w.reload; pvpReloadId = id;
}
// How inaccurate your shots are RIGHT NOW, as a random cone half-angle (radians).
// Standing still + aiming ≈ 0 (dead centre). Running, being in the air, and rapid
// firing all open it up. The crosshair (drawPvpReticle) is drawn from this SAME
// number, so where the cross sits is exactly where your bullets can land.
function pvpBulletSpreadRad() {
  const speed = Math.hypot(arenaPlayer.vx, arenaPlayer.vz) / PVP_FOOT_SPEED; // 0..1
  const air = arenaPlayer.onGround ? 0 : 1;
  const moving = speed > 0.04 || air > 0;
  let s = speed * 0.05 + air * 0.04;
  if (moving) s += pvpGunKick * 0.03;          // recoil only opens you up while on the move
  if (pvpAiming) s *= 0.15; else s += 0.004;   // aiming = laser; still hip-fire barely sways
  return s;
}
function firePvpMain() {
  if (pvpRoundOver || pvpReloading > 0 || pvpPlayerHP <= 0 || pvpCountdown > 0) return;
  const id = pvpActiveWeapon(), w = PVP_WEAPONS[id];
  if (pvpMainCooldown > 0) return;
  if (w.windup && pvpSpin < w.windup) { pvpMainCooldown = 30; return; }  // minigun still spinning up
  const boost = pvpPlayerBoost > 0 ? PVP_TUNING.boostMul : 1;
  const dmg = w.dmg * boost;
  const cp = Math.cos(pvpLookPitch), dirY = Math.sin(pvpLookPitch);
  const dirX = Math.sin(arenaPlayer.heading) * cp, dirZ = Math.cos(arenaPlayer.heading) * cp;
  const eyeY = arenaPlayer.y + 2.3;   // eyes at the blocky avatar's head height (same as enemies)
  pvpGunKick = 1;
  if (w.kind === 'melee') {
    pvpMainCooldown = w.rate;
    // knife — hit the nearest ENEMY in front, up close
    const ne = pvpNearestEnemy(PVP_TEAM, arenaPlayer.x, arenaPlayer.z);
    if (ne) {
      const dx = ne.x - arenaPlayer.x, dz = ne.z - arenaPlayer.z;
      // longer reach for all melee — bigger for the long weapons
      const reach = (id === 'katana' || id === 'scythe' || id === 'energyblade' || id === 'warhammer') ? 5.2 : 4.2;
      if (Math.hypot(dx, dz) < reach && (dirX * dx + dirZ * dz) > 0 && Math.abs(ne.y - arenaPlayer.y) < 2.4) {
        pvpHurt(ne.ref, dmg, false); spawnExplosion3D(ne.x, ne.y + 1, ne.z); playCrashSound();
        if (ne.ref !== 'player' && ne.ref.hp <= 0) { pvpQuestBump('kill', id); pvpRegisterKill(); }
      }
    }
    return;
  }
  if (w.kind === 'heal') {    // medkit — spend a charge to heal up to your max HP
    pvpMainCooldown = w.rate;
    if (pvpGrenadesLeft <= 0 || pvpPlayerHP >= PVP_TUNING.hp) return;
    pvpGrenadesLeft--;
    pvpPlayerHP = Math.min(PVP_TUNING.hp, pvpPlayerHP + (w.heal || 100));
    pvpHealFlash = 550;
    return;
  }
  if (w.kind === 'throw') {   // slot 4 — grenade / molotov / flash / landmine
    pvpMainCooldown = w.rate;
    if (pvpThrowable === 'mine') placePvpMine(); else throwPvpGrenade(pvpThrowable);
    return;
  }
  const am = pvpAmmo[id];
  if (!am) return;

  am.mag--; pvpMainCooldown = w.rate;
  if (am.mag <= 0 && am.reserve > 0) reloadPvp();
  if (w.kind === 'bullet') {
    const pellets = w.pellets || 1;
    const burst = w.burst || 1;
    const spr = pvpBulletSpreadRad();   // movement/air/recoil inaccuracy (matches the crosshair)
    const _sk = pvpWeaponSkin(id); pvpBulletTint = _sk ? _sk.accent : null;   // gun skin tints your tracers
    pvpFireWid = id;   // tag bullets so quests know which weapon got the kill
    for (let s = 0; s < burst; s++) {
      if (s > 0) { if (!am || am.mag <= 0) break; am.mag--; }   // extra burst rounds consume ammo
      const climb = s * 0.02;                                    // slight upward climb across the burst
      for (let p = 0; p < pellets; p++) {
        // every shot is nudged inside the current spread cone — dead-centre only
        // when you're still + aiming, scattered while you run/jump/spray
        // sample inside a disk biased toward the centre → most shots land dead
        // middle, and none stray past the crosshair gap (the tick inner-ends)
        const _a = Math.random() * Math.PI * 2, _r = spr * Math.random();
        let h = arenaPlayer.heading + Math.cos(_a) * _r;
        let pit = pvpLookPitch + climb + Math.sin(_a) * _r;
        if (pellets > 1) { h += (Math.random() - 0.5) * w.spread; pit += (Math.random() - 0.5) * w.spread; }
        const c = Math.cos(pit), pdx = Math.sin(h) * c, pdz = Math.cos(h) * c, pdy = Math.sin(pit);
        spawnPvpBullet(arenaPlayer.x, eyeY, arenaPlayer.z, 'player', dmg, w.speed, id === 'sniper', pdx, pdy, pdz, w.hsDmg ? w.hsDmg * boost : 0, w.life, PVP_TEAM, true, w.shape);
      }

    let trailCol = '#ff8800';
    if (rsk && rsk.form === 'pumpkin') {

      const pump = new THREE.Mesh(new THREE.SphereGeometry(0.34, 10, 8), new THREE.MeshPhongMaterial({ color: 0xff7a1a, emissive: 0x6a2a00, emissiveIntensity: 0.55 }));
      pump.scale.set(1.15, 0.9, 1.15); rg.add(pump);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.22, 6), new THREE.MeshPhongMaterial({ color: 0x4a7a20 }));
      stem.position.y = 0.34; rg.add(stem);
      for (const sx of [-0.13, 0.13]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffd23a })); e.position.set(sx, 0.05, -0.27); rg.add(e); }
      const mo = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffd23a })); mo.position.set(0, -0.08, -0.29); rg.add(mo);

// Molotov: a mass of individual flame tongues (no flat disc) that SPREADS outward

// Per-frame PvP combat: bot firing, bullets, grenades, boost pickup, round flow.
function updatePvpCombat(dt) {
  const bdts = dt / 1000;
  // floor safety + platform clamp for the player and every alive bot
  if (arenaPlayer.y < 0) { arenaPlayer.y = 0; arenaPlayer.vy = 0; arenaPlayer.onGround = true; }
  for (const b of arenaBots) if (b.state === 'alive' && b.y < 0) { b.y = 0; b.vy = 0; b.onGround = true; }
  if (arenaPlayer.onGround && pvpPlayerHP > 0) {
    for (const pad of pvpJumpPads) { if (Math.hypot(arenaPlayer.x - pad.x, arenaPlayer.z - pad.z) < pad.r) { arenaPlayer.vy = 26; arenaPlayer.onGround = false; break; } }
  }
  pvpClampToPlatforms(arenaPlayer);
  for (const b of arenaBots) if (b.state === 'alive') pvpClampToPlatforms(b);
  if (pvpMapId === 7) {   // ARENA — keep everyone inside the walls (never get stuck on/over them)
    const lim = 74;
    arenaPlayer.x = Math.max(-lim, Math.min(lim, arenaPlayer.x)); arenaPlayer.z = Math.max(-lim, Math.min(lim, arenaPlayer.z));
    for (const b of arenaBots) if (b.state === 'alive') { b.x = Math.max(-lim, Math.min(lim, b.x)); b.z = Math.max(-lim, Math.min(lim, b.z)); }
  }
  if (pvpCountdown > 0) pvpCountdown -= dt;                            // match-start freeze
  { const _aw = PVP_WEAPONS[pvpActiveWeapon()];                        // minigun spin-up / spin-down
    if (pvpFiring && _aw && _aw.windup) pvpSpin = Math.min(_aw.windup, pvpSpin + dt);
    else pvpSpin = Math.max(0, pvpSpin - dt * 2); }
  // throwables (grenade/molotov/freeze/cluster) = HOLD to aim the arc, RELEASE to throw;
  // everything else auto-fires while held
  const _fw = PVP_WEAPONS[pvpActiveWeapon()], _canAct = !pvpRoundOver && pvpPlayerHP > 0 && pvpCountdown <= 0;
  if (_fw && _fw.kind === 'throw' && pvpThrowable !== 'mine') {
    if (pvpFiring && _canAct) pvpThrowCharging = true;
    else if (pvpThrowCharging) { pvpThrowCharging = false; if (_canAct) firePvpMain(); }
  } else if (pvpFiring && _canAct) firePvpMain();
  // molotov fire pools — spread outward + ignite anyone (not on the fire's team) inside
  for (let i = pvpFires.length - 1; i >= 0; i--) {
    const fr = pvpFires[i];
    fr.timer -= dt; fr.tick -= dt;
    fr.r = Math.min(fr.rMax, fr.r + dt * 0.0018);                 // creeps outward as it burns
    if (fr.tick <= 0) {
      fr.tick = 300;
      for (const f of pvpFighters()) {
        if (f.alive && f.team !== fr.team && Math.hypot(f.x - fr.x, f.z - fr.z) < fr.r) pvpApplyBurn(f.ref, 2600);
      }
    }
    if (fr.flames) {
      const now = performance.now(), fade = fr.timer < 900 ? fr.timer / 900 : 1;
      for (const fl of fr.flames) {
        const rr = fl.userData.rr * fr.r, a = fl.userData.a + Math.sin(now * 0.004 + fl.userData.rr * 6) * 0.2;
        fl.position.set(Math.cos(a) * rr, fl.userData.h * (0.28 + Math.random() * 0.22), Math.sin(a) * rr);
        fl.scale.y = 0.6 + Math.random() * 0.8;
        fl.material.opacity = (0.6 + Math.random() * 0.35) * fade;
      }
    }
    if (fr.timer <= 0) { if (fr.mesh) arenaGroup.remove(fr.mesh); pvpFires.splice(i, 1); }
  }
  // burning damage-over-time — keeps hurting you after you leave the flames
  if (pvpPlayerHP > 0 && pvpPlayerBurn > 0) {
    pvpPlayerBurn -= dt; pvpPlayerBurnTick -= dt;
    if (pvpPlayerBurnTick <= 0) { pvpPlayerBurnTick = 400; pvpHurt('player', 9); }
  }
  for (const b of arenaBots) {
    if (b.state === 'alive' && b.burnTimer > 0) {
      b.burnTimer -= dt; b.burnTick = (b.burnTick || 0) - dt;
      if (b.burnTick <= 0) { b.burnTick = 400; pvpHurt(b, 9, false); }
      if (b.burnMesh) for (const fl of b.burnMesh.children) fl.scale.y = 0.6 + Math.random() * 0.8;
    }
    if ((b.burnTimer <= 0 || b.state !== 'alive') && b.burnMesh) { if (b.mesh) b.mesh.remove(b.burnMesh); b.burnMesh = null; }
  }
  if (pvpFlash > 0) pvpFlash -= dt;
  if (pvpHealFlash > 0) pvpHealFlash -= dt;
  if (pvpHitMarker > 0) pvpHitMarker -= dt;
  for (const b of arenaBots) if (b.blindTimer > 0) b.blindTimer -= dt;
  if (pvpHeadshotFlash > 0) pvpHeadshotFlash -= dt;
  if (pvpHitFlash > 0) pvpHitFlash -= dt;
  if (pvpGunKick > 0) pvpGunKick = Math.max(0, pvpGunKick - dt / 110);
  for (let i = pvpImpacts.length - 1; i >= 0; i--) { const im = pvpImpacts[i]; im.life -= dt; if (im.life <= 0) { if (im.mesh) arenaGroup.remove(im.mesh); pvpImpacts.splice(i, 1); } }
  for (let i = pvpDamagePopups.length - 1; i >= 0; i--) { const d = pvpDamagePopups[i]; d.life -= dt; d.y += dt * 0.0018; if (d.life <= 0) pvpDamagePopups.splice(i, 1); }
  if (pvpMainCooldown > 0) pvpMainCooldown -= dt;
  if (pvpReloading > 0) {
    pvpReloading -= dt;
    if (pvpReloading <= 0) {
      pvpReloading = 0;
      const id = pvpReloadId || pvpActiveWeapon(), w = PVP_WEAPONS[id], am = pvpAmmo[id];
      if (am) { const need = w.mag - am.mag, take = Math.min(need, am.reserve); am.mag += take; am.reserve -= take; }
      pvpReloadId = null;
    }
  }
  if (pvpPlayerBoost > 0) pvpPlayerBoost -= dt;
  for (const b of arenaBots) if (b.boost > 0) b.boost -= dt;

  // between-round / match-over banner
  if (pvpRoundOver) {
    pvpRoundBanner -= dt;
    if (pvpRoundBanner <= 0) {
      if (pvpPlayerWins >= 5 || pvpBotWins >= 5) {
        pvpMode = false; battleRoyale = false; champActive = false; pvpFiring = false;
        if (pvpPointerLocked) { try { document.exitPointerLock(); } catch (_) {} }
        for (const b of arenaBots) { if (b.mesh) scene.remove(b.mesh); }
        arenaBots = []; pvpBot = null;
        if (pvpPlayerAvatar) { scene.remove(pvpPlayerAvatar); pvpPlayerAvatar = null; }
        if (pvpBoostPickup && pvpBoostPickup.mesh) arenaGroup.remove(pvpBoostPickup.mesh);
        pvpBoostPickup = null;
        for (const m of pvpObstacleMeshes) arenaGroup.remove(m);
        pvpObstacleMeshes = []; pvpPlatforms = []; pvpJumpPads = []; pvpRamps = [];
        for (const m of pvpMines) if (m.mesh) arenaGroup.remove(m.mesh); pvpMines = [];
        arenaVoid.material.color.setHex(0x0055bb);
        clearPvpProjectiles();
        state = STATE.PVP_LOBBY; enterPvpLobby();
      } else { pvpRound++; startPvpRound(); }
    }
    return;
  }

  // centre damage-boost pickup — first fighter to reach it gets 2x damage
  if (pvpBoostPickup) {
    if (pvpBoostPickup.active) {
      pvpBoostPickup.mesh.rotation.y += dt * 0.003;
      pvpBoostPickup.mesh.children[0].position.y = 1.1 + Math.sin(gameTime * 3) * 0.12;
      let grabbed = false;
      if (pvpPlayerHP > 0 && Math.hypot(arenaPlayer.x, arenaPlayer.z) < 2.0) { pvpPlayerBoost = PVP_TUNING.boostDur; grabbed = true; }
      else { for (const b of arenaBots) if (b.state === 'alive' && Math.hypot(b.x, b.z) < 2.0) { b.boost = PVP_TUNING.boostDur; grabbed = true; break; } }
      if (grabbed) { pvpBoostPickup.active = false; pvpBoostPickup.mesh.visible = false; pvpBoostRespawn = PVP_TUNING.boostRespawn; spawnExplosion3D(0, 1, 0); }
    } else { pvpBoostRespawn -= dt; if (pvpBoostRespawn <= 0) { pvpBoostPickup.active = true; pvpBoostPickup.mesh.visible = true; } }
  }

  // bot AI — chase nearest enemy. Every player carries only the BASIC loadout
  // (the rifle), which is the single gun they visibly hold — no weapon swapping.
  for (const bot of arenaBots) {
    if (bot.state !== 'alive') continue;
    const ne = pvpNearestEnemy(bot.team, bot.x, bot.z);
    if (!ne) continue;
    bot.targetX = ne.x; bot.targetZ = ne.z; bot.targetTimer = 9999;
    bot.fireCd = (bot.fireCd || 0) - dt;
    const dist = Math.hypot(ne.x - bot.x, ne.z - bot.z);
    bot.weapon = 'rifle';
    let ad = Math.atan2(ne.x - bot.x, ne.z - bot.z) - bot.heading;
    while (ad > Math.PI) ad -= Math.PI * 2;
    while (ad < -Math.PI) ad += Math.PI * 2;
    if (pvpCountdown > 0 || (bot.blindTimer || 0) > 0 || bot.fireCd > 0) continue;
    const bm = bot.boost > 0 ? PVP_TUNING.boostMul : 1;
    if (bot.weapon === 'knife') {                       // melee up close
      if (dist < 4.4 && Math.abs(ad) < 0.9) { pvpHurt(ne.ref, 24 * bm, false, bot.x, bot.z); spawnExplosion3D(ne.x, ne.y + 1, ne.z); bot.fireCd = 520; }
      else bot.fireCd = 120;
      continue;
    }
    if (Math.abs(ad) > 0.34 || dist > 52) continue;     // ranged: must be aimed + in range
    if (bot.weapon === 'shotgun') {
      for (let p = 0; p < 5; p++) { const bh = bot.heading + (Math.random() - 0.5) * 0.34; spawnPvpBullet(bot.x, bot.y + 1.1, bot.z, bot, 6 * bm, 220, false, Math.sin(bh), 0, Math.cos(bh), 0, 200, bot.team, false); }
      bot.fireCd = 1400;
    } else if (bot.weapon === 'sniper') {
      const bh = bot.heading + (Math.random() - 0.5) * 0.12; spawnPvpBullet(bot.x, bot.y + 1.1, bot.z, bot, 42 * bm, 600, true, Math.sin(bh), 0, Math.cos(bh), 0, 0, bot.team, false);
      bot.fireCd = 2200;
    } else {                                            // rifle
      const bh = bot.heading + (Math.random() - 0.5) * 0.26; spawnPvpBullet(bot.x, bot.y + 1.1, bot.z, bot, 14 * bm, 320, false, Math.sin(bh), 0, Math.cos(bh), 0, 0, bot.team, false);
      bot.fireCd = PVP_WEAPONS.rifle.rate * 3.0;
    }
  }

  // bullets — swept collision, team-aware (only damages OTHER team)
  for (let i = pvpBullets.length - 1; i >= 0; i--) {
    const b = pvpBullets[i];
    const px = b.x, py = b.y, pz = b.z;
    b.x += b.vx * bdts; b.z += b.vz * bdts; b.y += (b.vy || 0) * bdts; b.life -= dt;
    if (b.mesh) { b.mesh.position.set(b.x, b.y, b.z); if (b.spin) b.mesh.rotation.x += dt * 0.02; }
    // 2D (x,z) closest approach of the travel segment to a point
    const sweep = (tx, tz) => {
      const dx = b.x - px, dz = b.z - pz, len2 = dx * dx + dz * dz;
      let t = len2 > 0 ? ((tx - px) * dx + (tz - pz) * dz) / len2 : 0; t = Math.max(0, Math.min(1, t));
      return { d: Math.hypot(tx - (px + dx * t), tz - (pz + dz * t)), y: py + (b.y - py) * t, t };
    };
    // full 3D closest distance of the segment to a world point (for the head sphere)
    const seg3d = (hx, hy, hz) => {
      const dx = b.x - px, dy = b.y - py, dz = b.z - pz, len2 = dx * dx + dy * dy + dz * dz;
      let t = len2 > 0 ? ((hx - px) * dx + (hy - py) * dy + (hz - pz) * dz) / len2 : 0; t = Math.max(0, Math.min(1, t));

    };

    for (const f of pvpFighters()) {
      if (!f.alive || f.team === b.team) continue;   // no friendly fire
      // HEAD: 3D sphere at the top of the avatar — works shooting down/up/level
      const hs = seg3d(f.x, f.y + 2.28, f.z);
      const headHit = hs.d < 0.42;
      // BODY: the lower column
      const s = sweep(f.x, f.z);
      const bodyHit = s.d < 1.0 && s.y > f.y - 0.4 && s.y < f.y + PVP_TUNING.hitTop;
      if (headHit || bodyHit) {
        const t = headHit ? hs.t : s.t;
        if (!best || t < best.t) { best = { t }; bestF = f; bestHead = headHit; }
      }
    }
    if (bestF) {
      const head = bestHead;
      const dealt = head ? (b.hsDmg || b.dmg * PVP_TUNING.headshotMul) : b.dmg;
      pvpHurt(bestF.ref, dealt, head, b.x - b.vx, b.z - b.vz);
      if (head && b.byPlayer) pvpHeadshotFlash = 700;
      if (b.byPlayer) {
        pvpHitMarker = (bestF.ref !== 'player' && bestF.ref.hp <= 0) ? 360 : 170;  // kill = bigger/red marker
        if (head) pvpQuestBump('head', b.wid);
        if (bestF.ref !== 'player' && bestF.ref.hp <= 0) { pvpQuestBump('kill', b.wid); pvpRegisterKill(); }
      }
      hit = true;   // no big explosion on a bullet hit — the damage number is the feedback
    }
    const hitWall = !hit && (pvpSolidAt(b.x, b.y, b.z) || pvpSolidAt((px + b.x) / 2, (py + b.y) / 2, (pz + b.z) / 2));
    if (hitWall) { const im = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 6), new THREE.MeshBasicMaterial({ color: 0x1a1a1a })); im.position.set(b.x, b.y, b.z); arenaGroup.add(im); pvpImpacts.push({ mesh: im, life: 600 }); }
    if (hit || hitWall || b.life <= 0 || b.y < -1 || Math.hypot(b.x, b.z) > 70) { if (b.mesh) arenaGroup.remove(b.mesh); pvpBullets.splice(i, 1); }
  }

  // grenades — arc through the air and DETONATE the instant they hit something
  // (floor or a wall/obstacle). The fuse is just a long safety cap now.
  for (let i = pvpGrenades.length - 1; i >= 0; i--) {
    const g = pvpGrenades[i];
    g.vy -= 22 * bdts; g.x += g.vx * bdts; g.y += g.vy * bdts; g.z += g.vz * bdts;
    g.fuse -= dt;
    const hitFloor = g.y <= 0.2, hitWall = pvpSolidAt(g.x, g.y, g.z);
    if (hitFloor || hitWall || g.fuse <= 0) {
      if (hitFloor) g.y = 0.2;
      pvpGrenadeBlast(g.x, g.z, g.firedBy, g.kind);
      if (g.mesh) arenaGroup.remove(g.mesh); pvpGrenades.splice(i, 1); continue;
    }
    if (g.mesh) g.mesh.position.set(g.x, g.y, g.z);
  }

  // landmines — arm, then detonate when an enemy steps close
  for (let i = pvpMines.length - 1; i >= 0; i--) {
    const m = pvpMines[i];
    if (m.arm > 0) m.arm -= dt;
    let trip = false;
    if (m.arm <= 0) for (const f of pvpFighters()) { if (f.alive && f.team !== m.team && Math.hypot(f.x - m.x, f.z - m.z) < 2.2 && Math.abs(f.y) < 3) { trip = true; break; } }
    if (trip) {
      pvpAreaDamage(m.x, m.z, PVP_TUNING.mineRadius, PVP_TUNING.mineDmg, m.team);
      spawnExplosion3D(m.x, 0.5, m.z); playCrashSound(); addShake(0.35, 350);
      if (m.mesh) arenaGroup.remove(m.mesh); pvpMines.splice(i, 1);
    }
  }

  // round end — a whole team is wiped
  const purp = pvpTeamAlive('purple'), yell = pvpTeamAlive('yellow');
  if (purp === 0 || yell === 0) {
    const playerWon = yell === 0;
    if (playerWon) pvpPlayerWins++; else pvpBotWins++;

    pvpRoundOver = true;
    if (pvpPlayerWins >= 5 || pvpBotWins >= 5) { pvpRoundResult = playerWon ? 'YOU WIN THE MATCH!' : 'YOU LOST THE MATCH'; pvpRoundBanner = 4000; }
    else { pvpRoundResult = playerWon ? 'ROUND WON' : 'ROUND LOST'; pvpRoundBanner = 5000; }
    playCrashSound();
  }
}

// Swing a stickman's arms + legs while it's moving (keys la/ra/ll/rl).
function animatePvpAvatarLimbs(av, moving) {
  const lm = av.userData && av.userData.limbs;
  if (!lm) return;
  const mfrac = Math.min(1, moving / 6);
  const sw = mfrac > 0.05 ? Math.sin(gameTime * 11) * 0.6 * mfrac : 0;
  if (av.userData && av.userData.hasGun) {
    // holding a rifle: both arms raised forward toward the gun, with just a
    // slight sway while walking (legs still stride normally).
    const base = -1.2, s2 = sw * 0.3;
    if (lm.la) lm.la.rotation.x = base + s2;
    if (lm.ra) lm.ra.rotation.x = base - s2;
  } else {
    if (lm.la) lm.la.rotation.x = sw;
    if (lm.ra) lm.ra.rotation.x = -sw;
  }
  if (lm.ll) lm.ll.rotation.x = -sw;
  if (lm.rl) lm.rl.rotation.x = sw;
}

// sniper-aiming it becomes a real scope (darkened surround + clear circle), all

function drawPvpReticle() {
  // first-person: you aim dead-centre, so the reticle is at screen centre
  const mx = W / 2, my = H / 2;
  if (pvpMainWeapon === 'sniper' && pvpAiming) {
    const R = Math.min(W, H) * 0.3;
    ctx.save();

    ctx.globalCompositeOperation = 'destination-out';

    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(mx, my, R, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(mx - R, my); ctx.lineTo(mx + R, my);
    ctx.moveTo(mx, my - R); ctx.lineTo(mx, my + R); ctx.stroke();
    ctx.fillStyle = 'rgba(255,60,60,0.95)';
    ctx.beginPath(); ctx.arc(mx, my, 2.5, 0, Math.PI * 2); ctx.fill();

    // The gap is drawn straight from pvpBulletSpreadRad(), so it literally shows
    // how far your shots can stray — wide while running/jumping/spraying, tight
    // when you stand still or aim. A small resting gap keeps it feeling realistic.
    const target = 5 + pvpBulletSpreadRad() * 240;

    pvpCrossSpread += (target - pvpCrossSpread) * 0.2;
    const gap = pvpCrossSpread, len = 7;

    ctx.save();
    ctx.lineCap = 'round';
    const tick = (dx, dy) => {

      ctx.lineTo(mx + dx * (gap + len), my + dy * (gap + len));

  let x = arenaPlayer.x, y = arenaPlayer.y + 1.4, z = arenaPlayer.z;
  let vx = sinH * fwdSpd, vy = 10 + Math.sin(pvpLookPitch) * fwdSpd, vz = cosH * fwdSpd;
  const dt = 1 / 30, pts = []; let lx = x, lz = z;

    pts.push([x, y, z]); lx = x; lz = z;
    if (y <= 0.2 || pvpSolidAt(x, y, z)) break;
    if (Math.hypot(x, z) > 82) break;

  line(3, 'rgba(' + col + ',0.95)', [2, 7]);               // bright dashed core

  const rad = kind === 'molotov' ? 6.5 : kind === 'freeze' ? 5 : kind === 'clusterbomb' ? 5 : 4.2;

}

  if (bpScroll > 0)            ctx.fillText('◀', 16, trackTop + cardH / 2 + 9);
  if (bpScroll < bpMaxScroll()) ctx.fillText('▶', W - 16, trackTop + cardH / 2 + 9);

  // hint + back button
  ctx.fillStyle = '#99a'; ctx.font = '11px system-ui';
  ctx.fillText('Tap a glowing tier to claim · ← → to scroll', W / 2, trackTop + cardH + 28);
  const bbW = 150, bbH = 34, bbX = W / 2 - bbW / 2, bbY = H - 52;
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.roundRect(bbX, bbY, bbW, bbH, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui'; ctx.fillText('BACK', W / 2, bbY + 22);
  bpTierBtns.push({ x: bbX, y: bbY, w: bbW, h: bbH, back: true });

  // ── award burst animation ──
  if (bpClaimAnim) {
    const el = performance.now() - bpClaimAnim.t0;
    if (el > 1300) { bpClaimAnim = null; }
    else {
      const p = el / 1300, ease = 1 - Math.pow(1 - Math.min(1, p * 1.6), 3);
      ctx.save();
      ctx.globalAlpha = Math.min(0.82, p < 0.15 ? p / 0.15 * 0.82 : (1 - (p - 0.15) / 0.85) * 0.82 + 0.0);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      const cy = H / 2;
      // expanding glow rings
      for (let r = 0; r < 3; r++) {
        const rr = 30 + ease * (90 + r * 40);
        ctx.strokeStyle = `rgba(255,213,74,${(0.5 * (1 - p)).toFixed(2)})`; ctx.lineWidth = 4 - r;
        ctx.beginPath(); ctx.arc(W / 2, cy - 10, rr, 0, Math.PI * 2); ctx.stroke();
      }
      const t = bpClaimAnim.tier, isGem = t.type === 'gems';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd54a'; ctx.font = 'bold ' + (18 + ease * 8).toFixed(0) + 'px system-ui';
      ctx.fillText('REWARD CLAIMED!', W / 2, cy - 50);
      ctx.fillStyle = isGem ? '#b39ddb' : '#ffd54a'; ctx.font = 'bold ' + (44 + ease * 18).toFixed(0) + 'px system-ui';
      ctx.fillText(isGem ? '◆' : '●', W / 2, cy + 6);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 24px system-ui';
      ctx.fillText('+' + t.amount + (isGem ? ' gems' : ' coins'), W / 2, cy + 52);
      ctx.fillStyle = '#9be3ff'; ctx.font = '12px system-ui';
      ctx.fillText('LEVEL ' + t.level + ' REWARD', W / 2, cy + 78);
      ctx.restore();
    }
  }
  ctx.textAlign = 'left';
}

function buildArena(radius = HEX_RADIUS) {
  for (const t of arenaTiles) arenaGroup.remove(t.mesh);
  arenaTiles.length = 0;
  for (let q = -radius; q <= radius; q++) {
    for (let r = -radius; r <= radius; r++) {
      const s = -q - r;
      if (Math.abs(s) > radius) continue;
      const x = HEX_SIZE * 1.5 * q;
      const z = HEX_SIZE * Math.sqrt(3) * (r + q / 2);
      const hex = new THREE.Mesh(
        arenaTileGeom,
        new THREE.MeshLambertMaterial({ color: 0xffffff })
      );
      hex.rotation.y = Math.PI / 6;
      hex.position.set(x, 0, z);
      arenaGroup.add(hex);
      arenaTiles.push({ mesh: hex, x, z, state: 'alive', timer: 0 });
    }
  }
}

// Snap a world position to the nearest arena hex-cell centre (cube rounding) so
// Minecraft rescue plates line up exactly with the real tile grid.
function _snapArenaHex(x, z) {
  const SQ3 = Math.sqrt(3);
  const q = x / (HEX_SIZE * 1.5);
  const r = z / (HEX_SIZE * SQ3) - q / 2;
  let rx = Math.round(q), ry = Math.round(-q - r), rz = Math.round(r);
  const dx = Math.abs(rx - q), dy = Math.abs(ry - (-q - r)), dz = Math.abs(rz - r);
  if (dx > dy && dx > dz) rx = -ry - rz;
  else if (dy > dz) ry = -rx - rz;
  else rz = -rx - ry;
  return { x: HEX_SIZE * 1.5 * rx, z: HEX_SIZE * SQ3 * (rz + rx / 2) };
}
