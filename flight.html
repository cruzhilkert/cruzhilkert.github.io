<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SKY STRIKE</title>
<style>
  :root{ --cyan:#33e8ff; --magenta:#ff3df0; --violet:#a855ff; --lime:#9bff5b; --bg0:#05030f; --bg1:#0c0822; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg0);
    color:#eef; font-family:'Segoe UI', system-ui, sans-serif; user-select:none; }
  canvas{ display:block; position:fixed; inset:0; }

  #home{ position:fixed; top:12px; left:12px; z-index:30; text-decoration:none;
    font:800 13px/1 system-ui; letter-spacing:2px; color:#cfe; padding:9px 14px; border-radius:999px;
    background:rgba(10,8,30,.62); border:1px solid rgba(120,160,255,.4); backdrop-filter:blur(6px);
    box-shadow:0 4px 18px rgba(0,0,0,.45); }
  #home:hover{ background:rgba(51,232,255,.22); border-color:var(--cyan); color:#fff; }
  #mute{ position:fixed; top:12px; right:12px; z-index:30; cursor:pointer; color:#cfe;
    font:800 13px/1 system-ui; letter-spacing:1px; padding:9px 14px; border-radius:999px;
    background:rgba(10,8,30,.62); border:1px solid rgba(120,160,255,.4); backdrop-filter:blur(6px); }

  #top{ position:fixed; top:54px; left:0; right:0; z-index:20; text-align:center; pointer-events:none; }
  #top .title{ font-size:clamp(30px,7vw,64px); font-weight:900; letter-spacing:6px;
    background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--violet),var(--cyan));
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:hue 6s linear infinite; filter:drop-shadow(0 0 16px rgba(51,232,255,.45)); }
  @keyframes hue{ to{ background-position:300% 0; } }
  #top .who{ font-size:12px; letter-spacing:4px; color:#9fb6ff; text-transform:uppercase; margin-top:2px; }

  #info{ position:fixed; left:50%; transform:translateX(-50%); bottom:110px; z-index:20; text-align:center;
    width:min(440px,92vw); padding:14px 18px; border-radius:16px;
    background:rgba(10,8,30,.55); border:1px solid rgba(120,160,255,.28); backdrop-filter:blur(8px); }
  #info h2{ margin:0 0 8px; font-size:24px; font-weight:900; letter-spacing:2px; color:#fff; }
  #info .stats{ display:flex; gap:10px; justify-content:center; }
  #info .stat{ flex:1; }
  #info .stat .lab{ font-size:10px; letter-spacing:2px; color:#9fb6ff; text-transform:uppercase; }
  #info .stat .bar{ height:8px; border-radius:999px; background:rgba(120,160,255,.15); margin-top:4px; overflow:hidden; }
  #info .stat .bar i{ display:block; height:100%; border-radius:999px;
    background:linear-gradient(90deg,var(--cyan),var(--lime)); }

  .arrow{ position:fixed; top:52%; z-index:22; transform:translateY(-50%); cursor:pointer;
    width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:26px; color:#04121a; background:linear-gradient(90deg,var(--cyan),var(--lime));
    box-shadow:0 0 18px rgba(51,232,255,.5); border:none; }
  #prev{ left:18px; } #next{ right:18px; }
  .arrow:active{ transform:translateY(-50%) scale(.94); }

  #bar{ position:fixed; left:0; right:0; bottom:20px; z-index:22; display:flex; gap:14px;
    justify-content:center; padding:0 16px; }
  .btn{ cursor:pointer; border:none; border-radius:14px; padding:15px 30px; font-size:16px; font-weight:900;
    letter-spacing:3px; text-transform:uppercase; color:#04121a;
    background:linear-gradient(90deg,var(--cyan),var(--lime)); box-shadow:0 0 22px rgba(51,232,255,.5); }
  .btn:active{ transform:translateY(2px); }
  #hint{ position:fixed; left:0; right:0; bottom:2px; z-index:20; text-align:center; pointer-events:none;
    font-size:11px; letter-spacing:2px; color:#7f92c4; text-transform:uppercase; }
</style>
</head>
<body>
<a id="home" href="index.html">← ARCADE</a>
<div id="mute">🔊 SOUND</div>

<div id="top">
  <div class="title">SKY STRIKE</div>
  <div class="who" id="who">HANGAR</div>
</div>

<button id="prev" class="arrow">‹</button>
<button id="next" class="arrow">›</button>

<div id="info">
  <h2 id="pname">—</h2>
  <div class="stats">
    <div class="stat"><div class="lab">Speed</div><div class="bar"><i id="s-spd"></i></div></div>
    <div class="stat"><div class="lab">Armor</div><div class="bar"><i id="s-arm"></i></div></div>
    <div class="stat"><div class="lab">Guns</div><div class="bar"><i id="s-gun"></i></div></div>
  </div>
</div>

<div id="bar">
  <button class="btn" id="fly">▶ Fly</button>
</div>
<div id="hint">Drag to look around your plane</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const $ = s => document.querySelector(s);
const NAME = (localStorage.getItem('headon_username') || 'PILOT').toUpperCase();
$('#who').textContent = 'HANGAR · ' + NAME;
let soundOn = localStorage.getItem('headon_sound_on') !== '0';
$('#mute').textContent = soundOn ? '🔊 SOUND' : '🔇 MUTED';
$('#mute').addEventListener('click', () => { soundOn = !soundOn; localStorage.setItem('headon_sound_on', soundOn?'1':'0'); $('#mute').textContent = soundOn ? '🔊 SOUND' : '🔇 MUTED'; });

// real-life-looking, modest jets
const PLANES = [
  { name:'SR-1 KESTREL', body:0xdfe6ee, accent:0xff8a3d, scale:0.86, sweep:0.14, twinTail:false, tanks:false, spd:.42, arm:.35, gun:.35 },
  { name:'F-5 VIPER',    body:0x9aa3ad, accent:0x33e8ff, scale:1.00, sweep:0.34, twinTail:false, tanks:true,  spd:.66, arm:.55, gun:.6  },
  { name:'MK-9 TEMPEST', body:0x5c6b58, accent:0x9bff5b, scale:1.16, sweep:0.46, twinTail:true,  tanks:true,  spd:.82, arm:.78, gun:.8  },
];
let idx = Math.min(PLANES.length-1, Math.max(0, +localStorage.getItem('headon_flight_equipped') || 0));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07061a);
scene.fog = new THREE.Fog(0x07061a, 22, 60);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

scene.add(new THREE.AmbientLight(0x8faaff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(6, 12, 8); scene.add(key);
const pC = new THREE.PointLight(0x33e8ff, 1.2, 60); pC.position.set(-10, 6, 6); scene.add(pC);
const pM = new THREE.PointLight(0xff3df0, 1.2, 60); pM.position.set(10, 5, -6); scene.add(pM);

const floor = new THREE.Mesh(new THREE.CylinderGeometry(30, 30, 1, 40),
  new THREE.MeshStandardMaterial({ color:0x0a0820, roughness:1 }));
floor.position.y = -1.5; scene.add(floor);
const platform = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 7, 0.6, 48),
  new THREE.MeshStandardMaterial({ color:0x141033, roughness:0.6, metalness:0.3 }));
platform.position.y = -0.3; scene.add(platform);
const ring = new THREE.Mesh(new THREE.TorusGeometry(6.7, 0.12, 12, 60),
  new THREE.MeshStandardMaterial({ color:0x33e8ff, emissive:0x33e8ff, emissiveIntensity:1.4 }));
ring.rotation.x = Math.PI/2; ring.position.y = 0.05; scene.add(ring);

const turntable = new THREE.Group(); scene.add(turntable);
let jet = null;
function mat(c, m, r){ return new THREE.MeshStandardMaterial({ color:c, metalness:m??0.45, roughness:r??0.5 }); }

function makeJet(cfg){
  const g = new THREE.Group();
  const body = mat(cfg.body), accent = mat(cfg.accent, 0.5, 0.4);
  const glass = new THREE.MeshStandardMaterial({ color:0x16222e, metalness:0.3, roughness:0.1, emissive:0x0a1a26, emissiveIntensity:0.5 });

  const fus = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 6.4, 20), body);
  fus.rotation.x = Math.PI/2; g.add(fus);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.7, 20), body);
  nose.rotation.x = Math.PI/2; nose.position.z = 3.9; g.add(nose);
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.32, 1.2, 20), body);
  tail.rotation.x = Math.PI/2; tail.position.z = -3.5; g.add(tail);
  const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.5, 16),
    new THREE.MeshStandardMaterial({ color:0x222226, emissive:0xff6a2a, emissiveIntensity:0.6 }));
  nozzle.rotation.x = Math.PI/2; nozzle.position.z = -4.2; g.add(nozzle);
  const can = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 12), glass);
  can.scale.set(0.85, 0.6, 1.7); can.position.set(0, 0.42, 1.5); g.add(can);

  for (const side of [-1, 1]){
    const wing = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.12, 1.7), body);
    wing.position.set(side*2.0, -0.05, -0.3);
    wing.rotation.y = side * cfg.sweep;
    g.add(wing);
    const st = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.14, 0.28), accent);
    st.position.copy(wing.position); st.rotation.y = wing.rotation.y; st.position.y += 0.02; g.add(st);
    if (cfg.tanks){
      const tk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 1.4, 12), accent);
      tk.rotation.x = Math.PI/2; tk.position.set(side*3.6, -0.05, -0.3 - Math.sin(cfg.sweep)*1.6); g.add(tk);
    }
  }
  for (const side of [-1, 1]){
    const hs = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.1, 0.9), body);
    hs.position.set(side*1.0, 0.05, -3.1); hs.rotation.y = side*0.5; g.add(hs);
  }
  if (cfg.twinTail){
    for (const side of [-1,1]){
      const vt = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.4, 1.1), body);
      vt.position.set(side*0.6, 0.85, -3.0); vt.rotation.z = side*0.18; g.add(vt);
    }
  } else {
    const vt = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.6, 1.2), body);
    vt.position.set(0, 0.95, -3.0); g.add(vt);
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.5, 0.5), accent);
    fin.position.set(0, 1.55, -3.15); g.add(fin);
  }
  for (const side of [-1,1]){
    const intake = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 1.4), body);
    intake.position.set(side*0.6, -0.1, 0.6); g.add(intake);
  }
  g.scale.setScalar(cfg.scale);
  g.position.y = 1.4;
  return g;
}

function showPlane(){
  if (jet) turntable.remove(jet);
  const cfg = PLANES[idx];
  jet = makeJet(cfg);
  turntable.add(jet);
  $('#pname').textContent = cfg.name;
  $('#s-spd').style.width = (cfg.spd*100)+'%';
  $('#s-arm').style.width = (cfg.arm*100)+'%';
  $('#s-gun').style.width = (cfg.gun*100)+'%';
  localStorage.setItem('headon_flight_equipped', idx);
  blip(520);
}

let actx = null;
function blip(f){ if(!soundOn) return; try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
  o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0.14,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.13);}catch(e){} }

$('#next').addEventListener('click', () => { idx = (idx+1)%PLANES.length; showPlane(); });
$('#prev').addEventListener('click', () => { idx = (idx-1+PLANES.length)%PLANES.length; showPlane(); });
$('#fly').addEventListener('click', () => { blip(720); document.body.style.opacity='0'; document.body.style.transition='opacity .25s';
  setTimeout(()=>{ location.href='skystrike2d.html'; }, 230); });

let camYaw = 0.5, camPitch = 0.18, camDist = 13, dragging=false, lx=0, ly=0;
renderer.domElement.addEventListener('pointerdown', e => { dragging=true; lx=e.clientX; ly=e.clientY; });
addEventListener('pointerup', ()=> dragging=false);
addEventListener('pointermove', e => { if(dragging){ camYaw -= (e.clientX-lx)*0.008; camPitch = Math.max(-0.2, Math.min(0.7, camPitch + (e.clientY-ly)*0.005)); lx=e.clientX; ly=e.clientY; } });

showPlane();

const clock = new THREE.Clock();
function frame(){
  const dt = Math.min(clock.getDelta(), 0.05);
  turntable.rotation.y += dt * 0.35;
  const cx = Math.sin(camYaw)*Math.cos(camPitch)*camDist;
  const cy = 2.2 + Math.sin(camPitch)*camDist;
  const cz = Math.cos(camYaw)*Math.cos(camPitch)*camDist;
  camera.position.set(cx, cy, cz);
  camera.lookAt(0, 1.5, 0);
  ring.material.emissiveIntensity = 1.2 + Math.sin(clock.elapsedTime*2)*0.3;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
