  ctx.beginPath(); ctx.roundRect(W/2 - 64, 6, 128, 32, 8); ctx.fill();
  ctx.fillStyle = '#ffd54a';
  ctx.font = 'bold 20px system-ui';
  ctx.fillText(Math.floor(score), W/2, 28);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px system-ui';
  ctx.fillText('Best: ' + getBest(), 10, 24);
  ctx.fillText('Speed: ' + Math.floor(speed * 3.6) + ' km/h', W - 160, 24);
  ctx.font = '12px system-ui';
  ctx.fillStyle = '#ccc';
  ctx.fillText(CARS[carIdx].name + '  · crashes ' + crashes, W - 200, 44);

  // difficulty badge — show fog/speed-floor warning on HARD
  if (difficultyIdx === 2) {
    const tooSlow = diffSpeedWarning > 200 && MODES[modeIdx] === 'HEAD ON';
    const warnFrac = diffSpeedWarning / 2500;
    ctx.fillStyle = tooSlow ? 'rgba(200,20,20,0.75)' : 'rgba(180,30,0,0.65)';
    ctx.beginPath(); ctx.roundRect(W/2 - 46, H - 36, 92, 24, 5); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(tooSlow ? '⚡ SPEED UP!' : '● HARD  2× COINS', W/2, H - 20);
    ctx.textAlign = 'left';
    // edge-of-screen red flash when penalty is close
    if (tooSlow && warnFrac > 0.5) {
      ctx.globalAlpha = (warnFrac - 0.5) * 2 * 0.22 * (Math.sin(Date.now() / 100) * 0.5 + 0.5);
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  drawDamageBars();

  if (damageBanner > 0 && state === STATE.PLAYING) {
    const a = Math.min(0.45, (damageBanner / 300) * 0.45);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ff2222';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  if (MODES[modeIdx] === 'HEAD ON' && state === STATE.PLAYING) {
    const w = WAVES[Math.min(wave, WAVES.length-1)];
    ctx.font = '13px system-ui';
    ctx.fillStyle = '#ffd54a';
    ctx.fillText(w.label, 10, 66);
    if (wave < WAVES.length-1) {
      ctx.fillStyle = '#bbb';
      ctx.fillText('Dodged ' + dodged + ' / ' + w.advance, 10, 84);
    }

  if (waveBanner > 0 && state === STATE.PLAYING) {
    const a = Math.min(1, waveBanner / 400);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, H/2 - 40, W, 60);
    ctx.fillStyle = '#ffd54a';
    ctx.font = 'bold 28px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(WAVES[Math.min(wave, WAVES.length-1)].label, W/2, H/2);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
}

function drawDamageBars() {
  const items = [['BODY', dmg.body],['TIRES', dmg.tires],['ENGINE', dmg.engine]];
  const bx = W - 130, by = 60, bw = 90, bh = 7;
  ctx.font = '10px system-ui';
  ctx.textAlign = 'left';
  for (let i = 0; i < items.length; i++) {
    const [name, d] = items[i];
    const y = by + i * 14;
    ctx.fillStyle = '#bbb'; ctx.fillText(name, bx, y - 1);
    ctx.fillStyle = '#222'; ctx.fillRect(bx + 38, y - 7, bw, bh);
    const remaining = 1 - d;
    const color = remaining > 0.6 ? '#2ecc71' : remaining > 0.3 ? '#f39c12' : '#e74c3c';
    ctx.fillStyle = color; ctx.fillRect(bx + 38, y - 7, bw * remaining, bh);
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
    ctx.strokeRect(bx + 38, y - 7, bw, bh);
  }
}

function drawButton(b) {
  const hovered = !b.disabled && mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h;
  ctx.fillStyle = b.disabled ? 'rgba(60,60,60,0.7)' : (hovered ? '#ffd54a' : 'rgba(0,0,0,0.55)');
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = b.disabled ? '#444' : (hovered ? '#fff' : '#888');
  ctx.lineWidth = 2;
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = b.disabled ? '#888' : (hovered ? '#111' : '#fff');
  ctx.font = 'bold 15px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.label, b.x + b.w/2, b.y + b.h/2);
  ctx.textBaseline = 'alphabetic';
}

const STAT_MAX = 3.00;
function drawCarStats(car, cx, cy) {
  const idx = CARS.indexOf(car);
  const rows = [['TOP SPEED', effTop(idx)], ['HANDLING', effSteer(idx)], ['ACCELERATION', effAccel(idx)], ['BRAKE', effBrake(idx)]];
  const barW = 100, barH = 7, labelW = 88, valW = 28;
  ctx.textAlign = 'left'; ctx.font = '10px system-ui';
  for (let i = 0; i < rows.length; i++) {
    const [name, val] = rows[i];
    const y = cy + i * 16;
    ctx.fillStyle = '#bbb'; ctx.fillText(name, cx, y);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.roundRect(cx + labelW, y - barH + 1, barW, barH, 2); ctx.fill();
    const t = Math.min(1, val / STAT_MAX);
    const r = Math.round(t < 0.5 ? t * 2 * 255 : 255);
    const gv = Math.round(t < 0.5 ? 213 : (1 - (t - 0.5) * 2) * 213);
    const b  = Math.round(t < 0.5 ? (1 - t * 2) * 255 : 0);
    ctx.fillStyle = `rgb(${r},${gv},${b})`;
    ctx.beginPath(); ctx.roundRect(cx + labelW, y - barH + 1, barW * t, barH, 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(val.toFixed(2), cx + labelW + barW + valW, y);
    ctx.textAlign = 'left'; ctx.font = '10px system-ui';
  }
  // car buff badges
  const buffY = cy + rows.length * 16 + 6;
  const coinM = car.coinMul || 1;
  const gemPct = ((car.gemChance || 0) * 100).toFixed(coinM >= 5 ? 2 : 3);
  const hits = car.hitsToKill || 4;
  ctx.font = 'bold 9px system-ui';
  ctx.fillStyle = coinM > 1 ? '#ffd54a' : '#666';
  ctx.fillText('● ×' + coinM + ' coins', cx, buffY);
  ctx.fillStyle = '#b39ddb';
  ctx.fillText('◆ ' + gemPct + '%', cx + 82, buffY);
  ctx.fillStyle = hits >= 10 ? '#44ff88' : hits >= 5 ? '#ffdd44' : '#ff7766';
  ctx.fillText('❤ ' + hits + ' hits', cx + 140, buffY);
}

function drawMenuButton(b) {
  const hovered = !b.disabled && mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h;
  // body — dark base; on hover it lights up
  ctx.fillStyle = b.disabled ? 'rgba(40,40,50,0.55)'
                : hovered    ? 'rgba(20,40,55,0.95)'
                             : 'rgba(10,14,28,0.85)';
  // Neon glow halo — always on, brighter on hover.
  ctx.shadowColor = b.disabled ? 'transparent' : (hovered ? '#34ff9e' : '#00f0ff');
  ctx.shadowBlur  = b.disabled ? 0 : (hovered ? 28 : 16);
  roundedRect(b.x, b.y, b.w, b.h, 6);
  ctx.fill();
  ctx.shadowBlur = 0;
  // neon border
  ctx.strokeStyle = b.disabled ? '#444' : (hovered ? '#34ff9e' : '#00f0ff');
  ctx.lineWidth = 2.5;
  roundedRect(b.x, b.y, b.w, b.h, 6);
  ctx.stroke();
  // icon takes precedence over label
  if (b.icon) {
    const iconColor = b.disabled ? '#888' : (hovered ? '#fff' : '#ffd54a');
    const iconSize = Math.min(b.w, b.h) * 0.72;
    drawMenuIcon(b.icon, b.x + b.w/2, b.y + b.h/2, iconSize, iconColor);
    return;
  }
  // label (shifted up a bit when there's a sublabel so both fit inside)
  ctx.fillStyle = b.disabled ? '#888' : (hovered ? '#fff' : '#ffd54a');
  ctx.font = 'bold ' + (b.fontSize || 13) + 'px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const labelY = b.sub ? b.y + b.h/2 - 8 : b.y + b.h/2;
  ctx.fillText(b.label, b.x + b.w/2, labelY);
  ctx.textBaseline = 'alphabetic';
  // sublabel — drawn inside the button, below the main label
  if (b.sub) {
    ctx.fillStyle = hovered ? '#fff' : '#ff8fea';
    ctx.font = 'bold 13px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.sub, b.x + b.w/2, b.y + b.h/2 + 11);
    ctx.textBaseline = 'alphabetic';
  }
}

function drawMenuIcon(kind, cx, cy, size, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(1.5, size * 0.07);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  if (kind === 'home') {
    const s = size * 0.5;
    // roof (filled triangle)
    ctx.beginPath();
    ctx.moveTo(cx - s, cy - s * 0.05);
    ctx.lineTo(cx,     cy - s * 0.85);
    ctx.lineTo(cx + s, cy - s * 0.05);
    ctx.closePath();
    ctx.fill();
    // body (filled rect)
    ctx.fillRect(cx - s * 0.78, cy - s * 0.05, s * 1.56, s * 0.95);
    // door (cutout — use destination-out so it punches through both shapes)
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - s * 0.22, cy + s * 0.18, s * 0.44, s * 0.72);
    ctx.restore();
  } else if (kind === 'gear') {
    const r = size * 0.34;
    const ri = size * 0.18;
    const teeth = 8;
    // teeth: small rectangles around the ring
    for (let i = 0; i < teeth; i++) {
      const a = (i / teeth) * Math.PI * 2;
      const tx = cx + Math.cos(a) * (r + size * 0.06);
      const ty = cy + Math.sin(a) * (r + size * 0.06);
      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(a);
      ctx.fillRect(-size * 0.08, -size * 0.06, size * 0.16, size * 0.12);
      ctx.restore();
    }
    // outer ring
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    // inner hole (knock out)
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(cx, cy, ri, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else if (kind === 'cart') {
    const s = size * 0.5;
    // handle line from upper-left corner down into basket
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.95, cy - s * 0.55);
    ctx.lineTo(cx - s * 0.65, cy - s * 0.55);
    ctx.lineTo(cx - s * 0.45, cy + s * 0.15);
    ctx.lineTo(cx + s * 0.65, cy + s * 0.15);
    ctx.stroke();
    // basket
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.55, cy - s * 0.20);
    ctx.lineTo(cx + s * 0.80, cy - s * 0.20);
    ctx.lineTo(cx + s * 0.60, cy + s * 0.20);
    ctx.lineTo(cx - s * 0.40, cy + s * 0.20);
    ctx.closePath();
    ctx.stroke();
    // wheels
    const wr = Math.max(2, s * 0.16);
    ctx.beginPath(); ctx.arc(cx - s * 0.25, cy + s * 0.55, wr, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + s * 0.50, cy + s * 0.55, wr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else { ctx.rect(x, y, w, h); }
}

// Animated fire around the level chip. Kicks in at level 5 and grows more
// intense with level — more flame tongues, brighter/whiter core, bigger glow.
function drawLevelFire(x, y, w, h, level) {
  const fl = level - 4;                 // fire starts at level 5
  if (fl <= 0) return;
  const intensity = Math.min(1, fl / 16);   // ramps to full by ~level 20
  const t = menuBlink;
  const hot = intensity > 0.6;          // white/blue-hot core at high level
  ctx.save();
  // soft glow behind the chip
  const cx = x + w / 2, cy = y + h / 2;
  const glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, w * (0.7 + intensity * 0.7));
  glow.addColorStop(0, `rgba(255,${150 + Math.floor(90 * intensity)},40,${0.3 + 0.4 * intensity})`);
  glow.addColorStop(1, 'rgba(255,70,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(x - w, y - h, w * 3, h * 3);
  // flame tongues licking up off the top edge
  const count = 6 + Math.floor(intensity * 9);
  const maxH = Math.min(h * 1.4, 24) * (0.7 + intensity * 0.6);
  for (let i = 0; i < count; i++) {
    const fx = x + (w * (i + 0.5) / count);
    const flick = 0.55 + 0.45 * Math.sin(t * 0.012 + i * 1.7) + Math.random() * 0.3;
    const fh = maxH * flick;
    const fw = (w / count) * (0.9 + Math.random() * 0.4);
    const topY = Math.max(1, y - fh);
    const grad = ctx.createLinearGradient(0, topY, 0, y + 2);
    grad.addColorStop(0, hot ? 'rgba(255,255,215,0.95)' : 'rgba(255,232,130,0.9)');
    grad.addColorStop(0.5, `rgba(255,${120 + Math.floor(70 * intensity)},20,0.85)`);
    grad.addColorStop(1, 'rgba(200,30,0,0.08)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(fx - fw / 2, y + 2);
    ctx.quadraticCurveTo(fx - fw * 0.2, topY + fh * 0.5, fx, topY);
    ctx.quadraticCurveTo(fx + fw * 0.2, topY + fh * 0.5, fx + fw / 2, y + 2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawMenu() {
  // Lobby HUD: identity (name + level) top-left, currencies top-right,
  // settings gear under the name, and a soft fade overlay when the player
  // has just driven into a portal so the mode transition feels smooth.

  // Coins + gems top-right
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd54a';
  ctx.font = 'bold 20px system-ui';
  ctx.fillText('● ' + coins, W - 14, 30);
  ctx.fillStyle = '#b39ddb';
  ctx.font = 'bold 16px system-ui';
  ctx.fillText('◆ ' + gems, W - 14, 52);
  // Arcade Coins — the shared arcade currency, under a small "ARCADE" sign.
  ctx.fillStyle = '#8a93a8'; ctx.font = 'bold 8px system-ui';
  ctx.fillText('ARCADE', W - 14, 66);
  ctx.fillStyle = '#33e8ff'; ctx.font = 'bold 16px system-ui';
  ctx.fillText('◈ ' + arcadeCoins, W - 14, 80);

  // Player name + level badge top-left
  ctx.textAlign = 'left';
  const nameText = playerName || 'PLAYER';
  ctx.font = 'bold 16px system-ui';
  const nameW = Math.max(96, ctx.measureText(nameText).width + 18);
  ctx.fillStyle = 'rgba(10,10,20,0.55)';
  roundedRect(10, 10, nameW + 56, 30, 6); ctx.fill();
  ctx.strokeStyle = '#ff44dd'; ctx.lineWidth = 1.5;
  roundedRect(10, 10, nameW + 56, 30, 6); ctx.stroke();
  // Level chip — fire behind it once the player hits a high level
  drawLevelFire(14, 14, 44, 22, playerLevel);
  ctx.fillStyle = '#ffd54a';
  roundedRect(14, 14, 44, 22, 4); ctx.fill();
  ctx.fillStyle = '#1a1a26';
  ctx.font = 'bold 12px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('LV ' + playerLevel, 36, 29);
  // Name
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px system-ui';
  ctx.fillText(nameText, 64, 29);
  // XP progress bar under the badge
  const need = xpForLevel(playerLevel);
  const pct = Math.max(0, Math.min(1, playerXp / need));
  ctx.fillStyle = 'rgba(10,10,20,0.55)';
  roundedRect(10, 42, nameW + 56, 5, 2); ctx.fill();
  ctx.fillStyle = '#b388ff';
  roundedRect(10, 42, (nameW + 56) * pct, 5, 2); ctx.fill();

  // Settings gear — sits below the name plate
  menuButtons = [
    { icon: 'gear', x: 12, y: 54, w: 30, h: 30, action: () => { state = STATE.SETTINGS; } },
  ];
  for (const b of menuButtons) drawMenuButton(b);

  // Driving hint at the bottom (blinks)
  if (Math.floor(menuBlink / 500) % 2 === 0) {
    ctx.fillStyle = 'rgba(255,213,74,0.8)';
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('DRIVE INTO A PORTAL TO ENTER A MODE', W/2, H - 8);
  }

  // Show-Off stats panel — shown while parked on the front-room SHOW OFF pad.
  if (lobbyOnShowOff) {
    const pw = 300, ph = 210, px = (W - pw) / 2, py = (H - ph) / 2;
    ctx.fillStyle = 'rgba(10,12,28,0.94)';
    roundedRect(px, py, pw, ph, 12); ctx.fill();
    ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 2;
    roundedRect(px, py, pw, ph, 12); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 18px system-ui';
    ctx.fillText('★ ' + (playerName || 'PLAYER') + ' ★', W / 2, py + 30);
    const stats = [
      ['Level', playerLevel],
      ['Classic Best', bestClassic],
      ['Cars Owned', (Array.isArray(unlocked) ? unlocked.length : 1)],
      ['Coins', coins],
      ['Gems', gems],
    ];
    let yy = py + 64; ctx.font = '14px system-ui';
    for (const [k, v] of stats) {
      ctx.textAlign = 'left';  ctx.fillStyle = '#9be3ff'; ctx.fillText(k, px + 24, yy);
      ctx.textAlign = 'right'; ctx.fillStyle = '#fff';    ctx.fillText(String(v), px + pw - 24, yy);
      yy += 28;
    }
    ctx.textAlign = 'center'; ctx.fillStyle = '#888'; ctx.font = '11px system-ui';
    ctx.fillText('Drive off the pad to close', W / 2, py + ph - 14);
  }

  // Showroom buy panel — shown while parked on a car podium in the left room.
  if (lobbyShopHover != null) {
    const car = CARS[lobbyShopHover];
    const owned = Array.isArray(unlocked) && unlocked.includes(lobbyShopHover);
    const isCur = carIdx === lobbyShopHover;
    const pw = 300, ph = 196, px = (W - pw) / 2, py = H - ph - 36;
    ctx.fillStyle = 'rgba(10,12,28,0.94)'; roundedRect(px, py, pw, ph, 12); ctx.fill();
    ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 2; roundedRect(px, py, pw, ph, 12); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 20px system-ui';
    ctx.fillText(car.name, W / 2, py + 28);
    const stat = (label, val, max, y) => {
      ctx.textAlign = 'left'; ctx.font = '12px system-ui'; ctx.fillStyle = '#9be3ff';
      ctx.fillText(label, px + 20, y);
      const bw = 130, bx = px + 130, frac = Math.max(0, Math.min(1, val / max));
      ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(bx, y - 9, bw, 8);
      ctx.fillStyle = '#ffd54a'; ctx.fillRect(bx, y - 9, bw * frac, 8);
    };
    stat('Top Speed', car.raceTopKmh, 245, py + 58);
    stat('Accel',     car.accelMul,   3,   py + 80);
    stat('Handling',  car.steerMul,   3,   py + 102);
    const bw2 = 150, bh2 = 36, bx = W / 2 - bw2 / 2, by = py + ph - 50;
    let label, color;
    if (isCur)       { label = 'SELECTED';  color = '#444';    }
    else if (owned)  { label = 'SELECT';    color = '#2e7d32'; }
    else             { const aff = coins >= car.cost; label = car.cost === 0 ? 'GET' : 'BUY  ● ' + car.cost; color = aff ? '#b8860b' : '#5a2a2a'; }
    ctx.fillStyle = color; roundedRect(bx, by, bw2, bh2, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(label, W / 2, by + 23);
    lobbyShopBtn = { x: bx, y: by, w: bw2, h: bh2, idx: lobbyShopHover, owned, isCur };
    // alternative: buy this car with Arcade Coins (locked cars only)
    if (!owned && !isCur && car.cost > 0) {
      const ac = arcadePrice(car.cost), aff2 = arcadeCoins >= ac;
      const aby = by + bh2 + 6, abh = 26;
      ctx.fillStyle = aff2 ? 'rgba(51,232,255,0.22)' : 'rgba(40,50,60,0.6)';
      roundedRect(bx, aby, bw2, abh, 7); ctx.fill();
      ctx.strokeStyle = '#33e8ff'; ctx.lineWidth = 1.5; roundedRect(bx, aby, bw2, abh, 7); ctx.stroke();
      ctx.fillStyle = aff2 ? '#eafcff' : '#8aa'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('BUY  ◈ ' + ac, W / 2, aby + 17);
      lobbyShopArcBtn = { x: bx, y: aby, w: bw2, h: abh, idx: lobbyShopHover, cost: ac };
    } else { lobbyShopArcBtn = null; }
  } else {
    lobbyShopBtn = null; lobbyShopArcBtn = null;
  }

  // Cosmetics buy/equip overlay (opened by a garage category pad).
  lobbyBuyBtns = [];
  if (lobbyBuyMenu) {
    // SHOP overlay — BUY ONLY. Equipping happens in YOUR GARAGE (the equip pad).
    const cfg = _COSM[lobbyBuyMenu], cat = cfg.cat(), cur = cfg.cur();
    const titleMap = { helmet: 'HELMETS', skin: 'SKINS', aura: 'AURAS', trail: 'TRAILS' };
    const rowH = 44, maxRows = 7, nRows = Math.min(cat.length, maxRows);
    const pw = 340, headH = 64, footH = 46, ph = headH + nRows * rowH + footH;
    const px = (W - pw) / 2, py = (H - ph) / 2;
    const maxScroll = Math.max(0, cat.length - maxRows);
    lobbyBuyScroll = Math.max(0, Math.min(lobbyBuyScroll, maxScroll));
    ctx.fillStyle = 'rgba(10,12,28,0.97)'; roundedRect(px, py, pw, ph, 12); ctx.fill();
    ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 2; roundedRect(px, py, pw, ph, 12); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 20px system-ui';
    ctx.fillText(titleMap[lobbyBuyMenu] + '  ·  SHOP', W / 2, py + 26);
    ctx.fillStyle = '#7fe0b0'; ctx.font = '11px system-ui';
    ctx.fillText('Buy here — equip in YOUR GARAGE', W / 2, py + 43);
    ctx.fillStyle = '#ffd54a'; ctx.font = '12px system-ui'; ctx.fillText('● ' + coins + '   ◆ ' + gems, W / 2, py + 58);
    const listTop = py + headH;
    if (lobbyBuyScroll > 0)         { ctx.fillStyle = 'rgba(255,213,74,0.8)'; ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.fillText('▲', W / 2, listTop + 4); }
    if (lobbyBuyScroll < maxScroll) { ctx.fillStyle = 'rgba(255,213,74,0.8)'; ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.fillText('▼', W / 2, listTop + nRows * rowH - 2); }
    ctx.save(); ctx.beginPath(); ctx.rect(px, listTop, pw, nRows * rowH); ctx.clip();
    for (let idx = lobbyBuyScroll; idx < Math.min(cat.length, lobbyBuyScroll + nRows); idx++) {
      const it = cat[idx];
      const yy = listTop + (idx - lobbyBuyScroll) * rowH;
      const owned = cosmeticOwned(lobbyBuyMenu, it.id);
      if (lobbyBuyMenu === 'trail') {
        for (let d = 0; d < 5; d++) { ctx.globalAlpha = 0.2 + d * 0.16; ctx.fillStyle = it.color; ctx.beginPath(); ctx.ellipse(px + 24 + d * 12, yy + 21, 4, 2.6, 0, 0, Math.PI * 2); ctx.fill(); }
        ctx.globalAlpha = 1;
      } else if (it.rainbow) { const rg = ctx.createLinearGradient(px + 16, 0, px + 42, 0); ['#ff0040','#ff9900','#ffe600','#33dd33','#22aaff','#aa33ff'].forEach((c, ci, ar) => rg.addColorStop(ci / (ar.length - 1), c)); ctx.fillStyle = rg; roundedRect(px + 16, yy + 8, 26, 26, 6); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1; roundedRect(px + 16, yy + 8, 26, 26, 6); ctx.stroke(); }
      else if (it.color != null) { ctx.fillStyle = '#' + it.color.toString(16).padStart(6, '0'); roundedRect(px + 16, yy + 8, 26, 26, 6); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1; roundedRect(px + 16, yy + 8, 26, 26, 6); ctx.stroke(); }
      else { ctx.fillStyle = '#1e1e2a'; roundedRect(px + 16, yy + 8, 26, 26, 6); ctx.fill(); ctx.fillStyle = '#667'; ctx.font = '11px system-ui'; ctx.textAlign = 'center'; ctx.fillText('—', px + 29, yy + 25); }
      ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui'; ctx.fillText(it.name, px + 86, yy + 26);
      const bw = 104, bh = 30, bx = px + pw - bw - 14, by = yy + 6;
      let label, color;
      if (owned)  { label = cur === it.id ? 'OWNED ✓' : 'OWNED'; color = '#2e7d32'; }
      else        { const aff = coins >= it.cost; label = it.cost === 0 ? 'GET' : 'BUY ● ' + it.cost; color = aff ? '#b8860b' : '#5a2a2a'; }
      ctx.fillStyle = color; roundedRect(bx, by, bw, bh, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(label, bx + bw / 2, by + 20);
      lobbyBuyBtns.push({ x: bx, y: by, w: bw, h: bh, kind: lobbyBuyMenu, id: it.id, owned });
    }
    ctx.restore();
    const cw = 130, chh = 32, cx = W / 2 - cw / 2, cy = py + ph - 40;
    ctx.fillStyle = '#333'; roundedRect(cx, cy, cw, chh, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.fillText('CLOSE', W / 2, cy + 21);
    lobbyBuyBtns.push({ x: cx, y: cy, w: cw, h: chh, close: true });
  }

  // Portal-fire fade overlay (covers the screen briefly while transitioning)
  if (lobbyFadeAlpha > 0) {
    ctx.fillStyle = 'rgba(6,8,18,' + lobbyFadeAlpha.toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.textAlign = 'left';
}

function garageBtn(label, x, y, w, h, action, opts={}) {
  const hov = mouse.x>=x && mouse.x<=x+w && mouse.y>=y && mouse.y<=y+h && !opts.disabled;
  ctx.fillStyle = opts.disabled ? 'rgba(40,40,50,0.6)'
                : opts.active   ? 'rgba(255,68,221,0.9)'
                : hov           ? 'rgba(255,68,221,0.7)'
                                : 'rgba(20,20,30,0.75)';
  roundedRect(x, y, w, h, 5); ctx.fill();
  ctx.strokeStyle = opts.disabled ? '#444' : (opts.active ? '#fff' : '#ff44dd');
  ctx.lineWidth = opts.active ? 2.5 : 1.5;
  roundedRect(x, y, w, h, 5); ctx.stroke();
  ctx.fillStyle = opts.disabled ? '#888' : '#fff';
  ctx.font = opts.small ? 'bold 10px system-ui' : 'bold 12px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x+w/2, y+h/2);
  ctx.textBaseline = 'alphabetic';
  garageButtons.push({ x, y, w, h, action, disabled: !!opts.disabled });
}

function drawGarageRoom() {
  const RB = 200; // bottom of garage room area
  // opaque shop background below the room
  ctx.fillStyle = 'rgba(6,8,20,0.96)';
  ctx.fillRect(0, RB, W, H - RB);

  // garage door horizontal stripes across the top
  const sH = 14, nS = 5;
  for (let i = 0; i < nS; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(188,188,202,0.84)' : 'rgba(162,162,176,0.84)';
    ctx.fillRect(0, i * sH, W, sH);
  }
  ctx.strokeStyle = 'rgba(65,65,76,0.55)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= nS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * sH - 0.5); ctx.lineTo(W, i * sH - 0.5); ctx.stroke();
  }

  // perspective walls — inner transparent window where car shows through
  const IT = nS * sH, IL = 62, IR = W - 62, IB = RB - 6;
  // left wall
  ctx.fillStyle = 'rgba(148,150,162,0.88)';
  ctx.beginPath();
  ctx.moveTo(0, IT); ctx.lineTo(IL, IT); ctx.lineTo(IL, IB); ctx.lineTo(0, RB);
  ctx.closePath(); ctx.fill();
  // right wall
  ctx.beginPath();
  ctx.moveTo(W, IT); ctx.lineTo(IR, IT); ctx.lineTo(IR, IB); ctx.lineTo(W, RB);
  ctx.closePath(); ctx.fill();
  // floor strip
  ctx.fillStyle = 'rgba(96,98,110,0.88)';
  ctx.beginPath();
  ctx.moveTo(0, RB); ctx.lineTo(W, RB); ctx.lineTo(IR, IB); ctx.lineTo(IL, IB);
  ctx.closePath(); ctx.fill();

  // inner frame line
  ctx.strokeStyle = 'rgba(45,45,54,0.65)';
  ctx.lineWidth = 2;
  ctx.strokeRect(IL, IT, IR - IL, IB - IT);

  // tires stacked on right wall
  const tx = W - 30;
  for (let i = 0; i < 3; i++) {
    const ty = RB - 16 - i * 22;
    ctx.fillStyle = '#1e1e22';
    ctx.beginPath(); ctx.ellipse(tx, ty, 15, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5e5e70';
    ctx.beginPath(); ctx.ellipse(tx, ty, 5, 3, 0, 0, Math.PI*2); ctx.fill();
  }

  // workbench on left wall
  const wx = 4, ww = 54, wy = RB - 54;
  ctx.fillStyle = '#7a5530'; ctx.fillRect(wx, wy, ww, 8);
  ctx.fillStyle = '#4a3020'; ctx.fillRect(wx, wy + 8, ww, 32);
  // red toolbox on workbench
  ctx.fillStyle = '#cc2020'; ctx.fillRect(wx, wy - 17, 22, 17);
  ctx.fillStyle = '#aa1010'; ctx.fillRect(wx + 2, wy - 10, 18, 3);
}

function drawGarage() {
  garageButtons = [];
  drawGarageRoom();
  const RB = 200;

  // title + coins
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd54a';
  ctx.font = 'bold 22px system-ui';
  ctx.fillText('GARAGE', W/2, RB + 22);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 14px system-ui';
  ctx.fillText('● ' + coins, W-14, RB + 20);
  ctx.fillStyle = '#b39ddb'; ctx.font = 'bold 11px system-ui';
  ctx.fillText('◆ ' + gems, W-14, RB + 33);

  // tabs — two rows: car cosmetics (top) + avatar cosmetics (bottom).
  // Avatar/trail tabs are EQUIP-ONLY here; you buy those at the lobby shop pads.
  const perRow=3, tabGap=4, tabRowGap=4, tabH=24, tabY=RB+34;
  const tabW=Math.min(138,(W-24-tabGap*(perRow-1))/perRow);
  const tabX0=(W-(tabW*perRow+tabGap*(perRow-1)))/2;
  const TABS=[['cars','CARS'],['paint','PAINT'],['trails','TRAILS'],['helmets','HELMETS'],['auras','AURAS'],['skins','SKINS']];
  for(let i=0;i<TABS.length;i++){
    const [id,label]=TABS[i];
    const r=Math.floor(i/perRow), c=i%perRow;
    const tx=tabX0+c*(tabW+tabGap), ty=tabY+r*(tabH+tabRowGap);
    garageBtn(label,tx,ty,tabW,tabH,()=>{garageTab=id;garagePaintSelected=null;garageTrailSelected=null;garageCarSelected=null;garageSlotPicker=null;garageTrailScroll=0;garagePaintScroll=0;garageCosmScroll=0;},{active:garageTab===id,small:true});
  }

  const contentY=tabY+2*(tabH+tabRowGap)+10, contentH=H-contentY-40;

  if(garageTab==='cars'){
    const cardH=44, gap=5, visibleCount=6;
    const regularCars=CARS.map((c,i)=>({...c,_origIdx:i})).filter(c=>!c.missionOnly);
    const maxScroll=Math.max(0,regularCars.length-visibleCount);
    garageCarScroll=Math.max(0,Math.min(garageCarScroll,maxScroll));
    const startIdx=Math.floor(garageCarScroll);
    const endIdx=Math.min(regularCars.length,startIdx+visibleCount);
    // scroll hint arrows
    if(startIdx>0){ctx.fillStyle='rgba(255,213,74,0.7)';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('▲',W/2,contentY+6);}
    if(endIdx<regularCars.length){ctx.fillStyle='rgba(255,213,74,0.7)';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('▼',W/2,contentY+contentH+4);}
    for(let li=0;li<endIdx-startIdx;li++){
      const car=regularCars[startIdx+li];
      const i=car._origIdx;
      const cy=contentY+li*(cardH+gap);
      const owned_=isUnlocked(i);
      const equipped=carIdx===i;
      // card bg
      ctx.fillStyle=equipped?'rgba(255,68,221,0.18)':'rgba(255,255,255,0.04)';
      roundedRect(14,cy,W-28,cardH,7); ctx.fill();
      ctx.strokeStyle=equipped?'#ff44dd':'rgba(255,255,255,0.12)';
      ctx.lineWidth=equipped?2:1; roundedRect(14,cy,W-28,cardH,7); ctx.stroke();
      // color swatch
      ctx.fillStyle='#'+car.body.toString(16).padStart(6,'0');
      ctx.beginPath(); ctx.roundRect(22,cy+cardH/2-10,20,20,4); ctx.fill();
      // name & desc
      ctx.textAlign='left'; ctx.fillStyle=owned_?'#ffd54a':'#aaa';
      ctx.font='bold 12px system-ui';
      ctx.fillText(car.name,50,cy+cardH/2-3);
      ctx.fillStyle='#888'; ctx.font='10px system-ui';
      ctx.fillText(car.desc,50,cy+cardH/2+10);
      // cost for locked cars
      if(!owned_){
        const gc=car.gemCost||0;
        ctx.fillStyle=coins>=car.cost?'#aaffaa':'#ff8888'; ctx.font='9px system-ui';
        ctx.fillText('● '+car.cost,50,cy+cardH/2+21);
        if(gc>0){
          ctx.fillStyle=gems>=gc?'#cc99ff':'#ff6688';
          ctx.fillText('  ◆ '+gc,50+ctx.measureText('● '+car.cost).width+2,cy+cardH/2+21);
        }
      }
      // card body clickable (left portion, excluding action button area) to toggle upgrade slots
      garageButtons.push({ x:14, y:cy, w:W-112, h:cardH, action:()=>{ garageCarSelected = garageCarSelected===i ? null : i; garageSlotPicker=null; }, disabled:false });
      // action button
      const bw=76,bh=24,bx=W-14-bw-4,by_=cy+cardH/2-bh/2;
      if(equipped){
        garageBtn('EQUIPPED',bx,by_,bw,bh,null,{active:true,small:true});
      }else if(owned_){
        garageBtn('EQUIP',bx,by_,bw,bh,()=>{carIdx=i;localStorage.setItem('headon_car',i);rebuildPlayerCar();},{small:true});
      }else{
        // Two stacked buy buttons: pay with Head On coins (+gems) OR Arcade Coins.
        const gc=car.gemCost||0, ac=arcadePrice(car.cost);
        const canCoin=coins>=car.cost && gems>=gc, canArc=arcadeCoins>=ac;
        const hh=bh/2-1, b1y=cy+cardH/2-bh/2, b2y=cy+cardH/2+1;
        const coinLabel=gc>0?('●'+car.cost+' ◆'+gc):('● '+car.cost);
        garageBtn(coinLabel,bx,b1y,bw,hh,canCoin?()=>{setCoins(coins-car.cost);if(gc>0)addGems(-gc);unlockCar(i);}:null,{disabled:!canCoin,small:true});
        garageBtn('◈ '+ac,bx,b2y,bw,hh,canArc?()=>{setArcadeCoins(arcadeCoins-ac);unlockCar(i);}:null,{disabled:!canArc,small:true});
      }
    }
  }

  // car upgrade slots panel — shown when a car card is tapped
  if (garageTab === 'cars' && garageCarSelected !== null) {
    const slotDefs = [
      { icon: '⚙', name: 'ENGINE', key: 'engine' },
      { icon: '◎', name: 'WHEELS', key: 'wheels' },
      { icon: '▣', name: 'BRAKES', key: 'brakes' },
    ];
    const panH = 90;
    const panY = H - 48 - panH;
    ctx.fillStyle = 'rgba(0,5,20,0.97)';
    ctx.beginPath(); ctx.roundRect(14, panY, W-28, panH, 7); ctx.fill();
    ctx.strokeStyle = '#ff44dd'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(14, panY, W-28, panH, 7); ctx.stroke();
    const selCar = CARS[garageCarSelected];
    ctx.textAlign = 'left'; ctx.fillStyle = '#ff88ee'; ctx.font = 'bold 10px system-ui';
    ctx.fillText((selCar ? selCar.name : '') + '  —  UPGRADES', 22, panY + 13);
    ctx.fillStyle = '#444'; ctx.font = '9px system-ui';
    ctx.fillText('Tap a slot to equip from inventory', 22, panY + 23);
    const slotGap = 5, slotW = (W - 28 - slotGap * 4) / 3;
    slotDefs.forEach((slot, si) => {

    const _isSecretPaint = _selPaint && (_selPaint.id === 'paint_obsidian' || _selPaint.id === 'paint_moneyforever' || _selPaint.id === 'paint_minecraft');

}

function drawGemShop() {
  const CHESTS = [
    { id:'common',    name:'COMMON',    cost:10,    color:'#9e9e9e', emoji:'📦' },
    { id:'uncommon',  name:'UNCOMMON',  cost:50,    color:'#4caf50', emoji:'🟩' },
    { id:'rare',      name:'RARE',      cost:200,   color:'#4fc3f7', emoji:'🔷' },
    { id:'epic',      name:'EPIC',      cost:500,   color:'#cc44ff', emoji:'🔮' },
    { id:'legendary', name:'LEGENDARY', cost:1000,  color:'#ffd700', emoji:'⭐' },
  ];
  function rollChest(id) {
    // probability per tier per chest (each splits evenly across engine/wheels/brakes)
    // tier numbers: 1 COMMON, 2 UNCOMMON, 3 RARE, 4 EPIC, 5 LEGENDARY
    const TP = {
      common:    { 2: 0.30, 1: 0.70 },
      uncommon:  { 3: 0.40, 1: 0.60 },
      rare:      { 4: 0.30, 3: 0.40, 1: 0.30 },
      epic:      { 5: 0.10, 4: 0.45, 3: 0.25, 1: 0.20 },
      legendary: { 5: 0.30, 4: 0.40, 3: 0.20, 1: 0.10 },
    };
    const COMPONENTS = ['engine','wheels','brakes'];
    const probs = TP[id] || TP.common;
    let r = Math.random();
    for (const tierKey of Object.keys(probs)) {
      const tier = +tierKey;
      const slice = probs[tierKey] / 3;
      for (let i = 0; i < 3; i++) {
        if (r < slice) return { type: COMPONENTS[i], tier };
        r -= slice;
      }
    }
    return { type: 'coins', amount: 200 }; // safety fallback
  }

  const GEM_DEALS = [
    { coins:500,   gems:1,  label:'1 GEM'   },
    { coins:1500,  gems:3,  label:'3 GEMS'  },
    { coins:2500,  gems:5,  label:'5 GEMS'  },
    { coins:5000,  gems:10, label:'10 GEMS' },
    { coins:22500, gems:50, label:'50 GEMS' },
  ];
  const rowH=64, rowGap=5, rowW=W-28, rowX=14;
  const gemRowH=52, gemRowGap=5;
  const sectionLabelH=30;
  const totalContentH = CHESTS.length*(rowH+rowGap) + sectionLabelH + GEM_DEALS.length*(gemRowH+gemRowGap);
  const contentTop=72, contentBot=H-44, contentH=contentBot-contentTop;
  const maxScroll=Math.max(0, totalContentH-contentH);
  shopScroll=Math.min(shopScroll,maxScroll);

  ctx.fillStyle='rgba(0,0,0,0.94)'; ctx.fillRect(0,0,W,H);
  // fixed header
  ctx.textAlign='center';
  ctx.font='bold 26px system-ui'; ctx.fillStyle='#ffd54a';
  ctx.fillText('SHOP', W/2, 34);
  ctx.font='bold 13px system-ui'; ctx.fillStyle='#ffd54a';
  ctx.fillText('● '+coins.toLocaleString(), W/2-40, 56);
  ctx.fillStyle='#b39ddb'; ctx.fillText('◆ '+gems, W/2+40, 56);
  // scroll hints
  if(shopScroll>0){ ctx.fillStyle='rgba(255,213,74,0.6)'; ctx.font='13px system-ui'; ctx.fillText('▲', W/2, contentTop+8); }
  if(shopScroll<maxScroll){ ctx.fillStyle='rgba(255,213,74,0.6)'; ctx.font='13px system-ui'; ctx.fillText('▼', W/2, contentBot-4); }

  gemShopButtons=[];
  ctx.save(); ctx.beginPath(); ctx.rect(0,contentTop,W,contentH); ctx.clip();

  let relY=0; // relative y within scrollable content
  // ---- CHESTS ----
  CHESTS.forEach((chest,i)=>{
    const ry=contentTop+relY-shopScroll;
    if(ry+rowH>contentTop && ry<contentBot){
      const canAfford=gems>=chest.cost;
      const hov=mouse.x>=rowX&&mouse.x<=rowX+rowW&&mouse.y>=ry&&mouse.y<=ry+rowH&&canAfford;
      ctx.fillStyle=canAfford?(hov?'rgba(255,255,255,0.09)':'rgba(255,255,255,0.04)'):'rgba(20,20,30,0.7)';
      ctx.beginPath(); ctx.roundRect(rowX,ry,rowW,rowH,8); ctx.fill();
      ctx.strokeStyle=canAfford?chest.color:'#2a2a3a'; ctx.lineWidth=canAfford?1.5:1;
      ctx.beginPath(); ctx.roundRect(rowX,ry,rowW,rowH,8); ctx.stroke();
      ctx.fillStyle=canAfford?chest.color+'28':'#ffffff0a';
      ctx.beginPath(); ctx.roundRect(rowX+6,ry+8,48,rowH-16,6); ctx.fill();
      // Per-rarity 2D chest art (replaces the old emoji).
      drawChestArt(ctx, rowX+12, ry+10, 36, rowH-20, chest.id, 0);
      ctx.textAlign='left';
      ctx.font='bold 13px system-ui'; ctx.fillStyle=canAfford?chest.color:'#444';
      ctx.fillText(chest.name, rowX+62, ry+22);
      ctx.font='9px system-ui'; ctx.fillStyle=canAfford?'#888':'#333';
      ctx.fillText('Engine · Wheels · Brakes  or  Coins  —  goes to inventory', rowX+62, ry+36);
      const invCount=(upgradeInventory.engine||[]).length+(upgradeInventory.wheels||[]).length+(upgradeInventory.brakes||[]).length;
      if(invCount>0){ ctx.fillStyle='#555'; ctx.font='9px system-ui'; ctx.fillText('inventory: '+invCount+' item'+(invCount===1?'':'s'), rowX+62, ry+50); }
      const btnW=84,btnH=30,btnX=rowX+rowW-btnW-8,btnY=ry+rowH/2-btnH/2;
      ctx.fillStyle=canAfford?(hov?'rgba(255,213,74,1)':'rgba(255,213,74,0.85)'):'rgba(35,35,45,0.9)';
      ctx.beginPath(); ctx.roundRect(btnX,btnY,btnW,btnH,5); ctx.fill();
      ctx.textAlign='center'; ctx.font='bold 10px system-ui'; ctx.fillStyle=canAfford?'#111':'#333';
      ctx.fillText('◆ '+chest.cost.toLocaleString(), btnX+btnW/2, btnY+12);
      ctx.font='bold 9px system-ui'; ctx.fillStyle=canAfford?'#222':'#333';
      ctx.fillText('OPEN CHEST', btnX+btnW/2, btnY+23);
      if(canAfford){
        // Clip the click hitbox to the visible content area so half-scrolled
        // rows can't be clicked through into the back-button strip below.
        const _hT = Math.max(ry, contentTop), _hB = Math.min(ry + rowH, contentBot);
        if (_hB > _hT) gemShopButtons.push({x:rowX,y:_hT,w:rowW,h:_hB - _hT,action:()=>{
          addGems(-chest.cost); addQP('chests_5',1); addQP('chests_15',1);
          const res=rollChest(chest.id);
          // Pre-compute the result but show the opening animation first.
          let prepared;
          if (res.type==='coins') {
            prepared = { type:'coins', amount:res.amount, chestName:chest.name, chestColor:chest.color };
          } else {
            addToInventory(res.type,res.tier);
            prepared = { type:res.type, tier:res.tier, tierName:TIER_NAMES[res.tier], tierColor:TIER_COLORS[res.tier], bonusPct:Math.round(UPGRADE_BONUS[res.tier]*100), chestName:chest.name, chestColor:chest.color };
          }
          // For coin payouts: hold off awarding coins until the chest finishes
          // opening so it feels earned.
          chestOpening = { rarity: chest.id, color: chest.color, prepared, res, t: 0, duration: 1500, started: performance.now() };
        }});
      }
    }
    relY+=rowH+rowGap;
  });

  // ---- GEMS SECTION ----
  const secY=contentTop+relY-shopScroll;
  if(secY+sectionLabelH>contentTop && secY<contentBot){
    ctx.textAlign='left'; ctx.fillStyle='#b39ddb'; ctx.font='bold 11px system-ui';
    ctx.fillText('◆  GEMS  —  spend coins to buy gems for premium cars', rowX, secY+20);
  }
  relY+=sectionLabelH;
  GEM_DEALS.forEach((deal)=>{
    const ry=contentTop+relY-shopScroll;
    if(ry+gemRowH>contentTop && ry<contentBot){
      const canAfford=coins>=deal.coins;
      const hov=canAfford&&mouse.x>=rowX&&mouse.x<=rowX+rowW&&mouse.y>=ry&&mouse.y<=ry+gemRowH;
      ctx.fillStyle=canAfford?(hov?'rgba(179,157,219,0.20)':'rgba(179,157,219,0.09)'):'rgba(20,20,30,0.7)';
      ctx.beginPath(); ctx.roundRect(rowX,ry,rowW,gemRowH,7); ctx.fill();
      ctx.strokeStyle=canAfford?'#b39ddb':'#2a2a3a'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(rowX,ry,rowW,gemRowH,7); ctx.stroke();
      ctx.textAlign='left'; ctx.font='bold 16px system-ui'; ctx.fillStyle=canAfford?'#b39ddb':'#444';
      ctx.fillText('◆'.repeat(Math.min(deal.gems,5))+(deal.gems>5?'…':''), rowX+12, ry+gemRowH/2+6);
      ctx.textAlign='right'; ctx.font='bold 13px system-ui'; ctx.fillStyle=canAfford?'#fff':'#555';
      ctx.fillText(deal.label, rowX+rowW-12, ry+20);
      ctx.font='11px system-ui'; ctx.fillStyle=canAfford?'#ffd54a':'#444';
      ctx.fillText('● '+deal.coins.toLocaleString(), rowX+rowW-12, ry+36);
      if(canAfford){
        const _hT = Math.max(ry, contentTop), _hB = Math.min(ry + gemRowH, contentBot);
        if (_hB > _hT) gemShopButtons.push({x:rowX,y:_hT,w:rowW,h:_hB - _hT,action:()=>{ setCoins(coins-deal.coins); addGems(deal.gems); }});
      }
    }
    relY+=gemRowH+gemRowGap;
  });

  ctx.restore();

  // fixed back button
  const backW=130,backH=32,backX=(W-backW)/2,backY=H-40;
  const backHov=mouse.x>=backX&&mouse.x<=backX+backW&&mouse.y>=backY&&mouse.y<=backY+backH;
  ctx.fillStyle=backHov?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.07)';
  ctx.beginPath(); ctx.roundRect(backX,backY,backW,backH,6); ctx.fill();
  ctx.strokeStyle='#888'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(backX,backY,backW,backH,6); ctx.stroke();
  ctx.textAlign='center'; ctx.font='bold 13px system-ui'; ctx.fillStyle='#ccc';
  ctx.fillText('← BACK', W/2, backY+21);
  // Back button: unshift so it's first in the array — find() returns it
  // before any deal hitbox, so a click in the back-button strip always exits.
  gemShopButtons.unshift({x:backX,y:backY,w:backW,h:backH,action:()=>{state=STATE.MENU; shopScroll=0;}});

  // Chest opening animation — shown before the result modal.
  if (chestOpening) {
    const co = chestOpening;
    const elapsed = performance.now() - co.started;
    co.t = elapsed;
    const tNorm = Math.min(1, elapsed / co.duration);
    // Backdrop tinted with the rarity colour the player is about to get.
    ctx.fillStyle = 'rgba(0,0,0,0.78)'; ctx.fillRect(0, 0, W, H);
    const pal = CHEST_PALETTE[co.rarity] || CHEST_PALETTE.common;
    // Pulsing radial glow of the rarity colour, ramps up.
    const cx = W / 2, cy = H / 2;
    const glowR = 60 + tNorm * 220;
    const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    glowGrad.addColorStop(0, pal.glow + 'cc');
    glowGrad.addColorStop(1, pal.glow + '00');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, W, H);
    // The chest itself, getting slightly bigger as it opens.
    const size = 120 + tNorm * 30;
    const chX = cx - size / 2, chY = cy - size / 2;
    // Open the lid in the second half of the animation.
    const lidOpen = Math.max(0, (tNorm - 0.4) / 0.55);
    drawChestArt(ctx, chX, chY, size, size, co.rarity, Math.min(1, lidOpen));
    // Sparkle particles bursting out near the end.
    if (tNorm > 0.5) {
      const burst = (tNorm - 0.5) / 0.5;
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2 + tNorm * 2;
        const r = burst * 130;
        ctx.fillStyle = pal.glow;
        ctx.globalAlpha = 1 - burst * 0.6;
        ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r - 30, 3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = pal.glow;
    ctx.font = 'bold 14px system-ui';
    ctx.fillText(co.rarity.toUpperCase() + ' CHEST', cx, chY - 14);
    if (elapsed >= co.duration) {
      // Finalize: award coins if any, surface the result modal.
      if (co.prepared.type === 'coins') setCoins(coins + co.prepared.amount);
      shopResult = co.prepared;
      chestOpening = null;
    }
  }

  if(shopResult){
    ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,H);
    const panW=W-40,panH=200,panX=20,panY=H/2-panH/2;
    ctx.fillStyle='rgba(8,4,18,0.97)'; ctx.beginPath(); ctx.roundRect(panX,panY,panW,panH,12); ctx.fill();
    ctx.strokeStyle=shopResult.type==='coins'?'#ffd54a':(shopResult.tierColor||'#ff44dd'); ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(panX,panY,panW,panH,12); ctx.stroke();
    ctx.textAlign='center';
    ctx.font='bold 10px system-ui'; ctx.fillStyle='#666';
    ctx.fillText(shopResult.chestName+' CHEST', W/2, panY+20);
    ctx.font='bold 16px system-ui'; ctx.fillStyle='#fff';
    ctx.fillText('YOU GOT', W/2, panY+46);
    if(shopResult.type==='coins'){
      ctx.font='bold 30px system-ui'; ctx.fillStyle='#ffd54a';
      ctx.fillText('● '+shopResult.amount.toLocaleString(), W/2, panY+90);
      ctx.font='12px system-ui'; ctx.fillStyle='#aaa'; ctx.fillText('COINS', W/2, panY+110);
    } else {
      const tl=shopResult.type==='engine'?'ENGINE':shopResult.type==='wheels'?'WHEELS':'BRAKES';
      const ef=shopResult.type==='engine'?'+'+shopResult.bonusPct+'% Top Speed & Accel':shopResult.type==='wheels'?'+'+shopResult.bonusPct+'% Handling':'+'+shopResult.bonusPct+'% Braking';
      ctx.font='bold 24px system-ui'; ctx.fillStyle=shopResult.tierColor;
      ctx.fillText(shopResult.tierName+' '+tl, W/2, panY+84);
      ctx.font='11px system-ui'; ctx.fillStyle='#ccc'; ctx.fillText(ef, W/2, panY+104);
      ctx.font='bold 11px system-ui'; ctx.fillStyle='#44ff88';
      ctx.fillText('✓ ADDED TO INVENTORY', W/2, panY+124);
      ctx.font='10px system-ui'; ctx.fillStyle='#888';
      ctx.fillText('Equip it in the Garage → tap your car', W/2, panY+142);
    }
    ctx.font='10px system-ui'; ctx.fillStyle='#444';
    ctx.fillText('tap anywhere to dismiss', W/2, panY+panH-12);
  }
  ctx.textAlign='left';
}

function drawMissionsScreen() {
  checkQuestReset();
  missionsButtons = [];
  ctx.fillStyle = 'rgba(0,0,0,0.94)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 26px system-ui'; ctx.fillStyle = '#ffd54a';
  ctx.fillText('QUESTS', W/2, 38);
  ctx.font = '10px system-ui'; ctx.fillStyle = '#888';
  ctx.fillText('Complete quests to earn coins', W/2, 56);
  const msLeft = Math.max(0, (questResetAt + QUEST_RESET_MS) - Date.now());
  const d = Math.floor(msLeft / 86400000);
  const h = Math.floor((msLeft % 86400000) / 3600000);
  const m = Math.floor((msLeft % 3600000) / 60000);
  ctx.font = '9px system-ui'; ctx.fillStyle = '#ff44dd';
  ctx.fillText('Resets in ' + d + 'd ' + h + 'h ' + m + 'm', W/2, 68);

  const rowH=52, rowGap=4, startY=80, rowW=W-28, rowX=14;
  const listTop = startY, listBottom = H - 52;
  const maxScroll = Math.max(0, QUESTS.length*(rowH+rowGap) - (listBottom - listTop));
  missionsScroll = Math.max(0, Math.min(missionsScroll, maxScroll));
  ctx.save(); ctx.beginPath(); ctx.rect(0, listTop-2, W, listBottom-listTop+4); ctx.clip();
  QUESTS.forEach((q,i) => {
    const ry = startY + i*(rowH+rowGap) - missionsScroll;
    if (ry+rowH < listTop || ry > listBottom) return;   // off-screen — skip
    const prog = questProgress[q.id]?.progress || 0;
    const claimed = questProgress[q.id]?.claimed || false;
    const done = prog >= q.goal;
    const hov = done && !claimed && mouse.x>=rowX && mouse.x<=rowX+rowW && mouse.y>=ry && mouse.y<=ry+rowH;

    ctx.fillStyle = claimed ? 'rgba(20,30,20,0.7)' : done ? 'rgba(30,50,20,0.85)' : 'rgba(18,18,30,0.8)';
    ctx.beginPath(); ctx.roundRect(rowX,ry,rowW,rowH,7); ctx.fill();
    ctx.strokeStyle = claimed ? '#2a3a2a' : done ? '#44ff88' : 'rgba(255,255,255,0.08)';
    ctx.lineWidth = done && !claimed ? 1.5 : 1;
    ctx.beginPath(); ctx.roundRect(rowX,ry,rowW,rowH,7); ctx.stroke();

    // title + desc
    ctx.textAlign = 'left';
    ctx.font = 'bold 12px system-ui';
    ctx.fillStyle = claimed ? '#4a6a4a' : done ? '#44ff88' : '#eee';
    ctx.fillText(q.title, rowX+10, ry+18);
    ctx.font = '9px system-ui'; ctx.fillStyle = claimed ? '#3a5a3a' : '#777';
    ctx.fillText(q.desc, rowX+10, ry+30);

    // progress bar
    const barX=rowX+10, barY=ry+37, barW=rowW-100, barH=5;
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.roundRect(barX,barY,barW,barH,2); ctx.fill();
    const t=Math.min(1,prog/q.goal);
    ctx.fillStyle=claimed?'#2a5a2a':done?'#44ff88':'#ff44dd';
    ctx.beginPath(); ctx.roundRect(barX,barY,barW*t,barH,2); ctx.fill();
    ctx.font='8px system-ui'; ctx.fillStyle='#666'; ctx.textAlign='left';
    ctx.fillText(Math.min(prog,q.goal)+'/'+q.goal, barX, ry+rowH-6);

    // claim / reward button
    const btnW=80,btnH=28,btnX=rowX+rowW-btnW-8,btnY=ry+rowH/2-btnH/2;
    if(claimed){
      ctx.fillStyle='rgba(20,40,20,0.7)'; ctx.beginPath(); ctx.roundRect(btnX,btnY,btnW,btnH,5); ctx.fill();
      ctx.textAlign='center'; ctx.font='bold 9px system-ui'; ctx.fillStyle='#3a7a3a';
      ctx.fillText('✓ DONE', btnX+btnW/2, btnY+btnH/2+3);
    } else if(done){
      ctx.fillStyle=hov?'rgba(68,255,136,1)':'rgba(68,255,136,0.85)';
      ctx.beginPath(); ctx.roundRect(btnX,btnY,btnW,btnH,5); ctx.fill();
      ctx.textAlign='center'; ctx.font='bold 9px system-ui'; ctx.fillStyle='#001800';
      ctx.fillText('CLAIM', btnX+btnW/2, btnY+10);
      ctx.font='bold 10px system-ui'; ctx.fillStyle='#002800';
      ctx.fillText('● '+q.reward, btnX+btnW/2, btnY+22);
      missionsButtons.push({x:btnX,y:btnY,w:btnW,h:btnH,action:()=>claimQuest(q.id),disabled:false});
    } else {
      ctx.fillStyle='rgba(30,30,45,0.8)'; ctx.beginPath(); ctx.roundRect(btnX,btnY,btnW,btnH,5); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(btnX,btnY,btnW,btnH,5); ctx.stroke();
      ctx.textAlign='center'; ctx.font='9px system-ui'; ctx.fillStyle='#555';
      ctx.fillText('● '+q.reward, btnX+btnW/2, btnY+btnH/2+3);
    }
  });
  ctx.restore();
  // scroll indicators
  ctx.textAlign='center'; ctx.fillStyle='rgba(255,213,74,0.85)'; ctx.font='14px system-ui';
  if (missionsScroll > 0)         ctx.fillText('▲', W/2, listTop+8);
  if (missionsScroll < maxScroll) ctx.fillText('▼', W/2, listBottom-2);

  // back button

function drawMissionsGarage() {

  missionCars.forEach((car, li) => {
    const cy = startY + li * (cardH + gap);

    ctx.fillText(car.name, 28, cy + 22);
    ctx.fillStyle = '#ccc'; ctx.font = '10px system-ui';
    ctx.fillText(car.desc, 28, cy + 38);
    ctx.fillStyle = '#aaa'; ctx.font = '9px system-ui';

    const bw_ = 100, bh_ = 28, bx_ = W - 14 - bw_ - 8, by_ = cy + cardH/2 - bh_/2;
    let label_, disabled_ = false, action_ = null;
    if (equipped_) { label_ = 'EQUIPPED'; disabled_ = false; }

    else {
      const canAfford = coins >= car.cost;
      label_ = canAfford ? '● ' + car.cost : '● ' + car.cost;
      disabled_ = !canAfford;
      if (canAfford) action_ = () => { setCoins(coins - car.cost); unlockCar(car._idx); levelCarIdx = car._idx; localStorage.setItem('headon_level_car', car._idx); };
    }
    const hov_ = !disabled_ && mouse.x >= bx_ && mouse.x <= bx_+bw_ && mouse.y >= by_ && mouse.y <= by_+bh_;
    ctx.fillStyle = disabled_ ? 'rgba(40,40,50,0.55)' : hov_ ? 'rgba(255,68,221,0.85)' : 'rgba(20,20,35,0.85)';
    ctx.beginPath(); ctx.roundRect(bx_, by_, bw_, bh_, 5); ctx.fill();
    ctx.strokeStyle = disabled_ ? '#444' : hov_ ? '#fff' : '#ff44dd'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(bx_, by_, bw_, bh_, 5); ctx.stroke();

  if (levelCarIdx === SWAT_IDX) {

      { label: 'MOVE SPEED',   tier: swatSpeedTier,  maxTier: 1, costs: [SPEED_COST],  tLabels: ['+25% SPEED'],
        buy: () => { if (swatSpeedTier < 1 && coins >= SPEED_COST) { setCoins(coins - SPEED_COST); swatSpeedTier = 1; localStorage.setItem('headon_swat_speed', 1); } } },
      { label: 'HEALTH',       tier: swatHealthTier, maxTier: 3, costs: HEALTH_COSTS,  tLabels: HEALTH_LABELS,
        buy: () => { if (swatHealthTier < 3 && coins >= HEALTH_COSTS[swatHealthTier]) { setCoins(coins - HEALTH_COSTS[swatHealthTier]); swatHealthTier++; localStorage.setItem('headon_swat_health', swatHealthTier); } } },
    ];

    upgrades.forEach((u, ui) => {
      const uy = upgradesY + 20 + ui * 46;

      // tier dots
      for (let t = 0; t < u.maxTier; t++) {

        ctx.beginPath(); ctx.arc(24 + t * 14, uy + 30, 5, 0, Math.PI * 2); ctx.fill();

      // upgrade button
      const bw = 88, bh = 24, bx = W - 14 - bw - 8, by = uy + 8;
      const cost = maxed ? 0 : u.costs[u.tier];
      const canBuy = !maxed && coins >= cost;
      const hovU = canBuy && mouse.x >= bx && mouse.x <= bx+bw && mouse.y >= by && mouse.y <= by+bh;
      ctx.fillStyle = maxed ? 'rgba(0,200,80,0.12)' : canBuy ? (hovU ? 'rgba(255,68,221,0.85)' : 'rgba(20,20,35,0.85)') : 'rgba(30,30,40,0.5)';
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 4); ctx.fill();
      ctx.strokeStyle = maxed ? '#00cc55' : canBuy ? (hovU ? '#fff' : '#ff44dd') : '#333'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 4); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = maxed ? '#00ff77' : canBuy ? '#ffd54a' : '#555';
      ctx.font = 'bold 10px system-ui';
      ctx.fillText(maxed ? 'MAXED' : '● ' + cost, bx + bw/2, by + bh/2 + 4);

      if (canBuy) missionsButtons.push({ x: bx, y: by, w: bw, h: bh, action: u.buy, disabled: false });
    });
  }

  // back button
  const backB = { label: '← BACK', x: W/2 - 60, y: H - 42, w: 120, h: 32, action: () => state = STATE.MISSIONS };
  missionsButtons.push(backB);
  const hovB = mouse.x >= backB.x && mouse.x <= backB.x+backB.w && mouse.y >= backB.y && mouse.y <= backB.y+backB.h;
  ctx.fillStyle = hovB ? 'rgba(255,68,221,0.85)' : 'rgba(20,20,35,0.85)';
  ctx.beginPath(); ctx.roundRect(backB.x, backB.y, backB.w, backB.h, 6); ctx.fill();
  ctx.strokeStyle = hovB ? '#fff' : '#ff44dd'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(backB.x, backB.y, backB.w, backB.h, 6); ctx.stroke();
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 13px system-ui';
  ctx.fillText(backB.label, backB.x + backB.w/2, backB.y + backB.h/2 + 4);
  ctx.textAlign = 'left';
}

// ─── Inline leaderboard panel (top-left under the settings gear) ─────────
// Always visible in menu + free-map. Switches between classic / mini-games
// based on what the player is doing.
function _msUntilNextMonth() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  return Math.max(0, next - now);
}
function _formatCountdown(ms) {
  const days  = Math.floor(ms / 86400000);
  const hours = Math.floor((ms % 86400000) / 3600000);
  if (days  > 0) return days + 'd ' + hours + 'h';
  const mins = Math.floor((ms % 3600000) / 60000);
  if (hours > 0) return hours + 'h ' + mins + 'm';
  return mins + 'm';
}
// Award name + emoji rotates each month so it feels themed.
const _AWARD_THEMES = [
  { name: 'TROPHY OF SPEED',    emoji: '🏆' }, { name: 'NEON CROWN',         emoji: '👑' },
  { name: 'GOLD RIM',           emoji: '🏅' }, { name: 'PHANTOM CUP',        emoji: '🥇' },
  { name: 'COMET MEDAL',        emoji: '☄️' }, { name: 'INFERNO RIBBON',    emoji: '🔥' },
  { name: 'BLAZE STAR',         emoji: '⭐' }, { name: 'STORM TROPHY',       emoji: '⚡' },
  { name: 'LIGHTNING CHAIN',    emoji: '⛓️' }, { name: 'SAPPHIRE BADGE',    emoji: '💎' },
  { name: 'NIGHT RACER PLATE',  emoji: '🌙' }, { name: 'FROSTBITE GOBLET',   emoji: '❄️' },
];
function _currentAwardTheme() { return _AWARD_THEMES[new Date().getMonth() % _AWARD_THEMES.length]; }
let inlineLBScroll = 0;     // scroll offset (rows) for the inline panel
let inlineLBAwardOpen = false;   // award detail popover open

function drawInlineLeaderboard() {
  // Context-aware: in Free Map (either menu mode selection OR actively
  // driving) → show the two mini-game boards. Otherwise → Classic only.
  const isFM = freeMap || MODES[modeIdx] === 'FREE MAP';
  const x = 4, y = 4, w = 128, h = isFM ? 170 : 156;
  // Hover / click hit info
  const onPanel = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;

  // Panel background
  ctx.fillStyle = 'rgba(8, 12, 28, 0.85)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill();
  ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.stroke();

  // Header — countdown or award button.
  const cdMs = _msUntilNextMonth();
  if (monthlyRewardWonLast || performance.now() < monthlyRewardShownUntil) {
    const aw = _currentAwardTheme();
    const abX = x + 6, abY = y + 6, abW = w - 12, abH = 20;
    const abHov = mouse.x >= abX && mouse.x <= abX + abW && mouse.y >= abY && mouse.y <= abY + abH;
    ctx.fillStyle = abHov ? 'rgba(255,215,0,0.6)' : 'rgba(255,215,0,0.35)';
    ctx.beginPath(); ctx.roundRect(abX, abY, abW, abH, 3); ctx.fill();
    ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(abX, abY, abW, abH, 3); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(aw.emoji + ' AWARD — TAP', x + w / 2, abY + 13);
  } else {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#888'; ctx.font = '8px system-ui';
    ctx.fillText('next month in ' + _formatCountdown(cdMs), x + w / 2, y + 16);
  }

  if (isFM) {
    // FREE MAP: stack Flappy Dunk + Geo Dash Wave (top-4 each).
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ff8822'; ctx.font = 'bold 10px system-ui';
    ctx.fillText('FLAPPY DUNK', x + 6, y + 38);
    _drawInlineRows(x + 6, y + 46, w - 12, getMiniLeaderboardRanked('flappydunk').slice(0, 4), '#ff8822');
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 6, y + 110); ctx.lineTo(x + w - 6, y + 110); ctx.stroke();
    ctx.fillStyle = '#22ddff'; ctx.font = 'bold 10px system-ui';
    ctx.fillText('GEO DASH WAVE', x + 6, y + 124);
    _drawInlineRows(x + 6, y + 132, w - 12, getMiniLeaderboardRanked('gdwave').slice(0, 4), '#22ddff');
    return;
  }

  // CLASSIC: scrollable single board.
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 10px system-ui';
  ctx.fillText('CLASSIC', x + 6, y + 38);
  const classic = getClassicLeaderboardRanked();
  const maxScroll = Math.max(0, classic.length - 11);
  inlineLBScroll = Math.max(0, Math.min(maxScroll, inlineLBScroll));
  const classicView = classic.slice(inlineLBScroll, inlineLBScroll + 11);
  _drawInlineRows(x + 6, y + 46, w - 12, classicView, '#ffd54a', inlineLBScroll);
  if (inlineLBScroll > 0) {
    ctx.fillStyle = '#ffd54a'; ctx.font = '8px system-ui'; ctx.textAlign = 'right';
    ctx.fillText('▲', x + w - 6, y + 38);
  }
  if (inlineLBScroll < maxScroll) {
    ctx.fillStyle = '#ffd54a'; ctx.font = '8px system-ui'; ctx.textAlign = 'right';
    ctx.fillText('▼', x + w - 6, y + h - 6);
  }
}
function _drawInlineRows(x, y, w, list, color, startIdx) {
  ctx.textAlign = 'left';
  let ly = y;
  for (let i = 0; i < list.length; i++) {
    const r = list[i];
    const pos = (startIdx || 0) + i + 1;
    const isYou = r.isPlayer;
    ctx.fillStyle = isYou ? '#22ddff' : (pos === 1 ? color : '#aaa');
    ctx.font = isYou ? 'bold 9px system-ui' : '9px system-ui';
    const tag = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : '#' + pos;
    ctx.fillText(tag, x, ly + 8);
    ctx.fillText((r.name || '').slice(0, 8), x + 22, ly + 8);
    ctx.textAlign = 'right';
    ctx.fillText(String(r.score), x + w, ly + 8);
    ctx.textAlign = 'left';
    ly += 11;
  }
}

const FD_W = 880, FD_H = 540;
const FD_GRAVITY = 950;           // gentler fall (landscape canvas → easier)
const FD_TAP_VY = -390;           // upward kick on tap
const FD_BALL_R = 22;
const FD_BALL_X = 180;            // ball stays at this fixed X
const FD_SCROLL = 160;            // px/s — hoops scroll left at this speed
const FD_HOOP_W = 14;             // thickness of hoop edges
const FD_HOOP_GAP = 200;          // vertical gap in the hoop
const FD_HOOP_SPACING = 400;      // distance between hoops
const _fdRAF = { id: 0 };

// Deterministic RNG so duo matches generate identical hoops on both clients.
function _fdMakePRNG(seed) {
  let s = seed | 0;
  return () => { s = (s * 1664525 + 1013904223) | 0; return ((s >>> 0) / 0x100000000); };
}
let _fdHoopRng = Math.random;   // overridden in duo mode for shared hoops

function _fdSpawnHoop(x) {
  // Pick a random vertical center for the gap, keeping it on-screen.
  const margin = FD_HOOP_GAP / 2 + 60;
  const gapY = margin + _fdHoopRng() * (FD_H - 2 * margin);
  return { x, gapY, passed: false };
}

function _fdInitRound() {
  const hoops = [];
  for (let i = 0; i < 3; i++) {
    hoops.push(_fdSpawnHoop(FD_W + 60 + i * FD_HOOP_SPACING));
  }
  return hoops;
}

function startFlappyDunk() {

    // mode_select → duo_lobby → duo_matched → playing → gameover (duo)
    mode: 'mode_select',

    bestEver: +localStorage.getItem('fd_best') || 0,
    by: FD_H / 2,
    bvy: 0,
    wingFlap: 0,
    hoops: _fdInitRound(),
    score: 0,
    lastTime: performance.now(),
    flashUntil: 0,
    flashColor: '#ffffff',
    dead: false,
    duo: null,             // duo-match state object, see startFlappyDunkDuo
  };

function fdOnKey(k) {
  if (!_fdState) return;
  const s = _fdState;
  if (s.mode === 'mode_select') {
    // 1 / s → SOLO,  2 / d → DUO
    if (k === '1' || k === 's') { s.gameMode = 'solo'; s.mode = 'ready'; }
    else if (k === '2' || k === 'd') {
      if (!FIREBASE_READY) { s.duoMessage = 'Multiplayer needs Firebase set up.'; }
      else { s.gameMode = 'duo'; startFlappyDunkDuoLobby(); }
    }
  } else if (s.mode === 'ready') {
    if (k === ' ' || k === 'enter') {
      s.mode = 'playing';
      s.score = 0;
      s.by = FD_H / 2;
      s.bvy = FD_TAP_VY;
      s.wingFlap = 1;
      _fdHoopRng = s.gameMode === 'duo' && s.duo
        ? _fdMakePRNG(s.duo.seed) : Math.random;
      s.hoops = _fdInitRound();
      s.dead = false;
      s.lastTime = performance.now();
    }
  } else if (s.mode === 'playing') {
    if (k === ' ') { s.bvy = FD_TAP_VY; s.wingFlap = 1; }
  } else if (s.mode === 'gameover') {
    if (k === ' ' || k === 'enter') {
      s.mode = 'mode_select'; s.gameMode = null;
      if (s.duo) _fdLeaveDuoMatch();
    }
  }
}

function _fdUpdate(dts) {
  const s = _fdState;
  // Duo-matched countdown: 3 seconds, then auto-start play.
  if (s.mode === 'duo_matched') {
    const t = (performance.now() - (s.duo && s.duo.matchedAt || performance.now())) / 1000;
    if (t > 2.8) {
      s.mode = 'playing';
      s.score = 0;
      s.by = FD_H / 2;
      s.bvy = FD_TAP_VY;
      s.wingFlap = 1;
      _fdHoopRng = _fdMakePRNG(s.duo.seed);
      s.hoops = _fdInitRound();
      s.dead = false;
      s.lastTime = performance.now();
    }
    return;
  }
  if (s.mode !== 'playing') return;
  // physics
  s.bvy += FD_GRAVITY * dts;
  s.by  += s.bvy * dts;
  s.wingFlap = Math.max(0, s.wingFlap - dts * 4);
  // Duo: broadcast self at 10Hz so the opponent sees us move + score live.
  if (s.gameMode === 'duo' && s.duo && s.duo.matchId) {
    s._bcTimer = (s._bcTimer || 0) + dts;
    if (s._bcTimer >= 0.1) {
      s._bcTimer = 0;
      _fdDuoBroadcast({ score: s.score, by: s.by, alive: true });
    }
  }

  // scroll the hoops left
  // scroll speed scales gently with score so it gets harder (very gradual)
  const scroll = FD_SCROLL + Math.min(s.score, 40) * 2;
  for (const h of s.hoops) {
    h.x -= scroll * dts;
  }

  // off the bottom or top → dead
  if (s.by > FD_H - 30) { s.by = FD_H - 30; _fdEndRound(); return; }
  if (s.by < 30)        { s.by = 30; s.bvy = 0; }

  // scoring + collision with each hoop
  for (const h of s.hoops) {
    // score when ball passes the hoop's x (going left, i.e., hoop scrolled past ball)
    if (!h.passed && h.x < FD_BALL_X - FD_HOOP_W) {
      h.passed = true;
      s.score++;
      s.flashUntil = performance.now() + 180;
      s.flashColor = '#22ff88';
    }
    // collision: ball is within hoop x-range AND not in the gap
    const dx = Math.abs(h.x - FD_BALL_X);
    if (dx < FD_HOOP_W + FD_BALL_R) {
      const top = h.gapY - FD_HOOP_GAP / 2;
      const bot = h.gapY + FD_HOOP_GAP / 2;
      if (s.by - FD_BALL_R < top || s.by + FD_BALL_R > bot) {
        s.flashUntil = performance.now() + 240;
        s.flashColor = '#ff4422';
        _fdEndRound();
        return;
      }
    }
  }

  // recycle hoops that scrolled off the left edge
  for (let i = 0; i < s.hoops.length; i++) {
    if (s.hoops[i].x < -60) {
      const maxX = s.hoops.reduce((m, h) => Math.max(m, h.x), 0);
      s.hoops[i] = _fdSpawnHoop(maxX + FD_HOOP_SPACING);
    }
  }
}

function _fdEndRound() {
  const s = _fdState;
  if (s.score > s.bestEver) {
    s.bestEver = s.score;
    localStorage.setItem('fd_best', s.score);
  }
  submitMiniScore('flappydunk', s.score);
  s.dead = true;
  // Solo: end of run. Duo: mark self dead but wait for opponent (or timeout)
  // before showing results.
  if (s.gameMode === 'duo' && s.duo) {
    _fdDuoBroadcast({ score: s.score, by: s.by, alive: false });
    if (s.duo.opponentAlive === false) s.mode = 'gameover';
    else                                s.mode = 'duo_waiting';
  } else {
    s.mode = 'gameover';
  }
}

// ─── Flappy Dunk duo (Firebase matchmaking + shared seed) ──────────────
function startFlappyDunkDuoLobby() {
  const s = _fdState;
  s.mode = 'duo_lobby';
  s.duo = {
    matchId: null, mySide: null, otherSide: null, seed: 0,
    opponentName: null, opponentScore: 0, opponentY: FD_H / 2, opponentAlive: true,
    lobbyKey: null, matchListenerOff: null, lobbyListenerOff: null,
    joinedAt: Date.now(),

// Mini-Game: GEOMETRY DASH WAVE (2D, local hot-seat for 2 players)
// Hold SPACE → ship climbs at 45°.  Release → ship descends at 45°.
// Squeeze through gaps in scrolling neon walls.  One hit = round over.
// ═══════════════════════════════════════════════════════════════════════
const GDW_PLAYER_X = 140;
const GDW_PLAYER_R = 11;
const GDW_SCROLL_BASE = 240;       // px/s baseline scroll speed
const GDW_VSPEED = 300;            // px/s vertical — a bit faster than scroll for snappier up/down
const GDW_FLOOR_PAD = 30;          // bottom HUD strip
const _gdwRAF = { id: 0 };

function _gdwSpawnObstacle(x, score) {
  // Stepped difficulty: the gap drops a notch every 100 points and can get
  // REALLY tight (down to 38 px), so chasing a high score takes a long time.
  const step = Math.floor(score / 100);
  const gapH = Math.max(38, 360 - step * 28);
  const top = 50 + Math.random() * (FD_H - GDW_FLOOR_PAD - 50 - gapH);
  return { x, w: 56, gapTop: top, gapBot: top + gapH };
}

function startGeometryDashWave() {
  miniGameActive = 'gdwave';
  _fdCanvas.style.display = 'block';
  _fdBackdrop.style.display = 'block';
  _fdCloseBtn.style.display = 'block';
  _gdwState = {
    mode: 'menu',
    bestEver: +localStorage.getItem('gdw_best') || 0,
    py: FD_H / 2,
    trail: [],
    obstacles: [],
    distance: 0,
    nextSpawnIn: 0,
    score: 0,
    flashUntil: 0,
    lastTime: performance.now(),
  };
  _gdwLoop();
}

function gdwOnKey(k) {
  if (!_gdwState) return;
  const s = _gdwState;
  if (s.mode === 'menu') {
    if (k === ' ' || k === 'enter') s.mode = 'ready';
  } else if (s.mode === 'ready') {
    if (k === ' ' || k === 'enter') {
      s.mode = 'playing';
      s.py = FD_H / 2;
      s.trail = [];
      s.obstacles = [];
      s.distance = 0;
      s.nextSpawnIn = 0;
      s.score = 0;
      s.lastTime = performance.now();
    }
  } else if (s.mode === 'gameover') {
    if (k === ' ' || k === 'enter') s.mode = 'menu';
  }

function _gdwEndRound() {
  const s = _gdwState;
  if (s.score > s.bestEver) { s.bestEver = s.score; localStorage.setItem('gdw_best', s.bestEver); }
  submitMiniScore('gdwave', s.score);
  s.mode = 'gameover';
  s.flashUntil = performance.now() + 280;

function _gdwUpdate(dts) {
  const s = _gdwState;
  if (s.mode !== 'playing') return;
  const held = !!keys[' '];
  // 45° wave — vertical step exactly matches scroll for the GD feel.
  s.py += (held ? -1 : 1) * GDW_VSPEED * dts;
  // top / floor collision
  if (s.py < 10 || s.py > FD_H - GDW_FLOOR_PAD - 10) { _gdwEndRound(); return; }
  // scroll
  const scroll = GDW_SCROLL_BASE + Math.min(s.distance / 8, 80);
  s.distance += scroll * dts;
  s.score = Math.floor(s.distance / 30);
  for (const o of s.obstacles) o.x -= scroll * dts;
  // spawn new obstacles
  s.nextSpawnIn -= scroll * dts;
  while (s.nextSpawnIn <= 0) {
    const lastX = s.obstacles.length
      ? s.obstacles[s.obstacles.length - 1].x + s.obstacles[s.obstacles.length - 1].w
      : FD_W;
    const newX = Math.max(lastX + 220, FD_W + 50);
    s.obstacles.push(_gdwSpawnObstacle(newX, s.score));
    s.nextSpawnIn += 300;
  }
  while (s.obstacles.length && s.obstacles[0].x + s.obstacles[0].w < -10) s.obstacles.shift();
  // collision
  for (const o of s.obstacles) {
    if (GDW_PLAYER_X + GDW_PLAYER_R > o.x && GDW_PLAYER_X - GDW_PLAYER_R < o.x + o.w) {
      if (s.py - GDW_PLAYER_R < o.gapTop || s.py + GDW_PLAYER_R > o.gapBot) {
        _gdwEndRound(); return;
      }
    }
  }
  // trail
  s.trail.unshift({ x: GDW_PLAYER_X, y: s.py });
  if (s.trail.length > 30) s.trail.pop();
}

    c.fillStyle = '#22ddff'; c.font = 'bold 24px sans-serif';
    if (Math.floor(performance.now() / 500) % 2 === 0)
      c.fillText('PRESS SPACE / ENTER', FD_W / 2, 400);
    c.fillStyle = '#666'; c.font = '14px sans-serif';
    c.fillText('ESC or × to leave', FD_W / 2, 480);
    return;
  }

  if (s.mode === 'ready') {
    c.textAlign = 'center';
    c.fillStyle = '#22ddff'; c.font = 'bold 56px sans-serif';
    c.fillText('READY', FD_W / 2, 180);
    c.fillStyle = '#aaccdd'; c.font = '20px sans-serif';
    c.fillText('Hold SPACE to wave up.', FD_W / 2, 260);
    c.fillStyle = '#22ddff'; c.font = 'bold 22px sans-serif';
    if (Math.floor(performance.now() / 500) % 2 === 0)
      c.fillText('PRESS SPACE / ENTER', FD_W / 2, 360);
    return;
  }

  // obstacles
  for (const o of s.obstacles) {
    c.fillStyle = '#ff44dd';
    c.fillRect(o.x, 0, o.w, o.gapTop);
    c.fillRect(o.x, o.gapBot, o.w, FD_H - GDW_FLOOR_PAD - o.gapBot);
    // neon outlines
    c.strokeStyle = '#ffaaff'; c.lineWidth = 2;
    c.strokeRect(o.x, 0, o.w, o.gapTop);
    c.strokeRect(o.x, o.gapBot, o.w, FD_H - GDW_FLOOR_PAD - o.gapBot);
    // spikes on the gap edges
    c.fillStyle = '#ff66ee';
    for (let i = 0; i < 3; i++) {
      const sx = o.x + 8 + i * 14;
      c.beginPath(); c.moveTo(sx, o.gapTop); c.lineTo(sx + 7, o.gapTop - 10); c.lineTo(sx + 14, o.gapTop); c.fill();
      c.beginPath(); c.moveTo(sx, o.gapBot); c.lineTo(sx + 7, o.gapBot + 10); c.lineTo(sx + 14, o.gapBot); c.fill();
    }
  }

  // trail
  for (let i = 0; i < s.trail.length; i++) {
    const p = s.trail[i];
    c.globalAlpha = 1 - i / s.trail.length;
    c.fillStyle = '#22ddff';
    c.fillRect(p.x - 3, p.y - 3, 6, 6);
  }
  c.globalAlpha = 1;

  // player ship — diamond pointing right, tilted 45° based on direction
  if (s.mode === 'playing' || s.mode === 'roundover') {
    c.save();
    c.translate(GDW_PLAYER_X, s.py);
    const held = !!keys[' '];
    c.rotate(held ? -Math.PI / 4 : Math.PI / 4);
    c.fillStyle = '#22ddff';
    c.beginPath();
    c.moveTo( GDW_PLAYER_R,            0);
    c.lineTo( 0,             -GDW_PLAYER_R);
    c.lineTo(-GDW_PLAYER_R,            0);
    c.lineTo( 0,              GDW_PLAYER_R);
    c.closePath();
    c.fill();
    c.strokeStyle = '#ffffff'; c.lineWidth = 2; c.stroke();
    c.restore();
  }

  // HUD
  c.textAlign = 'center';
  c.fillStyle = '#ffffff'; c.font = 'bold 44px sans-serif';
  c.fillText(String(s.score), FD_W / 2, 50);

  // flash on crash
  if (performance.now() < s.flashUntil) {
    c.fillStyle = '#ff4422'; c.globalAlpha = 0.22;
    c.fillRect(0, 0, FD_W, FD_H); c.globalAlpha = 1;
  }

  if (s.mode === 'gameover') {
    c.fillStyle = 'rgba(0, 20, 40, 0.92)'; c.fillRect(0, 0, FD_W, FD_H);
    c.textAlign = 'center';
    c.fillStyle = '#22ddff'; c.font = 'bold 42px sans-serif';
    c.fillText('RESULTS', FD_W / 2, 70);
    c.fillStyle = '#22aaff'; c.font = 'bold 28px sans-serif';
    c.fillText('SCORE  ' + s.score, FD_W / 2, 130);
    c.fillStyle = '#ffd54a'; c.font = 'bold 18px sans-serif';
    c.fillText('Best: ' + s.bestEver, FD_W / 2, 160);
    if (s.score > 0 && s.score === s.bestEver) {
      c.fillStyle = '#22ff88'; c.font = 'bold 22px sans-serif';
      c.fillText('NEW PERSONAL BEST!', FD_W / 2, 200);
    }
    c.fillStyle = '#22ddff'; c.font = 'bold 18px sans-serif';
    if (Math.floor(performance.now() / 500) % 2 === 0)
      c.fillText('SPACE → MENU', FD_W / 2, 510);
    c.fillStyle = '#666'; c.font = '12px sans-serif';
    c.fillText('ESC or × to leave', FD_W / 2, 528);
    drawMiniLeaderboardOnCanvas(c, FD_W - 280, 250, 260, 200, 'gdwave');
  }
}

function _gdwLoop() {
  if (miniGameActive !== 'gdwave' || !_gdwState) { _gdwRAF.id = 0; return; }
  const now = performance.now();
  const dts = Math.min(0.05, (now - _gdwState.lastTime) / 1000);
  _gdwState.lastTime = now;
  _gdwUpdate(dts);
  _gdwDraw();
  _gdwRAF.id = requestAnimationFrame(_gdwLoop);
}

// ===== fullscreen sizing ===== make the 3D fill the whole window (correct
// aspect, no stretch) and size the HUD canvas to match, recomputing the
// contain box used by the HUD transform + click mapping.
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  canvasHud.width = Math.round(w * dpr);
  canvasHud.height = Math.round(h * dpr);
  hudScale = Math.min(canvasHud.width / W, canvasHud.height / H);
  hudOffX = (canvasHud.width - W * hudScale) / 2;
  hudOffY = (canvasHud.height - H * hudScale) / 2;
}
window.addEventListener('resize', resize);
// Mobile browsers sometimes fire 'resize' before innerWidth/innerHeight settle
// on a rotate, so re-fit on orientationchange (and again after a short beat).
window.addEventListener('orientationchange', () => { resize(); setTimeout(resize, 120); setTimeout(resize, 400); });
// The mobile viewport also changes when the address bar shows/hides — that does
// NOT fire 'resize'/'orientationchange', so track it too or the HUD misaligns.
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

requestAnimationFrame(loop);
</script>
