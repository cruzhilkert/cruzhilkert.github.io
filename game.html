            vx: (Math.random()-0.5) * 2,
            vy: 1.5 + Math.random() * 3,
            life: 900 + Math.random() * 600, max: 1500,
            size: 13 + Math.random() * 8,
            color: gamerCols[Math.floor(Math.random() * gamerCols.length)],
            gravity: 0, kind: 'controller' });
        }
      }
    } else {
      const obsidianOn = equippedPaint === 'paint_obsidian';
      const obsidianCols = ['#2d0040','#4a0066','#6600aa','#1a0030','#3d005a'];
      const trailColor = obsidianOn
        ? obsidianCols[Math.floor(Math.random()*obsidianCols.length)]
        : getTrailColor(_trailT);
      for (let side = -1; side <= 1; side += 2) {
        const wp = project3D(player.worldX + side * 0.72, 0.05, -1.6);
        if (!wp.behind) {
          particles.push({ x: wp.x, y: wp.y,
            vx: (Math.random()-0.5) * (1.5 + slideBoost * 3),
            vy: 1.5 + Math.random() * 2.5,
            life: 700 + slideBoost * 600 + Math.random() * 400,
            max: 1700,
            size: 8 + slideBoost * 14 + Math.random() * 6,
            color: trailColor, gravity: 0, kind: 'spark' });
        }
      }
    }
  }

  // paint special effects — emit ambient particles while driving
  if (speed > 5) spawnPaintFX(player.worldX, 0.6, 0, 1.0);
  // paint ground trail marks — inferno/snow/ocean leave marks on the road
  if (speed > 8) spawnPaintGroundTrail(player.worldX, speed);
  // water + fire = steam: OCEAN paint + FIRE trail → hissing steam cloud at exhaust
  if (speed > 8 && Math.random() < 0.25) {
    const paintSpec = SHOP_PAINTS.find(p => p.id === equippedPaint);
    const trailSpec = SHOP_TRAILS.find(t => t.id === equippedTrail);
    if (paintSpec && paintSpec.special === 'ocean' && trailSpec && trailSpec.special === 'fire') {
      const sp = project3D(player.worldX + (Math.random()-0.5)*1.0, 0.35, -1.85);
      if (!sp.behind) {
        for (let i = 0; i < 3; i++) {
          particles.push({ x: sp.x + (Math.random()-0.5)*14, y: sp.y + (Math.random()-0.5)*8,
            vx: (Math.random()-0.5)*1.8, vy: -(0.8 + Math.random()*2.5),
            life: 500+Math.random()*500, max: 1000,
            size: 10+Math.random()*16, color: `rgba(${200+Math.floor(Math.random()*40)},${215+Math.floor(Math.random()*30)},240,0.7)`,
            gravity: -0.018, kind: 'spark' });
        }
      }
    }
  }

  if (headOn) {
    // classic mode: same accel + max-boost for every car
    const accelRate = 22 * engineMul;
    const maxBoost = 18 * bodyMul;
    if (keys['arrowup']||keys['w']) speedBoost = Math.min(maxBoost, speedBoost + accelRate * dts);
    else if (keys['arrowdown']||keys['s']) speedBoost = Math.max(-7, speedBoost - accelRate * dts);
    else speedBoost *= Math.pow(0.5, dts * 3);
  } else { speedBoost = 0; }

  if (invulnTime > 0) invulnTime -= dt;
  if (damageBanner > 0) damageBanner -= dt;
  smokeTimer -= dt;

  // auto-cycle background randomly every 25-45 seconds while playing
  bgCycleTimer -= dt;
  if (bgCycleTimer <= 0) {
    let next = bgIdx;
    while (next === bgIdx) next = Math.floor(Math.random() * BACKGROUNDS.length);
    bgIdx = next;
    applyBackground();
    rebuildScenery();
    bgCycleTimer = 25000 + Math.random() * 20000;
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    if (headOn) {
      const w = WAVES[Math.min(wave, WAVES.length-1)];
      spawnPulse(w.count, w.truck);
      spawnTimer = w.interval / Math.max(0.6, speed / 22);
    } else {
      // Classic difficulty comes from SPEED, not car count: spawn a constant
      // 1 car per pulse (never ramps up). As `speed` climbs the spawn interval
      // tightens on its own, so traffic naturally thickens without ever forming
      // a wall — you just have less time to react because you're going faster.
      const classicCount = 1;
      spawnPulse(classicCount, false);
      spawnTimer = (d.spawnBase * 1.3) / Math.max(0.6, speed / 22) + Math.random()*250;
    }
  }

  // closing speed (capped)
  const closing = speed <= 35 ? speed : 35 + (speed - 35) * 0.5;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.worldZ -= closing * dts;
    e.mesh.position.z = e.worldZ;
    if (e.worldZ < -8) {
      scene.remove(e.mesh);
      enemies.splice(i, 1);
      dodged++;
      score += headOn ? 10 : 5;
    }
  }

  if (headOn && wave < WAVES.length - 1) {
    const w = WAVES[wave];
    if (dodged >= w.advance) { wave++; dodged = 0; waveBanner = 1800; }
  }
  if (waveBanner > 0) waveBanner -= dt;

  // collisions: both at z≈0; lateral and longitudinal overlap
  if (invulnTime <= 0) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const dim = e.mesh.userData.dim;
      const halfL = dim.l / 2;
      const halfW = dim.w / 2;
      const myHalfL = 2.2;
      const myHalfW = 1.2;
      if (Math.abs(e.worldZ) < halfL + myHalfL && Math.abs(e.worldX - player.worldX) < halfW + myHalfW) {
        takeDamage(e);
        scene.remove(e.mesh);
        enemies.splice(i, 1);
        if (state === STATE.DEAD) return;
        break;
      }
    }
  }

  // smoke + fire when damaged
  const totalDmg = (dmg.body + dmg.tires + dmg.engine) / 3;
  if (totalDmg > 0.35 && smokeTimer <= 0) {
    smokeTimer = totalDmg > 0.85 ? 35 : totalDmg > 0.6 ? 60 : 100;
    const sp = project3D(player.worldX, 1.4, -2.5);
    if (!sp.behind) {
      const grays = totalDmg > 0.7 ? ['#222','#333','#555','#444'] : ['#666','#555','#777','#888'];
      const sCount = totalDmg > 0.7 ? 2 : 1;
      for (let i = 0; i < sCount; i++) {
        particles.push({ x: sp.x + (Math.random()*2-1)*22, y: sp.y + (Math.random()*2-1)*4,
          vx: (Math.random()*2-1)*0.6, vy: -1.6 - Math.random()*1.2,
          life: 900 + Math.random()*500, max: 1400, size: 5 + Math.random()*6 + totalDmg * 4,
          color: grays[Math.floor(Math.random()*grays.length)], gravity: -0.025, kind: 'spark' });
      }
      if (totalDmg > 0.8) {
        const oranges = ['#ff8800','#ff4400','#ffd000','#ff5500'];
        for (let i = 0; i < 2; i++) {
          particles.push({ x: sp.x + (Math.random()*2-1)*16, y: sp.y - 8,
            vx: (Math.random()*2-1)*0.5, vy: -2 - Math.random()*1.5,
            life: 280 + Math.random()*220, max: 500, size: 4 + Math.random()*5,
            color: oranges[Math.floor(Math.random()*oranges.length)], gravity: -0.06, kind: 'spark' });
        }
      }
    }
  }

  score += dts * 18 * d.scoreMul;
  // Classic speed: every car starts at the same speed (about 16 m/s, ~36
  // mph) and climbs at the same rate (~0.32 m/s per second). Cars no
  // longer differ in classic — they all start the same and ramp the same.
  speed = (16 + score * 0.018) * bodyMul + speedBoost;

  // speed floor — HARD forces you to stay above 60 km/h (~16.7 m/s)
  // (only in HEAD ON where braking is possible, so the rule has teeth)
  if (difficultyIdx === 2 && headOn) {
    const minKmh = 60;
    if (speed * 3.6 < minKmh) {
      diffSpeedWarning = Math.min(2500, diffSpeedWarning + dt * 1.3);
      if (diffSpeedWarning >= 2500) {
        // penalty: treat like a crash damage tick, scaled by car durability
        const per = 0.3 / (CARS[carIdx].hitsToKill || 4);
        dmg.engine = Math.min(1, dmg.engine + per);
        dmg.body   = Math.min(1, dmg.body   + per * 0.5);
        diffSpeedWarning = 1200; // reset to mid so it doesn't instant-loop
        damageBanner = 1200;
        if (dmg.body >= 0.99 && dmg.tires >= 0.99 && dmg.engine >= 0.99) {
          state = STATE.DEAD;
          addShake(0.6, 900); playCrashSound();
          crashAutoTimer = 3000;
          saveBest(Math.floor(score));
          earnings = computeEarnings();
          lastEarned = earnings.total;
          if (lastEarned > 0) { setCoins(coins + lastEarned); awardXp(lastEarned); }
          triggerQP('earn_500', lastEarned); triggerQP('earn_2000', lastEarned); addQP('dodge_50', dodged); addQP('dodge_200', dodged); addQP('dist_5km', Math.floor(distanceM)); addQP('dist_20km', Math.floor(distanceM));
          triggerQP('survive_2m', Math.floor(gameTime/1000)); triggerQP('survive_5m', Math.floor(gameTime/1000));
        }
      }
    } else {
      diffSpeedWarning = Math.max(0, diffSpeedWarning - dt * 2.5);
    }
  } else {
    diffSpeedWarning = Math.max(0, diffSpeedWarning - dt * 2.5);
  }

  // gameplay stats
  gameTime += dts;
  distanceM += speed * dts;
  if (speed * 3.6 > 80) speedingTime += dt;
  if (speed > maxSpeed) maxSpeed = speed;
}

function updateParticles(dt) {
  const f = dt / 16;
  for (const p of particles) {
    p.x += p.vx*f; p.y += p.vy*f; p.vy += p.gravity*f; p.life -= dt;
    if (p.spin != null) p.rot += p.spin*f;
  }
  particles = particles.filter(p => p.life > 0);
}

// ===== sync 3D scene =====
function syncScene() {
  const inLobby = (state === STATE.MENU);
  const inPvpLobby = (state === STATE.PVP_LOBBY);
  const inShowroom = (state === STATE.HELP || state === STATE.ARENA_SELECT || state === STATE.GEM_SHOP);
  const inGarage = (state === STATE.GARAGE);
  const inIndoor   = inShowroom || inGarage || inLobby || inPvpLobby;
  const inArena = (state === STATE.ARENA) || (state === STATE.DEAD && earnings && earnings.mode === 'ARENA');
  roadMesh.visible = !inIndoor && !inArena;
  grassMesh.visible = !inIndoor && !inArena;
  mountains.visible = !inIndoor && !inArena;
  showroomGroup.visible = inShowroom;
  lobbyGroup.visible = inLobby;
  pvpGroup.visible = inPvpLobby;
  arenaGroup.visible = inArena;
  for (const b of arenaBots) { if (b.mesh) b.mesh.visible = inArena && b.state === 'alive'; }
  for (const s of scenery) s.mesh.visible = !inIndoor && !inArena;
  stars.visible = !inIndoor && !inArena && BACKGROUNDS[bgIdx].stars;

  if (inArena) {
    // PvP = clean white RIVALS arena (no dark mountain ring, bright sky dome)
    if (arenaMountainGroup) arenaMountainGroup.visible = !pvpMode;
    if (arenaSkyDome) arenaSkyDome.material.color.setHex(pvpMode ? 0xdce6f4 : 0x5bbde4);
    if (pvpMode) {
      // clean low-poly arena tinted to the chosen map's theme
      const _th = pvpTheme || { sky: 0xccd6ea, fog: 0xdde6f4 };
      scene.background = new THREE.Color(_th.sky);
      scene.fog.color.setHex(_th.fog);
      scene.fog.near = 150; scene.fog.far = 560;
      hemi.color.set(0xffffff);
      hemi.groundColor.set(0xcfd6e6);
      ambient.intensity = 0.62;
    } else if (freeMapInRace) {
      scene.background = new THREE.Color(0x9ddcff); // bright sky
      scene.fog.color.set(0xc4ebff);
      scene.fog.near = 200; scene.fog.far = 600;
      hemi.color.set(0xfffbe6);
      hemi.groundColor.set(0x5fa84b);
      ambient.intensity = 0.55;
    } else {
      scene.background = new THREE.Color(0x5bbde4);
      scene.fog.color.set(0x5bbde4);
      scene.fog.near = 90; scene.fog.far = 220;
      hemi.color.set(0x5bbde4);
      hemi.groundColor.set(0x0055bb);
      ambient.intensity = 0.35;
    }
  } else if (inGarage) {
    scene.background = new THREE.Color(0x808088);
    scene.fog.color.set(0x808088);
    scene.fog.near = 20; scene.fog.far = 50;
    hemi.color.set(0xfff8e8);
    hemi.groundColor.set(0x606068);
    ambient.intensity = 0.5;
  }

  if (inIndoor) {
    if (inPvpLobby) {
      // bright clean cool-white lobby (low-poly FPS look)
      ambient.intensity = 0.95;
      hemi.color.set(0xffffff); hemi.groundColor.set(0xeaf0ff);
      scene.background = new THREE.Color(0xdce7f7);
      if (scene.fog) { scene.fog.color.set(0xe9f0fc); scene.fog.near = 150; scene.fog.far = 620; }
    } else if (!inGarage) {
      ambient.intensity = 0.45;
      // Menu / showroom states: dark backdrop so the car stands out.
      // Setting this on scene.background means the dark colour sits
      // BEHIND the 3D car, not over it.
      scene.background = new THREE.Color(0x060812);
      if (scene.fog) { scene.fog.color.set(0x060812); scene.fog.near = 25; scene.fog.far = 80; }
    }
    if (inLobby) {
      // Player car drives around the lobby. Position/heading sourced from
      // updateLobby(); camera chases from behind and high up. The chase
      // anchor is clamped inside the room so a wall never sits in front
      // of the camera — without this clamp the camera ends up *behind*
      // the back wall on spawn and the whole view goes black.
      // In the lobby you're a stickman, not the car — hide the car, drive the
      // avatar. A small bob while moving makes the figure feel alive.
      if (playerCarGroup) playerCarGroup.visible = false;
      if (lobbyAvatar) {
        const moving = Math.abs(lobbyCar.vfwd);
        const mfrac = Math.min(1, moving / 4);
        const bob = moving > 0.3 ? Math.abs(Math.sin(menuBlink * 0.012)) * 0.12 * mfrac : 0;
        lobbyAvatar.position.set(lobbyCar.x, lobbyCar.y + bob, lobbyCar.z);
        lobbyAvatar.rotation.set(0, lobbyCar.heading, 0);
        lobbyAvatar.visible = true;
        // Swing arms + legs (opposite phases) while walking; ease back to rest when still.
        const lm = lobbyAvatar.userData.limbs;
        if (lm) {
          const sw = moving > 0.3 ? Math.sin(menuBlink * 0.012) * 0.6 * mfrac : 0;
          lm.la.rotation.x = sw;  lm.ra.rotation.x = -sw;
          lm.ll.rotation.x = -sw; lm.rl.rotation.x = sw;
        }
        animateAura(lobbyAvatar, menuBlink * 0.001);
        // your equipped car trail streams behind the walking avatar too
        avatarTrailStep(lobbyGroup, lobbyCar.x, lobbyCar.z, lobbyCar.heading, moving, menuBlink * 0.001);
      }
      const chaseDist = 12;
      const chaseHeight = 9;      // moderate height — enclosing shell blocks the void
      const sh = Math.sin(lobbyCar.heading), ch = Math.cos(lobbyCar.heading);
      const camMargin = 1.2;
      const camX = Math.max(-LOBBY_REACH + camMargin, Math.min(LOBBY_REACH - camMargin, lobbyCar.x - sh * chaseDist));
      const camZ = Math.max(-LOBBY_REACH + camMargin, Math.min(LOBBY_HALF_Z - camMargin, lobbyCar.z - ch * chaseDist));
      if (lobbyPodiumCar) { lobbyPodiumCar.rotation.y = menuBlink * 0.0006; animateAura(lobbyPodiumCar, menuBlink * 0.001); }
      camera.position.set(camX, chaseHeight, camZ);
      // aim a bit up so the wall leaderboards/trophy boards stay in view; the
      // enclosing shell keeps the outside hidden even at this angle.
      camera.lookAt(lobbyCar.x + sh * 3, 2.8, lobbyCar.z + ch * 3);
    } else if (inPvpLobby) {
      // PvP lobby: you walk a blocky character around; chase cam tilted down.
      if (playerCarGroup) playerCarGroup.visible = false;
      if (pvpPlayerCar) {
        pvpPlayerCar.position.set(pvpCar.x, 0, pvpCar.z);
        pvpPlayerCar.rotation.set(0, pvpCar.heading, 0);
        pvpPlayerCar.visible = true;
        const lm = pvpPlayerCar.userData.limbs;
        if (lm) {
          const mv = Math.min(1, Math.abs(pvpCar.vfwd) / 8);
          const sw = mv > 0.05 ? Math.sin(menuBlink * 0.012) * 0.7 * mv : 0;
          lm.la.rotation.x = sw; lm.ra.rotation.x = -sw; lm.ll.rotation.x = -sw; lm.rl.rotation.x = sw;
        }
      }
      const cd = 9, chH = 9.5, M = 1.3;
      const psh = Math.sin(pvpCar.heading), pch = Math.cos(pvpCar.heading);
      // clamp the chase anchor inside the room so it never ends up behind a wall
      // (which would point the camera at the wall backface → black screen).
      // z-extent of the region the car is currently in (spawn box / hallway / room)
      let _zlim = PVP_ROOM_HZ;
      if (pvpCar.x < PVP_S) _zlim = PVP_S;
      else if (pvpCar.x < PVP_ROOM_X0) _zlim = PVP_DOOR + 1.5;
      const pcx = Math.max(-PVP_S + M, Math.min(PVP_ROOM_X1 - M, pvpCar.x - psh * cd));
      const pcz = Math.max(-_zlim + M, Math.min(_zlim - M, pvpCar.z - pch * cd));
      camera.position.set(pcx, chH, pcz);
      camera.lookAt(pvpCar.x + psh * 3, 0.8, pvpCar.z + pch * 3);
    } else {
      // Showroom / Garage: spinning car on the platform with orbit camera.
      if (playerCarGroup) {
        playerCarGroup.position.set(0, 0.18, 1);
        playerCarGroup.rotation.set(0, menuBlink * 0.0008, 0);
        playerCarGroup.visible = true;
        applyDamageVisual(playerCarGroup, 0);
        spawnPaintFX(0, 0.9, 1, 1.4);
      }
      const orbit = -Math.PI/4 + Math.sin(menuBlink * 0.00018) * 0.4;
      const dist = inGarage ? 8.5 : 9.5;
      const camH = inGarage ? 2.6 : 3.4;
      camera.position.set(Math.sin(orbit) * dist, camH, Math.cos(orbit) * -dist + 1);
      camera.lookAt(0, 1.1, 1);
    }
  } else {
    // restore ambient from background
    const bg = BACKGROUNDS[bgIdx];
    ambient.intensity = bg.name === 'NIGHT' ? 0.08 : 0.25;
    // difficulty-based fog: EASY=clear, NORMAL=standard, HARD=thick
    if (state === STATE.PLAYING || (state === STATE.DEAD && !(earnings && earnings.mode === 'ARENA'))) {
      const fogMul = [2.2, 1.0, 0.38][difficultyIdx];
      scene.fog.near = 60 * fogMul;
      scene.fog.far  = 240 * fogMul;
      scene.fog.color.set(bg.fog);
    }
    if (state === STATE.LEVEL) {
      scene.fog.near = 80;
      scene.fog.far  = 200;
      scene.fog.color.set(bg.fog);
    }
    if (playerCarGroup) {
      if (state === STATE.LEVEL) {
        playerCarGroup.position.set(levelPlayerX, 0, 0);
        playerCarGroup.rotation.set(0, 0, -levelPlayerVx / (14 * CARS[levelCarIdx].steerMul) * 0.08);
        applyDamageVisual(playerCarGroup, 0);
        playerCarGroup.visible = levelInvuln <= 0 || Math.floor(levelInvuln / 90) % 2 === 0;
      } else {
        playerCarGroup.position.set(player.worldX, 0, 0);
        playerCarGroup.rotation.set(0, 0, -player.vx / maxSteerRef() * 0.08);
        const totalDmg = (dmg.body + dmg.tires + dmg.engine) / 3;
        applyDamageVisual(playerCarGroup, totalDmg);
        if (invulnTime > 0 && Math.floor(invulnTime / 90) % 2 === 0) playerCarGroup.visible = false;
        else playerCarGroup.visible = state !== STATE.DEAD;
      }
    }
    const sx = (Math.random()*2-1) * shakeMag;
    const sy = (Math.random()*2-1) * shakeMag * 0.5;
    // keep the FOV at the default everywhere except first-person PvP (which zooms)
    if (!(inArena && pvpMode) && camera.fov !== 70) { camera.fov = 70; camera.updateProjectionMatrix(); }
    if (inArena && pvpMode) {
      // If you're DEAD but a teammate is still fighting (2v2), spectate them with
      // a chase cam instead of freezing on your own corpse.
      const specAlly = (pvpPlayerHP <= 0 && !pvpRoundOver)
        ? arenaBots.find(b => b.state === 'alive' && b.team === PVP_TEAM) : null;
      if (specAlly) {
        if (camera.fov !== 70) { camera.fov = 70; camera.updateProjectionMatrix(); }
        const d = 7, camY = 4.6;
        camera.position.set(specAlly.x - Math.sin(specAlly.heading) * d + sx,
                            (specAlly.y || 0) + camY + sy,
                            specAlly.z - Math.cos(specAlly.heading) * d);
        camera.lookAt(specAlly.x + Math.sin(specAlly.heading) * 3,
                      (specAlly.y || 0) + 2.0,
                      specAlly.z + Math.cos(specAlly.heading) * 3);
      } else {
      // PvP is FIRST-PERSON: the camera sits at your eyes and looks along your
      // aim (heading + pvpLookPitch), so the centre crosshair == where you shoot.
      const scope = pvpAiming && pvpMainWeapon === 'sniper';
      const aimZoom = pvpAiming && pvpMainWeapon !== 'sniper';
      const targetFov = scope ? 24 : aimZoom ? 55 : 75;   // aiming zooms in (sniper most)
      pvpCamDist += (targetFov - pvpCamDist) * 0.25;
      if (Math.abs(camera.fov - pvpCamDist) > 0.05) { camera.fov = pvpCamDist; camera.updateProjectionMatrix(); }
      const hx = Math.sin(arenaPlayer.heading), hz = Math.cos(arenaPlayer.heading);
      const cp = Math.cos(pvpLookPitch), sp = Math.sin(pvpLookPitch);
      const eyeY = arenaPlayer.y + 2.3;   // stand as tall as the enemies (blocky avatars)
      camera.position.set(arenaPlayer.x + sx * 0.25, eyeY + sy * 0.25, arenaPlayer.z);
      camera.lookAt(arenaPlayer.x + hx * cp * 10, eyeY + sp * 10, arenaPlayer.z + hz * cp * 10);
      }
      // first person — never render your own body; animate everyone else
      if (pvpPlayerAvatar) pvpPlayerAvatar.visible = false;
      if (playerCarGroup) playerCarGroup.visible = false;
      for (const b of arenaBots) if (b.mesh && b.state === 'alive') animatePvpAvatarLimbs(b.mesh, Math.abs(b.fwd || 0) + Math.hypot(b.vx || 0, b.vz || 0));
    } else if (inArena) {
      // chase camera, pulled high & back so you can see most of the platform
      const dist = 24, camY = 17;
      const cx = arenaPlayer.x - Math.sin(arenaPlayer.heading) * dist + sx;
      const cy = Math.max(arenaPlayer.y, 0) + camY + sy;
      const cz = arenaPlayer.z - Math.cos(arenaPlayer.heading) * dist;
      camera.position.set(cx, cy, cz);
      camera.lookAt(
        arenaPlayer.x + Math.sin(arenaPlayer.heading) * 4,
        arenaPlayer.y + 0.8,
        arenaPlayer.z + Math.cos(arenaPlayer.heading) * 4
      );
      if (playerCarGroup) {
        playerCarGroup.position.set(arenaPlayer.x, arenaPlayer.y, arenaPlayer.z);
        playerCarGroup.rotation.set(0, arenaPlayer.heading, 0);
        playerCarGroup.visible = true;
      }
    } else if (state === STATE.LEVEL) {
      camera.position.set(levelPlayerX * 0.25 + sx, 3.4 + sy, -10);
      camera.lookAt(levelPlayerX * 0.35, 1.4, 10);
    } else {
      camera.position.set(player.worldX * 0.25 + sx, 3.4 + sy, -10);
      camera.lookAt(player.worldX * 0.35, 1.4, 10);
    }
  }
}
function maxSteerRef() { return 14 * CARS[carIdx].steerMul; }

// ===== HUD canvas drawing =====
// States that show the live 3D world full-bleed (no dark margins — the 3D fills
// the screen behind the HUD). Everything else is a flat menu, so we paint the
// letterbox margins dark instead of letting the 3D bleed through the sides.
const _LIVE3D = new Set([STATE.PLAYING, STATE.DEAD, STATE.MENU, STATE.ARENA, STATE.PVP_LOBBY, STATE.LEVEL, STATE.CHAMPIONSHIP]);
function drawHud2D() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvasHud.width, canvasHud.height);
  if (!_LIVE3D.has(state)) { ctx.fillStyle = '#06081a'; ctx.fillRect(0, 0, canvasHud.width, canvasHud.height); }
  ctx.setTransform(hudScale, 0, 0, hudScale, hudOffX, hudOffY);
  drawParticles();
  if (state === STATE.PLAYING || state === STATE.DEAD) drawHud();
  if (state === STATE.MENU) drawMenu();
  if (state === STATE.PVP_LOBBY) drawPvpLobby();
  if (state === STATE.PVP_SETUP) drawPvpSetup();
  if (state === STATE.BATTLE_PASS) drawBattlePass();
  if (state === STATE.HELP) drawHelp();
  if (state === STATE.DEAD) drawCrash();
  if (state === STATE.ARENA) drawArenaHud();
  if (state === STATE.GARAGE) drawGarage();
  if (state === STATE.ARENA_SELECT) drawArenaSelect();
  if (state === STATE.GEM_SHOP) drawGemShop();
  if (state === STATE.CHAMPIONSHIP) drawChampionship();
  if (state === STATE.MISSIONS) drawMissionsScreen();
  if (state === STATE.MISSIONS_GARAGE) drawMissionsGarage();
  if (state === STATE.LEVEL) drawLevel();
  if (state === STATE.SETTINGS) drawSettings();
  if (state === STATE.INTRO) drawIntro();
  if (state === STATE.DEVICE_SELECT) drawDeviceSelect();
  // Mobile on-screen touch controls — render whenever the player can move on
  // mobile: gameplay (Classic, Arena, Free Map, race) AND the drive-around
  // lobbies (Head On MENU lobby + PVP_LOBBY) — all share keys[].
  if (device === 'mobile' && (state === STATE.ARENA || state === STATE.PLAYING || state === STATE.MENU || state === STATE.PVP_LOBBY)) drawMobileControls();
  // Inline leaderboard removed from the lobby home screen — coins/gems and
  // identity are the only HUD bits there now. Leaderboard still drawable
  // via its function if reintroduced via a future portal.
  if (inlineLBAwardOpen) drawAwardPopover();
  // Old modal kept around as a legacy fallback (no longer activated).
  if (leaderboardModalShown) drawLeaderboardModal();
  // Monthly-reward popup: drawn on top of everything for a few seconds
  // after a new month starts with a 1st-place finish.
  if (monthlyRewardWonLast && performance.now() < monthlyRewardShownUntil) {
    const panW = 360, panH = 130, panX = W / 2 - panW / 2, panY = 60;
    ctx.fillStyle = 'rgba(8, 12, 28, 0.95)';
    ctx.beginPath(); ctx.roundRect(panX, panY, panW, panH, 10); ctx.fill();
    ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(panX, panY, panW, panH, 10); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 22px system-ui';
    ctx.fillText('🏆 1st PLACE LAST MONTH! 🏆', W / 2, panY + 36);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui';
    ctx.fillText('Reward claimed:', W / 2, panY + 66);
    ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 20px system-ui';
    ctx.fillText('● 50,000   ◆ 50', W / 2, panY + 96);
    ctx.fillStyle = '#888'; ctx.font = '11px system-ui';
    ctx.fillText('Closing automatically…', W / 2, panY + 118);
    ctx.textAlign = 'left';
  }
}

// HEAD ON intro — HEAD slides in from the LEFT at the top row, ON slides
// in from the RIGHT at the bottom row. When they're in place, a big
// explosion lights up the gap between them; GAMES fades in from below;
// the brand then ignites — flickering fire flames lick the letters.
let introShock = null;     // primary shockwave ring
let introShock2 = null;    // secondary shockwave ring (delayed)
let introShock3 = null;    // tertiary shockwave ring (slower, magenta)
let introEmbers = [];      // ongoing fire embers floating above HEAD ON
function drawIntro() {
  if (introStart === 0) introStart = performance.now();
  const t = performance.now() - introStart;
  // Phase durations
  const T_SLIDE = 1100;      // HEAD + ON slide in
  const T_BANG = 350;        // explosion at impact
  const T_CAP_IN = 700;      // GAMES rises in
  const T_HOLD = 2200;       // hold the full scene — extended so you can soak it in
  const T_CAP_OUT = 1200;    // GAMES slowly fades
  const T_FADE = 700;        // crossfade INTO the next screen
  const T_CAP_OUT_DONE_TOTAL = T_SLIDE + T_BANG + T_CAP_IN + T_HOLD + T_CAP_OUT;
  const T_END = T_CAP_OUT_DONE_TOTAL + T_FADE;

  // During the final fade phase, render whichever screen comes next behind
  // the intro and then draw the intro on top with decreasing alpha so the
  // two crossfade smoothly.
  let layerAlpha = 1;
  if (t > T_CAP_OUT_DONE_TOTAL) {
    layerAlpha = Math.max(0, 1 - (t - T_CAP_OUT_DONE_TOTAL) / T_FADE);
    drawDeviceSelect();
  }

  ctx.save();
  ctx.globalAlpha = layerAlpha;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // A touch bigger than the previous pass — but tight enough to never overflow.
  const fontSize = Math.round(Math.min(W * 0.26, H * 0.19));
  ctx.font = 'bold italic ' + fontSize + 'px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cx = W / 2;
  // Rows closer together so HEAD and ON read as a single stacked logo.
  const headY = H * 0.42;
  const onY   = H * 0.55;
  ctx.lineJoin = 'round';

  const slideT = Math.min(1, t / T_SLIDE);
  const eased = 1 - Math.pow(1 - slideT, 3);
  // HEAD slides in from the left at headY; ON slides in from the right at onY.
  const headStart = -fontSize * 2;
  const onStart   = W + fontSize * 2;
  const headX = headStart + (cx - headStart) * eased;
  const onX   = onStart   + (cx - onStart)   * eased;

  // Camera shake during the bang
  const bang = t >= T_SLIDE && t < T_SLIDE + T_BANG;
  const shakeAmt = bang ? (1 - (t - T_SLIDE) / T_BANG) * 14 : 0;
  const dx = (Math.random() - 0.5) * 2 * shakeAmt;
  const dy = (Math.random() - 0.5) * 2 * shakeAmt;

  // Full-screen white→magenta flash at impact
  if (bang) {
    const f = 1 - (t - T_SLIDE) / T_BANG;
    ctx.globalAlpha = Math.max(0, f) * 0.95;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, f) * 0.35;
    ctx.fillStyle = '#ff44dd';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // Explosion centered between the two rows
  const explosionY = (headY + onY) / 2;
  if (t >= T_SLIDE && introParticles.length === 0) {
    for (let i = 0; i < 180; i++) {
      const ang = (Math.PI * 2) * (i / 180) + Math.random() * 0.25;
      const sp = 6 + Math.random() * 22;
      introParticles.push({
        x: cx, y: explosionY,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: 1, size: 2 + Math.random() * 5,
        col: ['#ffd54a', '#ff44dd', '#00f0ff', '#ff6622', '#ffffff', '#34ff9e'][Math.floor(Math.random() * 6)],
      });
    }
    introShock  = { r: 8,  life: 1,    speed: 18, col: '#ffffff', w: 5, cy: explosionY };
    introShock2 = { r: 0,  life: 1.15, speed: 12, col: '#00f0ff', w: 3, cy: explosionY, delay: 90  };
    introShock3 = { r: 0,  life: 1.30, speed: 9,  col: '#ff44dd', w: 4, cy: explosionY, delay: 180 };
  }

  // Tick + draw particles and shockwaves
  if (t >= T_SLIDE) {
    for (const p of introParticles) {
      if (p.life <= 0) continue;
      p.x += p.vx; p.y += p.vy; p.vy += 0.18;
      p.life -= 0.011;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const since = t - T_SLIDE;
    for (const s of [introShock, introShock2, introShock3]) {
      if (!s || s.life <= 0) continue;
      if ((s.delay || 0) > since) continue;
      s.r += s.speed;
      s.life -= 0.018;
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.strokeStyle = s.col;
      ctx.lineWidth = s.w;
      ctx.beginPath(); ctx.arc(cx, s.cy, s.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // Fire effect — once the words are locked in, embers drift up off the letters.
  if (t > T_SLIDE + T_BANG) {
    const headW = ctx.measureText('HEAD').width;
    const onW   = ctx.measureText('ON').width;
    // Spawn a few new embers per frame from along each word's baseline.
    for (let k = 0; k < 3; k++) {
      // pick which word
      const isHead = Math.random() < 0.5;
      const baseW = isHead ? headW : onW;
      const baseY = isHead ? headY + fontSize * 0.35 : onY + fontSize * 0.35;
      introEmbers.push({
        x: cx + (Math.random() - 0.5) * baseW * 0.9,
        y: baseY + (Math.random() - 0.5) * 4,
        vx: (Math.random() - 0.5) * 0.6,
        vy: -(1.0 + Math.random() * 1.8),
        life: 1,
        size: 1.5 + Math.random() * 2.5,
      });
    }
    // Tick + render embers (fire palette: white → yellow → orange → red, fade out)
    for (const em of introEmbers) {
      if (em.life <= 0) continue;
      em.x += em.vx;
      em.y += em.vy;
      em.vy -= 0.02;
      em.life -= 0.025;
      const L = Math.max(0, em.life);
      let col;
      if      (L > 0.75) col = '#ffffff';
      else if (L > 0.5)  col = '#ffe070';
      else if (L > 0.25) col = '#ff7722';
      else               col = '#cc1c1c';
      ctx.globalAlpha = L;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(em.x, em.y, em.size, 0, Math.PI * 2); ctx.fill();
    }
    introEmbers = introEmbers.filter(e => e.life > 0);
    ctx.globalAlpha = 1;
  }

  // Chromatic-aberration title at the two stacked rows.
  function drawTitleWord(text, x, y, primaryCol, primaryGlow) {
    ctx.shadowColor = '#ff44dd'; ctx.shadowBlur = 32;
    ctx.fillStyle = 'rgba(255, 68, 221, 0.55)';
    ctx.fillText(text, x - 3, y);
    ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 32;
    ctx.fillStyle = 'rgba(0, 240, 255, 0.55)';
    ctx.fillText(text, x + 3, y);
    ctx.shadowColor = primaryGlow; ctx.shadowBlur = 24;
    ctx.fillStyle = primaryCol;
    ctx.fillText(text, x, y);
    ctx.shadowBlur = 0;
  }
  drawTitleWord('HEAD', headX + dx, headY + dy, '#ffffff', '#ffffff');
  drawTitleWord('ON',   onX   + dx, onY   + dy, '#ffd54a', '#ffaa22');

  // GAMES caption — rises up from below after the explosion, holds, then
  // slowly fades back out before the screen fades to the next state.
  const T_CAP_START = T_SLIDE + T_BANG;
  const T_CAP_IN_DONE  = T_CAP_START + T_CAP_IN;
  const T_HOLD_DONE    = T_CAP_IN_DONE + T_HOLD;
  const T_CAP_OUT_DONE = T_HOLD_DONE + T_CAP_OUT;
  if (t > T_CAP_START) {
    let capAlpha = 0, eIn = 1;
    if (t < T_CAP_IN_DONE) {
      const p = (t - T_CAP_START) / T_CAP_IN;
      eIn = 1 - Math.pow(1 - p, 3);
      capAlpha = p;
    } else if (t < T_HOLD_DONE) {
      capAlpha = 1;
    } else if (t < T_CAP_OUT_DONE) {
      capAlpha = 1 - (t - T_HOLD_DONE) / T_CAP_OUT;
    }
    if (capAlpha > 0) {
      const capSize = Math.round(fontSize * 0.40);
      const capRest = H * 0.72;
      const capFromY = H + capSize;
      const capY = capFromY + (capRest - capFromY) * eIn;
      ctx.globalAlpha = capAlpha;
      ctx.shadowColor = '#9be3ff'; ctx.shadowBlur = 22;
      ctx.fillStyle = '#9be3ff';
      ctx.font = 'bold ' + capSize + 'px system-ui';
      ctx.fillText('GAMES', cx, capY);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }

  // Skip hint
  if (t > T_CAP_START + 200 && t < T_CAP_OUT_DONE) {
    ctx.fillStyle = '#666';
    ctx.font = '11px system-ui';
    ctx.fillText('tap or press a key to skip', cx, H - 22);
  }

  // Subtle scanlines for arcade feel
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#000';
  for (let sy = 0; sy < H; sy += 3) ctx.fillRect(0, sy, W, 1);
  ctx.globalAlpha = 1;

  // (Final transition is handled by the crossfade layerAlpha at the top.)

  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.restore();

  if (t >= T_END) {
    introParticles = []; introEmbers = [];
    introShock = null; introShock2 = null; introShock3 = null;
    endIntro();
  }
}

// One-time device pick on first launch — also reachable later via Settings.
let deviceSelectButtons = [];
function drawDeviceSelect() {
  ctx.save();
  // Neon backdrop: dark with a swirling cyan/magenta radial wash.
  const bg = ctx.createRadialGradient(W * 0.3, H * 0.3, 40, W / 2, H / 2, Math.max(W, H));
  bg.addColorStop(0, '#241540');
  bg.addColorStop(0.55, '#0e0928');
  bg.addColorStop(1, '#04020a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // Faint diagonal neon grid lines for the synthwave feel.
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.10)';
  ctx.lineWidth = 1;
  for (let gy = 60; gy < H; gy += 28) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy + 8); ctx.stroke();
  }

  // Title with neon glow
  ctx.textAlign = 'center';
  ctx.font = 'bold italic 44px system-ui';
  for (let i = 6; i > 0; i--) {
    ctx.fillStyle = 'rgba(255, 68, 221, ' + (0.05 + 0.05 * i) + ')';
    ctx.fillText('HEAD ON', W / 2 + i, H * 0.18 + i);
  }
  ctx.fillStyle = '#ffffff';
  ctx.fillText('HEAD ON', W / 2, H * 0.18);
  ctx.font = 'bold 14px system-ui';
  ctx.fillStyle = '#9be3ff';
  ctx.fillText('PICK YOUR DEVICE', W / 2, H * 0.18 + 30);

  // Two large neon buttons stacked vertically (compact widths for any aspect)
  deviceSelectButtons = [];
  const bw = Math.min(280, W - 80), bh = 92;
  const cx = W / 2;
  const opts = [
    { id: 'computer', label: 'COMPUTER', sub: 'keyboard',     glow: '#00f0ff' },
    { id: 'mobile',   label: 'MOBILE',   sub: 'on-screen controls', glow: '#34ff9e' },
  ];
  for (let i = 0; i < opts.length; i++) {
    const o = opts[i];
    const by = H / 2 - bh + i * (bh + 24);
    const bx = cx - bw / 2;
    const hov = mouse.x >= bx && mouse.x <= bx + bw && mouse.y >= by && mouse.y <= by + bh;
    // outer neon halo
    ctx.shadowColor = o.glow; ctx.shadowBlur = hov ? 24 : 14;
    ctx.fillStyle = hov ? 'rgba(20, 30, 50, 0.95)' : 'rgba(10, 14, 28, 0.92)';
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = o.glow; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.stroke();
    // text
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px system-ui';
    ctx.fillText(o.label, cx, by + 44);
    ctx.fillStyle = '#cfd3e8'; ctx.font = '12px system-ui';
    ctx.fillText(o.sub, cx, by + 70);
    deviceSelectButtons.push({ x: bx, y: by, w: bw, h: bh, id: o.id });
  }

  ctx.fillStyle = '#888'; ctx.font = '11px system-ui';
  ctx.fillText('You can change this later in Settings', cx, H - 30);
  ctx.textAlign = 'left';
  ctx.restore();
}

// Touch / on-screen controls for mobile play.
let mobileBtnLayout = null;
function drawMobileControls() {
  ctx.save();
  const r = Math.min(W, H) * 0.072;                 // shrunk so 4 pads + 2 action buttons fit
  const margin = 14;
  // Apply user-saved offsets (set via the mobile button-position editor
  // in Settings). If nothing has been customised, dx/dy are both 0.
  const _ofL = getMobileOffset('left'),  _ofR = getMobileOffset('right');
  const _ofB = getMobileOffset('brake'), _ofG = getMobileOffset('gas');
  const _ofJ = getMobileOffset('jump'),  _ofF = getMobileOffset('fire');
  const lx = margin + r + _ofL.dx,                  ly = H - margin - r + _ofL.dy;
  const rx = lx + r * 2 + 12 + _ofR.dx,             ry = ly + _ofR.dy;
  const gx = W - margin - r + _ofG.dx,              gy = H - margin - r + _ofG.dy;
  const bx = gx - r * 2 - 12 + _ofB.dx,             by = gy + _ofB.dy;
  // Action buttons — smaller, stacked above brake/gas so the right thumb
  // can reach them without crowding the steering side.
  const ar = r * 0.72;
  const jx = bx + _ofJ.dx, jy = by - r - ar - 6 + _ofJ.dy;
  const fx = gx + _ofF.dx, fy = gy - r - ar - 6 + _ofF.dy;
  const showFire = rocketCharges > 0;
  // store hit-targets for the pointer handler
  mobileBtnLayout = {
    left:  { cx: lx, cy: ly, r: r,  key: 'arrowleft'  },
    right: { cx: rx, cy: ry, r: r,  key: 'arrowright' },
    brake: { cx: bx, cy: by, r: r,  key: 'arrowdown'  },
    gas:   { cx: gx, cy: gy, r: r,  key: 'arrowup'    },
    jump:  { cx: jx, cy: jy, r: ar, key: ' ', tap: true },
  };
  if (showFire) mobileBtnLayout.fire = { cx: fx, cy: fy, r: ar, key: 'f', tap: true };
  function pad(cx, cy, pr, label, glow, pressed) {
    ctx.globalAlpha = pressed ? 0.9 : 0.45;
    ctx.shadowColor = glow; ctx.shadowBlur = pressed ? 24 : 10;
    ctx.fillStyle = 'rgba(8, 10, 20, 0.7)';
    ctx.beginPath(); ctx.arc(cx, cy, pr, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = glow; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy, pr, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.round(pr * 0.7) + 'px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy + 2);
    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  }
  // Small inline missile-icon — a rocket silhouette inside the F pad.
  function drawMissileIcon(cx, cy, pr, pressed) {
    ctx.globalAlpha = pressed ? 0.95 : 0.7;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#ff6622'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    const w = pr * 0.34, h = pr * 0.95;
    ctx.moveTo(cx, cy - h * 0.55);
    ctx.lineTo(cx + w, cy - h * 0.15);
    ctx.lineTo(cx + w, cy + h * 0.35);
    ctx.lineTo(cx + w * 1.6, cy + h * 0.55);
    ctx.lineTo(cx - w * 1.6, cy + h * 0.55);
    ctx.lineTo(cx - w, cy + h * 0.35);
    ctx.lineTo(cx - w, cy - h * 0.15);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // flame tip
    ctx.fillStyle = '#ff7733';
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.7, cy + h * 0.55);
    ctx.lineTo(cx, cy + h * 0.95);
    ctx.lineTo(cx + w * 0.7, cy + h * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  // ── PvP shooting battle: on-FOOT layout instead of the car pads. A movement
  // pad on the LEFT (strafe, mapped to the same arrow keys PvP move reads) with
  // a JUMP button; FIRE/NADE/RELOAD/AIM are drawn on the RIGHT by drawPvpHud so
  // nothing overlaps. Looking around is a drag anywhere on the screen.
  if (state === STATE.ARENA && pvpMode) {
    const pr = Math.min(W, H) * 0.068;
    const oU = getMobileOffset('gas'),  oD = getMobileOffset('brake');
    const oL = getMobileOffset('left'), oR = getMobileOffset('right');
    const oJ = getMobileOffset('jump');
    const cx0 = 84, cy0 = H - 84, sp = pr + 22;
    const up = { cx: cx0 + oU.dx,      cy: cy0 - sp + oU.dy };
    const dn = { cx: cx0 + oD.dx,      cy: cy0 + sp + oD.dy };
    const lf = { cx: cx0 - sp + oL.dx, cy: cy0 + oL.dy };
    const rt = { cx: cx0 + sp + oR.dx, cy: cy0 + oR.dy };
    const jr = pr * 0.8;
    const jp = { cx: cx0 + sp * 2 + 10 + oJ.dx, cy: cy0 - sp + oJ.dy };
    mobileBtnLayout = {
      left:  { cx: lf.cx, cy: lf.cy, r: pr, key: 'arrowleft'  },
      right: { cx: rt.cx, cy: rt.cy, r: pr, key: 'arrowright' },
      gas:   { cx: up.cx, cy: up.cy, r: pr, key: 'arrowup'    },
      brake: { cx: dn.cx, cy: dn.cy, r: pr, key: 'arrowdown'  },
      jump:  { cx: jp.cx, cy: jp.cy, r: jr, key: ' ', tap: true },
    };
    pad(up.cx, up.cy, pr, '⬆', '#34ff9e', !!keys['arrowup']);
    pad(dn.cx, dn.cy, pr, '⬇', '#ff44dd', !!keys['arrowdown']);
    pad(lf.cx, lf.cy, pr, '◀', '#00f0ff', !!keys['arrowleft']);
    pad(rt.cx, rt.cy, pr, '▶', '#00f0ff', !!keys['arrowright']);
    pad(jp.cx, jp.cy, jr, '↥', '#ffd54a', false);
    ctx.font = 'bold ' + Math.round(jr * 0.34) + 'px system-ui';
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd54a';
    ctx.fillText('JUMP', jp.cx, jp.cy + jr + 12);
    ctx.restore();
    return;
  }
  pad(lx, ly, r,  '◀', '#00f0ff', !!keys['arrowleft']);
  pad(rx, ry, r,  '▶', '#00f0ff', !!keys['arrowright']);
  pad(bx, by, r,  '⬇', '#ff44dd', !!keys['arrowdown']);
  pad(gx, gy, r,  '⬆', '#34ff9e', !!keys['arrowup']);
  pad(jx, jy, ar, '↑', '#ffd54a', false);
  ctx.font = 'bold ' + Math.round(ar * 0.32) + 'px system-ui';
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffd54a';
  ctx.fillText('JUMP', jx, jy + ar + 12);
  if (showFire) {
    pad(fx, fy, ar, '', '#ff5520', false);
    drawMissileIcon(fx, fy, ar, false);
    ctx.font = 'bold ' + Math.round(ar * 0.32) + 'px system-ui';
    ctx.textAlign = 'center'; ctx.fillStyle = '#ff5520';
    ctx.fillText('×' + rocketCharges, fx, fy + ar + 12);
  }
  ctx.restore();
}

function drawArenaSelect() {
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd54a';
  ctx.font = 'bold 30px system-ui';
  ctx.fillText('⬢  ARENA', W/2, 50);

  const allUnlocked = arenaProgress >= 10;
  ctx.fillStyle = '#aaa';
  ctx.font = '12px system-ui';
  ctx.fillText(allUnlocked ? '🏆 All levels unlocked!' : 'Beat 1st place to unlock the next level', W/2, 72);

  const cols = 5, bw = 78, bh = 72, gapX = 8, gapY = 10;
  const totalW = cols * bw + (cols - 1) * gapX;
  const startX = (W - totalW) / 2;
  const startY = 92;

  arenaSelectButtons = [];
  for (let i = 0; i < 10; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const bx = startX + col * (bw + gapX);
    const by_ = startY + row * (bh + gapY);
    const level = i + 1;
    const hasBarrier = level <= 5;
    const locked = !allUnlocked && level > arenaProgress + 1;
    const hov = !locked && mouse.x >= bx && mouse.x <= bx + bw && mouse.y >= by_ && mouse.y <= by_ + bh;
    const done = level <= arenaProgress;

    ctx.fillStyle = locked ? 'rgba(20,20,24,0.92)'
      : hov ? (hasBarrier ? 'rgba(0,220,255,0.85)' : 'rgba(255,68,221,0.85)')
      : done ? 'rgba(30,50,30,0.88)' : 'rgba(14,14,28,0.88)';
    roundedRect(bx, by_, bw, bh, 9); ctx.fill();
    ctx.strokeStyle = locked ? '#333' : done ? '#44cc44' : (hasBarrier ? '#00f0ff' : '#ff44dd');
    ctx.lineWidth = hov ? 2.5 : 1.8;
    roundedRect(bx, by_, bw, bh, 9); ctx.stroke();

    if (locked) {
      ctx.fillStyle = '#444';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText('🔒', bx + bw / 2, by_ + 36);
      ctx.font = '9px system-ui';
      ctx.fillText('beat lv ' + (level - 1), bx + bw / 2, by_ + 54);
    } else {
      ctx.fillStyle = hov ? '#111' : (done ? '#88ff88' : '#ffd54a');
      ctx.font = 'bold 26px system-ui';
      ctx.fillText(level, bx + bw / 2, by_ + 32);

      ctx.fillStyle = hov ? '#222' : (done ? '#44cc44' : (hasBarrier ? '#00f0ff' : '#ff44dd'));
      ctx.font = 'bold 9px system-ui';
      ctx.fillText(done ? '✓ DONE' : (hasBarrier ? '🔒 BARRIER' : '🔓 OPEN'), bx + bw / 2, by_ + 46);

      // difficulty pips
      const pips = Math.ceil(level / 2);
      for (let p = 0; p < 5; p++) {
        ctx.fillStyle = p < pips ? (hov ? '#333' : '#ffd54a') : 'rgba(255,255,255,0.12)';
        ctx.beginPath();
        ctx.arc(bx + bw / 2 - 22 + p * 11, by_ + 61, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    arenaSelectButtons.push({ x: bx, y: by_, w: bw, h: bh, level, locked });
  }

  ctx.font = '11px system-ui';
  ctx.fillStyle = '#00f0ff';
  ctx.fillText('Levels 1–5  ·  barrier walls prevent falling off the sides', W / 2, startY + 2 * bh + gapY + 20);
  ctx.fillStyle = '#ff44dd';
  ctx.fillText('Levels 6–10 ·  open edges  ·  aggressive AI', W / 2, startY + 2 * bh + gapY + 36);

  // battle royale button — secret paints are now allowed in The Zone.
  const brW = 200, brH = 36, brX = W/2 - brW/2, brY = H - 132;
  const brHov = mouse.x >= brX && mouse.x <= brX+brW && mouse.y >= brY && mouse.y <= brY+brH;
  ctx.fillStyle = brHov ? '#ff4444' : 'rgba(255,40,40,0.14)';
  roundedRect(brX, brY, brW, brH, 7); ctx.fill();
  ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 2;
  roundedRect(brX, brY, brW, brH, 7); ctx.stroke();
  ctx.fillStyle = brHov ? '#fff' : '#ff6666';
  ctx.font = 'bold 13px system-ui'; ctx.textBaseline = 'middle';
  ctx.fillText('🟡 THE ZONE  —  50 cars', brX + brW/2, brY + brH/2);
  ctx.textBaseline = 'alphabetic';
  arenaSelectButtons.push({ x: brX, y: brY, w: brW, h: brH, level: -2, zoneBlocked: false });

  // championships button
  const chW = 180, chH = 34, chX = W/2 - chW/2, chY = H - 86;
  const chHov = mouse.x >= chX && mouse.x <= chX+chW && mouse.y >= chY && mouse.y <= chY+chH;
  ctx.fillStyle = chHov ? '#ffd700' : 'rgba(255,215,0,0.12)';
  roundedRect(chX, chY, chW, chH, 7); ctx.fill();
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2;
  roundedRect(chX, chY, chW, chH, 7); ctx.stroke();
  ctx.fillStyle = chHov ? '#111' : '#ffd700';
  ctx.font = 'bold 13px system-ui'; ctx.textBaseline = 'middle';
  ctx.fillText('🏆 CHAMPIONSHIPS', chX + chW/2, chY + chH/2);
  ctx.textBaseline = 'alphabetic';
  arenaSelectButtons.push({ x: chX, y: chY, w: chW, h: chH, level: -1 });

  // back button
  const bkW = 120, bkH = 32, bkX = W / 2 - 60, bkY = H - 44;
  const bkHov = mouse.x >= bkX && mouse.x <= bkX + bkW && mouse.y >= bkY && mouse.y <= bkY + bkH;
  ctx.fillStyle = bkHov ? 'rgba(255,68,221,0.85)' : 'rgba(20,20,30,0.8)';
  roundedRect(bkX, bkY, bkW, bkH, 6); ctx.fill();
  ctx.strokeStyle = '#ff44dd'; ctx.lineWidth = 2;
  roundedRect(bkX, bkY, bkW, bkH, 6); ctx.stroke();
  ctx.fillStyle = bkHov ? '#111' : '#fff';
  ctx.font = 'bold 13px system-ui'; ctx.textBaseline = 'middle';
  ctx.fillText('← BACK', bkX + bkW / 2, bkY + bkH / 2);
  ctx.textBaseline = 'alphabetic';
  arenaSelectButtons.push({ x: bkX, y: bkY, w: bkW, h: bkH, level: 0 });

  ctx.textAlign = 'left';
}

function drawChampionship() {
  champScreenButtons = [];
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 26px system-ui';
  ctx.fillText('🏆 CHAMPIONSHIP', W/2, 44);
  ctx.fillStyle = '#aaa';
  ctx.font = '11px system-ui';
  ctx.fillText('Win all 5 rounds in a row to claim the trophy', W/2, 62);

  const tW = 74, tH = 100, gap = 8;
  const totalW = 5 * tW + 4 * gap;
  const startX = (W - totalW) / 2;
  const tY = 80;

  for (let i = 0; i < 5; i++) {
    const tx = startX + i * (tW + gap);
    const lv = CHAMP_LEVELS[i];
    const hasBarrier = lv <= 5;
    ctx.fillStyle = 'rgba(14,14,28,0.92)';
    ctx.beginPath(); ctx.roundRect(tx, tY, tW, tH, 8); ctx.fill();
    ctx.strokeStyle = hasBarrier ? '#00f0ff' : '#ff44dd';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(tx, tY, tW, tH, 8); ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#888'; ctx.font = 'bold 9px system-ui';
    ctx.fillText('ROUND ' + (i + 1), tx + tW/2, tY + 15);

    ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 28px system-ui';
    ctx.fillText(lv, tx + tW/2, tY + 50);

    ctx.fillStyle = hasBarrier ? '#00f0ff' : '#ff44dd';
    ctx.font = '9px system-ui';
    ctx.fillText('LVL ' + lv, tx + tW/2, tY + 64);

    ctx.fillStyle = '#666'; ctx.font = '8px system-ui';
    ctx.fillText(hasBarrier ? 'BARRIER' : 'OPEN', tx + tW/2, tY + 76);

    const pips = Math.ceil(lv / 2);
    for (let p = 0; p < 5; p++) {
      ctx.fillStyle = p < pips ? '#ffd54a' : 'rgba(255,255,255,0.1)';
      ctx.beginPath(); ctx.arc(tx + tW/2 - 16 + p * 8, tY + 90, 2.8, 0, Math.PI * 2); ctx.fill();
    }
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#00f0ff'; ctx.font = '9.5px system-ui';
  ctx.fillText('Rounds 1–2 have barrier walls  ·  Rounds 3–5 are open edges', W/2, tY + tH + 14);

  // START button
  const bW = 190, bH = 38, bX = W/2 - bW/2, bY = tY + tH + 30;
  const bHov = mouse.x >= bX && mouse.x <= bX+bW && mouse.y >= bY && mouse.y <= bY+bH;
  ctx.fillStyle = bHov ? '#ffd700' : 'rgba(255,215,0,0.14)';
  ctx.beginPath(); ctx.roundRect(bX, bY, bW, bH, 8); ctx.fill();
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bX, bY, bW, bH, 8); ctx.stroke();
  ctx.fillStyle = bHov ? '#111' : '#ffd700';
  ctx.font = 'bold 14px system-ui'; ctx.textBaseline = 'middle';
  ctx.fillText('🏆 START CHAMPIONSHIP', W/2, bY + bH/2);
  ctx.textBaseline = 'alphabetic';
  champScreenButtons.push({ x: bX, y: bY, w: bW, h: bH, action: () => { champActive = true; battleRoyale = false; champRound = 0; champTotalEarned = 0; arenaLevel = CHAMP_LEVELS[0]; startArena(); } });

  // round progress bar (shown if mid-run somehow returns to screen)
  ctx.fillStyle = '#555'; ctx.font = '9px system-ui';
  ctx.fillText('5 rounds  ·  each round harder than the last  ·  one shot at glory', W/2, bY + bH + 20);

  // BACK button
  const bkW = 110, bkH = 30, bkX = W/2 - 55, bkY = H - 44;
  const bkHov = mouse.x >= bkX && mouse.x <= bkX+bkW && mouse.y >= bkY && mouse.y <= bkY+bkH;
  ctx.fillStyle = bkHov ? 'rgba(255,68,221,0.85)' : 'rgba(20,20,30,0.8)';
  ctx.beginPath(); ctx.roundRect(bkX, bkY, bkW, bkH, 6); ctx.fill();
  ctx.strokeStyle = '#ff44dd'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(bkX, bkY, bkW, bkH, 6); ctx.stroke();
  ctx.fillStyle = bkHov ? '#111' : '#fff';
  ctx.font = 'bold 12px system-ui'; ctx.textBaseline = 'middle';
  ctx.fillText('← BACK', bkX + bkW/2, bkY + bkH/2);
  ctx.textBaseline = 'alphabetic';
  champScreenButtons.push({ x: bkX, y: bkY, w: bkW, h: bkH, action: () => { state = STATE.ARENA_SELECT; } });

  ctx.textAlign = 'left';
}

// Renders the show-off summary onto an arbitrary 2D canvas context.
// Used by the in-world billboard inside each show-off building.
function drawShowOffContent(c2, W, H) {
  const car = CARS[carIdx];
  const eTier = getUpg(carIdx, 'engine');
  const wTier = getUpg(carIdx, 'wheels');
  const bTier = getUpg(carIdx, 'brakes');
  const paint = SHOP_PAINTS.find(p => p.id === equippedPaint);
  const trail = SHOP_TRAILS.find(t => t.id === equippedTrail);

  c2.fillStyle = '#0a041e';
  c2.fillRect(0, 0, W, H);
  const grad = c2.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#2244ff');
  grad.addColorStop(1, '#aa22bb');
  c2.strokeStyle = grad; c2.lineWidth = 8;
  c2.strokeRect(4, 4, W - 8, H - 8);

  c2.textBaseline = 'alphabetic';
  c2.textAlign = 'center';

  c2.fillStyle = '#ffd54a'; c2.font = 'bold 40px system-ui';
  c2.fillText('★  SHOW OFF  ★', W / 2, 48);

  c2.fillStyle = '#fff'; c2.font = 'bold 44px system-ui';
  c2.fillText(playerName || 'PLAYER', W / 2, 96);

  c2.fillStyle = '#b39ddb'; c2.font = 'bold 16px system-ui';
  c2.fillText('CAR', W / 2, 122);
  c2.fillStyle = '#fff'; c2.font = 'bold 28px system-ui';
  c2.fillText(car.name, W / 2, 150);

  const cells = [
    { label: 'ENGINE', val: eTier > 0 ? TIER_NAMES[eTier] : '—', col: eTier > 0 ? TIER_COLORS[eTier] : '#555' },
    { label: 'WHEELS', val: wTier > 0 ? TIER_NAMES[wTier] : '—', col: wTier > 0 ? TIER_COLORS[wTier] : '#555' },
    { label: 'BRAKES', val: bTier > 0 ? TIER_NAMES[bTier] : '—', col: bTier > 0 ? TIER_COLORS[bTier] : '#555' },
    { label: 'PAINT',  val: (paint && paint.name) || 'STOCK',    col: '#fff' },
    { label: 'TRAIL',  val: (trail && trail.name) || 'DEFAULT',  col: '#fff' },
  ];
  const cellW = (W - 40) / cells.length;
  cells.forEach((r, i) => {
    const x = 20 + i * cellW + cellW / 2;
    c2.fillStyle = '#888'; c2.font = 'bold 16px system-ui';
    c2.fillText(r.label, x, 192);
    c2.fillStyle = r.col; c2.font = 'bold 22px system-ui';
    c2.fillText(r.val, x, 222);
  });

  c2.textAlign = 'left';
}

// Idle billboard art — drawn once when the building is built, before anyone
// has stepped onto the pad to publish their info.
function drawShowOffBillboardIdle(c2, W, H) {
  c2.fillStyle = '#0a041e';
  c2.fillRect(0, 0, W, H);
  const grad = c2.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#2244ff');
  grad.addColorStop(1, '#aa22bb');
  c2.strokeStyle = grad; c2.lineWidth = 8;
  c2.strokeRect(4, 4, W - 8, H - 8);
  c2.textBaseline = 'alphabetic';
  c2.textAlign = 'center';
  c2.fillStyle = '#ffd54a'; c2.font = 'bold 48px system-ui';
  c2.fillText('★  SHOW OFF  ★', W / 2, 110);
  c2.fillStyle = '#b39ddb'; c2.font = 'bold 22px system-ui';
  c2.fillText('STEP ONTO THE PAD', W / 2, 170);
  c2.textAlign = 'left';
}

function drawFreeMapHud() {
  // Race-mode lap counter (top center)
  if (freeMapInRace) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 13px system-ui';
    ctx.fillText('LAP', W / 2, 22);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px system-ui';
    const _shown = Math.min(freeMapRaceLaps + 1, RACE_LAPS_TO_WIN);
    ctx.fillText(_shown + ' / ' + RACE_LAPS_TO_WIN, W / 2, 52);
    ctx.textAlign = 'left';
    ctx.restore();
  }
  // (show-off info renders on an in-world billboard inside each SHOW OFF
  // building — see addShowOffBuilding — so other players can see it.)
  // faint username floating above the player's car
  if (playerName) {
    const _np = project3D(arenaPlayer.x, arenaPlayer.y + 2.4, arenaPlayer.z);
    if (!_np.behind) {
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.font = 'bold 13px system-ui';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.strokeText(playerName, _np.x, _np.y);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(playerName, _np.x, _np.y);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
  // speedometer — top left
  {
    const _spd = Math.round(Math.hypot(arenaPlayer.vx, arenaPlayer.vz) * 3.6);
    ctx.textAlign = 'left'; ctx.font = 'bold 16px system-ui';
    ctx.fillStyle = '#fff';
    ctx.fillText(_spd + ' km/h', 12, 30);
  }
  // HP bar — under the speedometer, with 5 tick lines
  {
    const _hbX = 12, _hbY = 42, _hbW = 92, _hbH = 12;
    const _hpFrac = Math.max(0, freeMapHP / FREE_MAP_MAX_HP);
    // background
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.roundRect(_hbX - 2, _hbY - 2, _hbW + 4, _hbH + 4, 3); ctx.fill();
    // fill (green → yellow → red as HP drops)
    let _hpCol = '#22cc44';
    if (_hpFrac < 0.6) _hpCol = '#ffcc22';
    if (_hpFrac < 0.3) _hpCol = '#ff3322';
    ctx.fillStyle = _hpCol;
    ctx.fillRect(_hbX, _hbY, _hbW * _hpFrac, _hbH);
    // tick lines (5 segments)
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    for (let _t = 1; _t < FREE_MAP_HP_TICKS; _t++) {
      const _tx = _hbX + (_hbW * _t / FREE_MAP_HP_TICKS);
      ctx.beginPath(); ctx.moveTo(_tx, _hbY); ctx.lineTo(_tx, _hbY + _hbH); ctx.stroke();
    }
    // outline
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.strokeRect(_hbX, _hbY, _hbW, _hbH);
    // numeric HP
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'left';
    ctx.fillText(Math.ceil(freeMapHP) + ' HP', _hbX + _hbW + 6, _hbY + _hbH - 2);
  }
  // wanted stars — top right
  if (freeMapStars > 0) {
    const _policeChasing = freeMapNPCs.some(n => n.type === 'police' && n.alive);
    ctx.textAlign = 'right'; ctx.font = 'bold 16px system-ui';
    for (let _s = 0; _s < 5; _s++) {
      ctx.globalAlpha = _s < freeMapStars ? 1 : 0.2;
      ctx.fillStyle = _s < freeMapStars ? '#ffd54a' : '#555';
      ctx.fillText('★', W - 10 - _s * 22, 30);
    }
    if (_policeChasing) {
      const _flash = Math.floor(Date.now() / 350) % 2 === 0;
      ctx.globalAlpha = _flash ? 0.95 : 0.5;
      ctx.fillStyle = '#ff3333'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'right';
      ctx.fillText('WANTED', W - 10, 46);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  // grip bar — 5 segments at top center (hidden during races; grip is locked to 3)
  if (!freeMapInRace) {
    const _gbX = W/2 - 95, _gbY = 10, _gbW = 38, _gbH = 28, _gbGap = 4;
    const _gripColors = ['#ff3322','#ff8800','#ffdd00','#88dd00','#22cc44'];
    const _gripLabels = ['DRIFT','','','','GRIP'];
    ctx.textAlign = 'center';
    // background pill
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.roundRect(_gbX - 6, _gbY - 4, 5*(_gbW+_gbGap)+8, _gbH+8, 8); ctx.fill();
    ctx.globalAlpha = 1;
    for (let g = 1; g <= 5; g++) {
      const _bx = _gbX + (g-1)*(_gbW+_gbGap);
      const _active = g === freeMapGrip;
      const _locked = g > freeMapGripCap();
      const _col = _locked ? '#444' : _gripColors[g-1];
      ctx.globalAlpha = _locked ? 0.18 : (_active ? 1 : 0.28);
      ctx.fillStyle = _col;
      ctx.beginPath(); ctx.roundRect(_bx, _gbY, _gbW, _gbH, 5); ctx.fill();
      ctx.globalAlpha = _locked ? 0.5 : (_active ? 1 : 0.5);
      ctx.fillStyle = _locked ? '#777' : (_active ? '#111' : '#aaa');
      ctx.font = `bold ${_active ? 14 : 12}px system-ui`;
      ctx.fillText(_locked ? '✕' : g, _bx + _gbW/2, _gbY + _gbH - 8);
    }
    // DRIFT / GRIP end labels
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#ccc'; ctx.font = '9px system-ui';
    ctx.textAlign = 'right';  ctx.fillText('DRIFT', _gbX - 10, _gbY + _gbH/2 + 4);
    ctx.textAlign = 'left';   ctx.fillText('GRIP',  _gbX + 5*(_gbW+_gbGap) + 6, _gbY + _gbH/2 + 4);
    // current grip name hint
    const _names = ['Full Drift','Loose','Balanced','Traction','Full Grip'];
    ctx.globalAlpha = 0.6; ctx.fillStyle = _gripColors[freeMapGrip-1];
    ctx.font = '10px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(_names[freeMapGrip-1], W/2, _gbY + _gbH + 16);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  // active powerup badges
  if (freeMapInfiniteRockets || freeMapInfiniteTurbo) {
    const _bx0 = W/2 - (freeMapInfiniteRockets && freeMapInfiniteTurbo ? 62 : 32);
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'left';
    if (freeMapInfiniteRockets) {
      ctx.globalAlpha = 0.9; ctx.fillStyle = '#4488ff';
      ctx.beginPath(); ctx.roundRect(_bx0, H - 52, 60, 20, 6); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText('🚀 ROCKETS', _bx0 + 7, H - 38);
    }
    if (freeMapInfiniteTurbo) {
      const _tx = freeMapInfiniteRockets ? _bx0 + 66 : _bx0;
      ctx.globalAlpha = 0.9; ctx.fillStyle = '#cc6600';
      ctx.beginPath(); ctx.roundRect(_tx, H - 52, 56, 20, 6); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText('⚡ TURBO', _tx + 7, H - 38);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  // building speed-limit indicator
  if (freeMapInBuilding) {
    ctx.globalAlpha = 0.88; ctx.fillStyle = '#99ccff';
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('BUILDING  —  SPEED LIMITED', W/2, H/2 + 62);
    ctx.globalAlpha = 1;
  }
  // subtle ESC hint
  ctx.globalAlpha = 0.3; ctx.fillStyle = '#fff'; ctx.font = '9px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('ESC — exit', W/2, H - 8);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  // Pre-race map select & post-race results overlays
  if (raceMapSelectShown) drawMapSelect();
  if (raceResultsShown && raceResultsData) drawRaceResults();

  // "Coming soon" tooltip when the player steps on a race pad while the
  // feature is paused.
  const _rlNow = performance.now();
  if (_rlNow < raceLockedMsgUntil) {
    const fade = Math.min(1, (raceLockedMsgUntil - _rlNow) / 400);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.beginPath(); ctx.roundRect(W/2 - 130, H/2 - 30, 260, 60, 8); ctx.fill();
    ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(W/2 - 130, H/2 - 30, 260, 60, 8); ctx.stroke();
    ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 16px system-ui';
    ctx.fillText('RACING COMING SOON', W/2, H/2 - 4);
    ctx.fillStyle = '#aaa'; ctx.font = '11px system-ui';
    ctx.fillText('this feature is still under construction', W/2, H/2 + 16);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

// Race map select — arrows to switch between available maps. New themes
// can be added by appending to RACE_MAPS; the panel auto-paginates.
function drawMapSelect() {
  const idx = ((raceMapSelectIdx % RACE_MAPS.length) + RACE_MAPS.length) % RACE_MAPS.length;
  const map = RACE_MAPS[idx];
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
  ctx.fillRect(0, 0, W, H);
  const pw = Math.min(440, W - 40), ph = 410;
  const px = (W - pw) / 2, py = (H - ph) / 2;
  ctx.fillStyle = 'rgba(14, 6, 30, 0.96)';
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12); ctx.fill();
  const grad = ctx.createLinearGradient(px, py, px, py + ph);
  grad.addColorStop(0, '#2244ff'); grad.addColorStop(1, '#aa22bb');
  ctx.strokeStyle = grad; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12); ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 24px system-ui';
  ctx.fillText('SELECT MAP', W / 2, py + 42);

  // Page dots
  if (RACE_MAPS.length > 1) {
    const dotsY = py + 62;
    for (let i = 0; i < RACE_MAPS.length; i++) {
      ctx.fillStyle = i === idx ? '#ffd54a' : '#555';
      ctx.beginPath();
      ctx.arc(W / 2 + (i - (RACE_MAPS.length - 1) / 2) * 14, dotsY, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Thumbnail framed box — colors depend on the map theme.
  const tx = px + 40, ty = py + 78, tw = pw - 80, th = 180;
  const theme = map.theme === 'magma'
    ? { ground: '#5a1a14', track: '#2a1010', frame: '#ff6622', glow: '#ff8844' }
    : { ground: '#6cb04c', track: '#3a3a3a', frame: '#ffd54a', glow: '#9be074' };
  ctx.fillStyle = theme.ground;
  ctx.beginPath(); ctx.roundRect(tx, ty, tw, th, 6); ctx.fill();
  // For magma: add a few orange "glow" splotches as scenery.
  if (map.theme === 'magma') {
    for (const sp of [[0.18, 0.30], [0.74, 0.22], [0.32, 0.78], [0.85, 0.66]]) {
      ctx.fillStyle = 'rgba(255, 140, 40, 0.45)';
      ctx.beginPath();
      ctx.arc(tx + sp[0] * tw, ty + sp[1] * th, 14, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // Track outline — only Green Grove has the real serpentine; Volcano shows
  // a faint placeholder oval since the layout isn't done yet.
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (map.id === 'green_grove') {
    ctx.strokeStyle = theme.track; ctx.lineWidth = 10;
    ctx.beginPath();
    const pad = 18;
    const x0 = tx + pad, x1 = tx + tw - pad;
    const y0 = ty + pad, y1 = ty + th - pad;
    const my = (y0 + y1) / 2;
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y0);
    ctx.lineTo(x1, my - 12);
    ctx.lineTo(x0 + 18, my - 12);
    ctx.lineTo(x0 + 18, my + 12);
    ctx.lineTo(x1, my + 12);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x0, y1);
    ctx.closePath();
    ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)'; ctx.lineWidth = 6;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.ellipse(tx + tw / 2, ty + th / 2, tw / 2 - 26, th / 2 - 26, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui';
    ctx.fillText('COMING SOON', tx + tw / 2, ty + th / 2 + 8);
  }
  ctx.strokeStyle = theme.frame; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(tx, ty, tw, th, 6); ctx.stroke();

  // Map name & blurb
  ctx.fillStyle = '#fff'; ctx.font = 'bold 26px system-ui';
  ctx.fillText(map.name, W / 2, py + 295);
  ctx.fillStyle = '#aaa'; ctx.font = '12px system-ui';
  ctx.fillText(map.blurb, W / 2, py + 318);

  // Footer prompts
  if (map.ready) {
    ctx.fillStyle = '#cce0ff'; ctx.font = 'bold 13px system-ui';
    ctx.fillText('SPACE or ENTER — start race', W / 2, py + ph - 44);
  } else {
    ctx.fillStyle = '#ff9988'; ctx.font = 'bold 13px system-ui';
    ctx.fillText('This map is not playable yet', W / 2, py + ph - 44);
  }
  if (RACE_MAPS.length > 1) {
    ctx.fillStyle = '#888'; ctx.font = '11px system-ui';
    ctx.fillText('← / → switch map     ·     ESC cancel', W / 2, py + ph - 18);
  } else {
    ctx.fillStyle = '#888'; ctx.font = '11px system-ui';
    ctx.fillText('ESC — cancel', W / 2, py + ph - 18);
  }
  ctx.textAlign = 'left';
  ctx.restore();
}

// Post-race "you win" screen — shows result + rank progress.
function drawRaceResults() {
  const r = raceResultsData;
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
  ctx.fillRect(0, 0, W, H);
  const pw = Math.min(440, W - 40), ph = 360;
  const px = (W - pw) / 2, py = (H - ph) / 2;
  ctx.fillStyle = 'rgba(14, 6, 30, 0.96)';
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12); ctx.fill();
  const grad = ctx.createLinearGradient(px, py, px, py + ph);
  grad.addColorStop(0, '#2244ff'); grad.addColorStop(1, '#aa22bb');
  ctx.strokeStyle = grad; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12); ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 32px system-ui';
  ctx.fillText('YOU WIN!', W / 2, py + 50);

  // Standings
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui';
  ctx.fillText('FINAL STANDINGS', W / 2, py + 90);
  ctx.fillStyle = '#7fffa7'; ctx.font = 'bold 18px system-ui';
  ctx.fillText('1.  ' + (playerName || 'PLAYER'), W / 2, py + 118);
  ctx.fillStyle = '#ff8888'; ctx.font = 'bold 18px system-ui';
  ctx.fillText('2.  RIVAL', W / 2, py + 144);

  // Rank
  const rank = r.newRank;
  const col = RANK_COLORS[rank.idx] || '#fff';
  ctx.fillStyle = '#888'; ctx.font = 'bold 11px system-ui';
  ctx.fillText('RANK', W / 2, py + 184);
  ctx.fillStyle = col; ctx.font = 'bold 30px system-ui';
  ctx.fillText(rank.tier, W / 2, py + 220);

  // Progress bar (or "MAX")
  if (rank.need > 0) {
    const bx = px + 40, by = py + 240, bw = pw - 80, bh = 18;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6); ctx.fill();
    const fillW = bw * (rank.have / rank.need);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(bx, by, fillW, bh, 6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui';
    ctx.fillText(rank.have + ' / ' + rank.need + '  WINS', W / 2, by + 13);
  } else {
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui';
    ctx.fillText('★  MAXED OUT  ★', W / 2, py + 258);
  }

  if (r.promoted) {
    ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 16px system-ui';
    ctx.fillText('PROMOTED TO ' + rank.tier + '!', W / 2, py + 290);
  } else if (r.oldRank.idx === rank.idx) {
    ctx.fillStyle = '#bbb'; ctx.font = '12px system-ui';
    ctx.fillText('Total wins: ' + r.newWins, W / 2, py + 290);
  }

  ctx.fillStyle = '#cce0ff'; ctx.font = 'bold 12px system-ui';
  ctx.fillText('SPACE or ENTER to continue', W / 2, py + ph - 22);
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawArenaHud() {
  if (freeMap) { drawFreeMapHud(); return; }
  if (pvpMode) { drawPvpHud(); return; }
  // Minecraft rescue plate counter — only shown while the paint is equipped.
  if (equippedPaint === 'paint_minecraft' && !arenaElimOrder.includes('player')) {
    const pBoxW = 88, pBoxH = 28, pX = 10, pY = H - pBoxH - 10;
    ctx.fillStyle = 'rgba(10, 30, 10, 0.85)';
    ctx.beginPath(); ctx.roundRect(pX, pY, pBoxW, pBoxH, 5); ctx.fill();
    ctx.strokeStyle = '#5d8a1b'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(pX, pY, pBoxW, pBoxH, 5); ctx.stroke();
    // tiny grass-plate icon
    ctx.fillStyle = '#5d8a1b'; ctx.fillRect(pX + 8,  pY + 10, 12, 4);
    ctx.fillStyle = '#6b4226'; ctx.fillRect(pX + 8,  pY + 14, 12, 5);
    ctx.fillStyle = mcPlatesLeft > 0 ? '#cfe8a0' : '#666';
    ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('PLATES  ' + mcPlatesLeft, pX + 28, pY + pBoxH / 2);
    ctx.textBaseline = 'alphabetic';
  }
  // ice patches — drawn beneath skid marks
  const _iceT = menuBlink / 1000;
  for (const ip of icePatches) {
    if (ip.life <= 0) continue;
    const p = project3D(ip.wx, ip.wy, ip.wz);
    if (p.behind) continue;
    const fade = ip.life / ip.maxLife;
    const pulse = 0.45 + Math.sin(_iceT * 4 + ip.wx + ip.wz) * 0.15;
    const alpha = fade * pulse;
    const rx = 18 + Math.sin(_iceT * 3 + ip.wz) * 2;
    const ry = 9  + Math.cos(_iceT * 3 + ip.wx) * 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#aaddff';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#cceeff';
    ctx.lineWidth = 1;
    ctx.globalAlpha = alpha * 0.7;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // skid marks — drawn first (behind HUD)
  for (const s of skidMarks) {
    if (s.life <= 0) continue;
    const p = project3D(s.wx, s.wy, s.wz);
    if (p.behind) continue;
    const alpha = (s.life / s.maxLife) * 0.5 * s.intensity;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = getTrailColor(_trailT + s.life * 0.001);
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 12, 6, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const aliveBots = arenaBots.filter(b => b.state === 'alive').length;
  const livePlacement = aliveBots + 1;
  const _placeLabels = ['','1ST','2ND','3RD','4TH','5TH','6TH','7TH','8TH','9TH','10TH','11TH','12TH','13TH','14TH','15TH','16TH','17TH','18TH','19TH','20TH','21ST'];
  const _placeCols   = ['','#ffd700','#c0c0c0','#cd7f32','#ff9933','#ff6666','#ff4444','#ff2222','#ff0000','#cc0000','#aa0000','#880000','#660000','#550000','#440000','#330000','#ff6666','#ff6666','#ff6666','#ff6666','#ff6666','#ff6666'];
  const label = _placeLabels[livePlacement] || (livePlacement + 'TH');
  const col   = _placeCols[livePlacement]   || '#ff4444';

  // pill background
  ctx.save();
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = '#111';
  const pw = 148, ph = 32, px = W / 2 - pw / 2, py = 10;
  ctx.beginPath();
  ctx.roundRect(px, py, pw, ph, 8);
  ctx.fill();
  ctx.globalAlpha = 1;

  // placement text
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px system-ui';
  ctx.fillStyle = col;
  ctx.fillText(label + ' PLACE', W / 2, py + 22);

  // time
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#aaa';
  const _modeLabel = battleRoyale ? '🟡 THE ZONE' : ('ARENA  LV ' + arenaLevel);
  ctx.fillText(Math.floor(gameTime) + 's  ·  ' + aliveBots + ' left  ·  ' + _modeLabel, W / 2, py + ph + 14);


  // nitro indicator
  if (nitroTime > 0) {
    const frac = nitroTime / 5000;
    const nx = W / 2 - 60, ny = H - 48, nw = 120, nh = 18;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.roundRect(nx, ny, nw, nh, 5); ctx.fill();
    ctx.fillStyle = frac > 0.5 ? '#ffcc00' : '#ff6600';
    ctx.beginPath(); ctx.roundRect(nx, ny, nw * frac, nh, 5); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = 'bold 11px system-ui';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('⚡ NITRO', W / 2, ny - 4);
  } else if (!nitroPickup && !arenaElimOrder.includes('player') && nitroSpawnTimer > 0) {
    const remaining = Math.ceil(nitroSpawnTimer / 1000);
    ctx.globalAlpha = 0.55;
    ctx.font = '10px system-ui';
    ctx.fillStyle = '#ffcc00';
    ctx.textAlign = 'center';
    ctx.fillText('⚡ next nitro in ' + remaining + 's', W / 2, H - 34);
    ctx.globalAlpha = 1;
  }

  // rocket charge indicator
  if (rocketCharges > 0) {
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#1a0000';
    ctx.beginPath(); ctx.roundRect(W - 78, H - 48, 68, 22, 5); ctx.fill();
    ctx.fillStyle = '#ff4400';
    ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('🚀 ×' + rocketCharges, W - 44, H - 32);
    ctx.globalAlpha = 1;
  } else if (!rocketPickup && !arenaElimOrder.includes('player') && rocketSpawnTimer > 0) {
    const rs = Math.ceil(rocketSpawnTimer / 1000);
    ctx.globalAlpha = 0.5; ctx.font = '10px system-ui'; ctx.fillStyle = '#ff6633'; ctx.textAlign = 'center';
    ctx.fillText('🚀 next in ' + rs + 's', W - 44, H - 34);
    ctx.globalAlpha = 1;
  }

  // rocket targeting scope
  if (rocketCharges > 0 && !arenaElimOrder.includes('player')) {
    if (rocketLockTarget && (rocketLockTarget.state === 'alive' || rocketLockTarget.alive === true)) {
      const _ty = (rocketLockTarget.y != null ? rocketLockTarget.y : 0.2) + 0.8;
      const _tp = project3D(rocketLockTarget.x, _ty, rocketLockTarget.z);
      if (!_tp.behind) {
        const _locked = rocketLocked;
        const _prog = Math.min(1, rocketLockTimer / 1800);
        const _bsz = _locked ? 24 : 28 - _prog * 8; // brackets close in as lock builds
        const _col = _locked ? '#ff2200' : `rgba(255,${Math.floor(180 - _prog*180)},0,${0.6 + _prog*0.4})`;
        ctx.save();
        ctx.strokeStyle = _col;
        ctx.lineWidth = _locked ? 2.5 : 1.8;
        ctx.globalAlpha = _locked ? (0.8 + Math.sin(gameTime * 18) * 0.2) : 0.85;
        const _bx = _tp.x, _by = _tp.y, _bl = _bsz * 0.45;
        // corner brackets
        [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy]) => {
          ctx.beginPath();
          ctx.moveTo(_bx + sx*_bsz,       _by + sy*_bsz - sy*_bl);
          ctx.lineTo(_bx + sx*_bsz,       _by + sy*_bsz);
          ctx.lineTo(_bx + sx*_bsz - sx*_bl, _by + sy*_bsz);
          ctx.stroke();
        });
        // lock-on progress arc
        if (!_locked) {
          ctx.globalAlpha = 0.5;
          ctx.beginPath();
          ctx.arc(_bx, _by, _bsz + 6, -Math.PI/2, -Math.PI/2 + _prog * Math.PI * 2);
          ctx.stroke();
        }
        // LOCKED label
        if (_locked) {
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = '#ff2200';
          ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center';
          ctx.fillText('LOCKED', _bx, _by - _bsz - 6);
        }
        ctx.restore();
      }
    } else {
      // idle scope crosshair — shifted up to look at distant targets
      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = '#ff6633';
      ctx.lineWidth = 1.2;
      const _cx = W/2, _cy = H/2 - 95, _cr = 18, _cg = 6;
      ctx.beginPath(); ctx.moveTo(_cx - _cr, _cy); ctx.lineTo(_cx - _cg, _cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(_cx + _cg, _cy); ctx.lineTo(_cx + _cr, _cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(_cx, _cy - _cr); ctx.lineTo(_cx, _cy - _cg); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(_cx, _cy + _cg); ctx.lineTo(_cx, _cy + _cr); ctx.stroke();
      ctx.beginPath(); ctx.arc(_cx, _cy, _cg + 2, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }

  // directional arrow pointing to rocket pickup
  if (rocketPickup && !arenaElimOrder.includes('player')) {
    const _dRx = rocketPickup.x - arenaPlayer.x;
    const _dRz = rocketPickup.z - arenaPlayer.z;
    const _rDist = Math.hypot(_dRx, _dRz);
    if (_rDist > 4) {
      const _worldA = Math.atan2(_dRx, _dRz);
      const _screenA = _worldA - arenaPlayer.heading;
      const _hx = W / 2 + Math.sin(_screenA) * 165;
      const _hy = H / 2 - Math.cos(_screenA) * 165;
      const _ax = Math.max(28, Math.min(W - 28, _hx));
      const _ay = Math.max(28, Math.min(H - 28, _hy));
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.translate(_ax, _ay);
      ctx.rotate(_screenA);
      ctx.fillStyle = '#ff4422';
      ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(-9, 4); ctx.lineTo(9, 4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 1; ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🚀', _ax, _ay + 20);
      ctx.restore();
    }
  }

  // bomb counter (championship final)
  if (arenaBombs.length > 0) {
    const live = arenaBombs.filter(b => !b.triggered).length;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#1a0000';
    ctx.beginPath(); ctx.roundRect(10, 46, 68, 22, 6); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = live > 0 ? '#ff4400' : '#44cc44';
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('💣 ' + live + ' left', 44, 61);
  }

  // level badge top-left
  const lvColor = arenaLevel <= 5 ? '#00f0ff' : '#ff44dd';
  ctx.globalAlpha = 0.78;
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.roundRect(10, 10, 68, 30, 7); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = lvColor;
  ctx.font = 'bold 14px system-ui';
  ctx.fillText('LV ' + arenaLevel + (arenaLevel <= 5 ? ' 🔒' : ' 🔓'), 44, 29);

  // money forever charge indicator
  if (equippedPaint === 'paint_moneyforever') {
    const chargeY = nitroTime > 0 ? H - 72 : H - 48;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.roundRect(W/2 - 52, chargeY, 104, 20, 5); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#66bb6a';
    const cd = mfCooldown > 0 ? '  (' + Math.ceil(mfCooldown/1000) + 's)' : '';
    ctx.fillText('💵 ' + mfCharges + '/3 charges' + cd, W/2, chargeY + 14);
  }

  // championship round indicator
  if (champActive) {
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.roundRect(W - 88, 10, 78, 30, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'right';
    ctx.fillText('🏆 ' + (champRound + 1) + ' / 5', W - 14, 29);
  }

  ctx.textAlign = 'left';
  ctx.restore();
}
function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, Math.min(1, p.life / p.max));
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.kind === 'bill') {
      const bw = p.size * 1.7, bh = p.size * 0.85;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      ctx.fillStyle = '#2e7d32'; ctx.fillRect(-bw/2, -bh/2, bw, bh);
      ctx.fillStyle = '#c8e6c9'; ctx.fillRect(-bw/2+2, -bh/2+2, bw-4, bh-4);
      ctx.fillStyle = '#1b5e20'; ctx.font = 'bold ' + Math.floor(bh*0.55) + 'px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$100', 0, 0);
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      ctx.restore();
    } else if (p.kind === 'controller') {
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.font = Math.floor(p.size) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🎮', 0, 0);
      ctx.textBaseline = 'alphabetic'; ctx.restore();
    } else if (p.kind === 'debris') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
    } else if (p.kind === 'groundmark') {
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.size, p.size * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}

function drawHud() {
