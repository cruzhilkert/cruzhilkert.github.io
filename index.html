function drawFreeMapHud() {
  // Race-mode lap counter (top center)
  if (freeMapInRace) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 13px system-ui';
    ctx.fillText('LAP', W / 2, 22);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px system-ui';
    const _shown = Math.min(freeMapRaceLaps + 1, RACE_LAPS_TO_WIN);
    ctx.fillText(_shown + ' / ' + RACE_LAPS_TO_WIN, W / 2, 52);
    ctx.textAlign = 'left';
    ctx.restore();
  }
  // (show-off info renders on an in-world billboard inside each SHOW OFF
  // building — see addShowOffBuilding — so other players can see it.)
  // faint username floating above the player's car
  if (playerName) {
    const _np = project3D(arenaPlayer.x, arenaPlayer.y + 2.4, arenaPlayer.z);
    if (!_np.behind) {
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.font = 'bold 13px system-ui';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.strokeText(playerName, _np.x, _np.y);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(playerName, _np.x, _np.y);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
  // speedometer — top left
  {
    const _spd = Math.round(Math.hypot(arenaPlayer.vx, arenaPlayer.vz) * 3.6);
    ctx.textAlign = 'left'; ctx.font = 'bold 16px system-ui';
    ctx.fillStyle = '#fff';
    ctx.fillText(_spd + ' km/h', 12, 30);
  }
  // HP bar — under the speedometer, with 5 tick lines
  {
    const _hbX = 12, _hbY = 42, _hbW = 92, _hbH = 12;
    const _hpFrac = Math.max(0, freeMapHP / FREE_MAP_MAX_HP);
    // background
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.roundRect(_hbX - 2, _hbY - 2, _hbW + 4, _hbH + 4, 3); ctx.fill();
    // fill (green → yellow → red as HP drops)
    let _hpCol = '#22cc44';
    if (_hpFrac < 0.6) _hpCol = '#ffcc22';
    if (_hpFrac < 0.3) _hpCol = '#ff3322';
    ctx.fillStyle = _hpCol;
    ctx.fillRect(_hbX, _hbY, _hbW * _hpFrac, _hbH);
    // tick lines (5 segments)
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    for (let _t = 1; _t < FREE_MAP_HP_TICKS; _t++) {
      const _tx = _hbX + (_hbW * _t / FREE_MAP_HP_TICKS);
      ctx.beginPath(); ctx.moveTo(_tx, _hbY); ctx.lineTo(_tx, _hbY + _hbH); ctx.stroke();
    }
    // outline
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.strokeRect(_hbX, _hbY, _hbW, _hbH);
    // numeric HP
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'left';
    ctx.fillText(Math.ceil(freeMapHP) + ' HP', _hbX + _hbW + 6, _hbY + _hbH - 2);
  }
  // wanted stars — top right
  if (freeMapStars > 0) {
    const _policeChasing = freeMapNPCs.some(n => n.type === 'police' && n.alive);
    ctx.textAlign = 'right'; ctx.font = 'bold 16px system-ui';
    for (let _s = 0; _s < 5; _s++) {
      ctx.globalAlpha = _s < freeMapStars ? 1 : 0.2;
      ctx.fillStyle = _s < freeMapStars ? '#ffd54a' : '#555';
      ctx.fillText('★', W - 10 - _s * 22, 30);
    }
    if (_policeChasing) {
      const _flash = Math.floor(Date.now() / 350) % 2 === 0;
      ctx.globalAlpha = _flash ? 0.95 : 0.5;
      ctx.fillStyle = '#ff3333'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'right';
      ctx.fillText('WANTED', W - 10, 46);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  // grip bar — 5 segments at top center
  const _gbX = W/2 - 95, _gbY = 10, _gbW = 38, _gbH = 28, _gbGap = 4;
  const _gripColors = ['#ff3322','#ff8800','#ffdd00','#88dd00','#22cc44'];
  const _gripLabels = ['DRIFT','','','','GRIP'];
  ctx.textAlign = 'center';
  // background pill
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.roundRect(_gbX - 6, _gbY - 4, 5*(_gbW+_gbGap)+8, _gbH+8, 8); ctx.fill();
  ctx.globalAlpha = 1;
  for (let g = 1; g <= 5; g++) {
    const _bx = _gbX + (g-1)*(_gbW+_gbGap);
    const _active = g === freeMapGrip;
    const _locked = g > freeMapGripCap();
    const _col = _locked ? '#444' : _gripColors[g-1];
    ctx.globalAlpha = _locked ? 0.18 : (_active ? 1 : 0.28);
    ctx.fillStyle = _col;
    ctx.beginPath(); ctx.roundRect(_bx, _gbY, _gbW, _gbH, 5); ctx.fill();
    ctx.globalAlpha = _locked ? 0.5 : (_active ? 1 : 0.5);
    ctx.fillStyle = _locked ? '#777' : (_active ? '#111' : '#aaa');
    ctx.font = `bold ${_active ? 14 : 12}px system-ui`;
    ctx.fillText(_locked ? '✕' : g, _bx + _gbW/2, _gbY + _gbH - 8);
  }
  // DRIFT / GRIP end labels
  ctx.globalAlpha = 0.55; ctx.fillStyle = '#ccc'; ctx.font = '9px system-ui';
  ctx.textAlign = 'right';  ctx.fillText('DRIFT', _gbX - 10, _gbY + _gbH/2 + 4);
  ctx.textAlign = 'left';   ctx.fillText('GRIP',  _gbX + 5*(_gbW+_gbGap) + 6, _gbY + _gbH/2 + 4);
  // current grip name hint
  const _names = ['Full Drift','Loose','Balanced','Traction','Full Grip'];
  ctx.globalAlpha = 0.6; ctx.fillStyle = _gripColors[freeMapGrip-1];
  ctx.font = '10px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(_names[freeMapGrip-1], W/2, _gbY + _gbH + 16);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  // active powerup badges
  if (freeMapInfiniteRockets || freeMapInfiniteTurbo) {
    const _bx0 = W/2 - (freeMapInfiniteRockets && freeMapInfiniteTurbo ? 62 : 32);
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'left';
    if (freeMapInfiniteRockets) {
      ctx.globalAlpha = 0.9; ctx.fillStyle = '#4488ff';
      ctx.beginPath(); ctx.roundRect(_bx0, H - 52, 60, 20, 6); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText('🚀 ROCKETS', _bx0 + 7, H - 38);
    }
    if (freeMapInfiniteTurbo) {
      const _tx = freeMapInfiniteRockets ? _bx0 + 66 : _bx0;
      ctx.globalAlpha = 0.9; ctx.fillStyle = '#cc6600';
      ctx.beginPath(); ctx.roundRect(_tx, H - 52, 56, 20, 6); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText('⚡ TURBO', _tx + 7, H - 38);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  // building speed-limit indicator
  if (freeMapInBuilding) {
    ctx.globalAlpha = 0.88; ctx.fillStyle = '#99ccff';
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('BUILDING  —  SPEED LIMITED', W/2, H/2 + 62);
    ctx.globalAlpha = 1;
  }
  // subtle ESC hint
  ctx.globalAlpha = 0.3; ctx.fillStyle = '#fff'; ctx.font = '9px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('ESC — exit', W/2, H - 8);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  // Pre-race map select & post-race results overlays
  if (raceMapSelectShown) drawMapSelect();
  if (raceResultsShown && raceResultsData) drawRaceResults();
}

// Race map select — arrows to switch between available maps. New themes
// can be added by appending to RACE_MAPS; the panel auto-paginates.
function drawMapSelect() {
  const idx = ((raceMapSelectIdx % RACE_MAPS.length) + RACE_MAPS.length) % RACE_MAPS.length;
  const map = RACE_MAPS[idx];
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
  ctx.fillRect(0, 0, W, H);
  const pw = Math.min(440, W - 40), ph = 410;
  const px = (W - pw) / 2, py = (H - ph) / 2;
  ctx.fillStyle = 'rgba(14, 6, 30, 0.96)';
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12); ctx.fill();
  const grad = ctx.createLinearGradient(px, py, px, py + ph);
  grad.addColorStop(0, '#2244ff'); grad.addColorStop(1, '#aa22bb');
  ctx.strokeStyle = grad; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12); ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 24px system-ui';
  ctx.fillText('SELECT MAP', W / 2, py + 42);

  // Page dots
  if (RACE_MAPS.length > 1) {
    const dotsY = py + 62;
    for (let i = 0; i < RACE_MAPS.length; i++) {
      ctx.fillStyle = i === idx ? '#ffd54a' : '#555';
      ctx.beginPath();
      ctx.arc(W / 2 + (i - (RACE_MAPS.length - 1) / 2) * 14, dotsY, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Thumbnail framed box — colors depend on the map theme.
  const tx = px + 40, ty = py + 78, tw = pw - 80, th = 180;
  const theme = map.theme === 'magma'
    ? { ground: '#5a1a14', track: '#2a1010', frame: '#ff6622', glow: '#ff8844' }
    : { ground: '#6cb04c', track: '#3a3a3a', frame: '#ffd54a', glow: '#9be074' };
  ctx.fillStyle = theme.ground;
  ctx.beginPath(); ctx.roundRect(tx, ty, tw, th, 6); ctx.fill();
  // For magma: add a few orange "glow" splotches as scenery.
  if (map.theme === 'magma') {
    for (const sp of [[0.18, 0.30], [0.74, 0.22], [0.32, 0.78], [0.85, 0.66]]) {
      ctx.fillStyle = 'rgba(255, 140, 40, 0.45)';
      ctx.beginPath();
      ctx.arc(tx + sp[0] * tw, ty + sp[1] * th, 14, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // Track outline — only Green Grove has the real serpentine; Volcano shows
  // a faint placeholder oval since the layout isn't done yet.
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (map.id === 'green_grove') {
    ctx.strokeStyle = theme.track; ctx.lineWidth = 10;
    ctx.beginPath();
    const pad = 18;
    const x0 = tx + pad, x1 = tx + tw - pad;
    const y0 = ty + pad, y1 = ty + th - pad;
    const my = (y0 + y1) / 2;
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y0);
    ctx.lineTo(x1, my - 12);
    ctx.lineTo(x0 + 18, my - 12);
    ctx.lineTo(x0 + 18, my + 12);
    ctx.lineTo(x1, my + 12);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x0, y1);
    ctx.closePath();
    ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)'; ctx.lineWidth = 6;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.ellipse(tx + tw / 2, ty + th / 2, tw / 2 - 26, th / 2 - 26, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui';
    ctx.fillText('COMING SOON', tx + tw / 2, ty + th / 2 + 8);
  }
  ctx.strokeStyle = theme.frame; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(tx, ty, tw, th, 6); ctx.stroke();

  // Map name & blurb
  ctx.fillStyle = '#fff'; ctx.font = 'bold 26px system-ui';
  ctx.fillText(map.name, W / 2, py + 295);
  ctx.fillStyle = '#aaa'; ctx.font = '12px system-ui';
  ctx.fillText(map.blurb, W / 2, py + 318);

  // Footer prompts
  if (map.ready) {
    ctx.fillStyle = '#cce0ff'; ctx.font = 'bold 13px system-ui';
    ctx.fillText('SPACE or ENTER — start race', W / 2, py + ph - 44);
  } else {
    ctx.fillStyle = '#ff9988'; ctx.font = 'bold 13px system-ui';
    ctx.fillText('This map is not playable yet', W / 2, py + ph - 44);
  }
  if (RACE_MAPS.length > 1) {
    ctx.fillStyle = '#888'; ctx.font = '11px system-ui';
    ctx.fillText('← / → switch map     ·     ESC cancel', W / 2, py + ph - 18);
  } else {
    ctx.fillStyle = '#888'; ctx.font = '11px system-ui';
    ctx.fillText('ESC — cancel', W / 2, py + ph - 18);
  }
  ctx.textAlign = 'left';
  ctx.restore();
}

// Post-race "you win" screen — shows result + rank progress.
function drawRaceResults() {
  const r = raceResultsData;
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
  ctx.fillRect(0, 0, W, H);
  const pw = Math.min(440, W - 40), ph = 360;
  const px = (W - pw) / 2, py = (H - ph) / 2;
  ctx.fillStyle = 'rgba(14, 6, 30, 0.96)';
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12); ctx.fill();
  const grad = ctx.createLinearGradient(px, py, px, py + ph);
  grad.addColorStop(0, '#2244ff'); grad.addColorStop(1, '#aa22bb');
  ctx.strokeStyle = grad; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12); ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 32px system-ui';
  ctx.fillText('YOU WIN!', W / 2, py + 50);

  // Standings
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui';
  ctx.fillText('FINAL STANDINGS', W / 2, py + 90);
  ctx.fillStyle = '#7fffa7'; ctx.font = 'bold 18px system-ui';
  ctx.fillText('1.  ' + (playerName || 'PLAYER'), W / 2, py + 118);
  ctx.fillStyle = '#ff8888'; ctx.font = 'bold 18px system-ui';
  ctx.fillText('2.  RIVAL', W / 2, py + 144);

  // Rank
  const rank = r.newRank;
  const col = RANK_COLORS[rank.idx] || '#fff';
  ctx.fillStyle = '#888'; ctx.font = 'bold 11px system-ui';
  ctx.fillText('RANK', W / 2, py + 184);
  ctx.fillStyle = col; ctx.font = 'bold 30px system-ui';
  ctx.fillText(rank.tier, W / 2, py + 220);

  // Progress bar (or "MAX")
  if (rank.need > 0) {
    const bx = px + 40, by = py + 240, bw = pw - 80, bh = 18;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6); ctx.fill();
    const fillW = bw * (rank.have / rank.need);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(bx, by, fillW, bh, 6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui';
    ctx.fillText(rank.have + ' / ' + rank.need + '  WINS', W / 2, by + 13);
  } else {
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui';
    ctx.fillText('★  MAXED OUT  ★', W / 2, py + 258);
  }

  if (r.promoted) {
    ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 16px system-ui';
    ctx.fillText('PROMOTED TO ' + rank.tier + '!', W / 2, py + 290);
  } else if (r.oldRank.idx === rank.idx) {
    ctx.fillStyle = '#bbb'; ctx.font = '12px system-ui';
    ctx.fillText('Total wins: ' + r.newWins, W / 2, py + 290);
  }

  ctx.fillStyle = '#cce0ff'; ctx.font = 'bold 12px system-ui';
  ctx.fillText('SPACE or ENTER to continue', W / 2, py + ph - 22);
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawArenaHud() {
  if (freeMap) { drawFreeMapHud(); return; }
  // ice patches — drawn beneath skid marks
  const _iceT = menuBlink / 1000;
  for (const ip of icePatches) {
    if (ip.life <= 0) continue;
    const p = project3D(ip.wx, ip.wy, ip.wz);
    if (p.behind) continue;
    const fade = ip.life / ip.maxLife;
    const pulse = 0.45 + Math.sin(_iceT * 4 + ip.wx + ip.wz) * 0.15;
    const alpha = fade * pulse;
    const rx = 18 + Math.sin(_iceT * 3 + ip.wz) * 2;
    const ry = 9  + Math.cos(_iceT * 3 + ip.wx) * 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#aaddff';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#cceeff';
    ctx.lineWidth = 1;
    ctx.globalAlpha = alpha * 0.7;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // skid marks — drawn first (behind HUD)
  for (const s of skidMarks) {
    if (s.life <= 0) continue;
    const p = project3D(s.wx, s.wy, s.wz);
    if (p.behind) continue;
    const alpha = (s.life / s.maxLife) * 0.5 * s.intensity;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = getTrailColor(_trailT + s.life * 0.001);
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 12, 6, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const aliveBots = arenaBots.filter(b => b.state === 'alive').length;
  const livePlacement = aliveBots + 1;
  const _placeLabels = ['','1ST','2ND','3RD','4TH','5TH','6TH','7TH','8TH','9TH','10TH','11TH','12TH','13TH','14TH','15TH','16TH','17TH','18TH','19TH','20TH','21ST'];
  const _placeCols   = ['','#ffd700','#c0c0c0','#cd7f32','#ff9933','#ff6666','#ff4444','#ff2222','#ff0000','#cc0000','#aa0000','#880000','#660000','#550000','#440000','#330000','#ff6666','#ff6666','#ff6666','#ff6666','#ff6666','#ff6666'];
  const label = _placeLabels[livePlacement] || (livePlacement + 'TH');
  const col   = _placeCols[livePlacement]   || '#ff4444';

  // pill background
  ctx.save();
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = '#111';
  const pw = 148, ph = 32, px = W / 2 - pw / 2, py = 10;
  ctx.beginPath();
  ctx.roundRect(px, py, pw, ph, 8);
  ctx.fill();
  ctx.globalAlpha = 1;

  // placement text
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px system-ui';
  ctx.fillStyle = col;
  ctx.fillText(label + ' PLACE', W / 2, py + 22);

  // time
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#aaa';
  const _modeLabel = battleRoyale ? '🟡 THE ZONE' : ('ARENA  LV ' + arenaLevel);
  ctx.fillText(Math.floor(gameTime) + 's  ·  ' + aliveBots + ' left  ·  ' + _modeLabel, W / 2, py + ph + 14);


  // nitro indicator
  if (nitroTime > 0) {
    const frac = nitroTime / 5000;
    const nx = W / 2 - 60, ny = H - 48, nw = 120, nh = 18;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.roundRect(nx, ny, nw, nh, 5); ctx.fill();
    ctx.fillStyle = frac > 0.5 ? '#ffcc00' : '#ff6600';
    ctx.beginPath(); ctx.roundRect(nx, ny, nw * frac, nh, 5); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = 'bold 11px system-ui';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('⚡ NITRO', W / 2, ny - 4);
  } else if (!nitroPickup && !arenaElimOrder.includes('player') && nitroSpawnTimer > 0) {
    const remaining = Math.ceil(nitroSpawnTimer / 1000);
    ctx.globalAlpha = 0.55;
    ctx.font = '10px system-ui';
    ctx.fillStyle = '#ffcc00';
    ctx.textAlign = 'center';
    ctx.fillText('⚡ next nitro in ' + remaining + 's', W / 2, H - 34);
    ctx.globalAlpha = 1;
  }

  // rocket charge indicator
  if (rocketCharges > 0) {
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#1a0000';
    ctx.beginPath(); ctx.roundRect(W - 78, H - 48, 68, 22, 5); ctx.fill();
    ctx.fillStyle = '#ff4400';
    ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('🚀 ×' + rocketCharges, W - 44, H - 32);
    ctx.globalAlpha = 1;
  } else if (!rocketPickup && !arenaElimOrder.includes('player') && rocketSpawnTimer > 0) {
    const rs = Math.ceil(rocketSpawnTimer / 1000);
    ctx.globalAlpha = 0.5; ctx.font = '10px system-ui'; ctx.fillStyle = '#ff6633'; ctx.textAlign = 'center';
    ctx.fillText('🚀 next in ' + rs + 's', W - 44, H - 34);
    ctx.globalAlpha = 1;
  }

  // rocket targeting scope
  if (rocketCharges > 0 && !arenaElimOrder.includes('player')) {
    if (rocketLockTarget && (rocketLockTarget.state === 'alive' || rocketLockTarget.alive === true)) {
      const _ty = (rocketLockTarget.y != null ? rocketLockTarget.y : 0.2) + 0.8;
      const _tp = project3D(rocketLockTarget.x, _ty, rocketLockTarget.z);
      if (!_tp.behind) {
        const _locked = rocketLocked;
        const _prog = Math.min(1, rocketLockTimer / 1800);
        const _bsz = _locked ? 24 : 28 - _prog * 8; // brackets close in as lock builds
        const _col = _locked ? '#ff2200' : `rgba(255,${Math.floor(180 - _prog*180)},0,${0.6 + _prog*0.4})`;
        ctx.save();
        ctx.strokeStyle = _col;
        ctx.lineWidth = _locked ? 2.5 : 1.8;
        ctx.globalAlpha = _locked ? (0.8 + Math.sin(gameTime * 18) * 0.2) : 0.85;
        const _bx = _tp.x, _by = _tp.y, _bl = _bsz * 0.45;
        // corner brackets
        [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy]) => {
          ctx.beginPath();
          ctx.moveTo(_bx + sx*_bsz,       _by + sy*_bsz - sy*_bl);
          ctx.lineTo(_bx + sx*_bsz,       _by + sy*_bsz);
          ctx.lineTo(_bx + sx*_bsz - sx*_bl, _by + sy*_bsz);
          ctx.stroke();
        });
        // lock-on progress arc
        if (!_locked) {
          ctx.globalAlpha = 0.5;
          ctx.beginPath();
          ctx.arc(_bx, _by, _bsz + 6, -Math.PI/2, -Math.PI/2 + _prog * Math.PI * 2);
          ctx.stroke();
        }
        // LOCKED label
        if (_locked) {
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = '#ff2200';
          ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center';
          ctx.fillText('LOCKED', _bx, _by - _bsz - 6);
        }
        ctx.restore();
      }
    } else {
      // idle scope crosshair — shifted up to look at distant targets
      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = '#ff6633';
      ctx.lineWidth = 1.2;
      const _cx = W/2, _cy = H/2 - 95, _cr = 18, _cg = 6;
      ctx.beginPath(); ctx.moveTo(_cx - _cr, _cy); ctx.lineTo(_cx - _cg, _cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(_cx + _cg, _cy); ctx.lineTo(_cx + _cr, _cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(_cx, _cy - _cr); ctx.lineTo(_cx, _cy - _cg); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(_cx, _cy + _cg); ctx.lineTo(_cx, _cy + _cr); ctx.stroke();
      ctx.beginPath(); ctx.arc(_cx, _cy, _cg + 2, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }

  // directional arrow pointing to rocket pickup
  if (rocketPickup && !arenaElimOrder.includes('player')) {
    const _dRx = rocketPickup.x - arenaPlayer.x;
    const _dRz = rocketPickup.z - arenaPlayer.z;
    const _rDist = Math.hypot(_dRx, _dRz);
    if (_rDist > 4) {
      const _worldA = Math.atan2(_dRx, _dRz);
      const _screenA = _worldA - arenaPlayer.heading;
      const _hx = W / 2 + Math.sin(_screenA) * 165;
      const _hy = H / 2 - Math.cos(_screenA) * 165;
      const _ax = Math.max(28, Math.min(W - 28, _hx));
      const _ay = Math.max(28, Math.min(H - 28, _hy));
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.translate(_ax, _ay);
      ctx.rotate(_screenA);
      ctx.fillStyle = '#ff4422';
      ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(-9, 4); ctx.lineTo(9, 4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 1; ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🚀', _ax, _ay + 20);
      ctx.restore();
    }
  }

  // bomb counter (championship final)
  if (arenaBombs.length > 0) {
    const live = arenaBombs.filter(b => !b.triggered).length;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#1a0000';
    ctx.beginPath(); ctx.roundRect(10, 46, 68, 22, 6); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = live > 0 ? '#ff4400' : '#44cc44';
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('💣 ' + live + ' left', 44, 61);
  }

  // level badge top-left
  const lvColor = arenaLevel <= 5 ? '#00f0ff' : '#ff44dd';
  ctx.globalAlpha = 0.78;
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.roundRect(10, 10, 68, 30, 7); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = lvColor;
  ctx.font = 'bold 14px system-ui';
  ctx.fillText('LV ' + arenaLevel + (arenaLevel <= 5 ? ' 🔒' : ' 🔓'), 44, 29);

  // money forever charge indicator
  if (equippedPaint === 'paint_moneyforever') {
    const chargeY = nitroTime > 0 ? H - 72 : H - 48;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.roundRect(W/2 - 52, chargeY, 104, 20, 5); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#66bb6a';
    const cd = mfCooldown > 0 ? '  (' + Math.ceil(mfCooldown/1000) + 's)' : '';
    ctx.fillText('💵 ' + mfCharges + '/3 charges' + cd, W/2, chargeY + 14);
  }

  // championship round indicator
  if (champActive) {
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.roundRect(W - 88, 10, 78, 30, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'right';
    ctx.fillText('🏆 ' + (champRound + 1) + ' / 5', W - 14, 29);
  }

  ctx.textAlign = 'left';
  ctx.restore();
}
function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, Math.min(1, p.life / p.max));
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.kind === 'bill') {
      const bw = p.size * 1.7, bh = p.size * 0.85;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      ctx.fillStyle = '#2e7d32'; ctx.fillRect(-bw/2, -bh/2, bw, bh);
      ctx.fillStyle = '#c8e6c9'; ctx.fillRect(-bw/2+2, -bh/2+2, bw-4, bh-4);
      ctx.fillStyle = '#1b5e20'; ctx.font = 'bold ' + Math.floor(bh*0.55) + 'px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$100', 0, 0);
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      ctx.restore();
    } else if (p.kind === 'controller') {
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.font = Math.floor(p.size) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🎮', 0, 0);
      ctx.textBaseline = 'alphabetic'; ctx.restore();
    } else if (p.kind === 'debris') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
    } else if (p.kind === 'groundmark') {
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.size, p.size * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}

function drawHud() {
  // score pill — top centre
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(W/2 - 64, 6, 128, 32, 8); ctx.fill();
  ctx.fillStyle = '#ffd54a';
  ctx.font = 'bold 20px system-ui';
  ctx.fillText(Math.floor(score), W/2, 28);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px system-ui';
  ctx.fillText('Best: ' + getBest(), 10, 24);
  ctx.fillText('Speed: ' + Math.floor(speed * 3.6) + ' km/h', W - 160, 24);
  ctx.font = '12px system-ui';
  ctx.fillStyle = '#ccc';
  ctx.fillText(CARS[carIdx].name + '  · crashes ' + crashes, W - 200, 44);

  // difficulty badge — show fog/speed-floor warning on HARD
  if (difficultyIdx === 2) {
    const tooSlow = diffSpeedWarning > 200 && MODES[modeIdx] === 'HEAD ON';
    const warnFrac = diffSpeedWarning / 2500;
    ctx.fillStyle = tooSlow ? 'rgba(200,20,20,0.75)' : 'rgba(180,30,0,0.65)';
    ctx.beginPath(); ctx.roundRect(W/2 - 46, H - 36, 92, 24, 5); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(tooSlow ? '⚡ SPEED UP!' : '● HARD  2× COINS', W/2, H - 20);
    ctx.textAlign = 'left';
    // edge-of-screen red flash when penalty is close
    if (tooSlow && warnFrac > 0.5) {
      ctx.globalAlpha = (warnFrac - 0.5) * 2 * 0.22 * (Math.sin(Date.now() / 100) * 0.5 + 0.5);
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  drawDamageBars();

  if (damageBanner > 0 && state === STATE.PLAYING) {
    const a = Math.min(0.45, (damageBanner / 300) * 0.45);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ff2222';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  if (MODES[modeIdx] === 'HEAD ON' && state === STATE.PLAYING) {
    const w = WAVES[Math.min(wave, WAVES.length-1)];
    ctx.font = '13px system-ui';
    ctx.fillStyle = '#ffd54a';
    ctx.fillText(w.label, 10, 66);
    if (wave < WAVES.length-1) {
      ctx.fillStyle = '#bbb';
      ctx.fillText('Dodged ' + dodged + ' / ' + w.advance, 10, 84);
    }
  }
  if (waveBanner > 0 && state === STATE.PLAYING) {
    const a = Math.min(1, waveBanner / 400);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, H/2 - 40, W, 60);
    ctx.fillStyle = '#ffd54a';
    ctx.font = 'bold 28px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(WAVES[Math.min(wave, WAVES.length-1)].label, W/2, H/2);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
}

function drawDamageBars() {
  const items = [['BODY', dmg.body],['TIRES', dmg.tires],['ENGINE', dmg.engine]];
  const bx = W - 130, by = 60, bw = 90, bh = 7;
  ctx.font = '10px system-ui';
  ctx.textAlign = 'left';
  for (let i = 0; i < items.length; i++) {
    const [name, d] = items[i];
    const y = by + i * 14;
    ctx.fillStyle = '#bbb'; ctx.fillText(name, bx, y - 1);
    ctx.fillStyle = '#222'; ctx.fillRect(bx + 38, y - 7, bw, bh);
    const remaining = 1 - d;
    const color = remaining > 0.6 ? '#2ecc71' : remaining > 0.3 ? '#f39c12' : '#e74c3c';
    ctx.fillStyle = color; ctx.fillRect(bx + 38, y - 7, bw * remaining, bh);
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
    ctx.strokeRect(bx + 38, y - 7, bw, bh);
  }
}

function drawButton(b) {
  const hovered = !b.disabled && mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h;
  ctx.fillStyle = b.disabled ? 'rgba(60,60,60,0.7)' : (hovered ? '#ffd54a' : 'rgba(0,0,0,0.55)');
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = b.disabled ? '#444' : (hovered ? '#fff' : '#888');
  ctx.lineWidth = 2;
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = b.disabled ? '#888' : (hovered ? '#111' : '#fff');
  ctx.font = 'bold 15px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.label, b.x + b.w/2, b.y + b.h/2);
  ctx.textBaseline = 'alphabetic';
}

const STAT_MAX = 3.00;
function drawCarStats(car, cx, cy) {
  const idx = CARS.indexOf(car);
  const rows = [['TOP SPEED', effTop(idx)], ['HANDLING', effSteer(idx)], ['ACCELERATION', effAccel(idx)], ['BRAKE', effBrake(idx)]];
  const barW = 100, barH = 7, labelW = 88, valW = 28;
  ctx.textAlign = 'left'; ctx.font = '10px system-ui';
  for (let i = 0; i < rows.length; i++) {
    const [name, val] = rows[i];
    const y = cy + i * 16;
    ctx.fillStyle = '#bbb'; ctx.fillText(name, cx, y);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.roundRect(cx + labelW, y - barH + 1, barW, barH, 2); ctx.fill();
    const t = Math.min(1, val / STAT_MAX);
    const r = Math.round(t < 0.5 ? t * 2 * 255 : 255);
    const gv = Math.round(t < 0.5 ? 213 : (1 - (t - 0.5) * 2) * 213);
    const b  = Math.round(t < 0.5 ? (1 - t * 2) * 255 : 0);
    ctx.fillStyle = `rgb(${r},${gv},${b})`;
    ctx.beginPath(); ctx.roundRect(cx + labelW, y - barH + 1, barW * t, barH, 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(val.toFixed(2), cx + labelW + barW + valW, y);
    ctx.textAlign = 'left'; ctx.font = '10px system-ui';
  }
  // car buff badges
  const buffY = cy + rows.length * 16 + 6;
  const coinM = car.coinMul || 1;
  const gemPct = ((car.gemChance || 0) * 100).toFixed(coinM >= 5 ? 2 : 3);
  const hits = car.hitsToKill || 4;
  ctx.font = 'bold 9px system-ui';
  ctx.fillStyle = coinM > 1 ? '#ffd54a' : '#666';
  ctx.fillText('● ×' + coinM + ' coins', cx, buffY);
  ctx.fillStyle = '#b39ddb';
  ctx.fillText('◆ ' + gemPct + '%', cx + 82, buffY);
  ctx.fillStyle = hits >= 10 ? '#44ff88' : hits >= 5 ? '#ffdd44' : '#ff7766';
  ctx.fillText('❤ ' + hits + ' hits', cx + 140, buffY);
}

function drawMenuButton(b) {
  const hovered = !b.disabled && mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h;
  // body — dark base; on hover it lights up
  ctx.fillStyle = b.disabled ? 'rgba(40,40,50,0.55)'
                : hovered    ? 'rgba(20,40,55,0.95)'
                             : 'rgba(10,14,28,0.85)';
  // glow halo behind the fill on hover
  ctx.shadowColor = b.disabled ? 'transparent' : (hovered ? '#34ff9e' : '#00f0ff');
  ctx.shadowBlur  = b.disabled ? 0 : (hovered ? 22 : 8);
  roundedRect(b.x, b.y, b.w, b.h, 6);
  ctx.fill();
  ctx.shadowBlur = 0;
  // neon border
  ctx.strokeStyle = b.disabled ? '#444' : (hovered ? '#34ff9e' : '#00f0ff');
  ctx.lineWidth = 2.5;
  roundedRect(b.x, b.y, b.w, b.h, 6);
  ctx.stroke();
  // icon takes precedence over label
  if (b.icon) {
    const iconColor = b.disabled ? '#888' : (hovered ? '#fff' : '#ffd54a');
    const iconSize = Math.min(b.w, b.h) * 0.72;
    drawMenuIcon(b.icon, b.x + b.w/2, b.y + b.h/2, iconSize, iconColor);
    return;
  }
  // label (shifted up a bit when there's a sublabel so both fit inside)
  ctx.fillStyle = b.disabled ? '#888' : (hovered ? '#fff' : '#ffd54a');
  ctx.font = 'bold ' + (b.fontSize || 13) + 'px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const labelY = b.sub ? b.y + b.h/2 - 8 : b.y + b.h/2;
  ctx.fillText(b.label, b.x + b.w/2, labelY);
  ctx.textBaseline = 'alphabetic';
  // sublabel — drawn inside the button, below the main label
  if (b.sub) {
    ctx.fillStyle = hovered ? '#fff' : '#ff8fea';
    ctx.font = 'bold 13px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.sub, b.x + b.w/2, b.y + b.h/2 + 11);
    ctx.textBaseline = 'alphabetic';
  }
}

function drawMenuIcon(kind, cx, cy, size, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(1.5, size * 0.07);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  if (kind === 'home') {
    const s = size * 0.5;
    // roof (filled triangle)
    ctx.beginPath();
    ctx.moveTo(cx - s, cy - s * 0.05);
    ctx.lineTo(cx,     cy - s * 0.85);
    ctx.lineTo(cx + s, cy - s * 0.05);
    ctx.closePath();
    ctx.fill();
    // body (filled rect)
    ctx.fillRect(cx - s * 0.78, cy - s * 0.05, s * 1.56, s * 0.95);
    // door (cutout — use destination-out so it punches through both shapes)
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - s * 0.22, cy + s * 0.18, s * 0.44, s * 0.72);
    ctx.restore();
  } else if (kind === 'gear') {
    const r = size * 0.34;
    const ri = size * 0.18;
    const teeth = 8;
    // teeth: small rectangles around the ring
    for (let i = 0; i < teeth; i++) {
      const a = (i / teeth) * Math.PI * 2;
      const tx = cx + Math.cos(a) * (r + size * 0.06);
      const ty = cy + Math.sin(a) * (r + size * 0.06);
      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(a);
      ctx.fillRect(-size * 0.08, -size * 0.06, size * 0.16, size * 0.12);
      ctx.restore();
    }
    // outer ring
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    // inner hole (knock out)
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(cx, cy, ri, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else if (kind === 'cart') {
    const s = size * 0.5;
    // handle line from upper-left corner down into basket
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.95, cy - s * 0.55);
    ctx.lineTo(cx - s * 0.65, cy - s * 0.55);
    ctx.lineTo(cx - s * 0.45, cy + s * 0.15);
    ctx.lineTo(cx + s * 0.65, cy + s * 0.15);
    ctx.stroke();
    // basket
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.55, cy - s * 0.20);
    ctx.lineTo(cx + s * 0.80, cy - s * 0.20);
    ctx.lineTo(cx + s * 0.60, cy + s * 0.20);
    ctx.lineTo(cx - s * 0.40, cy + s * 0.20);
    ctx.closePath();
    ctx.stroke();
    // wheels
    const wr = Math.max(2, s * 0.16);
    ctx.beginPath(); ctx.arc(cx - s * 0.25, cy + s * 0.55, wr, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + s * 0.50, cy + s * 0.55, wr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else { ctx.rect(x, y, w, h); }
}

function drawMenu() {
  // subtle vignette
  const grad = ctx.createRadialGradient(W/2, H/2, H/3, W/2, H/2, H);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // stylized title top-left with neon glow
  ctx.textAlign = 'left';
  ctx.font = 'bold italic 38px system-ui';
  // glow layers
  ctx.fillStyle = 'rgba(255, 68, 221, 0.35)';
  for (let i = 4; i > 0; i--) ctx.fillText('HEAD', 14 + i, 50 + i);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('HEAD', 14, 50);
  ctx.fillStyle = 'rgba(0, 240, 255, 0.45)';
  for (let i = 4; i > 0; i--) ctx.fillText('ON', 14 + i, 88 + i);
  ctx.fillStyle = '#ffd54a';
  ctx.fillText('ON', 14, 88);

  // coin balance top-right
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd54a';
  ctx.font = 'bold 20px system-ui';
  ctx.fillText('● ' + coins, W - 14, 36);
  ctx.fillStyle = '#b39ddb';
  ctx.font = 'bold 13px system-ui';
  ctx.fillText('◆ ' + gems, W - 14, 54);
  ctx.font = '9px system-ui';
  ctx.fillStyle = '#bbb';
  ctx.fillText('GEMS', W - 14, 66);

  const car = CARS[carIdx];

  // info card under the rotating car (compact)
  const cardY = 268;
  ctx.fillStyle = 'rgba(10,10,20,0.55)';
  roundedRect(20, cardY, W - 40, 118, 8);
  ctx.fill();
  ctx.strokeStyle = '#ff44dd';
  ctx.lineWidth = 2;
  roundedRect(20, cardY, W - 40, 118, 8);
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd54a';
  ctx.font = 'bold 16px system-ui';
  ctx.fillText(car.name, W/2, cardY + 18);
  ctx.fillStyle = '#fff';
  ctx.font = '11px system-ui';
  ctx.fillText(car.desc, W/2, cardY + 33);
  const pnt = SHOP_PAINTS.find(p => p.id === equippedPaint);
  if (pnt && pnt.color != null) {
    ctx.fillStyle = '#' + pnt.color.toString(16).padStart(6,'0');
    ctx.fillText('● ' + pnt.name + ' PAINT', W/2, cardY + 48);
  }
  drawCarStats(car, W/2 - 90, cardY + 64);

  // click-car hint
  ctx.textAlign = 'center';
  ctx.font = '10px system-ui';
  ctx.fillStyle = 'rgba(255,213,74,0.65)';
  ctx.fillText('▲ TAP CAR TO OPEN GARAGE', W/2, 264);

  const gap = 8;
  const rowW = W - 28, rowX = 14;

  // bottom: SHOP (small) | PLAY (huge, center) | MODE (small) — all share the same bottom edge
  const sideW = 118, sideH = 64;
  const playH = 76;
  const playBottomY = H - 10;
  const sideY = playBottomY - sideH;          // small buttons sit at bottom
  const playY = playBottomY - playH;          // big button extends much higher
  const playX = rowX + sideW + gap;
  const playW = rowW - sideW * 2 - gap * 2;

  // small GARAGE + QUEST in the top-right, under the coin/gem stack
  const topBtnW = 70, topBtnH = 22;
  const topBtnY = 74;
  const questX  = W - 14 - topBtnW;
  const garageX = questX - gap - topBtnW;

  menuButtons = [
    { icon: 'home',     x: rowX,                            y: sideY, w: sideW, h: sideH, action: () => { state = STATE.GARAGE; garageTab = 'cars'; garageCarScroll = Math.max(0, carIdx - 2); } },
    { label: 'PLAY',    x: playX,                           y: playY, w: playW, h: playH, fontSize: 38, action: startGame },
    { label: 'MODE ▶', sub: MODES[modeIdx], x: rowX + rowW - sideW, y: sideY, w: sideW, h: sideH, action: cycleMode },
    { icon: 'cart', x: garageX, y: topBtnY, w: topBtnW, h: topBtnH, action: () => { state = STATE.GEM_SHOP; shopResult = null; } },
    { label: '✦ QUEST', x: questX,  y: topBtnY, w: topBtnW, h: topBtnH, fontSize: 10, action: () => state = STATE.MISSIONS },
    // gear icon to the right of the "HEAD ON" title
    { icon: 'gear', x: 130, y: 38, w: 36, h: 36, action: () => { state = STATE.SETTINGS; } },
  ];

  // records row — sits just above the PLAY button
  const bw2 = Math.floor((rowW - gap) / 2);
  const ry = playY - 34;
  ctx.fillStyle = 'rgba(0,0,0,0.40)';
  roundedRect(rowX, ry, bw2, 26, 6); ctx.fill();
  roundedRect(rowX + bw2 + gap, ry, bw2, 26, 6); ctx.fill();
  ctx.textAlign = 'center'; ctx.font = 'bold 10px system-ui';
  ctx.fillStyle = '#aaa';
  ctx.fillText('HEAD ON RECORD', rowX + bw2/2, ry + 10);
  ctx.fillStyle = bestHeadOn > 0 ? '#ffd54a' : '#555';
  ctx.font = 'bold 13px system-ui';
  ctx.fillText(bestHeadOn > 0 ? bestHeadOn : '—', rowX + bw2/2, ry + 23);
  ctx.fillStyle = '#aaa'; ctx.font = 'bold 10px system-ui';
  ctx.fillText('CLASSIC RECORD', rowX + bw2 + gap + bw2/2, ry + 10);
  ctx.fillStyle = bestClassic > 0 ? '#ffd54a' : '#555';
  ctx.font = 'bold 13px system-ui';
  ctx.fillText(bestClassic > 0 ? bestClassic : '—', rowX + bw2 + gap + bw2/2, ry + 23);

  for (const b of menuButtons) drawMenuButton(b);

  // hint
  if (Math.floor(menuBlink / 500) % 2 === 0) {
    ctx.fillStyle = '#ffd54a';
    ctx.font = 'bold 10px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('PRESS SPACE TO START', W/2, H - 6);
  }
  ctx.textAlign = 'left';
}

function garageBtn(label, x, y, w, h, action, opts={}) {
  const hov = mouse.x>=x && mouse.x<=x+w && mouse.y>=y && mouse.y<=y+h && !opts.disabled;
  ctx.fillStyle = opts.disabled ? 'rgba(40,40,50,0.6)'
                : opts.active   ? 'rgba(255,68,221,0.9)'
                : hov           ? 'rgba(255,68,221,0.7)'
                                : 'rgba(20,20,30,0.75)';
  roundedRect(x, y, w, h, 5); ctx.fill();
  ctx.strokeStyle = opts.disabled ? '#444' : (opts.active ? '#fff' : '#ff44dd');
  ctx.lineWidth = opts.active ? 2.5 : 1.5;
  roundedRect(x, y, w, h, 5); ctx.stroke();
  ctx.fillStyle = opts.disabled ? '#888' : '#fff';
  ctx.font = opts.small ? 'bold 10px system-ui' : 'bold 12px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x+w/2, y+h/2);
  ctx.textBaseline = 'alphabetic';
  garageButtons.push({ x, y, w, h, action, disabled: !!opts.disabled });
}

function drawGarageRoom() {
  const RB = 200; // bottom of garage room area
  // opaque shop background below the room
  ctx.fillStyle = 'rgba(6,8,20,0.96)';
  ctx.fillRect(0, RB, W, H - RB);

  // garage door horizontal stripes across the top
  const sH = 14, nS = 5;
  for (let i = 0; i < nS; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(188,188,202,0.84)' : 'rgba(162,162,176,0.84)';
    ctx.fillRect(0, i * sH, W, sH);
  }
  ctx.strokeStyle = 'rgba(65,65,76,0.55)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= nS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * sH - 0.5); ctx.lineTo(W, i * sH - 0.5); ctx.stroke();
  }

  // perspective walls — inner transparent window where car shows through
  const IT = nS * sH, IL = 62, IR = W - 62, IB = RB - 6;
  // left wall
  ctx.fillStyle = 'rgba(148,150,162,0.88)';
  ctx.beginPath();
  ctx.moveTo(0, IT); ctx.lineTo(IL, IT); ctx.lineTo(IL, IB); ctx.lineTo(0, RB);
  ctx.closePath(); ctx.fill();
  // right wall
  ctx.beginPath();
  ctx.moveTo(W, IT); ctx.lineTo(IR, IT); ctx.lineTo(IR, IB); ctx.lineTo(W, RB);
  ctx.closePath(); ctx.fill();
  // floor strip
  ctx.fillStyle = 'rgba(96,98,110,0.88)';
  ctx.beginPath();
  ctx.moveTo(0, RB); ctx.lineTo(W, RB); ctx.lineTo(IR, IB); ctx.lineTo(IL, IB);
  ctx.closePath(); ctx.fill();

  // inner frame line
  ctx.strokeStyle = 'rgba(45,45,54,0.65)';
  ctx.lineWidth = 2;
  ctx.strokeRect(IL, IT, IR - IL, IB - IT);

  // tires stacked on right wall
  const tx = W - 30;
  for (let i = 0; i < 3; i++) {
    const ty = RB - 16 - i * 22;
    ctx.fillStyle = '#1e1e22';
    ctx.beginPath(); ctx.ellipse(tx, ty, 15, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5e5e70';
    ctx.beginPath(); ctx.ellipse(tx, ty, 5, 3, 0, 0, Math.PI*2); ctx.fill();
  }

  // workbench on left wall
  const wx = 4, ww = 54, wy = RB - 54;
  ctx.fillStyle = '#7a5530'; ctx.fillRect(wx, wy, ww, 8);
  ctx.fillStyle = '#4a3020'; ctx.fillRect(wx, wy + 8, ww, 32);
  // red toolbox on workbench
  ctx.fillStyle = '#cc2020'; ctx.fillRect(wx, wy - 17, 22, 17);
  ctx.fillStyle = '#aa1010'; ctx.fillRect(wx + 2, wy - 10, 18, 3);
}

function drawGarage() {
  garageButtons = [];
  drawGarageRoom();
  const RB = 200;

  // title + coins
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd54a';
  ctx.font = 'bold 22px system-ui';
  ctx.fillText('GARAGE', W/2, RB + 22);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 14px system-ui';
  ctx.fillText('● ' + coins, W-14, RB + 20);
  ctx.fillStyle = '#b39ddb'; ctx.font = 'bold 11px system-ui';
  ctx.fillText('◆ ' + gems, W-14, RB + 33);

  // tabs
  const tabW=138, tabH=27, tabGap=4, tabY=RB+37;
  const tabX0=(W-(tabW*3+tabGap*2))/2;
  const TABS=[['cars','CARS'],['paint','PAINT'],['trails','TRAILS']];
  for(let i=0;i<TABS.length;i++){
    const [id,label]=TABS[i];
    const tx=tabX0+i*(tabW+tabGap);
    garageBtn(label,tx,tabY,tabW,tabH,()=>{garageTab=id;garagePaintSelected=null;garageTrailSelected=null;garageCarSelected=null;garageSlotPicker=null;garageTrailScroll=0;garagePaintScroll=0;},{active:garageTab===id});
  }

  const contentY=RB+72, contentH=H-contentY-40;

  if(garageTab==='cars'){
    const cardH=44, gap=5, visibleCount=6;
    const regularCars=CARS.map((c,i)=>({...c,_origIdx:i})).filter(c=>!c.missionOnly);
    const maxScroll=Math.max(0,regularCars.length-visibleCount);
    garageCarScroll=Math.max(0,Math.min(garageCarScroll,maxScroll));
    const startIdx=Math.floor(garageCarScroll);
    const endIdx=Math.min(regularCars.length,startIdx+visibleCount);
    // scroll hint arrows
    if(startIdx>0){ctx.fillStyle='rgba(255,213,74,0.7)';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('▲',W/2,contentY+6);}
    if(endIdx<regularCars.length){ctx.fillStyle='rgba(255,213,74,0.7)';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('▼',W/2,contentY+contentH+4);}
    for(let li=0;li<endIdx-startIdx;li++){
      const car=regularCars[startIdx+li];
      const i=car._origIdx;
      const cy=contentY+li*(cardH+gap);
      const owned_=isUnlocked(i);
      const equipped=carIdx===i;
      // card bg
      ctx.fillStyle=equipped?'rgba(255,68,221,0.18)':'rgba(255,255,255,0.04)';
      roundedRect(14,cy,W-28,cardH,7); ctx.fill();
      ctx.strokeStyle=equipped?'#ff44dd':'rgba(255,255,255,0.12)';
      ctx.lineWidth=equipped?2:1; roundedRect(14,cy,W-28,cardH,7); ctx.stroke();
      // color swatch
      ctx.fillStyle='#'+car.body.toString(16).padStart(6,'0');
      ctx.beginPath(); ctx.roundRect(22,cy+cardH/2-10,20,20,4); ctx.fill();
      // name & desc
      ctx.textAlign='left'; ctx.fillStyle=owned_?'#ffd54a':'#aaa';
      ctx.font='bold 12px system-ui';
      ctx.fillText(car.name,50,cy+cardH/2-3);
      ctx.fillStyle='#888'; ctx.font='10px system-ui';
      ctx.fillText(car.desc,50,cy+cardH/2+10);
      // cost for locked cars
      if(!owned_){
        const gc=car.gemCost||0;
        ctx.fillStyle=coins>=car.cost?'#aaffaa':'#ff8888'; ctx.font='9px system-ui';
        ctx.fillText('● '+car.cost,50,cy+cardH/2+21);
        if(gc>0){
          ctx.fillStyle=gems>=gc?'#cc99ff':'#ff6688';
          ctx.fillText('  ◆ '+gc,50+ctx.measureText('● '+car.cost).width+2,cy+cardH/2+21);
        }
      }
      // card body clickable (left portion, excluding action button area) to toggle upgrade slots
      garageButtons.push({ x:14, y:cy, w:W-112, h:cardH, action:()=>{ garageCarSelected = garageCarSelected===i ? null : i; garageSlotPicker=null; }, disabled:false });
      // action button
      const bw=76,bh=24,bx=W-14-bw-4,by_=cy+cardH/2-bh/2;
      if(equipped){
        garageBtn('EQUIPPED',bx,by_,bw,bh,null,{active:true,small:true});
      }else if(owned_){
        garageBtn('EQUIP',bx,by_,bw,bh,()=>{carIdx=i;localStorage.setItem('headon_car',i);rebuildPlayerCar();},{small:true});
      }else{
        const gc=car.gemCost||0;
        const canAfford=coins>=car.cost && gems>=gc;
        const buyLabel=gc>0?'BUY ◆'+gc:'BUY ●'+car.cost;
        garageBtn(buyLabel,bx,by_,bw,bh,canAfford?()=>{setCoins(coins-car.cost);if(gc>0)addGems(-gc);unlockCar(i);}:null,{disabled:!canAfford,small:true});
      }
    }
  }

  // car upgrade slots panel — shown when a car card is tapped
  if (garageTab === 'cars' && garageCarSelected !== null) {
    const slotDefs = [
      { icon: '⚙', name: 'ENGINE', key: 'engine' },
      { icon: '◎', name: 'WHEELS', key: 'wheels' },
      { icon: '▣', name: 'BRAKES', key: 'brakes' },
    ];
    const panH = 90;
    const panY = H - 48 - panH;
    ctx.fillStyle = 'rgba(0,5,20,0.97)';
    ctx.beginPath(); ctx.roundRect(14, panY, W-28, panH, 7); ctx.fill();
    ctx.strokeStyle = '#ff44dd'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(14, panY, W-28, panH, 7); ctx.stroke();
    const selCar = CARS[garageCarSelected];
    ctx.textAlign = 'left'; ctx.fillStyle = '#ff88ee'; ctx.font = 'bold 10px system-ui';
    ctx.fillText((selCar ? selCar.name : '') + '  —  UPGRADES', 22, panY + 13);
    ctx.fillStyle = '#444'; ctx.font = '9px system-ui';
    ctx.fillText('Tap a slot to equip from inventory', 22, panY + 23);
    const slotGap = 5, slotW = (W - 28 - slotGap * 4) / 3;
    slotDefs.forEach((slot, si) => {
      const tier = getUpg(garageCarSelected, slot.key);
      const tc = TIER_COLORS[tier] || '#666';
      const isOpen = garageSlotPicker === slot.key;
      const invCount = (upgradeInventory[slot.key] || []).length;
      const sx = 14 + slotGap + si * (slotW + slotGap);
      const sy = isOpen ? panY + 24 : panY + 28;
      const sh = isOpen ? panH - 28 : panH - 34;
      // solid filled background (no transparency)
      if (isOpen) {
        ctx.fillStyle = '#3a0a30';
      } else if (tier > 0) {
        ctx.fillStyle = tc; ctx.globalAlpha = 0.22; ctx.beginPath(); ctx.roundRect(sx, sy, slotW, sh, 5); ctx.fill(); ctx.globalAlpha = 1;
        ctx.fillStyle = '#181020';
      } else {
        ctx.fillStyle = '#181020';
      }
      ctx.beginPath(); ctx.roundRect(sx, sy, slotW, sh, 5); ctx.fill();
      ctx.strokeStyle = isOpen ? '#ff44dd' : tier > 0 ? tc : '#444';
      ctx.lineWidth = isOpen ? 2.5 : 1.5;
      ctx.beginPath(); ctx.roundRect(sx, sy, slotW, sh, 5); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = tier > 0 ? tc : '#888'; ctx.font = '15px system-ui';
      ctx.fillText(slot.icon, sx + slotW/2, sy + 16);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 10px system-ui';
      ctx.fillText(slot.name, sx + slotW/2, sy + 30);
      ctx.fillStyle = tier > 0 ? tc : '#666'; ctx.font = 'bold 9px system-ui';
      ctx.fillText(tier > 0 ? TIER_NAMES[tier] : 'EMPTY', sx + slotW/2, sy + 43);
      // inventory count badge in top-right corner
      const badgeX = sx + slotW - 18, badgeY = sy + 4;
      ctx.fillStyle = invCount > 0 ? '#ff44dd' : '#333';
      ctx.beginPath(); ctx.roundRect(badgeX, badgeY, 14, 14, 3); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 9px system-ui';
      ctx.fillText(invCount > 9 ? '9+' : String(invCount), badgeX + 7, badgeY + 10);
      if (isOpen) {
        ctx.fillStyle = '#ff88ee'; ctx.font = 'bold 9px system-ui';
        ctx.fillText('▼ TAP TO CLOSE', sx + slotW/2, sy + sh - 6);
      }
      garageButtons.push({ x:sx, y:sy, w:slotW, h:sh, action:()=>{ garageSlotPicker = garageSlotPicker===slot.key ? null : slot.key; }, disabled:false });
    });

    // slot picker modal
    if (garageSlotPicker !== null) {
      const items = upgradeInventory[garageSlotPicker] || [];
      const ROW_H = 56;
      // pickerH is capped by the space ABOVE the slot panel (panY), not below.
      const _pickerMaxH = panY - 90;
      const pickerH = Math.min(_pickerMaxH, 40 + Math.max(1, items.length) * ROW_H + 12);
      const pickerY = panY - pickerH - 6;
      ctx.fillStyle = '#000308';
      ctx.beginPath(); ctx.roundRect(14, pickerY, W-28, pickerH, 8); ctx.fill();
      ctx.strokeStyle = '#ff44dd'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(14, pickerY, W-28, pickerH, 8); ctx.stroke();
      // header
      ctx.textAlign = 'left'; ctx.fillStyle = '#ff88ee'; ctx.font = 'bold 11px system-ui';
      ctx.fillText(garageSlotPicker.toUpperCase() + ' UPGRADES  —  tap to equip / move', 22, pickerY + 16);
      const typeLabel = garageSlotPicker === 'engine' ? 'Top Speed & Accel' : garageSlotPicker === 'wheels' ? 'Handling' : 'Braking';
      // close button
      const cX = W-28, cY = pickerY+8, cW = 30, cH = 18;
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.roundRect(cX-cW-8, cY, cW, cH, 4); ctx.fill();
      ctx.textAlign='center'; ctx.fillStyle='#888'; ctx.font='bold 10px system-ui';
      ctx.fillText('✕', cX-cW/2-8, cY+12);
      garageButtons.push({ x:cX-cW-8, y:cY, w:cW, h:cH, action:()=>{ garageSlotPicker=null; }, disabled:false });
      if (items.length === 0) {
        ctx.textAlign='center'; ctx.fillStyle='#555'; ctx.font='11px system-ui';
        ctx.fillText('No '+garageSlotPicker+' upgrades in inventory — open chests in the Shop!', W/2, pickerY+pickerH/2+4);
      } else {
        const ROW_GAP = 4;
        const rowH = ROW_H - ROW_GAP;
        items.forEach((item, idx) => {
          const iy = pickerY + 32 + idx * ROW_H;
          const equippedOn = findEquippedCar(garageSlotPicker, idx);
          const onThisCar = equippedOn === garageCarSelected;
          const onOther = equippedOn !== null && !onThisCar;
          const tc = TIER_COLORS[item.tier];
          const bonusPct = Math.round(UPGRADE_BONUS[item.tier] * 100);
          // fully opaque row body
          ctx.fillStyle = onThisCar ? '#3a0a30' : '#1a1326';
          ctx.beginPath(); ctx.roundRect(20, iy, W-40, rowH, 6); ctx.fill();
          ctx.strokeStyle = onThisCar ? '#ff44dd' : '#553366'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.roundRect(20, iy, W-40, rowH, 6); ctx.stroke();
          ctx.textAlign='left'; ctx.fillStyle=tc; ctx.font='bold 13px system-ui';
          ctx.fillText(TIER_NAMES[item.tier] + ' ' + garageSlotPicker.toUpperCase(), 30, iy + 20);
          ctx.fillStyle='#bbb'; ctx.font='11px system-ui';
          ctx.fillText('+' + bonusPct + '% ' + typeLabel, 30, iy + 38);
          if (onOther) {
            const otherName = (CARS[equippedOn]||{}).name || 'another car';
            ctx.fillStyle='#ff9944'; ctx.font='bold 10px system-ui'; ctx.textAlign='right';
            ctx.fillText('on ' + otherName, W - 130, iy + 20);
          }
          const btnW = 100, btnH = 32, btnX = W - 30 - btnW, btnY = iy + (rowH - btnH) / 2;
          const btnLabel = onThisCar ? 'UNEQUIP' : onOther ? 'MOVE HERE' : 'EQUIP';
          const btnColor = onThisCar ? '#ff4444' : onOther ? '#ff9944' : '#44dd66';
          ctx.fillStyle = btnColor;
          ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 5); ctx.fill();
          ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.font = 'bold 11px system-ui';
          ctx.textBaseline = 'middle';
          ctx.fillText(btnLabel, btnX + btnW / 2, btnY + btnH / 2);
          ctx.textBaseline = 'alphabetic';
          garageButtons.push({ x: btnX, y: btnY, w: btnW, h: btnH, disabled: false, action: () => {
            if (onThisCar) unequipItem(garageCarSelected, garageSlotPicker);
            else equipItem(garageCarSelected, garageSlotPicker, idx);
            garageSlotPicker = null;
          }});
        });
      }
    }
  }

  if(garageTab==='paint'){
    const cols=4, swW=(W-28-cols*6)/cols, swH=78, gap=5;
    const visiblePRows=3, rowH=swH+gap;
    const totalPRows=Math.ceil(SHOP_PAINTS.length/cols);
    const maxPS=Math.max(0,totalPRows-visiblePRows);
    garagePaintScroll=Math.max(0,Math.min(garagePaintScroll,maxPS));
    if(garagePaintScroll>0){ctx.fillStyle='rgba(255,213,74,0.7)';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('▲',W/2,contentY+6);}
    if(garagePaintScroll<maxPS){ctx.fillStyle='rgba(255,213,74,0.7)';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('▼',W/2,contentY+visiblePRows*rowH+4);}
    ctx.save(); ctx.beginPath(); ctx.rect(0,contentY,W,visiblePRows*rowH); ctx.clip();
    SHOP_PAINTS.forEach((paint,i)=>{
      const col=i%cols, row=Math.floor(i/cols);
      if(row<garagePaintScroll||row>=garagePaintScroll+visiblePRows) return;
      const px=14+col*(swW+gap), py=contentY+(row-garagePaintScroll)*rowH;
      const owned_=isOwned(paint.id);
      const equipped=equippedPaint===paint.id;
      const isSelected = garagePaintSelected === paint.id;
      // register card body as clickable (tap to see info)
      garageButtons.push({ x:px, y:py, w:swW, h:swH-24, action:()=>{ garagePaintSelected = garagePaintSelected===paint.id ? null : paint.id; }, disabled:false });
      // card
      ctx.fillStyle=equipped?'rgba(255,68,221,0.2)':isSelected?'rgba(80,0,120,0.28)':'rgba(255,255,255,0.04)';
      roundedRect(px,py,swW,swH,7); ctx.fill();
      ctx.strokeStyle=equipped?'#ff44dd':isSelected?'#aa44ff':'rgba(255,255,255,0.12)';
      ctx.lineWidth=equipped||isSelected?2:1; roundedRect(px,py,swW,swH,7); ctx.stroke();
      // secret unlock conditions
      const obsidianCondMet   = equippedPaint==='paint_ocean'    && equippedTrail==='trail_fire';
      const mfCondMet         = equippedPaint==='paint_emerald'  && equippedTrail==='trail_money';
      const mcCondMet         = equippedPaint==='paint_dirt'     && equippedTrail==='trail_gamer';
      const conditionMet      = (paint.id==='paint_obsidian' && obsidianCondMet) || (paint.id==='paint_moneyforever' && mfCondMet) || (paint.id==='paint_minecraft' && mcCondMet);
      // secret: fully hidden until condition met, revealed (but unlockable) once condition met
      const _secretIds = ['paint_obsidian','paint_moneyforever','paint_minecraft'];
      const isSecret = _secretIds.includes(paint.id) && !owned_;
      const isSecretRevealed = isSecret && conditionMet; // condition met but not yet owned
      // glowing border when revealed-but-unlockable
      if (isSecretRevealed) {
        ctx.strokeStyle = '#44ff88'; ctx.lineWidth = 2;
        roundedRect(px,py,swW,swH,7); ctx.stroke();
      }
      // color swatch
      const swatchColor=paint.color!=null?'#'+paint.color.toString(16).padStart(6,'0'):'#'+CARS[carIdx].body.toString(16).padStart(6,'0');
      const swX=px+swW/2-18, swY=py+8, swW2=36, swH2=28;
      if(isSecret && !isSecretRevealed){
        // mystery swatch — still hidden
        ctx.fillStyle='#0a0010';
        ctx.beginPath(); ctx.roundRect(swX,swY,swW2,swH2,4); ctx.fill();
        ctx.fillStyle='#440066'; ctx.font='bold 14px system-ui'; ctx.textAlign='center';
        ctx.fillText('?',px+swW/2,swY+swH2/2+5);
      } else if(paint.special==='ocean'){
        // animated water ripple gradient
        const wt=(Date.now()/900)%1;
        const wg=ctx.createLinearGradient(swX,swY,swX+swW2,swY+swH2);
        wg.addColorStop(0,'#1565c0'); wg.addColorStop(wt,'#80deea'); wg.addColorStop(1,'#1976d2');
        ctx.fillStyle=wg;
      } else if(paint.special==='gold'){
        const gg=ctx.createLinearGradient(swX,swY,swX+swW2,swY+swH2);
        gg.addColorStop(0,'#bfa000'); gg.addColorStop(0.4,'#fff176'); gg.addColorStop(0.7,'#ffd54a'); gg.addColorStop(1,'#b8860b');
        ctx.fillStyle=gg;
      } else if(paint.special==='emerald'){
        const eg=ctx.createLinearGradient(swX,swY,swX+swW2,swY+swH2);
        eg.addColorStop(0,'#1b5e20'); eg.addColorStop(0.45,'#69ff47'); eg.addColorStop(1,'#2e7d32');
        ctx.fillStyle=eg;
      } else if(paint.special==='inferno'){
        const ig=ctx.createLinearGradient(swX,swY,swX,swY+swH2);
        ig.addColorStop(0,'#ffee00'); ig.addColorStop(0.5,'#ff6600'); ig.addColorStop(1,'#880000');
        ctx.fillStyle=ig;
      } else if(paint.special==='obsidian'){
        const og=ctx.createLinearGradient(swX,swY,swX+swW2,swY+swH2);
        const ot=(Date.now()/1200)%1;
        og.addColorStop(0,'#0a0010'); og.addColorStop(ot,'#6600aa'); og.addColorStop(1,'#1a0030');
        ctx.fillStyle=og;
      } else if(paint.special==='moneyforever'){
        const mg=ctx.createLinearGradient(swX,swY,swX+swW2,swY+swH2);
        mg.addColorStop(0,'#1b5e20'); mg.addColorStop(0.5,'#66bb6a'); mg.addColorStop(1,'#2e7d32');
        ctx.fillStyle=mg;
      } else if(paint.special==='minecraft'){
        const mcg=ctx.createLinearGradient(swX,swY,swX,swY+swH2);
        mcg.addColorStop(0,'#5d8a1b'); mcg.addColorStop(0.35,'#4a7a10'); mcg.addColorStop(0.36,'#6b4226'); mcg.addColorStop(1,'#4a2e18');
        ctx.fillStyle=mcg;
      } else {
        ctx.fillStyle=swatchColor;
      }
      const _showSwatch = !isSecret || isSecretRevealed;
      if(_showSwatch){ ctx.beginPath(); ctx.roundRect(swX,swY,swW2,swH2,4); ctx.fill(); }
      if(_showSwatch && paint.color==null){ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(swX,swY,swW2,swH2,4);ctx.stroke();}
      // special fx badge
      if(_showSwatch && paint.special){ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.roundRect(swX+swW2-14,swY+1,13,10,2);ctx.fill();ctx.fillStyle='#fff';ctx.font='7px system-ui';ctx.textAlign='left';ctx.fillText('FX',swX+swW2-12,swY+9);}
      // name
      ctx.textAlign='center';
      ctx.fillStyle = isSecretRevealed ? '#44ff88' : isSecret ? '#660099' : '#eee';
      ctx.font='bold 10px system-ui';
      ctx.fillText((isSecret && !isSecretRevealed) ? '??? SECRET' : paint.name, px+swW/2, py+48);
      // cost/owned
      ctx.fillStyle= isSecretRevealed ? '#44ff88' : '#aaa'; ctx.font='9px system-ui';
      ctx.fillText((isSecret && !isSecretRevealed) ? '●'+paint.cost : (paint.cost===0?'FREE':'●'+paint.cost), px+swW/2, py+60);
      // big lock overlay when secret and conditions not met
      const isSecretLocked = (paint.id==='paint_obsidian' || paint.id==='paint_moneyforever' || paint.id==='paint_minecraft') && !owned_ && !conditionMet;
      if (isSecretLocked) {
        ctx.fillStyle='rgba(0,0,0,0.55)';
        roundedRect(px,py,swW,swH,7); ctx.fill();
        ctx.font='28px system-ui'; ctx.textAlign='center';
        ctx.fillText('🔒', px+swW/2, py+swH/2+10);
      }
      // button
      const bw2=swW-12,bh2=18,bx2=px+6,by2=py+swH-22;
      if(equipped){
        garageBtn('ON',bx2,by2,bw2,bh2,null,{active:true,small:true});
      }else if(owned_){
        garageBtn('EQUIP',bx2,by2,bw2,bh2,()=>equipPaint(paint.id),{small:true});
      }else if(conditionMet){
        garageBtn('UNLOCK',bx2,by2,bw2,bh2,()=>{ownItem(paint.id);equipPaint(paint.id);},{small:true});
      }else if(isSecretLocked){
        garageBtn('LOCKED',bx2,by2,bw2,bh2,null,{disabled:true,small:true});
      }else{
        const canAfford=coins>=paint.cost;
        garageBtn('BUY',bx2,by2,bw2,bh2,canAfford?()=>{setCoins(coins-paint.cost);ownItem(paint.id);equipPaint(paint.id);}:null,{disabled:!canAfford,small:true});
      }
    });
    ctx.restore();
  }

  if(garageTab==='trails'){
    const tH=33, gap=3, visibleT=6;
    const maxTS=Math.max(0,SHOP_TRAILS.length-visibleT);
    garageTrailScroll=Math.max(0,Math.min(garageTrailScroll,maxTS));
    if(garageTrailScroll>0){ctx.fillStyle='rgba(255,213,74,0.7)';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('▲',W/2,contentY+6);}
    if(garageTrailScroll<maxTS){ctx.fillStyle='rgba(255,213,74,0.7)';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('▼',W/2,contentY+visibleT*(tH+gap)+4);}
    ctx.save(); ctx.beginPath(); ctx.rect(0,contentY,W,visibleT*(tH+gap)); ctx.clip();
    SHOP_TRAILS.forEach((trail,i)=>{
      if(i<garageTrailScroll||i>=garageTrailScroll+visibleT) return;
      const ty=contentY+(i-garageTrailScroll)*(tH+gap);
      const owned_=isOwned(trail.id);
      const equipped=equippedTrail===trail.id;
      const isSel=garageTrailSelected===trail.id;
      ctx.fillStyle=equipped?'rgba(255,68,221,0.2)':isSel?'rgba(100,200,255,0.12)':'rgba(255,255,255,0.04)';
      roundedRect(14,ty,W-28,tH,7); ctx.fill();
      ctx.strokeStyle=equipped?'#ff44dd':isSel?'#aaddff':'rgba(255,255,255,0.12)';
      ctx.lineWidth=equipped||isSel?2:1; roundedRect(14,ty,W-28,tH,7); ctx.stroke();
      // tap-to-info hit area (left 60% of card)
      garageButtons.push({ x:14, y:ty, w:(W-28)*0.6, h:tH, action:()=>{ garageTrailSelected=garageTrailSelected===trail.id?null:trail.id; }, disabled:false });
      // trail preview (dots)
      for(let d=0;d<6;d++){
        const a=0.15+d*0.14;
        ctx.globalAlpha=a;
        ctx.fillStyle=trail.color;
        ctx.beginPath(); ctx.ellipse(28+d*14,ty+tH/2,4,2.5,0,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
      // name + cost
      ctx.textAlign='left'; ctx.fillStyle='#eee'; ctx.font='bold 11px system-ui';
      ctx.fillText(trail.name,112,ty+12);
      ctx.fillStyle='#aaa'; ctx.font='9px system-ui';
      ctx.fillText(trail.cost===0?'FREE':'● '+trail.cost+' coins',112,ty+23);
      // button
      const bw3=66,bh3=22,bx3=W-14-bw3-4,by3=ty+tH/2-bh3/2;
      if(equipped){
        garageBtn('ACTIVE',bx3,by3,bw3,bh3,null,{active:true,small:true});
      }else if(owned_){
        garageBtn('EQUIP',bx3,by3,bw3,bh3,()=>equipTrail(trail.id),{small:true});
      }else{
        const canAfford=coins>=trail.cost;
        garageBtn('BUY',bx3,by3,bw3,bh3,canAfford?()=>{setCoins(coins-trail.cost);ownItem(trail.id);equipTrail(trail.id);}:null,{disabled:!canAfford,small:true});
      }
    });
    ctx.restore();
  }

  // trail info panel — shown when a trail card is tapped
  if (garageTab === 'trails' && garageTrailSelected) {
    const trailInfos = {
      trail_ice: [
        'Leaves a freezing ice slick behind your car.',
        '⬡ Any enemy that drives into it will lose',
        '   grip and slide out of control in the Arena.',
        '⬡ Ice patches last 2 seconds on the ground.',
      ],
    };
    const lines = trailInfos[garageTrailSelected];
    if (lines) {
      const panH = 14 + lines.length * 16 + 6;
      const panY = H - 48 - panH;
      ctx.fillStyle = 'rgba(0,10,30,0.90)';
      ctx.beginPath(); ctx.roundRect(14, panY, W-28, panH, 7); ctx.fill();
      ctx.strokeStyle = '#aaddff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(14, panY, W-28, panH, 7); ctx.stroke();
      const selTrailName = (SHOP_TRAILS.find(t => t.id === garageTrailSelected) || {}).name || garageTrailSelected;
      ctx.textAlign = 'left'; ctx.fillStyle = '#aaddff'; ctx.font = 'bold 10px system-ui';
      ctx.fillText(selTrailName + '  —  INFO', 22, panY + 13);
      ctx.fillStyle = '#ddd'; ctx.font = '9.5px system-ui';
      for (let li = 0; li < lines.length; li++) {
        ctx.fillText(lines[li], 22, panY + 26 + li * 16);
      }
    }
  }

  // paint info panel — shown when a paint card is tapped
  if (garageTab === 'paint' && garagePaintSelected) {
    const infos = {
      paint_obsidian: [
        'One of the most secret paints.',
        'Try to find more secrets hidden in the game.',
        '⬡ Stops Arena enemies for 2 seconds on collision.',
        '⬡ Infects Arena tiles with a spreading virus,',
        '   consuming more space over time.',
      ],
      paint_obsidian_locked: [
        '??? Secret paint.',
        'Figure out how to unlock it yourself.',
      ],
      paint_moneyforever: [
        'Car plastered with $100 bills.',
        '⬡ Touch any enemy → after 1.5s ALL cars panic and',
        '   flee to the outer edge for 2 seconds, then',
        '   recover and start fighting again.',
        '⬡ 3 charges per game · 7s cooldown.',
      ],
      paint_moneyforever_locked: [
        '??? Secret paint.',
        'Figure out how to unlock it yourself.',
      ],
      paint_minecraft: [
        'A legendary secret found deep in the game.',
        'Green grass on top. Dirt underneath.',
        '⬡ A rare badge of honour — no special ability,',
        '   just pure style for the dedicated.',
      ],
      paint_minecraft_locked: [
        '??? Secret paint.',
        'Figure out how to unlock it yourself.',
      ],
    };
    const _selPaint = SHOP_PAINTS.find(p => p.id === garagePaintSelected);
    const _selOwned = _selPaint && isOwned(_selPaint.id);
    const _isSecretPaint = _selPaint && (_selPaint.id === 'paint_obsidian' || _selPaint.id === 'paint_moneyforever' || _selPaint.id === 'paint_minecraft');
    const _infoKey = (_isSecretPaint && !_selOwned) ? garagePaintSelected + '_locked' : garagePaintSelected;
    const lines = infos[_infoKey];
    if (lines) {
      const panH = 14 + lines.length * 16 + 6;
      const panY = H - 48 - panH;
      ctx.fillStyle = 'rgba(10,0,20,0.88)';
      ctx.beginPath(); ctx.roundRect(14, panY, W-28, panH, 7); ctx.fill();
      ctx.strokeStyle = '#6600aa'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(14, panY, W-28, panH, 7); ctx.stroke();
      const selectedPaintName = (SHOP_PAINTS.find(p => p.id === garagePaintSelected) || {}).name || garagePaintSelected;
      ctx.textAlign = 'left'; ctx.fillStyle = '#cc88ff'; ctx.font = 'bold 10px system-ui';
      ctx.fillText(selectedPaintName + '  —  INFO', 22, panY + 13);
      ctx.fillStyle = '#ddd'; ctx.font = '9.5px system-ui';
      for (let li = 0; li < lines.length; li++) {
        ctx.fillText(lines[li], 22, panY + 26 + li * 16);
      }
    }
  }

  // back button
  const backW=120,backH=32,backX=W/2-60,backY=H-42;
  garageBtn('← BACK',backX,backY,backW,backH,()=>{state=STATE.MENU;});
  ctx.textAlign='left';
}

function drawGemShop() {
  const CHESTS = [
    { id:'common',    name:'COMMON',    cost:10,    color:'#9e9e9e', emoji:'📦' },
    { id:'uncommon',  name:'UNCOMMON',  cost:50,    color:'#4caf50', emoji:'🟩' },
    { id:'rare',      name:'RARE',      cost:200,   color:'#4fc3f7', emoji:'🔷' },
    { id:'epic',      name:'EPIC',      cost:500,   color:'#cc44ff', emoji:'🔮' },
    { id:'legendary', name:'LEGENDARY', cost:1000,  color:'#ffd700', emoji:'⭐' },
  ];
  function rollChest(id) {
    // probability per tier per chest (each splits evenly across engine/wheels/brakes)
    // tier numbers: 1 COMMON, 2 UNCOMMON, 3 RARE, 4 EPIC, 5 LEGENDARY
    const TP = {
      common:    { 2: 0.30, 1: 0.70 },
      uncommon:  { 3: 0.40, 1: 0.60 },
      rare:      { 4: 0.30, 3: 0.40, 1: 0.30 },
      epic:      { 5: 0.10, 4: 0.45, 3: 0.25, 1: 0.20 },
      legendary: { 5: 0.30, 4: 0.40, 3: 0.20, 1: 0.10 },
    };
    const COMPONENTS = ['engine','wheels','brakes'];
    const probs = TP[id] || TP.common;
    let r = Math.random();
    for (const tierKey of Object.keys(probs)) {
      const tier = +tierKey;
      const slice = probs[tierKey] / 3;
      for (let i = 0; i < 3; i++) {
        if (r < slice) return { type: COMPONENTS[i], tier };
        r -= slice;
      }
    }
    return { type: 'coins', amount: 200 }; // safety fallback
  }

  const GEM_DEALS = [
    { coins:500,   gems:1,  label:'1 GEM'   },
    { coins:1500,  gems:3,  label:'3 GEMS'  },
    { coins:2500,  gems:5,  label:'5 GEMS'  },
    { coins:5000,  gems:10, label:'10 GEMS' },
  ];
  const rowH=64, rowGap=5, rowW=W-28, rowX=14;
  const gemRowH=52, gemRowGap=5;
  const sectionLabelH=30;
  const totalContentH = CHESTS.length*(rowH+rowGap) + sectionLabelH + GEM_DEALS.length*(gemRowH+gemRowGap);
  const contentTop=72, contentBot=H-44, contentH=contentBot-contentTop;
  const maxScroll=Math.max(0, totalContentH-contentH);
  shopScroll=Math.min(shopScroll,maxScroll);

  ctx.fillStyle='rgba(0,0,0,0.94)'; ctx.fillRect(0,0,W,H);
  // fixed header
  ctx.textAlign='center';
  ctx.font='bold 26px system-ui'; ctx.fillStyle='#ffd54a';
  ctx.fillText('SHOP', W/2, 34);
  ctx.font='bold 13px system-ui'; ctx.fillStyle='#ffd54a';
  ctx.fillText('● '+coins.toLocaleString(), W/2-40, 56);
  ctx.fillStyle='#b39ddb'; ctx.fillText('◆ '+gems, W/2+40, 56);
  // scroll hints
  if(shopScroll>0){ ctx.fillStyle='rgba(255,213,74,0.6)'; ctx.font='13px system-ui'; ctx.fillText('▲', W/2, contentTop+8); }
  if(shopScroll<maxScroll){ ctx.fillStyle='rgba(255,213,74,0.6)'; ctx.font='13px system-ui'; ctx.fillText('▼', W/2, contentBot-4); }

  gemShopButtons=[];
  ctx.save(); ctx.beginPath(); ctx.rect(0,contentTop,W,contentH); ctx.clip();

  let relY=0; // relative y within scrollable content
  // ---- CHESTS ----
  CHESTS.forEach((chest,i)=>{
    const ry=contentTop+relY-shopScroll;
    if(ry+rowH>contentTop && ry<contentBot){
      const canAfford=gems>=chest.cost;
      const hov=mouse.x>=rowX&&mouse.x<=rowX+rowW&&mouse.y>=ry&&mouse.y<=ry+rowH&&canAfford;
      ctx.fillStyle=canAfford?(hov?'rgba(255,255,255,0.09)':'rgba(255,255,255,0.04)'):'rgba(20,20,30,0.7)';
      ctx.beginPath(); ctx.roundRect(rowX,ry,rowW,rowH,8); ctx.fill();
      ctx.strokeStyle=canAfford?chest.color:'#2a2a3a'; ctx.lineWidth=canAfford?1.5:1;
      ctx.beginPath(); ctx.roundRect(rowX,ry,rowW,rowH,8); ctx.stroke();
      ctx.fillStyle=canAfford?chest.color+'28':'#ffffff0a';
      ctx.beginPath(); ctx.roundRect(rowX+6,ry+8,48,rowH-16,6); ctx.fill();
      ctx.font='20px system-ui'; ctx.textAlign='center';
      ctx.fillText(chest.emoji, rowX+30, ry+rowH/2+7);
      ctx.textAlign='left';
      ctx.font='bold 13px system-ui'; ctx.fillStyle=canAfford?chest.color:'#444';
      ctx.fillText(chest.name, rowX+62, ry+22);
      ctx.font='9px system-ui'; ctx.fillStyle=canAfford?'#888':'#333';
      ctx.fillText('Engine · Wheels · Brakes  or  Coins  —  goes to inventory', rowX+62, ry+36);
      const invCount=(upgradeInventory.engine||[]).length+(upgradeInventory.wheels||[]).length+(upgradeInventory.brakes||[]).length;
      if(invCount>0){ ctx.fillStyle='#555'; ctx.font='9px system-ui'; ctx.fillText('inventory: '+invCount+' item'+(invCount===1?'':'s'), rowX+62, ry+50); }
      const btnW=84,btnH=30,btnX=rowX+rowW-btnW-8,btnY=ry+rowH/2-btnH/2;
      ctx.fillStyle=canAfford?(hov?'rgba(255,213,74,1)':'rgba(255,213,74,0.85)'):'rgba(35,35,45,0.9)';
      ctx.beginPath(); ctx.roundRect(btnX,btnY,btnW,btnH,5); ctx.fill();
      ctx.textAlign='center'; ctx.font='bold 10px system-ui'; ctx.fillStyle=canAfford?'#111':'#333';
      ctx.fillText('◆ '+chest.cost.toLocaleString(), btnX+btnW/2, btnY+12);
      ctx.font='bold 9px system-ui'; ctx.fillStyle=canAfford?'#222':'#333';
      ctx.fillText('OPEN CHEST', btnX+btnW/2, btnY+23);
      if(canAfford){ gemShopButtons.push({x:rowX,y:ry,w:rowW,h:rowH,action:()=>{
        addGems(-chest.cost); addQP('chests_5',1);
        const res=rollChest(chest.id);
        if(res.type==='coins'){ setCoins(coins+res.amount); shopResult={type:'coins',amount:res.amount,chestName:chest.name,chestColor:chest.color}; }
        else{ addToInventory(res.type,res.tier); shopResult={type:res.type,tier:res.tier,tierName:TIER_NAMES[res.tier],tierColor:TIER_COLORS[res.tier],bonusPct:Math.round(UPGRADE_BONUS[res.tier]*100),chestName:chest.name,chestColor:chest.color}; }
      }}); }
    }
    relY+=rowH+rowGap;
  });

  // ---- GEMS SECTION ----
  const secY=contentTop+relY-shopScroll;
  if(secY+sectionLabelH>contentTop && secY<contentBot){
    ctx.textAlign='left'; ctx.fillStyle='#b39ddb'; ctx.font='bold 11px system-ui';
    ctx.fillText('◆  GEMS  —  spend coins to buy gems for premium cars', rowX, secY+20);
  }
  relY+=sectionLabelH;
  GEM_DEALS.forEach((deal)=>{
    const ry=contentTop+relY-shopScroll;
    if(ry+gemRowH>contentTop && ry<contentBot){
      const canAfford=coins>=deal.coins;
      const hov=canAfford&&mouse.x>=rowX&&mouse.x<=rowX+rowW&&mouse.y>=ry&&mouse.y<=ry+gemRowH;
      ctx.fillStyle=canAfford?(hov?'rgba(179,157,219,0.20)':'rgba(179,157,219,0.09)'):'rgba(20,20,30,0.7)';
      ctx.beginPath(); ctx.roundRect(rowX,ry,rowW,gemRowH,7); ctx.fill();
      ctx.strokeStyle=canAfford?'#b39ddb':'#2a2a3a'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(rowX,ry,rowW,gemRowH,7); ctx.stroke();
      ctx.textAlign='left'; ctx.font='bold 16px system-ui'; ctx.fillStyle=canAfford?'#b39ddb':'#444';
      ctx.fillText('◆'.repeat(Math.min(deal.gems,5))+(deal.gems>5?'…':''), rowX+12, ry+gemRowH/2+6);
      ctx.textAlign='right'; ctx.font='bold 13px system-ui'; ctx.fillStyle=canAfford?'#fff':'#555';
      ctx.fillText(deal.label, rowX+rowW-12, ry+20);
      ctx.font='11px system-ui'; ctx.fillStyle=canAfford?'#ffd54a':'#444';
      ctx.fillText('● '+deal.coins.toLocaleString(), rowX+rowW-12, ry+36);
      if(canAfford) gemShopButtons.push({x:rowX,y:ry,w:rowW,h:gemRowH,action:()=>{ setCoins(coins-deal.coins); addGems(deal.gems); }});
    }
    relY+=gemRowH+gemRowGap;
  });

  ctx.restore();

  // fixed back button
  const backW=130,backH=32,backX=(W-backW)/2,backY=H-40;
  const backHov=mouse.x>=backX&&mouse.x<=backX+backW&&mouse.y>=backY&&mouse.y<=backY+backH;
  ctx.fillStyle=backHov?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.07)';
  ctx.beginPath(); ctx.roundRect(backX,backY,backW,backH,6); ctx.fill();
