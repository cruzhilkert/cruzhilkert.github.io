// road texture
function makeRoadTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 1024;
  const r = c.getContext('2d');
  r.fillStyle = '#3a3a3a'; r.fillRect(0,0,256,1024);
  // alternating bands
  r.fillStyle = '#454545';
  for (let i = 0; i < 1024; i += 80) if ((Math.floor(i/80)%2)===0) r.fillRect(0,i,256,40);
  // dashed lane stripes (LANE_COUNT - 1 stripes)
  r.fillStyle = '#ffd54a';
  for (let s = 1; s < LANE_COUNT; s++) {
    const sx = (256 / LANE_COUNT) * s;
    for (let i = 0; i < 1024; i += 80) r.fillRect(sx - 4, i, 8, 40);
  }
  // rumble strips
  r.fillStyle = '#ffffff';
  for (let i = 0; i < 1024; i += 60) {
    if ((Math.floor(i/60)%2)===0) {
      r.fillRect(0, i, 6, 30);
      r.fillRect(250, i, 6, 30);
    } else {
      r.fillStyle = '#cc1f1f';
      r.fillRect(0, i, 6, 30);
      r.fillRect(250, i, 6, 30);
      r.fillStyle = '#ffffff';
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

const arenaGroup = new THREE.Group();

// bot colours and starting positions (120° apart, radius 7)

let nitroTime = 0;           // ms of active boost remaining
let skidMarks = []; // { wx, wy, wz, life, maxLife }

function buildArena() {
  for (const t of arenaTiles) arenaGroup.remove(t.mesh);
  arenaTiles.length = 0;
  for (let q = -HEX_RADIUS; q <= HEX_RADIUS; q++) {
    for (let r = -HEX_RADIUS; r <= HEX_RADIUS; r++) {
      const s = -q - r;
      if (Math.abs(s) > HEX_RADIUS) continue;
      const x = HEX_SIZE * 1.5 * q;
      const z = HEX_SIZE * Math.sqrt(3) * (r + q / 2);
      const hex = new THREE.Mesh(
        arenaTileGeom,
        new THREE.MeshLambertMaterial({ color: 0xffffff })
      );
      hex.rotation.y = Math.PI / 6;
      hex.position.set(x, 0, z);
      arenaGroup.add(hex);
      arenaTiles.push({ mesh: hex, x, z, state: 'alive', timer: 0 });
    }
  }
}

function arenaTileAt(x, z) {
  let nearest = null, bestDist = Infinity;
  for (const t of arenaTiles) {
    const dx = x - t.x, dz = z - t.z;
    const d = dx * dx + dz * dz;
    if (d < bestDist) { bestDist = d; nearest = t; }
  }
  if (Math.sqrt(bestDist) < HEX_SIZE * 0.95) return nearest;
  return null;
}

// ===== car builder =====
function buildCar(opts) {
  const { kind = 'sedan', color = 0xff4444, accent = 0x222222, isPlayer = false } = opts;
  const g = new THREE.Group();

  // l=length w=width gc=ground-clearance lh=lower-body-height ch=cabin-height
  // cw=cabin-width cl=cabin-length cz=cabin Z offset from car centre
  const S = {
    sedan: { l:4.2, w:1.82, gc:0.16, lh:0.52, ch:0.50, cw:1.72, cl:2.02, cz:-0.12 },
    sport: { l:4.0, w:1.90, gc:0.13, lh:0.44, ch:0.40, cw:1.78, cl:1.66, cz:-0.06 },
    hatch: { l:3.8, w:1.76, gc:0.16, lh:0.54, ch:0.56, cw:1.66, cl:2.28, cz:-0.20 },
    van:   { l:4.5, w:1.92, gc:0.20, lh:0.68, ch:0.80, cw:1.86, cl:3.20, cz:-0.10 },
    truck: { l:5.0, w:2.20, gc:0.26, lh:0.78, ch:0.70, cw:2.04, cl:1.70, cz: 0.80 },
    f1:    { l:5.2, w:1.78, gc:0.06, lh:0.28, ch:0.28, cw:0.58, cl:0.88, cz:-0.18 },
  }[kind] || { l:4.2, w:1.82, gc:0.16, lh:0.52, ch:0.50, cw:1.72, cl:2.02, cz:-0.12 };

  const { l, w, gc, lh, ch, cw, cl, cz } = S;
  const wl = gc + lh;   // window-line Y (top of lower body = bottom of cabin)
  const rl = wl + ch;   // roof-line Y
  const wr = 0.34;      // wheel radius
  const ww = 0.22;      // wheel width

  // keep a compat dim object so the rest of the codebase doesn't break
  const dim = { l, w, h: lh + ch, roofL: cl, roofW: cw, roofH: ch, roofZ: cz };

  // ── Materials ─────────────────────────────────────────────────────────────────
  const bodyMat    = new THREE.MeshPhongMaterial({ color, shininess:100, specular:0x334466 });
  const accentMat  = new THREE.MeshPhongMaterial({ color:accent, shininess:60 });
  const glassMat   = new THREE.MeshPhongMaterial({ color:0x0e1820, shininess:120, transparent:true, opacity:0.88 });
  const darkMat    = new THREE.MeshLambertMaterial({ color:0x0e0e0e });
  const tireMat    = new THREE.MeshLambertMaterial({ color:0x111111 });
  const rimMat     = new THREE.MeshPhongMaterial({ color:0xe4e4e4, shininess:90 });
  const caliperMat = new THREE.MeshLambertMaterial({ color:0xcc1111 });
  const lightMat   = new THREE.MeshBasicMaterial({ color:0xfffae0 });
  const tailMat    = new THREE.MeshBasicMaterial({ color:0xff1818 });

  // ── Lower body (chassis) — full car length & width ────────────────────────────
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, lh, l), bodyMat);
  body.position.y = gc + lh / 2;
  g.add(body);

  // ── Cabin — sits flush on top of lower body ────────────────────────────────────
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(cw, ch, cl), bodyMat);
  cabin.position.set(0, wl + ch / 2, cz);
  g.add(cabin);

  // ── Roof panel (thin cap) ──────────────────────────────────────────────────────
  const roof = new THREE.Mesh(new THREE.BoxGeometry(cw, 0.05, cl), bodyMat);
  roof.position.set(0, rl - 0.02, cz);
  g.add(roof);

  // ── Glass ─────────────────────────────────────────────────────────────────────
  let glass = null;
  if (kind !== 'truck' && kind !== 'f1') {
    const wsH = ch * 0.82;
    const wsAngle = kind === 'van' ? -0.08 : kind === 'sport' ? -0.42 : -0.30;
    const ws = new THREE.Mesh(new THREE.BoxGeometry(cw * 0.86, wsH, 0.05), glassMat);
    ws.position.set(0, wl + wsH * 0.5 + ch * 0.03, cz + cl / 2);
    ws.rotation.x = wsAngle;
    g.add(ws);
    glass = ws;

    const rwH = ch * (kind === 'hatch' ? 0.88 : 0.72);
    const rw = new THREE.Mesh(new THREE.BoxGeometry(cw * 0.80, rwH, 0.05), glassMat);
    rw.position.set(0, wl + rwH * 0.5 + ch * 0.06, cz - cl / 2);
    rw.rotation.x = kind === 'hatch' ? 0.50 : 0.28;
    g.add(rw);

    for (const sx of [-1, 1]) {
      const sw = new THREE.Mesh(new THREE.BoxGeometry(0.05, ch * 0.70, cl * 0.78), glassMat);
      sw.position.set(sx * (cw / 2 + 0.01), wl + ch * 0.42, cz);
      g.add(sw);
    }
  }

  // ── Wheels ─────────────────────────────────────────────────────────────────────
  const wxOff = w / 2 + ww / 2 - 0.04;
  for (const wx of [-wxOff, wxOff]) {
    for (const wz of [l / 2 - 0.76, -l / 2 + 0.76]) {
      const wg = new THREE.Group();
      wg.position.set(wx, wr, wz);

      const tire = new THREE.Mesh(new THREE.CylinderGeometry(wr, wr, ww, 20), tireMat);
      tire.rotation.z = Math.PI / 2;
      wg.add(tire);

      const rim = new THREE.Mesh(new THREE.CylinderGeometry(wr * 0.72, wr * 0.72, ww + 0.01, 20), rimMat);
      rim.rotation.z = Math.PI / 2;
      wg.add(rim);

      for (let i = 0; i < 10; i++) {
        const spoke = new THREE.Mesh(new THREE.BoxGeometry(wr * 1.2, 0.04, 0.034), rimMat);
        spoke.rotation.x = (i / 10) * Math.PI * 2;
        wg.add(spoke);
      }

      const cal = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.15, 0.10), caliperMat);
      cal.position.set(wx < 0 ? 0.07 : -0.07, 0.07, 0);
      wg.add(cal);

      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, ww + 0.02, 8), rimMat);
      hub.rotation.z = Math.PI / 2;
      wg.add(hub);

      g.add(wg);
    }
  }

  // ── Lights ─────────────────────────────────────────────────────────────────────
  let tailLeft = null, tailRight = null, brakeStrip = null;
  if (isPlayer) {
    const tailBar = new THREE.Mesh(new THREE.BoxGeometry(w * 0.70, 0.05, 0.07), tailMat);
    tailBar.position.set(0, wl - 0.09, -l / 2 - 0.01);
    g.add(tailBar);
    for (const sx of [-1, 1]) {
      const tl = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.20, 0.07), tailMat);
      tl.position.set(sx * (w / 2 - 0.17), wl - 0.20, -l / 2 - 0.01);
      g.add(tl);
      if (sx === -1) tailLeft = tl; else tailRight = tl;
    }
    brakeStrip = new THREE.Mesh(new THREE.BoxGeometry(w * 0.48, 0.05, 0.06),
      new THREE.MeshBasicMaterial({ color:0xff5050 }));
    brakeStrip.position.set(0, wl - 0.03, -l / 2 - 0.01);
    g.add(brakeStrip);
  } else {
    for (const sx of [-1, 1]) {
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.06, 0.07), lightMat);
      hl.position.set(sx * (w / 2 - 0.23), wl - 0.09, l / 2 + 0.01);
      g.add(hl);
      const drl = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.04, 0.06), lightMat);
      drl.position.set(sx * (w / 2 - 0.23), wl - 0.21, l / 2 + 0.01);
      g.add(drl);
    }
    const grilleBg   = new THREE.MeshLambertMaterial({ color:0x080808 });
    const grilleEdge = new THREE.MeshLambertMaterial({ color:0x222222 });
    const gH = lh * 0.52, gW = w * 0.20;
    for (const sx of [-1, 1]) {
      const gx = sx * w * 0.14, gY = gc + lh * 0.40;
      const frame = new THREE.Mesh(new THREE.BoxGeometry(gW + 0.08, gH + 0.07, 0.09), grilleEdge);
      frame.position.set(gx, gY, l / 2 + 0.01);
      g.add(frame);
      const fill = new THREE.Mesh(new THREE.BoxGeometry(gW, gH, 0.09), grilleBg);
      fill.position.set(gx, gY, l / 2 + 0.015);
      g.add(fill);
      for (let b = 0; b < 4; b++) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(gW - 0.02, 0.025, 0.10), grilleEdge);
        bar.position.set(gx, gY - gH / 2 + (b + 0.8) * gH / 4.5, l / 2 + 0.015);
        g.add(bar);
      }
    }
    const intake = new THREE.Mesh(new THREE.BoxGeometry(w * 0.66, 0.09, 0.07),
      new THREE.MeshLambertMaterial({ color:0x0a0a0a }));
    intake.position.set(0, gc + 0.07, l / 2 + 0.01);
    g.add(intake);
  }

  // ── Bumpers — body-coloured, flush with front/rear faces ──────────────────────
  const frontBumper = new THREE.Mesh(new THREE.BoxGeometry(w + 0.06, lh * 0.36, 0.14), bodyMat);
  frontBumper.position.set(0, gc + lh * 0.18, l / 2 + 0.07);
  frontBumper.userData.initY = frontBumper.position.y;
  g.add(frontBumper);

  const rearBumper = new THREE.Mesh(new THREE.BoxGeometry(w + 0.06, lh * 0.32, 0.13), bodyMat);
  rearBumper.position.set(0, gc + lh * 0.16, -l / 2 - 0.06);
  g.add(rearBumper);

  // ── Side skirts ───────────────────────────────────────────────────────────────
  const skirtH = lh * 0.22;
  const skirtL = new THREE.Mesh(new THREE.BoxGeometry(0.05, skirtH, l * 0.76), accentMat);
  skirtL.position.set(-w / 2 - 0.015, gc + skirtH / 2, 0);
  g.add(skirtL);
  const skirtR = new THREE.Mesh(new THREE.BoxGeometry(0.05, skirtH, l * 0.76), accentMat);
  skirtR.position.set(w / 2 + 0.015, gc + skirtH / 2, 0);
  g.add(skirtR);

  // ── Mirrors — mounted on cabin sides ─────────────────────────────────────────
  const mirrorMat = new THREE.MeshLambertMaterial({ color:0x111111 });
  const mirrorL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.11, 0.18), mirrorMat);
  mirrorL.position.set(-cw / 2 - 0.06, wl + ch * 0.78, cz + cl * 0.32);
  g.add(mirrorL);
  const mirrorR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.11, 0.18), mirrorMat);
  mirrorR.position.set(cw / 2 + 0.06, wl + ch * 0.78, cz + cl * 0.32);
  g.add(mirrorR);

  // ── Exhaust ────────────────────────────────────────────────────────────────────
  const exMat  = new THREE.MeshLambertMaterial({ color:0x888888 });
  const exGeom = new THREE.CylinderGeometry(0.055, 0.055, 0.16, 8);
  for (const exX of [w * 0.22, w * 0.34]) {
    const pipe = new THREE.Mesh(exGeom, exMat);
    pipe.rotation.x = Math.PI / 2;
    pipe.position.set(exX, gc + 0.04, -l / 2 - 0.07);
    g.add(pipe);
  }

  // ── License plate ─────────────────────────────────────────────────────────────
  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.13, 0.03),
    new THREE.MeshBasicMaterial({ color:0xe0e0e0 }));
  plate.position.set(0, gc + lh * 0.28, isPlayer ? -l / 2 - 0.07 : l / 2 + 0.07);
  g.add(plate);

  // ── Truck trailer ─────────────────────────────────────────────────────────────
  if (kind === 'truck') {
    const tl = 5.5;
    const trailer = new THREE.Mesh(new THREE.BoxGeometry(w * 0.95, (lh + ch) * 0.85, tl),
      new THREE.MeshLambertMaterial({ color:0xcccccc }));
    trailer.position.set(0, gc + (lh + ch) * 0.425, -l / 2 - tl / 2 - 0.25);
    g.add(trailer);
    const txOff = w / 2 + ww / 2 - 0.04;
    for (const tx of [-txOff, txOff]) {
      for (const tz of [-l / 2 - 1.5, -l / 2 - 4.5]) {
        const tw = new THREE.Mesh(new THREE.CylinderGeometry(wr, wr, ww, 12), tireMat);
        tw.rotation.z = Math.PI / 2;
        tw.position.set(tx, wr, tz);
        g.add(tw);
      }
    }
  }

  // ── F1 car extras: front wing, rear wing, halo, sidepods, airbox ──────────────
  if (kind === 'f1') {
    const carbonMat = new THREE.MeshPhongMaterial({ color: accent, shininess: 120 });
    const f1BodyMat = new THREE.MeshPhongMaterial({ color, shininess: 140 });
    // front wing — wide flat plane at nose
    const fwMain = new THREE.Mesh(new THREE.BoxGeometry(w * 1.55, 0.04, 0.50), carbonMat);
    fwMain.position.set(0, gc + 0.06, l / 2 + 0.12);
    g.add(fwMain);
    // front wing end plates
    for (const sx of [-1, 1]) {
      const fwEp = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.14, 0.52), carbonMat);
      fwEp.position.set(sx * w * 0.79, gc + 0.10, l / 2 + 0.12);
      g.add(fwEp);
    }
    // front wing second flap
    const fwFlap = new THREE.Mesh(new THREE.BoxGeometry(w * 1.40, 0.035, 0.28), f1BodyMat);
    fwFlap.position.set(0, gc + 0.12, l / 2 + 0.04);
    g.add(fwFlap);
    // sidepods (two rectangular pods flanking the cockpit)
    for (const sx of [-1, 1]) {
      const pod = new THREE.Mesh(new THREE.BoxGeometry(0.28, lh * 0.90, l * 0.40), f1BodyMat);
      pod.position.set(sx * (w / 2 + 0.10), gc + lh * 0.45, -0.05);
      g.add(pod);
    }
    // airbox — intake scoop above cockpit
    const airbox = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.20, 0.30), carbonMat);
    airbox.position.set(0, wl + ch * 0.70, cz + cl * 0.15);
    g.add(airbox);
    // halo bar — U-shaped safety bar over cockpit (3 segments)
    const haloMat = new THREE.MeshPhongMaterial({ color: 0xd4af37, shininess: 130 });
    const haloTop = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.05, 0.60), haloMat);
    haloTop.position.set(0, wl + ch + 0.08, cz);
    g.add(haloTop);
    for (const sx of [-1, 1]) {
      const haloPillar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.26, 0.06), haloMat);
      haloPillar.position.set(sx * 0.22, wl + ch - 0.04, cz);
      g.add(haloPillar);
    }
    // rear wing main plane
    const rwMain = new THREE.Mesh(new THREE.BoxGeometry(w * 1.14, 0.05, 0.44), carbonMat);
    rwMain.position.set(0, wl + ch + 0.30, -l / 2 + 0.30);
    g.add(rwMain);
    // rear wing second flap
    const rwFlap = new THREE.Mesh(new THREE.BoxGeometry(w * 1.10, 0.04, 0.22), f1BodyMat);
    rwFlap.position.set(0, wl + ch + 0.20, -l / 2 + 0.22);
    g.add(rwFlap);
    // rear wing end plates
    for (const sx of [-1, 1]) {
      const rwEp = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.44, 0.52), carbonMat);
      rwEp.position.set(sx * w * 0.58, wl + ch + 0.14, -l / 2 + 0.26);
      g.add(rwEp);
    }
    // rear wing struts
    for (const sx of [-1, 1]) {
      const strut = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.36, 0.05), carbonMat);
      strut.position.set(sx * w * 0.22, wl + ch - 0.08, -l / 2 + 0.26);
      g.add(strut);
    }
    // visor (replaces windshield — thin strip at cockpit rim)
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.08, 0.05),
      new THREE.MeshPhongMaterial({ color: 0x003366, shininess: 200, transparent: true, opacity: 0.82 }));
    visor.position.set(0, wl + ch * 0.92, cz + cl / 2 + 0.02);
    g.add(visor);
  }

  // ── userData ──────────────────────────────────────────────────────────────────
  g.userData = {
    dim, body, roof, glass,
    frontBumper, rearBumper,
    mirrorL, mirrorR,
    skirtL, skirtR,
    tailLeft, tailRight, brakeStrip,
    plate,
    stripe: null,
    bodyMat, kind,
  };
  return g;
}

function applyDamageVisual(group, dmgLevel) {
  const d = Math.max(0, Math.min(1, dmgLevel));
  const u = group.userData;
  // body color darken
  const baseColor = new THREE.Color(getPlayerBodyColor());
  baseColor.multiplyScalar(1 - d * 0.5);
  u.bodyMat.color.copy(baseColor);
  // mirrors snap off
  if (u.mirrorL) u.mirrorL.visible = d < 0.6;
  if (u.mirrorR) u.mirrorR.visible = d < 0.8;
  // bumper hangs / tears off
  if (u.frontBumper) {
    u.frontBumper.rotation.x = d * 0.6;
    u.frontBumper.position.y = (u.frontBumper.userData.initY ?? 0.26) - d * 0.15;
    u.frontBumper.visible = d < 0.95;
  }
  if (u.rearBumper) {
    u.rearBumper.rotation.x = -d * 0.5;
    u.rearBumper.visible = d < 0.92;
  }
  // tail lights die
  if (u.tailLeft) u.tailLeft.visible = d < 0.5;
  if (u.tailRight) u.tailRight.visible = d < 0.75;
  if (u.brakeStrip) u.brakeStrip.visible = d < 0.6;
  // roof tilts at extreme damage
  if (u.roof) u.roof.rotation.x = d > 0.6 ? (d - 0.6) * 0.4 : 0;
  if (u.glass) u.glass.rotation.x = d > 0.6 ? (d - 0.6) * 0.4 : 0;
  // plate falls off

let audioCtx=null, engineOsc=null, engineGain=null, engineFilter=null, engineSub=null, engineSubGain=null;
function initAudio() {
  if (audioCtx) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
    engineOsc = audioCtx.createOscillator(); engineOsc.type = 'sawtooth'; engineOsc.frequency.value = 55;
    engineFilter = audioCtx.createBiquadFilter(); engineFilter.type = 'lowpass'; engineFilter.frequency.value = 700;
    engineGain = audioCtx.createGain(); engineGain.gain.value = 0.0001;
    engineOsc.connect(engineFilter); engineFilter.connect(engineGain); engineGain.connect(audioCtx.destination);
    engineOsc.start();
    engineSub = audioCtx.createOscillator(); engineSub.type = 'sine'; engineSub.frequency.value = 40;
    engineSubGain = audioCtx.createGain(); engineSubGain.gain.value = 0.0001;
    engineSub.connect(engineSubGain); engineSubGain.connect(audioCtx.destination);
    engineSub.start();
  } catch(e) { audioCtx = null; }
}
function ensureAudio() { if (!audioCtx) initAudio(); if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
function updateAudio() {
  if (!audioCtx) return;
  const playing = state === STATE.PLAYING;
  const idle = playing ? speed * 6 : 200; // map to feel
  const tFreq = 45 + idle / 14;
  const sFreq = 30 + idle / 60;
  const cutoff = 500 + idle * 0.35;
  const tGain = playing ? 0.07 : 0.025;
  const sGain = playing ? 0.05 : 0.018;
  const t = audioCtx.currentTime;
  engineOsc.frequency.setTargetAtTime(tFreq, t, 0.06);
  engineSub.frequency.setTargetAtTime(sFreq, t, 0.08);
  engineFilter.frequency.setTargetAtTime(cutoff, t, 0.08);
  engineGain.gain.setTargetAtTime(tGain, t, 0.08);
  engineSubGain.gain.setTargetAtTime(sGain, t, 0.08);
}
function playCrashSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * 0.6);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) { const env = Math.pow(1 - i/len, 1.6); d[i] = (Math.random()*2-1) * env; }
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const filt = audioCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value = 800;
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  src.connect(filt); filt.connect(g); g.connect(audioCtx.destination); src.start(t);
  const o = audioCtx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.45);
  const og = audioCtx.createGain(); og.gain.setValueAtTime(0.45, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
  o.connect(og); og.connect(audioCtx.destination); o.start(t); o.stop(t + 0.6);
}

function randomAliveTilePos() {

function updateBot(bot, dt) {
  if (bot.frozenTimer > 0) { bot.frozenTimer -= dt; return; }
  const dts = dt / 1000;
  bot.jumpCooldown = Math.max(0, bot.jumpCooldown - dt);

  // level-scaled parameters
  const botTopSpeed   = 15 + arenaLevel * 2;                             // 17→35
  const jumpProb      = 0.28 + arenaLevel * 0.065;                       // 0.35→0.93
  const chaseProb     = Math.max(0, (arenaLevel - 3) / 7);               // 0 at L1-3, 1.0 at L10
  const lookAhead     = 3 + arenaLevel * 0.4;                            // 3.4→7
  const targetRefresh = Math.max(700, 3400 - arenaLevel * 270);          // 3130→1030 ms
  const jumpCooldownT = Math.max(500, 1600 - arenaLevel * 110);          // 1490→500 ms

  // pick a new target when old one is reached or timer expires
  bot.targetTimer -= dt;
  const tdx = bot.targetX - bot.x, tdz = bot.targetZ - bot.z;
  if (bot.targetTimer <= 0 || (tdx*tdx + tdz*tdz) < 4) {
    if (Math.random() < chaseProb) {
      // chase player with slight random offset
      const spread = Math.max(0.5, 5 - arenaLevel * 0.4);
      bot.targetX = arenaPlayer.x + (Math.random()-0.5) * spread;
      bot.targetZ = arenaPlayer.z + (Math.random()-0.5) * spread;
    } else {
      const pos = randomAliveTilePos();
      bot.targetX = pos.x + (Math.random()-0.5) * 6;
      bot.targetZ = pos.z + (Math.random()-0.5) * 6;
    }
    bot.targetTimer = targetRefresh * (0.7 + Math.random() * 0.6);
  }

  // steer toward target
  const angleToTarget = Math.atan2(bot.targetX - bot.x, bot.targetZ - bot.z);
  let diff = angleToTarget - bot.heading;
  while (diff >  Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  bot.heading += Math.sign(diff) * Math.min(Math.abs(diff), 2.8 * dts);

  // drive forward
  bot.fwd += botTopSpeed * dts;
  bot.fwd *= Math.pow(0.55, dts);
  bot.fwd = Math.min(botTopSpeed, bot.fwd);
  bot.x += Math.sin(bot.heading) * bot.fwd * dts + bot.vx * dts;
  bot.z += Math.cos(bot.heading) * bot.fwd * dts + bot.vz * dts;
  bot.vx *= Math.pow(0.1, dts);
  bot.vz *= Math.pow(0.1, dts);

  // barrier collision (levels 1-5)
  if (arenaLevel <= 5) {
    const bd = Math.hypot(bot.x, bot.z);
    if (bd > BARRIER_RADIUS) {
      const bnx = bot.x / bd, bnz = bot.z / bd;
      bot.x = bnx * BARRIER_RADIUS;
      bot.z = bnz * BARRIER_RADIUS;
      const bdot = bot.vx * bnx + bot.vz * bnz;
      if (bdot > 0) { bot.vx -= bdot * 1.2 * bnx; bot.vz -= bdot * 1.2 * bnz; }
    }
  }

  // gravity / tile support
  const bt = arenaTileAt(bot.x, bot.z);
  const botOnSolid = bt && (bt.state === 'alive' || bt.state === 'fading');
  const botSupportY = bt ? bt.mesh.position.y + 0.2 : -100;
  if (botOnSolid && bot.y <= botSupportY + 0.05 && bot.vy <= 0) {
    bot.y = botSupportY; bot.vy = 0; bot.onGround = true;
  } else {
    bot.onGround = false;
    bot.vy -= 18 * dts;
    bot.y += bot.vy * dts;
  }

  // trigger tile (only when grounded on alive tile)
  if (bt && bt.state === 'alive' && bot.onGround) {
    bt.state = 'fading'; bt.timer = 0;
  }

  // hole-detection: look ahead (distance and jump prob scale with level)
  if (bot.onGround && bot.jumpCooldown <= 0) {
    const lx = bot.x + Math.sin(bot.heading) * lookAhead;
    const lz = bot.z + Math.cos(bot.heading) * lookAhead;
    const ahead = arenaTileAt(lx, lz);
    if (!ahead || ahead.state === 'gone' ||
        (ahead.state === 'fading' && ahead.timer > 700)) {
      if (Math.random() < jumpProb) {
        bot.vy = 10; bot.onGround = false; bot.jumpCooldown = jumpCooldownT;
      }
    }
  }

  // sync mesh
  if (bot.mesh) {
    bot.mesh.position.set(bot.x, bot.y, bot.z);
    bot.mesh.rotation.set(0, bot.heading, 0);
  }

  // death
  if (bot.y < -3) {
    bot.state = 'dead';
    if (!arenaElimOrder.includes(bot.id)) arenaElimOrder.push(bot.id);
    if (bot.mesh) bot.mesh.visible = false;
  }
}

function startArena() {
  // reset arena tiles
  for (const t of arenaTiles) {
    t.state = 'alive'; t.timer = 0; t.baseY = 0;
    t.infected = false; t.infectTimer = 0; t.spreadTimer = 0;
    t.mesh.position.y = 0; t.mesh.visible = true;
    t.mesh.material.color.setHex(0xfafafa);
  }
  arenaPlayer.x = 0; arenaPlayer.z = 0; arenaPlayer.y = 0;
  arenaPlayer.vy = 0; arenaPlayer.vx = 0; arenaPlayer.vz = 0;
  arenaPlayer.heading = 0; arenaPlayer.fwd = 0; arenaPlayer.onGround = false;
  // remove any leftover enemies/bots
  for (const e of enemies) scene.remove(e.mesh);
  for (const b of arenaBots) { if (b.mesh) scene.remove(b.mesh); }
  enemies = []; particles = [];
  // barrier visibility based on level
  const hasBarrier = arenaLevel <= 5;
  arenaBarrierMesh.visible = hasBarrier;
  arenaBarrierRingB.visible = hasBarrier;
  arenaBarrierRingT.visible = hasBarrier;
  // build 3 bots
  arenaBots = BOT_COLORS.map((col, i) => {
    const mesh = buildCar({ kind: 'sedan', color: col, accent: BOT_ACCENTS[i] });
    mesh.position.set(BOT_STARTS[i][0], 0, BOT_STARTS[i][1]);
    scene.add(mesh);
    return {
      id: 'bot' + i,
      x: BOT_STARTS[i][0], z: BOT_STARTS[i][1],
      y: 0, vy: 0, vx: 0, vz: 0,
      heading: Math.random() * Math.PI * 2,
      fwd: 0, onGround: false,
      state: 'alive',
      mesh,
      targetX: 0, targetZ: 0, targetTimer: 0, jumpCooldown: 0, frozenTimer: 0,
    };
  });
  arenaElimOrder = []; arenaPlacement = null; skidMarks = [];
  // reset nitro
  if (nitroPickup) { arenaGroup.remove(nitroPickup.mesh); nitroPickup = null; }
  nitroSpawnTimer = 0; nitroTime = 0;
  dmg = { body: 0, tires: 0, engine: 0 };
  invulnTime = 0; crashes = 0; gameTime = 0; score = 0;
  earnings = null; lastEarned = 0;
  rebuildPlayerCar();
  state = STATE.ARENA;
}

function updateArena(dt) {
  const dts = dt / 1000;
  gameTime += dts;
  score = Math.floor(gameTime * 10);

  // free driving input
  const turn = ((keys['arrowleft']||keys['a']) ? 1 : 0) - ((keys['arrowright']||keys['d']) ? 1 : 0);
  const accel = ((keys['arrowup']||keys['w']) ? 1 : 0) - ((keys['arrowdown']||keys['s']) ? 1 : 0);

  // drift physics: velocity vector is separate from heading
  const speed = Math.hypot(arenaPlayer.vx, arenaPlayer.vz);
  const turnRate = 1.6 + Math.min(1.4, speed / 10);
  arenaPlayer.heading += turn * turnRate * dts;

  // accelerate in the heading direction
  arenaPlayer.vx += Math.sin(arenaPlayer.heading) * accel * 22 * dts;
  arenaPlayer.vz += Math.cos(arenaPlayer.heading) * accel * 22 * dts;

  // grip: gradually bleed lateral velocity back toward heading (low = more slide)
  if (speed > 0.2) {
    const gripRate = 2.2;          // lower value = more drift
    const f = 1 - Math.exp(-gripRate * dts);
    const alignedVx = Math.sin(arenaPlayer.heading) * speed;
    const alignedVz = Math.cos(arenaPlayer.heading) * speed;
    arenaPlayer.vx += (alignedVx - arenaPlayer.vx) * f;
    arenaPlayer.vz += (alignedVz - arenaPlayer.vz) * f;
  }

  // friction & speed cap (nitro overrides both)
  const frictionBase = nitroTime > 0 ? Math.pow(0.97, dts) : Math.pow(0.55, dts);
  arenaPlayer.vx *= frictionBase;
  arenaPlayer.vz *= frictionBase;
  const newSpeed = Math.hypot(arenaPlayer.vx, arenaPlayer.vz);
  const speedCap = nitroTime > 0 ? 58 : 28;
  if (newSpeed > speedCap) { arenaPlayer.vx *= speedCap / newSpeed; arenaPlayer.vz *= speedCap / newSpeed; }

  // keep fwd as signed speed for camera/compat
  arenaPlayer.fwd = (Math.sin(arenaPlayer.heading) * arenaPlayer.vx +
                     Math.cos(arenaPlayer.heading) * arenaPlayer.vz);

  arenaPlayer.x += arenaPlayer.vx * dts;
  arenaPlayer.z += arenaPlayer.vz * dts;
  _trailT += dts;

  // barrier collision (levels 1-5 only)
  if (arenaLevel <= 5) {
    const bd = Math.hypot(arenaPlayer.x, arenaPlayer.z);
    if (bd > BARRIER_RADIUS) {
      const bnx = arenaPlayer.x / bd, bnz = arenaPlayer.z / bd;
      arenaPlayer.x = bnx * BARRIER_RADIUS;
      arenaPlayer.z = bnz * BARRIER_RADIUS;
      const bdot = arenaPlayer.vx * bnx + arenaPlayer.vz * bnz;
      if (bdot > 0) { arenaPlayer.vx -= bdot * 1.6 * bnx; arenaPlayer.vz -= bdot * 1.6 * bnz; }
    }
  }

  // tile under player determines support
  const tile = arenaTileAt(arenaPlayer.x, arenaPlayer.z);
  const onSolid = tile && (tile.state === 'alive' || tile.state === 'fading' || tile.state === 'rising');
  const supportY = tile ? tile.mesh.position.y + 0.2 : -100;

  if (onSolid && arenaPlayer.y <= supportY + 0.05 && arenaPlayer.vy <= 0) {
    arenaPlayer.y = supportY;
    arenaPlayer.vy = 0;
    arenaPlayer.onGround = true;
  } else {
    arenaPlayer.onGround = false;
    arenaPlayer.vy -= 18 * dts;
    arenaPlayer.y += arenaPlayer.vy * dts;
  }

  // tile starts falling only when the player is physically standing on it
  if (tile && tile.state === 'alive' && arenaPlayer.onGround) {
    if (equippedPaint === 'paint_obsidian' && !tile.infected) {
      tile.infected = true; tile.infectTimer = 0; tile.spreadTimer = 0;
    } else if (!tile.infected) {
      tile.state = 'fading'; tile.timer = 0;
    }
  }

  // tile state machine
  for (const t of arenaTiles) {
    // obsidian infection — purple creep, spreads, then drops
    if (t.infected && t.state === 'alive') {
      t.infectTimer += dt;
      t.spreadTimer  += dt;
      // lerp color white → deep purple over 3s
      const p = Math.min(1, t.infectTimer / 3000);
      t.mesh.material.color.setRGB(0.08 + (1-p)*0.85, 0, 0.12 + p*0.45);
      // spread to one random adjacent alive uninfected tile every ~1s
      if (t.spreadTimer >= 1000) {
        t.spreadTimer = 0;
        const neighbors = arenaTiles.filter(o =>
          o !== t && !o.infected && o.state === 'alive' &&
          Math.hypot(o.x - t.x, o.z - t.z) < HEX_SIZE * 2.2
        );
        if (neighbors.length > 0) {
          const pick = neighbors[Math.floor(Math.random()*neighbors.length)];
          pick.infected = true; pick.infectTimer = 0; pick.spreadTimer = 0;
        }
      }
      // after 3s tile drops
      if (t.infectTimer >= 3000) {
        t.infected = false;
        t.state = 'fading'; t.timer = 0;
      }
    }
    if (t.state === 'fading') {
      t.timer += dt;
      const p = Math.min(1, t.timer / 1800);
      const flash = Math.min(1, p / 0.4);
      t.mesh.material.color.setRGB(1, 1 - flash * 0.85, 1 - flash * 0.85);
      const holdFrac = 0.39;
      const drop = p < holdFrac ? 0 : Math.pow((p - holdFrac) / (1 - holdFrac), 2) * 38;
      t.mesh.position.y = -drop;
      if (t.timer > 1800) {
        t.state = 'gone';
        t.timer = 0;
        t.mesh.visible = false;
      }
    } else if (t.state === 'gone') {
      t.timer += dt;
      if (t.timer >= 5000) {
        t.state = 'rising';
        t.timer = 0;
        t.mesh.position.y = -5;
        t.mesh.material.color.setHex(0xfafafa);
        t.mesh.visible = true;
      }
    } else if (t.state === 'rising') {
      t.timer += dt;
      const p = Math.min(1, t.timer / 500);
      t.mesh.position.y = -5 * (1 - p);
      if (p >= 1) {
        t.state = 'alive'; t.mesh.position.y = 0;
        t.infected = false; t.infectTimer = 0; t.spreadTimer = 0;
      }
    }
  }

  // update bots
  for (const bot of arenaBots) {
    if (bot.state === 'alive') updateBot(bot, dt);
  }

  // player-bot collision (soft circle push)
  const COLL_R = 1.4;
  for (const bot of arenaBots) {
    if (bot.state !== 'alive') continue;
    const dx = arenaPlayer.x - bot.x;
    const dz = arenaPlayer.z - bot.z;
    const dist = Math.hypot(dx, dz);
    if (dist < COLL_R * 2 && dist > 0.001) {
      const nx = dx / dist, nz = dz / dist;
      const overlap = COLL_R * 2 - dist;
      arenaPlayer.x += nx * overlap * 0.55;
      arenaPlayer.z += nz * overlap * 0.55;
      bot.x -= nx * overlap * 0.45;
      bot.z -= nz * overlap * 0.45;
      const relVx = arenaPlayer.vx - bot.vx;
      const relVz = arenaPlayer.vz - bot.vz;
      const dot = relVx * nx + relVz * nz;
      if (dot < 0) {
        const impulse = dot * 0.6;
        arenaPlayer.vx -= impulse * nx;
        arenaPlayer.vz -= impulse * nz;
        bot.vx += impulse * nx;
        bot.vz += impulse * nz;
        // obsidian freeze: halt the bot for 2s
        if (equippedPaint === 'paint_obsidian') {
          bot.frozenTimer = 2000;
          bot.vx = 0; bot.vz = 0; bot.fwd = 0;
        }
      }
    }
  }

  // drift trail: emit skid marks when sliding sideways
  if (arenaPlayer.onGround) {
    const lateralVx = arenaPlayer.vx - Math.sin(arenaPlayer.heading) * arenaPlayer.fwd;
    const lateralVz = arenaPlayer.vz - Math.cos(arenaPlayer.heading) * arenaPlayer.fwd;
    const lateralSpeed = Math.hypot(lateralVx, lateralVz);
    if (lateralSpeed > 2.0) {
      const rx = arenaPlayer.x - Math.sin(arenaPlayer.heading) * 1.6;
      const rz = arenaPlayer.z - Math.cos(arenaPlayer.heading) * 1.6;
      skidMarks.push({ wx: rx, wy: arenaPlayer.y + 0.05, wz: rz, life: 1800, maxLife: 1800, intensity: Math.min(1, lateralSpeed / 8) });
    }
  }
  for (const s of skidMarks) s.life -= dt;
  if (skidMarks.length > 250) skidMarks = skidMarks.filter(s => s.life > 0).slice(-220);

  // ── nitro boost tick ──────────────────────────────────────────────────────
  if (nitroTime > 0) {
    nitroTime -= dt;
    if (nitroTime <= 0) {
      // sharp brake at end of boost
      nitroTime = 0;
      arenaPlayer.vx *= 0.35;
      arenaPlayer.vz *= 0.35;
    }
  }

  // ── nitro pickup spawn (once per 60s, only while game is live) ───────────
  if (!nitroPickup && !arenaElimOrder.includes('player')) {
    nitroSpawnTimer -= dt;
    if (nitroSpawnTimer <= 0) {
      const aliveTiles = arenaTiles.filter(t => t.state === 'alive');
      if (aliveTiles.length > 0) {
        const tile = aliveTiles[Math.floor(Math.random() * aliveTiles.length)];
        // build mesh: glowing hex pad + spinning torus
        const padGeo  = new THREE.CylinderGeometry(0.72, 0.72, 0.18, 6);
        const padMat  = new THREE.MeshPhongMaterial({ color: 0xffcc00, emissive: 0xff8800, emissiveIntensity: 0.9 });
        const pad     = new THREE.Mesh(padGeo, padMat);
        const ringGeo = new THREE.TorusGeometry(0.55, 0.09, 8, 18);
        const ringMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0xffee44, emissiveIntensity: 1.0 });
        const ring    = new THREE.Mesh(ringGeo, ringMat);
        ring.position.y = 0.55;
        ring.rotation.x = Math.PI / 2;
        ring.name = 'nitroRing';
        const g = new THREE.Group();
        g.add(pad); g.add(ring);
        g.position.set(tile.x, 0.22, tile.z);
        arenaGroup.add(g);
        nitroPickup = { mesh: g, x: tile.x, z: tile.z };
      }
      nitroSpawnTimer = 30000;
    }
  }

  // ── spin & collect pickup ─────────────────────────────────────────────────
  if (nitroPickup) {
    const ring = nitroPickup.mesh.getObjectByName('nitroRing');
    if (ring) ring.rotation.z += dts * 3.5;
    nitroPickup.mesh.position.y = 0.22 + Math.sin(gameTime * 3.5) * 0.12;
    const pdx = arenaPlayer.x - nitroPickup.x;
    const pdz = arenaPlayer.z - nitroPickup.z;
    if (Math.hypot(pdx, pdz) < 1.6 && arenaPlayer.onGround) {
      // collected — big speed blast forward
      const fwd = Math.hypot(arenaPlayer.vx, arenaPlayer.vz) < 1 ? 1 : Math.hypot(arenaPlayer.vx, arenaPlayer.vz);
      const nx = Math.sin(arenaPlayer.heading), nz = Math.cos(arenaPlayer.heading);
      arenaPlayer.vx = nx * Math.max(fwd * 2.5, 38);
      arenaPlayer.vz = nz * Math.max(fwd * 2.5, 38);
      nitroTime = 5000;
      arenaGroup.remove(nitroPickup.mesh);
      nitroPickup = null;
      addShake(0.15, 300);
      // burst particles
      for (let i = 0; i < 18; i++) {
        particles.push({ x: W/2 + (Math.random()-0.5)*60, y: H/2 + (Math.random()-0.5)*60,
          vx: (Math.random()-0.5)*6, vy: -(1+Math.random()*5),
          life: 400+Math.random()*400, max: 800,
          size: 4+Math.random()*8, color: Math.random()<0.5?'#ffee00':'#ff9900', gravity: 0.04, kind: 'spark' });
      }
    }
  }

  const allBotsDead = arenaBots.every(b => b.state === 'dead');

  function calcArenaEarnings(placement) {
    // placement base — 1st gets noticeably more
    const placeBase = [80, 25, 10, 4][placement - 1] || 4;
    // gentle level multiplier: L1=1, L5=2.5, L10=2 (soft bell)
    const LVL_MULS = [1.0, 1.3, 1.6, 2.0, 2.5, 2.4, 2.3, 2.2, 2.1, 2.0];
    const lvlMul = LVL_MULS[Math.min(arenaLevel - 1, LVL_MULS.length - 1)];
    // survival time bonus (flat — no level scaling)
    const timeCoin = Math.floor(gameTime * 0.4);
    // eliminated bots bonus
    const botsDown = arenaBots.filter(b => b.state === 'dead').length;
    const botBonus  = botsDown * 6;
    const carMul = CARS[carIdx].coinMul || 1.0;
    const base  = Math.floor(placeBase * lvlMul) + timeCoin + botBonus;
    let masterBonus = 0;
    // unlock next level + award master bonus for first-time L10 clear
    if (placement === 1 && arenaLevel > arenaProgress) {
      arenaProgress = arenaLevel;
      localStorage.setItem('headon_arena_progress', arenaProgress);
      if (arenaLevel === 10) masterBonus = 1000;
    }
    const total = Math.floor(base * carMul) + masterBonus;
    const gemEarned = Math.random() < (CARS[carIdx].gemChance || 0);
    if (gemEarned) addGems(1);
    return { placeBase, lvlMul, timeCoin, botBonus, botsDown, base, total, carMul, gemEarned, masterBonus };
  }

  // player wins — all bots eliminated first
  if (allBotsDead && !arenaElimOrder.includes('player')) {
    arenaElimOrder.push('player');
    arenaPlacement = (BOT_COLORS.length + 1) - arenaElimOrder.indexOf('player');
    state = STATE.DEAD;
    if (score > best) { best = Math.floor(score); localStorage.setItem('headon_best', best); }
    const e = calcArenaEarnings(arenaPlacement);
    earnings = {
      distanceKm:0, distanceCoins:0, speedingSec:gameTime,
      speedCoins: e.timeCoin, overtakes:0, overtakeCoins:0,
      waves:0, waveCoins:0, topSpeedKmh:0, topSpeedBonus: Math.floor(e.placeBase * e.lvlMul),
      total: e.total, mode:'ARENA', placement: arenaPlacement,
      carMul: e.carMul, gemEarned: e.gemEarned,
      lvlMul: e.lvlMul, botBonus: e.botBonus, botsDown: e.botsDown, masterBonus: e.masterBonus,
    };
    lastEarned = e.total; if (e.total > 0) setCoins(coins + e.total);
    return;
  }

  // player death by falling
  if (arenaPlayer.y < -3 && !arenaElimOrder.includes('player')) {
    arenaElimOrder.push('player');
    arenaPlacement = (BOT_COLORS.length + 1) - arenaElimOrder.indexOf('player');
    state = STATE.DEAD;
    addShake(0.4, 600); playCrashSound(); crashes = 1;
    if (score > best) { best = Math.floor(score); localStorage.setItem('headon_best', best); }
    const e = calcArenaEarnings(arenaPlacement);
    earnings = {
      distanceKm:0, distanceCoins:0, speedingSec:gameTime,
      speedCoins: e.timeCoin, overtakes:0, overtakeCoins:0,
      waves:0, waveCoins:0, topSpeedKmh: arenaPlayer.fwd * 3.6, topSpeedBonus: Math.floor(e.placeBase * e.lvlMul),
      total: e.total, mode:'ARENA', placement: arenaPlacement,
      carMul: e.carMul, gemEarned: e.gemEarned,
      lvlMul: e.lvlMul, botBonus: e.botBonus, botsDown: e.botsDown, masterBonus: e.masterBonus,
    };
    lastEarned = e.total; if (e.total > 0) setCoins(coins + e.total);
  }
}
function cycleDifficulty() { difficultyIdx = (difficultyIdx + 1) % DIFFICULTIES.length; localStorage.setItem('headon_diff', difficultyIdx); }
function cycleMode() { modeIdx = (modeIdx + 1) % MODES.length; localStorage.setItem('headon_mode', modeIdx); }
function cycleCar() { carIdx = (carIdx + 1) % CARS.length; localStorage.setItem('headon_car', carIdx); rebuildPlayerCar(); }
function cycleBg() { bgIdx = (bgIdx + 1) % BACKGROUNDS.length; localStorage.setItem('headon_bg', bgIdx); applyBackground(); rebuildScenery(); }

function spawnEnemy(opts={}) {
  const truck = !!opts.truck;
  const type = pickEnemyType(truck);
  const lane = opts.lane != null ? opts.lane : Math.floor(Math.random() * LANE_COUNT);
  const color = type.palette[Math.floor(Math.random() * type.palette.length)];
  const m = buildCar({ kind: type.kind, color, accent: 0x222222 });
  m.rotation.y = Math.PI; // face -z (toward player/camera)
  m.position.set(LANE_X[lane], 0, DRAW_DIST + (opts.zOffset || 0));
  scene.add(m);
  enemies.push({
    mesh: m, worldX: LANE_X[lane], worldZ: DRAW_DIST + (opts.zOffset || 0),
    kind: type.kind, color
  });
}
function spawnPulse(count, truck) {
  const lanes = [];
  for (let i = 0; i < LANE_COUNT; i++) lanes.push(i);
  for (let i = lanes.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lanes[i], lanes[j]] = [lanes[j], lanes[i]];
  }
  for (let i = 0; i < count; i++) {
    const lane = lanes[i % lanes.length];
    const zOff = i >= lanes.length ? 30 + Math.random() * 20 : 0;
    spawnEnemy({ lane, truck, zOffset: zOff });
  }
}

// project a 3D point to 2D HUD canvas pixel coords
const _v3 = new THREE.Vector3();
function project3D(x, y, z) {
  _v3.set(x, y, z); _v3.project(camera);
  return { x: (_v3.x + 1)/2 * W, y: (-_v3.y + 1)/2 * H, behind: _v3.z > 1 };
}

function spawnExplosion3D(x, y, z) {
  const p = project3D(x, y, z);
  if (p.behind) return;
  const colors = ['#ff5555','#ffaa00','#ffe066','#ffffff'];
  for (let i = 0; i < 32; i++) {
    const a = Math.random()*Math.PI*2; const s = 2 + Math.random()*7;
    particles.push({ x: p.x, y: p.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 700 + Math.random()*500, max: 1200, size: 2 + Math.random()*4,
      color: colors[Math.floor(Math.random()*colors.length)], gravity: 0.06, kind: 'spark' });
  }
  const debris = ['#444','#666','#888','#222'];
  for (let i = 0; i < 16; i++) {
    const a = Math.random()*Math.PI*2; const s = 1 + Math.random()*5;
    particles.push({ x: p.x, y: p.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2,
      life: 1000 + Math.random()*500, max: 1500, size: 3 + Math.random()*5,
      color: debris[Math.floor(Math.random()*debris.length)], gravity: 0.18, kind: 'debris',
      rot: Math.random()*Math.PI, spin: (Math.random()-0.5)*0.4 });
  }
}

function takeDamage(e) {
  spawnExplosion3D(e.worldX, 1.2, e.worldZ);
  spawnExplosion3D(player.worldX, 1.2, 0);
  addShake(0.2 + Math.min(0.4, speed / 100), 400);
  playCrashSound();
  crashes++;
  invulnTime = 1500;
  damageBanner = 1200;
  const speedFactor = 1 + Math.max(0, (speed - 25) / 50);
  const hitsToKill = CARS[carIdx].hitsToKill || 4;
  const per = (1.0 / hitsToKill) * speedFactor;
  const noise = () => 0.85 + Math.random() * 0.3;
  dmg.body   = Math.min(1, dmg.body   + per * noise());
  dmg.tires  = Math.min(1, dmg.tires  + per * noise());
  dmg.engine = Math.min(1, dmg.engine + per * noise());
  speedBoost = Math.max(-5, speedBoost - 6);
  if (dmg.body >= 0.99 && dmg.tires >= 0.99 && dmg.engine >= 0.99) {
    state = STATE.DEAD;
    if (score > best) { best = Math.floor(score); localStorage.setItem('headon_best', best); }
    earnings = computeEarnings();
    lastEarned = earnings.total;
    if (lastEarned > 0) setCoins(coins + lastEarned);
  }
}

function computeEarnings() {
  const km = distanceM / 1000;
  const distanceCoins = Math.floor(km * 18);
  const speedCoins = Math.floor((speedingTime / 1000) * 1);
  const overtakeCoins = dodged * 1;
  const waveCoins = wave * 25;
  const topSpeedKmh = maxSpeed * 3.6;
  const topSpeedBonus = Math.floor(Math.max(0, topSpeedKmh - 100) * 0.2);
  const diffMul = [0.7, 1.0, 2.0][difficultyIdx];
  const carMul  = CARS[carIdx].coinMul || 1.0;
  const base = distanceCoins + speedCoins + overtakeCoins + waveCoins + topSpeedBonus;
  const total = Math.floor(base * diffMul * carMul);
  // gem drop roll
  const gemEarned = Math.random() < (CARS[carIdx].gemChance || 0);
  if (gemEarned) addGems(1);
  return {
    distanceKm: km, distanceCoins,
    speedingSec: speedingTime / 1000, speedCoins,
    overtakes: dodged, overtakeCoins,
    waves: wave, waveCoins,
    topSpeedKmh, topSpeedBonus,
    total, diffMul, carMul, gemEarned,
  };
}

// ===== paint FX =====
// carX/Y/Z = world centre of car body; scale = 1.0 normal, smaller for showroom framing
function spawnPaintFX(carX, carY, carZ, scale) {
  const paintSpec = SHOP_PAINTS.find(p => p.id === equippedPaint);
  if (!paintSpec || !paintSpec.special) return;
  // sample several points spread across the car surface
  const pts = [
    project3D(carX,              carY + 0.3 * scale, carZ),
    project3D(carX - 0.7*scale,  carY,               carZ + 0.8*scale),
    project3D(carX + 0.7*scale,  carY,               carZ - 0.8*scale),
    project3D(carX - 0.6*scale,  carY + 0.5*scale,   carZ - 0.5*scale),
    project3D(carX + 0.6*scale,  carY + 0.5*scale,   carZ + 0.5*scale),
  ];
  for (const cp of pts) {
    if (cp.behind) continue;
    const spread = 10 * scale;
    if (paintSpec.special === 'ocean' && Math.random() < 0.12) {
      const hue = 190 + Math.random() * 30;
      particles.push({ x: cp.x + (Math.random()-0.5)*spread, y: cp.y + (Math.random()-0.5)*spread*0.6,
        vx: (Math.random()-0.5)*2, vy: -(0.4 + Math.random()*1.8),
        life: 400+Math.random()*400, max: 800,
        size: (2+Math.random()*5)*scale, color: `hsl(${hue},100%,72%)`, gravity: 0.01, kind: 'spark' });
    }
    if (paintSpec.special === 'gold' && Math.random() < 0.10) {
      const bright = Math.random() < 0.5 ? '#fff8c0' : '#ffd54a';
      particles.push({ x: cp.x + (Math.random()-0.5)*spread, y: cp.y + (Math.random()-0.5)*spread*0.6,
        vx: (Math.random()-0.5)*1.2, vy: -(0.2 + Math.random()*0.8),
        life: 180+Math.random()*220, max: 400,
        size: (1.5+Math.random()*3.5)*scale, color: bright, gravity: 0.005, kind: 'spark' });
    }
    if (paintSpec.special === 'emerald' && Math.random() < 0.10) {
      const bright = Math.random() < 0.4 ? '#ccffcc' : '#00ff88';
      particles.push({ x: cp.x + (Math.random()-0.5)*spread, y: cp.y + (Math.random()-0.5)*spread*0.6,
        vx: (Math.random()-0.5)*1.5, vy: -(0.3 + Math.random()*1.0),
        life: 220+Math.random()*280, max: 500,
        size: (1.5+Math.random()*4)*scale, color: bright, gravity: 0.008, kind: 'spark' });
    }
    if (paintSpec.special === 'inferno' && Math.random() < 0.10) {
      particles.push({ x: cp.x + (Math.random()-0.5)*spread, y: cp.y + (Math.random()-0.5)*spread*0.4,
        vx: (Math.random()-0.5)*1.8, vy: -(0.6 + Math.random()*1.8),
        life: 280+Math.random()*220, max: 500,
        size: (4+Math.random()*7)*scale, color: getFireColor(), gravity: -0.04, kind: 'spark' });
    }
    if (paintSpec.special === 'rainbow' && Math.random() < 0.12) {
      const hue = (_paintRainbowHue + Math.random() * 60) % 360;
      particles.push({ x: cp.x + (Math.random()-0.5)*spread, y: cp.y + (Math.random()-0.5)*spread*0.6,
        vx: (Math.random()-0.5)*2.2, vy: -(0.5 + Math.random()*1.5),
        life: 250+Math.random()*300, max: 550,
        size: (2+Math.random()*5)*scale, color: `hsl(${Math.floor(hue)},100%,62%)`, gravity: 0.006, kind: 'spark' });
    }
    // obsidian: purple glimmer sparks when moving side-to-side
    if (paintSpec.special === 'obsidian' && Math.abs(player.vx) > 2 && Math.random() < 0.13) {
      const hue = 260 + Math.random() * 50;
      const bright = Math.random() < 0.4 ? 85 : 65;
      // spawn from behind the car so sparks trail backward
      const bp = project3D(carX + (Math.random()-0.5)*spread*0.8, carY - 0.1, carZ - 1.4 * scale);
      if (!bp.behind) particles.push({ x: bp.x, y: bp.y,
        vx: (Math.random()-0.5)*2.5, vy: 1.2 + Math.random()*2.5,
        life: 180+Math.random()*220, max: 400,
        size: (1.5+Math.random()*3.5)*scale, color: `hsl(${Math.floor(hue)},90%,${bright}%)`, gravity: 0, kind: 'spark' });
    }
  }
}

function spawnPaintGroundTrail(carX, carSpeed) {
  if (CARS[carIdx].kind === 'truck') return;
  const paintSpec = SHOP_PAINTS.find(p => p.id === equippedPaint);
  if (!paintSpec || !['inferno','snow','ocean','obsidian'].includes(paintSpec.special)) return;
  if (Math.random() > 0.35) return; // thin out spawns
  // project rear-centre of car to screen
  const rp = project3D(carX + (Math.random()-0.5)*1.2, 0.01, -2.1);
  if (rp.behind) return;
  // drift speed: matches road scroll so marks appear to stay on the ground
  const drift = 1.8 + carSpeed * 0.06 + Math.random() * 1.2;
  if (paintSpec.special === 'inferno') {
    const cols = ['#cc2200','#dd3300','#ff4400','#ff6600','#441100'];
    particles.push({ x: rp.x, y: rp.y,
      vx: (Math.random()-0.5)*1.2, vy: drift,
      life: 2000, max: 2000,
      size: 22 + Math.random()*18, color: cols[Math.floor(Math.random()*cols.length)],
      gravity: 0, kind: 'groundmark' });
  } else if (paintSpec.special === 'snow') {
    const cols = ['#ddeeff','#eef5ff','#ffffff','#c8e0ff'];
    particles.push({ x: rp.x, y: rp.y,
      vx: (Math.random()-0.5)*0.8, vy: drift,
      life: 2000, max: 2000,
      size: 18 + Math.random()*14, color: cols[Math.floor(Math.random()*cols.length)],
      gravity: 0, kind: 'groundmark' });
  } else if (paintSpec.special === 'ocean') {
    const cols = ['#1a6ea8','#2980b9','#5dade2','#aed6f1'];
    particles.push({ x: rp.x, y: rp.y,
      vx: (Math.random()-0.5)*0.8, vy: drift,
      life: 2000, max: 2000,
      size: 20 + Math.random()*16, color: cols[Math.floor(Math.random()*cols.length)],
      gravity: 0, kind: 'groundmark' });
  } else if (paintSpec.special === 'obsidian') {
    const cols = ['#2d0040','#4a0066','#1a0030','#3d005a','#0a0015'];
    particles.push({ x: rp.x, y: rp.y,
      vx: (Math.random()-0.5)*0.8, vy: drift,
      life: 2000, max: 2000,
      size: 24 + Math.random()*18, color: cols[Math.floor(Math.random()*cols.length)],
      gravity: 0, kind: 'groundmark' });
  }
}

// ===== update =====
function update(dt) {
  menuBlink += dt;
  updateAudio();
  // shake decay
  const dts0 = dt / 1000;
  if (shakeImpulse > 0) shakeImpulse -= dt; else shakeMag *= Math.pow(0.5, dts0 * 5);
  if (shakeMag < 0.005) shakeMag = 0;
  _paintRainbowHue = (_paintRainbowHue + dts0 * 90) % 360;

  if (state === STATE.ARENA) { updateArena(dt); updateParticles(dt); return; }

  const dts = dt / 1000;
  const ambientSpeed = state === STATE.PLAYING ? speed : 6;
  trackScroll += ambientSpeed * dts;
  // scroll road texture
  roadTex.offset.y = -(trackScroll * 0.15) % 1;

  // scroll scenery toward camera
  for (const s of scenery) {
    s.worldZ -= ambientSpeed * dts;
    if (s.worldZ < -10) {
      // recycle
      scene.remove(s.mesh);
      const newKind = BACKGROUNDS[bgIdx].scenery;
      s.mesh = buildSceneryItem(newKind);
      const side = Math.random() < 0.5 ? -1 : 1;
      s.worldX = side * (ROAD_HALF + 3 + Math.random() * 15);
      s.worldZ = DRAW_DIST + Math.random() * 60;
      s.mesh.position.set(s.worldX, 0, s.worldZ);
      scene.add(s.mesh);
    }
    s.mesh.position.set(s.worldX, 0, s.worldZ);
  }

  // particles
  updateParticles(dt);

  if (state !== STATE.PLAYING) return;

  const car = CARS[carIdx];
  const d = DIFFICULTIES[difficultyIdx];
  const headOn = MODES[modeIdx] === 'HEAD ON';

  const bodyMul = 1 - dmg.body * 0.6;
  const tiresMul = 1 - dmg.tires * 0.6;
  const engineMul = 1 - dmg.engine * 0.6;

  // smooth steer (camera looks +Z so screen-right = world -X)
  const dir = ((keys['arrowleft']||keys['a']) ? 1 : 0) - ((keys['arrowright']||keys['d']) ? 1 : 0);
  const maxVx = 14 * car.steerMul * tiresMul; // m/s
  const tVx = dir * maxVx;
  const resp = 9 * car.steerMul * tiresMul;
  player.vx += (tVx - player.vx) * Math.min(1, dts * resp);
  player.worldX += player.vx * dts;
  const limit = ROAD_HALF - 1.0;
  if (player.worldX < -limit) { player.worldX = -limit; player.vx *= -0.2; }
  if (player.worldX > limit)  { player.worldX = limit;  player.vx *= -0.2; }

  // advance hyper hue only when moving side-to-side
  const lateralSpeed = Math.abs(player.vx);
  if (lateralSpeed > 2) _hyperHue = (_hyperHue + lateralSpeed * 0.8 * dts * 120) % 360;

  // continuous tire trail — emits downward (toward camera = bottom of screen)
  if (speed > 8) {
    _trailT += 0.016;
    const slideBoost = Math.min(1, lateralSpeed / 12);
    const trailSpec = SHOP_TRAILS.find(x => x.id === equippedTrail);
    const isFire = trailSpec && trailSpec.special === 'fire';
    const obsidianTrail = equippedPaint === 'paint_obsidian';
    const _obsCols = ['#2d0040','#4a0066','#6600aa','#1a0030','#3d005a'];
    const getObsidianColor = () => _obsCols[Math.floor(Math.random()*_obsCols.length)];
    if (isFire) {
      // fire trail: flames trail backward behind the car (positive vy = down-screen = away)
      const exhaustPoints = [
        project3D(player.worldX - 0.34, 0.18, -1.8),
        project3D(player.worldX + 0.34, 0.18, -1.8),
      ];
      for (const wp of exhaustPoints) {
        if (wp.behind) continue;
        const burst = 3 + Math.floor(Math.random() * 3);
        for (let b = 0; b < burst; b++) {
          particles.push({
            x: wp.x + (Math.random()-0.5)*6,
            y: wp.y,
            vx: (Math.random()-0.5) * 3,
            vy: 2 + Math.random() * 4,
            life: 280 + Math.random() * 220,
            max: 500,
            size: 10 + Math.random() * 14,
            color: obsidianTrail ? getObsidianColor() : getFireColor(), gravity: 0, kind: 'spark',
          });
        }
      }
      // extra center plume — larger, trails further back
      const cp = project3D(player.worldX, 0.14, -1.95);
      if (!cp.behind) {
        for (let b = 0; b < 4; b++) {
          particles.push({
            x: cp.x + (Math.random()-0.5)*5,
            y: cp.y,
            vx: (Math.random()-0.5) * 2,
            vy: 2.5 + Math.random() * 5,
            life: 350 + Math.random() * 200,
            max: 550,
            size: 16 + Math.random() * 20,
            color: obsidianTrail ? getObsidianColor() : getFireColor(), gravity: 0, kind: 'spark',
          });
        }
      }
    } else {
      const obsidianOn = equippedPaint === 'paint_obsidian';
      const obsidianCols = ['#2d0040','#4a0066','#6600aa','#1a0030','#3d005a'];
      const trailColor = obsidianOn
        ? obsidianCols[Math.floor(Math.random()*obsidianCols.length)]
        : getTrailColor(_trailT);
      for (let side = -1; side <= 1; side += 2) {
        const wp = project3D(player.worldX + side * 0.72, 0.05, -1.6);
        if (!wp.behind) {
          particles.push({ x: wp.x, y: wp.y,
            vx: (Math.random()-0.5) * (1.5 + slideBoost * 3),
            vy: 1.5 + Math.random() * 2.5,
            life: 700 + slideBoost * 600 + Math.random() * 400,
            max: 1700,
            size: 8 + slideBoost * 14 + Math.random() * 6,
            color: trailColor, gravity: 0, kind: 'spark' });
        }
      }
    }
  }

  // paint special effects — emit ambient particles while driving
  if (speed > 5) spawnPaintFX(player.worldX, 0.6, 0, 1.0);
  // paint ground trail marks — inferno/snow/ocean leave marks on the road
  if (speed > 8) spawnPaintGroundTrail(player.worldX, speed);
  // water + fire = steam: OCEAN paint + FIRE trail → hissing steam cloud at exhaust
  if (speed > 8 && Math.random() < 0.25) {
    const paintSpec = SHOP_PAINTS.find(p => p.id === equippedPaint);
    const trailSpec = SHOP_TRAILS.find(t => t.id === equippedTrail);
    if (paintSpec && paintSpec.special === 'ocean' && trailSpec && trailSpec.special === 'fire') {
      const sp = project3D(player.worldX + (Math.random()-0.5)*1.0, 0.35, -1.85);
      if (!sp.behind) {
        for (let i = 0; i < 3; i++) {
          particles.push({ x: sp.x + (Math.random()-0.5)*14, y: sp.y + (Math.random()-0.5)*8,
            vx: (Math.random()-0.5)*1.8, vy: -(0.8 + Math.random()*2.5),
            life: 500+Math.random()*500, max: 1000,
            size: 10+Math.random()*16, color: `rgba(${200+Math.floor(Math.random()*40)},${215+Math.floor(Math.random()*30)},240,0.7)`,
            gravity: -0.018, kind: 'spark' });
        }
      }
    }
  }

  if (headOn) {
    const accelRate = 22 * car.accelMul * engineMul;
    const maxBoost = 18 * car.topMul * bodyMul;
    if (keys['arrowup']||keys['w']) speedBoost = Math.min(maxBoost, speedBoost + accelRate * dts);
    else if (keys['arrowdown']||keys['s']) speedBoost = Math.max(-7, speedBoost - accelRate * dts);
    else speedBoost *= Math.pow(0.5, dts * 3);
  } else { speedBoost = 0; }

  if (invulnTime > 0) invulnTime -= dt;
  if (damageBanner > 0) damageBanner -= dt;
  smokeTimer -= dt;

  // auto-cycle background randomly every 25-45 seconds while playing
  bgCycleTimer -= dt;
  if (bgCycleTimer <= 0) {
    let next = bgIdx;
    while (next === bgIdx) next = Math.floor(Math.random() * BACKGROUNDS.length);
    bgIdx = next;
    applyBackground();
    rebuildScenery();
    bgCycleTimer = 25000 + Math.random() * 20000;
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    if (headOn) {
      const w = WAVES[Math.min(wave, WAVES.length-1)];
      spawnPulse(w.count, w.truck);
      spawnTimer = w.interval / Math.max(0.6, speed / 22);
    } else {
      spawnEnemy();
      spawnTimer = d.spawnBase / Math.max(0.6, speed / 22) + Math.random()*250;
    }
  }

  // closing speed (capped)
  const closing = speed <= 35 ? speed : 35 + (speed - 35) * 0.5;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.worldZ -= closing * dts;
    e.mesh.position.z = e.worldZ;
    if (e.worldZ < -8) {
      scene.remove(e.mesh);
      enemies.splice(i, 1);
      dodged++;
      score += headOn ? 10 : 5;
    }
  }

  if (headOn && wave < WAVES.length - 1) {
    const w = WAVES[wave];
    if (dodged >= w.advance) { wave++; dodged = 0; waveBanner = 1800; }
  }
  if (waveBanner > 0) waveBanner -= dt;

  // collisions: both at z≈0; lateral and longitudinal overlap
  if (invulnTime <= 0) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const dim = e.mesh.userData.dim;
      const halfL = dim.l / 2;
      const halfW = dim.w / 2;
      const myHalfL = 2.2;
      const myHalfW = 1.2;
      if (Math.abs(e.worldZ) < halfL + myHalfL && Math.abs(e.worldX - player.worldX) < halfW + myHalfW) {
        takeDamage(e);
        scene.remove(e.mesh);
        enemies.splice(i, 1);
        if (state === STATE.DEAD) return;
        break;
      }
    }
  }

  // smoke + fire when damaged
  const totalDmg = (dmg.body + dmg.tires + dmg.engine) / 3;
  if (totalDmg > 0.35 && smokeTimer <= 0) {
    smokeTimer = totalDmg > 0.85 ? 35 : totalDmg > 0.6 ? 60 : 100;
    const sp = project3D(player.worldX, 1.4, -2.5);
    if (!sp.behind) {
      const grays = totalDmg > 0.7 ? ['#222','#333','#555','#444'] : ['#666','#555','#777','#888'];
      const sCount = totalDmg > 0.7 ? 2 : 1;
      for (let i = 0; i < sCount; i++) {
        particles.push({ x: sp.x + (Math.random()*2-1)*22, y: sp.y + (Math.random()*2-1)*4,
          vx: (Math.random()*2-1)*0.6, vy: -1.6 - Math.random()*1.2,
          life: 900 + Math.random()*500, max: 1400, size: 5 + Math.random()*6 + totalDmg * 4,
          color: grays[Math.floor(Math.random()*grays.length)], gravity: -0.025, kind: 'spark' });
      }
      if (totalDmg > 0.8) {
        const oranges = ['#ff8800','#ff4400','#ffd000','#ff5500'];
        for (let i = 0; i < 2; i++) {
          particles.push({ x: sp.x + (Math.random()*2-1)*16, y: sp.y - 8,
            vx: (Math.random()*2-1)*0.5, vy: -2 - Math.random()*1.5,
            life: 280 + Math.random()*220, max: 500, size: 4 + Math.random()*5,
            color: oranges[Math.floor(Math.random()*oranges.length)], gravity: -0.06, kind: 'spark' });
        }
      }
    }
  }

  score += dts * 18 * d.scoreMul;
  speed = Math.min(d.maxSpeed * car.topMul * bodyMul, d.startSpeed + score * 0.08) + speedBoost;

  // speed floor — HARD forces you to stay above 60 km/h (~16.7 m/s)
  // (only in HEAD ON where braking is possible, so the rule has teeth)
  if (difficultyIdx === 2 && headOn) {
    const minKmh = 60;
    if (speed * 3.6 < minKmh) {
      diffSpeedWarning = Math.min(2500, diffSpeedWarning + dt * 1.3);
      if (diffSpeedWarning >= 2500) {
        // penalty: treat like a crash damage tick, scaled by car durability
        const per = 0.3 / (CARS[carIdx].hitsToKill || 4);
        dmg.engine = Math.min(1, dmg.engine + per);
        dmg.body   = Math.min(1, dmg.body   + per * 0.5);
        diffSpeedWarning = 1200; // reset to mid so it doesn't instant-loop
        damageBanner = 1200;
        if (dmg.body >= 0.99 && dmg.tires >= 0.99 && dmg.engine >= 0.99) {
          state = STATE.DEAD;
          if (score > best) { best = Math.floor(score); localStorage.setItem('headon_best', best); }
          earnings = computeEarnings();
          lastEarned = earnings.total;
          if (lastEarned > 0) setCoins(coins + lastEarned);
        }
      }
    } else {
      diffSpeedWarning = Math.max(0, diffSpeedWarning - dt * 2.5);
    }
  } else {
    diffSpeedWarning = Math.max(0, diffSpeedWarning - dt * 2.5);
  }

  // gameplay stats
  gameTime += dts;
  distanceM += speed * dts;
  if (speed * 3.6 > 80) speedingTime += dt;
  if (speed > maxSpeed) maxSpeed = speed;
}

function updateParticles(dt) {
  const f = dt / 16;
  for (const p of particles) {
    p.x += p.vx*f; p.y += p.vy*f; p.vy += p.gravity*f; p.life -= dt;
    if (p.spin != null) p.rot += p.spin*f;
  }
  particles = particles.filter(p => p.life > 0);
}

// ===== sync 3D scene =====
function syncScene() {
  const inShowroom = (state === STATE.MENU || state === STATE.HELP || state === STATE.ARENA_SELECT || state === STATE.GEM_SHOP);
  const inGarage = (state === STATE.GARAGE);
  const inIndoor   = inShowroom || inGarage;
  const inArena = (state === STATE.ARENA) || (state === STATE.DEAD && earnings && earnings.mode === 'ARENA');
  roadMesh.visible = !inIndoor && !inArena;
  grassMesh.visible = !inIndoor && !inArena;
  mountains.visible = !inIndoor && !inArena;
  showroomGroup.visible = inShowroom;
  arenaGroup.visible = inArena;
  for (const b of arenaBots) { if (b.mesh) b.mesh.visible = inArena && b.state === 'alive'; }
  for (const s of scenery) s.mesh.visible = !inIndoor && !inArena;
  stars.visible = !inIndoor && !inArena && BACKGROUNDS[bgIdx].stars;

  if (inArena) {
    scene.background = new THREE.Color(0x5bbde4);
    scene.fog.color.set(0x5bbde4);
    scene.fog.near = 90; scene.fog.far = 220;
    hemi.color.set(0x5bbde4);
    hemi.groundColor.set(0x0055bb);
    ambient.intensity = 0.35;
  } else if (inGarage) {
    scene.background = new THREE.Color(0x808088);
    scene.fog.color.set(0x808088);
    scene.fog.near = 20; scene.fog.far = 50;
    hemi.color.set(0xfff8e8);
    hemi.groundColor.set(0x606068);
    ambient.intensity = 0.5;
  }

  if (inIndoor) {
    if (!inGarage) ambient.intensity = 0.45;
    if (playerCarGroup) {
      playerCarGroup.position.set(0, 0.18, 1);
      playerCarGroup.rotation.set(0, menuBlink * 0.0008, 0);
      playerCarGroup.visible = true;
      applyDamageVisual(playerCarGroup, 0);
      spawnPaintFX(0, 0.9, 1, 1.4);
    }
    const orbit = -Math.PI/4 + Math.sin(menuBlink * 0.00018) * 0.4;
    const dist = inGarage ? 8.5 : 9.5;
    const camH = inGarage ? 2.6 : 3.4;
    camera.position.set(Math.sin(orbit) * dist, camH, Math.cos(orbit) * -dist + 1);
    camera.lookAt(0, 1.1, 1);
  } else {
    // restore ambient from background
    const bg = BACKGROUNDS[bgIdx];
    ambient.intensity = bg.name === 'NIGHT' ? 0.08 : 0.25;
    // difficulty-based fog: EASY=clear, NORMAL=standard, HARD=thick
    if (state === STATE.PLAYING || (state === STATE.DEAD && !(earnings && earnings.mode === 'ARENA'))) {
      const fogMul = [2.2, 1.0, 0.38][difficultyIdx];
      scene.fog.near = 60 * fogMul;
      scene.fog.far  = 240 * fogMul;
      scene.fog.color.set(bg.fog);
    }
    if (playerCarGroup) {
      playerCarGroup.position.set(player.worldX, 0, 0);
      playerCarGroup.rotation.set(0, 0, -player.vx / maxSteerRef() * 0.08);
      const totalDmg = (dmg.body + dmg.tires + dmg.engine) / 3;
      applyDamageVisual(playerCarGroup, totalDmg);
      if (invulnTime > 0 && Math.floor(invulnTime / 90) % 2 === 0) playerCarGroup.visible = false;
      else playerCarGroup.visible = state !== STATE.DEAD;
    }
    const sx = (Math.random()*2-1) * shakeMag;
    const sy = (Math.random()*2-1) * shakeMag * 0.5;
    if (inArena) {
      // chase camera, pulled high & back so you can see most of the platform
      const dist = 24;
      const camY = 17;
      const cx = arenaPlayer.x - Math.sin(arenaPlayer.heading) * dist + sx;
      const cy = Math.max(arenaPlayer.y, 0) + camY + sy;
      const cz = arenaPlayer.z - Math.cos(arenaPlayer.heading) * dist;
      camera.position.set(cx, cy, cz);
      camera.lookAt(
        arenaPlayer.x + Math.sin(arenaPlayer.heading) * 4,
        arenaPlayer.y + 0.8,
        arenaPlayer.z + Math.cos(arenaPlayer.heading) * 4
      );
      if (playerCarGroup) {
        playerCarGroup.position.set(arenaPlayer.x, arenaPlayer.y, arenaPlayer.z);
        playerCarGroup.rotation.set(0, arenaPlayer.heading, 0);
        playerCarGroup.visible = true;
      }
    } else {
      camera.position.set(player.worldX * 0.25 + sx, 3.4 + sy, -10);
      camera.lookAt(player.worldX * 0.35, 1.4, 10);
    }
  }
}
function maxSteerRef() { return 14 * CARS[carIdx].steerMul; }

// ===== HUD canvas drawing =====
function drawHud2D() {
  ctx.clearRect(0, 0, W, H);
  drawParticles();
  if (state === STATE.PLAYING || state === STATE.DEAD) drawHud();
  if (state === STATE.MENU) drawMenu();
  if (state === STATE.HELP) drawHelp();
  if (state === STATE.DEAD) drawCrash();
  if (state === STATE.ARENA) drawArenaHud();
  if (state === STATE.GARAGE) drawGarage();
  if (state === STATE.ARENA_SELECT) drawArenaSelect();
  if (state === STATE.GEM_SHOP) drawGemShop();
}

function drawArenaSelect() {
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd54a';
  ctx.font = 'bold 30px system-ui';
  ctx.fillText('⬢  ARENA', W/2, 50);

  const allUnlocked = arenaProgress >= 10;
  ctx.fillStyle = '#aaa';
  ctx.font = '12px system-ui';
  ctx.fillText(allUnlocked ? '🏆 All levels unlocked!' : 'Beat 1st place to unlock the next level', W/2, 72);

  const cols = 5, bw = 78, bh = 72, gapX = 8, gapY = 10;
  const totalW = cols * bw + (cols - 1) * gapX;
  const startX = (W - totalW) / 2;
  const startY = 92;

  arenaSelectButtons = [];
  for (let i = 0; i < 10; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const bx = startX + col * (bw + gapX);
    const by_ = startY + row * (bh + gapY);
    const level = i + 1;
    const hasBarrier = level <= 5;
    const locked = !allUnlocked && level > arenaProgress + 1;
    const hov = !locked && mouse.x >= bx && mouse.x <= bx + bw && mouse.y >= by_ && mouse.y <= by_ + bh;
    const done = level <= arenaProgress;

    ctx.fillStyle = locked ? 'rgba(20,20,24,0.92)'
      : hov ? (hasBarrier ? 'rgba(0,220,255,0.85)' : 'rgba(255,68,221,0.85)')
      : done ? 'rgba(30,50,30,0.88)' : 'rgba(14,14,28,0.88)';
    roundedRect(bx, by_, bw, bh, 9); ctx.fill();
    ctx.strokeStyle = locked ? '#333' : done ? '#44cc44' : (hasBarrier ? '#00f0ff' : '#ff44dd');
    ctx.lineWidth = hov ? 2.5 : 1.8;
    roundedRect(bx, by_, bw, bh, 9); ctx.stroke();

    if (locked) {
      ctx.fillStyle = '#444';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText('🔒', bx + bw / 2, by_ + 36);
      ctx.font = '9px system-ui';
      ctx.fillText('beat lv ' + (level - 1), bx + bw / 2, by_ + 54);
    } else {
      ctx.fillStyle = hov ? '#111' : (done ? '#88ff88' : '#ffd54a');
      ctx.font = 'bold 26px system-ui';
      ctx.fillText(level, bx + bw / 2, by_ + 32);

      ctx.fillStyle = hov ? '#222' : (done ? '#44cc44' : (hasBarrier ? '#00f0ff' : '#ff44dd'));
      ctx.font = 'bold 9px system-ui';
      ctx.fillText(done ? '✓ DONE' : (hasBarrier ? '🔒 BARRIER' : '🔓 OPEN'), bx + bw / 2, by_ + 46);

      // difficulty pips
      const pips = Math.ceil(level / 2);
      for (let p = 0; p < 5; p++) {
        ctx.fillStyle = p < pips ? (hov ? '#333' : '#ffd54a') : 'rgba(255,255,255,0.12)';
        ctx.beginPath();
        ctx.arc(bx + bw / 2 - 22 + p * 11, by_ + 61, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    arenaSelectButtons.push({ x: bx, y: by_, w: bw, h: bh, level, locked });
  }

  ctx.font = '11px system-ui';
  ctx.fillStyle = '#00f0ff';
  ctx.fillText('Levels 1–5  ·  barrier walls prevent falling off the sides', W / 2, startY + 2 * bh + gapY + 20);
  ctx.fillStyle = '#ff44dd';
  ctx.fillText('Levels 6–10 ·  open edges  ·  aggressive AI', W / 2, startY + 2 * bh + gapY + 36);

function drawArenaHud() {
  // skid marks — drawn first (behind HUD)
  for (const s of skidMarks) {
    if (s.life <= 0) continue;
    const p = project3D(s.wx, s.wy, s.wz);
    if (p.behind) continue;
    const alpha = (s.life / s.maxLife) * 0.5 * s.intensity;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = getTrailColor(_trailT + s.life * 0.001);
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 12, 6, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const aliveBots = arenaBots.filter(b => b.state === 'alive').length;
  const livePlacement = aliveBots + 1; // 3 bots alive = 4th, 0 alive = 1st
  const labels  = ['', '1ST', '2ND', '3RD', '4TH'];
  const colours = ['', '#ffd700', '#c0c0c0', '#cd7f32', '#ff6666'];
  const label   = labels[livePlacement]  || '4TH';
  const col     = colours[livePlacement] || '#ff6666';

  // pill background
  ctx.save();
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = '#111';
  const pw = 148, ph = 32, px = W / 2 - pw / 2, py = 10;
  ctx.beginPath();
  ctx.roundRect(px, py, pw, ph, 8);
  ctx.fill();
  ctx.globalAlpha = 1;

  // placement text
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px system-ui';
  ctx.fillStyle = col;
  ctx.fillText(label + ' PLACE', W / 2, py + 22);

  // time
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#aaa';
  ctx.fillText(Math.floor(gameTime) + 's  ·  ' + aliveBots + ' rivals left', W / 2, py + ph + 14);

  // nitro indicator
  if (nitroTime > 0) {
    const frac = nitroTime / 5000;
    const nx = W / 2 - 60, ny = H - 48, nw = 120, nh = 18;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.roundRect(nx, ny, nw, nh, 5); ctx.fill();
    ctx.fillStyle = frac > 0.5 ? '#ffcc00' : '#ff6600';
    ctx.beginPath(); ctx.roundRect(nx, ny, nw * frac, nh, 5); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = 'bold 11px system-ui';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('⚡ NITRO', W / 2, ny - 4);
  } else if (!nitroPickup && !arenaElimOrder.includes('player') && nitroSpawnTimer > 0) {
    const remaining = Math.ceil(nitroSpawnTimer / 1000);
    ctx.globalAlpha = 0.55;
    ctx.font = '10px system-ui';
    ctx.fillStyle = '#ffcc00';
    ctx.textAlign = 'center';
    ctx.fillText('⚡ next nitro in ' + remaining + 's', W / 2, H - 34);
    ctx.globalAlpha = 1;
  }

  // level badge top-left
  const lvColor = arenaLevel <= 5 ? '#00f0ff' : '#ff44dd';
  ctx.globalAlpha = 0.78;
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.roundRect(10, 10, 68, 30, 7); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = lvColor;
  ctx.font = 'bold 14px system-ui';
  ctx.fillText('LV ' + arenaLevel + (arenaLevel <= 5 ? ' 🔒' : ' 🔓'), 44, 29);

  ctx.textAlign = 'left';
  ctx.restore();
}
function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, Math.min(1, p.life / p.max));
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.kind === 'debris') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
    } else if (p.kind === 'groundmark') {
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.size, p.size * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}

      ctx.globalAlpha = (warnFrac - 0.5) * 2 * 0.22 * (Math.sin(Date.now() / 100) * 0.5 + 0.5);
      ctx.fillStyle = '#ff0000';

    ctx.fillRect(0, H/2 - 30, W, 50);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px system-ui';
    ctx.textAlign = 'center';

  if (waveBanner > 0 && state === STATE.PLAYING) {

    ctx.fillStyle = 'rgba(0,0,0,0.5)';

function drawDamageBars() {

const STAT_MAX = 2.20;
function drawCarStats(car, cx, cy) {
  const rows = [['TOP SPEED', car.topMul], ['HANDLING', car.steerMul], ['ACCELERATION', car.accelMul]];
  const barW = 100, barH = 7, labelW = 88, valW = 28;
  ctx.textAlign = 'left'; ctx.font = '10px system-ui';
  for (let i = 0; i < rows.length; i++) {
    const [name, val] = rows[i];
    const y = cy + i * 16;
    ctx.fillStyle = '#bbb'; ctx.fillText(name, cx, y);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.roundRect(cx + labelW, y - barH + 1, barW, barH, 2); ctx.fill();
    const t = Math.min(1, val / STAT_MAX);
    const r = Math.round(t < 0.5 ? t * 2 * 255 : 255);
    const gv = Math.round(t < 0.5 ? 213 : (1 - (t - 0.5) * 2) * 213);
    const b  = Math.round(t < 0.5 ? (1 - t * 2) * 255 : 0);
    ctx.fillStyle = `rgb(${r},${gv},${b})`;
    ctx.beginPath(); ctx.roundRect(cx + labelW, y - barH + 1, barW * t, barH, 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(val.toFixed(2), cx + labelW + barW + valW, y);
    ctx.textAlign = 'left'; ctx.font = '10px system-ui';
  }
  // car buff badges
  const buffY = cy + rows.length * 16 + 6;
  const coinM = car.coinMul || 1;
  const gemPct = ((car.gemChance || 0) * 100).toFixed(coinM >= 5 ? 2 : 3);
  const hits = car.hitsToKill || 4;
  ctx.font = 'bold 9px system-ui';
  ctx.fillStyle = coinM > 1 ? '#ffd54a' : '#666';
  ctx.fillText('● ×' + coinM + ' coins', cx, buffY);
  ctx.fillStyle = '#b39ddb';
  ctx.fillText('◆ ' + gemPct + '%', cx + 82, buffY);
  ctx.fillStyle = hits >= 10 ? '#44ff88' : hits >= 5 ? '#ffdd44' : '#ff7766';
  ctx.fillText('❤ ' + hits + ' hits', cx + 140, buffY);
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else { ctx.rect(x, y, w, h); }
}

function garageBtn(label, x, y, w, h, action, opts={}) {
  const hov = mouse.x>=x && mouse.x<=x+w && mouse.y>=y && mouse.y<=y+h && !opts.disabled;
  ctx.fillStyle = opts.disabled ? 'rgba(40,40,50,0.6)'
                : opts.active   ? 'rgba(255,68,221,0.9)'
                : hov           ? 'rgba(255,68,221,0.7)'
                                : 'rgba(20,20,30,0.75)';
  roundedRect(x, y, w, h, 5); ctx.fill();
  ctx.strokeStyle = opts.disabled ? '#444' : (opts.active ? '#fff' : '#ff44dd');
  ctx.lineWidth = opts.active ? 2.5 : 1.5;
  roundedRect(x, y, w, h, 5); ctx.stroke();
  ctx.fillStyle = opts.disabled ? '#888' : '#fff';
  ctx.font = opts.small ? 'bold 10px system-ui' : 'bold 12px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x+w/2, y+h/2);
  ctx.textBaseline = 'alphabetic';
  garageButtons.push({ x, y, w, h, action, disabled: !!opts.disabled });
}

function drawGarageRoom() {
  const RB = 200; // bottom of garage room area
  // opaque shop background below the room
  ctx.fillStyle = 'rgba(6,8,20,0.96)';
  ctx.fillRect(0, RB, W, H - RB);

  // garage door horizontal stripes across the top
  const sH = 14, nS = 5;
  for (let i = 0; i < nS; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(188,188,202,0.84)' : 'rgba(162,162,176,0.84)';
    ctx.fillRect(0, i * sH, W, sH);
  }
  ctx.strokeStyle = 'rgba(65,65,76,0.55)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= nS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * sH - 0.5); ctx.lineTo(W, i * sH - 0.5); ctx.stroke();
  }

  // perspective walls — inner transparent window where car shows through
  const IT = nS * sH, IL = 62, IR = W - 62, IB = RB - 6;
  // left wall
  ctx.fillStyle = 'rgba(148,150,162,0.88)';
  ctx.beginPath();
  ctx.moveTo(0, IT); ctx.lineTo(IL, IT); ctx.lineTo(IL, IB); ctx.lineTo(0, RB);
  ctx.closePath(); ctx.fill();
  // right wall
  ctx.beginPath();
  ctx.moveTo(W, IT); ctx.lineTo(IR, IT); ctx.lineTo(IR, IB); ctx.lineTo(W, RB);
  ctx.closePath(); ctx.fill();
  // floor strip
  ctx.fillStyle = 'rgba(96,98,110,0.88)';
  ctx.beginPath();
  ctx.moveTo(0, RB); ctx.lineTo(W, RB); ctx.lineTo(IR, IB); ctx.lineTo(IL, IB);
  ctx.closePath(); ctx.fill();

  // inner frame line
  ctx.strokeStyle = 'rgba(45,45,54,0.65)';
  ctx.lineWidth = 2;
  ctx.strokeRect(IL, IT, IR - IL, IB - IT);

  // tires stacked on right wall
  const tx = W - 30;
  for (let i = 0; i < 3; i++) {
    const ty = RB - 16 - i * 22;
    ctx.fillStyle = '#1e1e22';
    ctx.beginPath(); ctx.ellipse(tx, ty, 15, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5e5e70';
    ctx.beginPath(); ctx.ellipse(tx, ty, 5, 3, 0, 0, Math.PI*2); ctx.fill();
  }

  // workbench on left wall
  const wx = 4, ww = 54, wy = RB - 54;
  ctx.fillStyle = '#7a5530'; ctx.fillRect(wx, wy, ww, 8);
  ctx.fillStyle = '#4a3020'; ctx.fillRect(wx, wy + 8, ww, 32);
  // red toolbox on workbench
  ctx.fillStyle = '#cc2020'; ctx.fillRect(wx, wy - 17, 22, 17);
  ctx.fillStyle = '#aa1010'; ctx.fillRect(wx + 2, wy - 10, 18, 3);
}
