<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>KEY ROOM</title>
<style>
  :root{ --cyan:#33e8ff; --magenta:#ff3df0; --violet:#a855ff; --lime:#9bff5b; --bg0:#05030f; --bg1:#0c0822; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg0);
    color:#eef; font-family:'Segoe UI', system-ui, sans-serif; user-select:none; }
  canvas{ display:block; position:fixed; inset:0; }

  /* back to arcade — always visible */
  #home{ position:fixed; top:12px; left:12px; z-index:30; text-decoration:none;
    font:800 13px/1 system-ui,sans-serif; letter-spacing:2px; color:#cfe; padding:9px 14px;
    border-radius:999px; background:rgba(10,8,30,.62); border:1px solid rgba(120,160,255,.4);
    backdrop-filter:blur(6px); box-shadow:0 4px 18px rgba(0,0,0,.45); }
  #home:hover{ background:rgba(51,232,255,.22); border-color:var(--cyan); color:#fff; }

  #mute{ position:fixed; top:12px; right:12px; z-index:30; cursor:pointer; color:#cfe;
    font:800 13px/1 system-ui; letter-spacing:1px; padding:9px 14px; border-radius:999px;
    background:rgba(10,8,30,.62); border:1px solid rgba(120,160,255,.4); backdrop-filter:blur(6px); }
  #mute:hover{ background:rgba(120,160,255,.2); }

  #hud{ position:fixed; left:0; right:0; bottom:14px; z-index:20; text-align:center;
    pointer-events:none; font-size:12px; letter-spacing:2px; color:#9fb6ff; text-transform:uppercase; }
  #hud b{ color:var(--lime); }

  /* start overlay (gates audio behind a tap) */
  #start{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; padding:24px; text-align:center;
    background:radial-gradient(1000px 700px at 50% 20%, rgba(168,85,255,.25), transparent 60%),
      linear-gradient(180deg, var(--bg1), var(--bg0)); transition:opacity .4s; }
  #start.hide{ opacity:0; pointer-events:none; }
  #start h1{ margin:0; font-size:clamp(40px,10vw,96px); font-weight:900; letter-spacing:6px;
    background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--violet),var(--cyan));
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:hue 6s linear infinite; filter:drop-shadow(0 0 18px rgba(51,232,255,.5)); }
  @keyframes hue{ to{ background-position:300% 0; } }
  #start p{ margin:0; max-width:520px; color:#cfe; line-height:1.5; font-size:15px; }
  #start .hint{ color:#9fb6ff; font-size:13px; letter-spacing:1px; }
  .btn{ cursor:pointer; border:none; border-radius:14px; padding:16px 40px; font-size:18px; font-weight:900;
    letter-spacing:3px; text-transform:uppercase; color:#04121a;
    background:linear-gradient(90deg,var(--cyan),var(--lime)); box-shadow:0 0 24px rgba(51,232,255,.5);
    transition:transform .12s; }
  .btn:active{ transform:translateY(2px); }

  /* mobile joystick */
  #stick{ position:fixed; z-index:25; left:26px; bottom:26px; width:132px; height:132px; border-radius:50%;
    background:rgba(120,160,255,.10); border:2px solid rgba(120,160,255,.35); display:none; touch-action:none; }
  #stick .nub{ position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px;
    border-radius:50%; background:rgba(51,232,255,.5); border:2px solid rgba(255,255,255,.6);
    box-shadow:0 0 18px rgba(51,232,255,.6); }
  #jump{ position:fixed; z-index:25; right:26px; bottom:36px; width:96px; height:96px; border-radius:50%;
    display:none; align-items:center; justify-content:center; font-weight:900; letter-spacing:2px; color:#04121a;
    background:linear-gradient(90deg,var(--magenta),var(--violet)); border:none;
    box-shadow:0 0 20px rgba(255,61,240,.5); font-size:15px; touch-action:none; }
  body.touch #stick, body.touch #jump{ display:flex; }
</style>
</head>
<body>
<a id="home" href="index.html">← ARCADE</a>
<div id="mute">🔊 SOUND</div>
<div id="hud">Walk on the <b>keys</b> · they click &amp; light up · drag to look</div>

<div id="stick"><div class="nub"></div></div>
<button id="jump">JUMP</button>

<div id="start">
  <h1>🎹 KEY ROOM</h1>
  <p id="greet">Welcome. Walk around the room and step on the keys — each one clicks and lights up.</p>
  <p class="hint">Move: W A S D / arrows &nbsp;·&nbsp; Jump: Space &nbsp;·&nbsp; Look: drag / Q E &nbsp;·&nbsp; Mobile: joystick + JUMP</p>
  <button class="btn" id="play">▶ Enter</button>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

// ---------- basics ----------
const $ = s => document.querySelector(s);
const NAME = (localStorage.getItem('headon_username') || 'PLAYER').toUpperCase();
$('#greet').textContent = `Welcome, ${NAME}. Walk around the room and step on the keys — each one clicks and lights up.`;
let soundOn = localStorage.getItem('headon_sound_on') !== '0';
const syncMute = () => { $('#mute').textContent = soundOn ? '🔊 SOUND' : '🔇 MUTED'; };
syncMute();
$('#mute').addEventListener('click', () => { soundOn = !soundOn; localStorage.setItem('headon_sound_on', soundOn ? '1' : '0'); syncMute(); });

if (matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window) document.body.classList.add('touch');

// ---------- three setup ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07051a);
scene.fog = new THREE.Fog(0x07051a, 40, 90);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 300);

function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// lights
scene.add(new THREE.AmbientLight(0x8899ff, 0.55));
const dir = new THREE.DirectionalLight(0xffffff, 0.9); dir.position.set(12, 24, 8); scene.add(dir);
const p1 = new THREE.PointLight(0x33e8ff, 0.8, 120); p1.position.set(-18, 14, -18); scene.add(p1);
const p2 = new THREE.PointLight(0xff3df0, 0.8, 120); p2.position.set(18, 14, 18); scene.add(p2);

// ---------- room ----------
const GRID = 9;            // keys per side
const TILE = 3.2;          // tile size (world units)
const GAP = 0.18;
const HALF = (GRID*TILE)/2;
const BOUND = HALF - 0.8;  // keep player inside

// walls + ceiling
const wallMat = new THREE.MeshStandardMaterial({ color:0x120c2e, roughness:0.9, metalness:0.1 });
const roomH = 14, roomExtra = 6;
const roomSize = GRID*TILE + roomExtra*2;
function wall(x,z,w,rotY){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, roomH, 0.6), wallMat);
  m.position.set(x, roomH/2 - 0.2, z); m.rotation.y = rotY; scene.add(m);
  // neon trim strip
  const trim = new THREE.Mesh(new THREE.BoxGeometry(w, 0.25, 0.8),
    new THREE.MeshStandardMaterial({ color:0x33e8ff, emissive:0x33e8ff, emissiveIntensity:1.2 }));
  trim.position.set(x, 3.6, z); trim.rotation.y = rotY; scene.add(trim);
}
const s = roomSize;
wall(0, -s/2, s, 0); wall(0, s/2, s, 0);
wall(-s/2, 0, s, Math.PI/2); wall(s/2, 0, s, Math.PI/2);
// ceiling
const ceil = new THREE.Mesh(new THREE.BoxGeometry(s, 0.5, s), wallMat);
ceil.position.set(0, roomH, 0); scene.add(ceil);
// base floor under the keys
const base = new THREE.Mesh(new THREE.BoxGeometry(s, 1, s),
  new THREE.MeshStandardMaterial({ color:0x0a0820, roughness:1 }));
base.position.set(0, -0.9, 0); scene.add(base);

// ---------- keys (the floor tiles you step on) ----------
// pentatonic-ish notes so walking makes pleasant tones alongside the click
const SCALE = [261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99];
const KEY_COLORS = [0x33e8ff, 0xff3df0, 0xa855ff, 0x9bff5b];
const keys = [];                 // {mesh, baseY, note, col, pressed, glow}
const keyMat = i => new THREE.MeshStandardMaterial({
  color: KEY_COLORS[i % KEY_COLORS.length], roughness:0.45, metalness:0.25,
  emissive: KEY_COLORS[i % KEY_COLORS.length], emissiveIntensity:0.08 });

for (let r=0; r<GRID; r++){
  for (let c=0; c<GRID; c++){
    const mat = keyMat((r+c));
    const m = new THREE.Mesh(new THREE.BoxGeometry(TILE-GAP, 0.7, TILE-GAP), mat);
    const x = -HALF + TILE/2 + c*TILE;
    const z = -HALF + TILE/2 + r*TILE;
    m.position.set(x, 0, z);
    scene.add(m);
    keys.push({ mesh:m, baseY:0, note:SCALE[(r*3+c) % SCALE.length], pressed:0, r, c });
  }
}
function tileIndexAt(x, z){
  const c = Math.floor((x + HALF) / TILE);
  const r = Math.floor((z + HALF) / TILE);
  if (c<0 || c>=GRID || r<0 || r>=GRID) return -1;
  return r*GRID + c;
}

// ---------- character (blocky Roblox-style avatar) ----------
const player = new THREE.Group();
scene.add(player);
function limbMat(hex){ return new THREE.MeshStandardMaterial({ color:hex, roughness:0.6 }); }
const SKIN = 0xf4d9b0, SHIRT = 0xffffff, PANTS = 0x2b3a67;
function box(w,h,d,mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); }
// torso
const torso = box(1.5, 1.8, 0.9, limbMat(SHIRT)); torso.position.y = 2.7; player.add(torso);
// head
const head = box(1.1, 1.1, 1.1, limbMat(SKIN)); head.position.y = 4.15; player.add(head);
// simple face
const eyeMat = new THREE.MeshStandardMaterial({ color:0x101020 });
for (const sx of [-0.26, 0.26]){ const e = box(0.16,0.22,0.06, eyeMat); e.position.set(sx, 4.2, 0.56); player.add(e); }
// arms (pivoted at shoulder)
function limb(x, mat){
  const pivot = new THREE.Group(); pivot.position.set(x, 3.55, 0);
  const seg = box(0.55, 1.8, 0.55, mat); seg.position.y = -0.9; pivot.add(seg);
  player.add(pivot); return pivot;
}
const armL = limb(-1.05, limbMat(SKIN)), armR = limb(1.05, limbMat(SKIN));
// legs (pivoted at hip)
function leg(x){
  const pivot = new THREE.Group(); pivot.position.set(x, 1.8, 0);
  const seg = box(0.6, 1.8, 0.6, limbMat(PANTS)); seg.position.y = -0.9; pivot.add(seg);
  player.add(pivot); return pivot;
}
const legL = leg(-0.42), legR = leg(0.42);

const pos = { x: 0, z: 0 };
let py = 0, vy = 0, grounded = true, heading = 0, walkPhase = 0;

// ---------- input ----------
const keyState = {};
addEventListener('keydown', e => { keyState[e.key.toLowerCase()] = true; if (e.key === ' ') e.preventDefault(); });
addEventListener('keyup',   e => { keyState[e.key.toLowerCase()] = false; });

// camera orbit via drag
let camYaw = 0, dist = 15, height = 10;
let dragging = false, lastX = 0;
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => { if (dragging){ camYaw -= (e.clientX - lastX) * 0.006; lastX = e.clientX; } });

// mobile joystick
let joyX = 0, joyZ = 0;
const stick = $('#stick'), nub = stick.querySelector('.nub');
let stickId = null;
stick.addEventListener('pointerdown', e => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); moveNub(e); });
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) moveNub(e); });
stick.addEventListener('pointerup',   e => { if (e.pointerId === stickId){ stickId=null; joyX=joyZ=0; nub.style.transform='translate(0,0)'; } });
function moveNub(e){
  const r = stick.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  const max = r.width/2 - 12, len = Math.hypot(dx,dy);
  if (len > max){ dx *= max/len; dy *= max/len; }
  nub.style.transform = `translate(${dx}px,${dy}px)`;
  joyX = dx/max; joyZ = dy/max;
}
$('#jump').addEventListener('pointerdown', e => { e.preventDefault(); doJump(); });
function doJump(){ if (grounded){ vy = 13; grounded = false; } }

// ---------- audio (realistic click + subtle tone) ----------
let actx = null;
function playClick(note){
  if (!soundOn) return;
  if (!actx){ try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; } }
  const t = actx.currentTime;
  // percussive "clack": short filtered noise burst
  const dur = 0.05, n = Math.floor(actx.sampleRate*dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<n;i++){ d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 3); }
  const src = actx.createBufferSource(); src.buffer = buf;
  const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2400; bp.Q.value=0.7;
  const g = actx.createGain(); g.gain.setValueAtTime(0.55, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  src.connect(bp); bp.connect(g); g.connect(actx.destination); src.start(t); src.stop(t+dur);
  // subtle musical tone
  if (note){
    const o = actx.createOscillator(); o.type='triangle'; o.frequency.value = note;
    const g2 = actx.createGain(); g2.gain.setValueAtTime(0.16, t); g2.gain.exponentialRampToValueAtTime(0.001, t+0.28);
    o.connect(g2); g2.connect(actx.destination); o.start(t); o.stop(t+0.3);
  }
}

// ---------- game loop ----------
let lastTile = -1;
const clock = new THREE.Clock();
function frame(){
  const dt = Math.min(clock.getDelta(), 0.05);

  // movement input (camera-relative)
  let iF = (keyState['w']||keyState['arrowup']?1:0) - (keyState['s']||keyState['arrowdown']?1:0);
  let iR = (keyState['d']||keyState['arrowright']?1:0) - (keyState['a']||keyState['arrowleft']?1:0);
  iR += joyX; iF -= joyZ;               // joystick: up = forward
  if (keyState['q']) camYaw += 1.6*dt;
  if (keyState['e']) camYaw -= 1.6*dt;
  if (keyState[' ']) doJump();

  const fX = -Math.sin(camYaw), fZ = -Math.cos(camYaw);
  const rX =  Math.cos(camYaw), rZ = -Math.sin(camYaw);
  let mx = fX*iF + rX*iR, mz = fZ*iF + rZ*iR;
  const mlen = Math.hypot(mx, mz);
  const SPEED = 11;
  if (mlen > 0.01){
    mx/=mlen; mz/=mlen;
    pos.x += mx*SPEED*dt; pos.z += mz*SPEED*dt;
    pos.x = Math.max(-BOUND, Math.min(BOUND, pos.x));
    pos.z = Math.max(-BOUND, Math.min(BOUND, pos.z));
    heading = Math.atan2(mx, mz);
    walkPhase += dt*10;
  } else {
    walkPhase *= 0.8;
  }

  // jump / gravity
  vy -= 34*dt; py += vy*dt;
  if (py <= 0){ py = 0; if (!grounded) onLand(); grounded = true; vy = 0; }
  else grounded = false;

  // place + animate character
  player.position.set(pos.x, py, pos.z);
  player.rotation.y += (heading - player.rotation.y) * Math.min(1, dt*12);
  const swing = Math.sin(walkPhase) * (mlen>0.01 ? 0.7 : 0);
  legL.rotation.x = swing;  legR.rotation.x = -swing;
  armL.rotation.x = -swing; armR.rotation.x = swing;

  // which key are we on? click on entering a new one (while grounded)
  const ti = tileIndexAt(pos.x, pos.z);
  if (grounded && ti !== -1 && ti !== lastTile){ pressKey(ti); }
  lastTile = grounded ? ti : lastTile;

  // animate keys (pressed dips down + glows, then eases back)
  for (const k of keys){
    k.pressed = Math.max(0, k.pressed - dt*3.2);
    const targetY = -0.55 * k.pressed;
    k.mesh.position.y += (targetY - k.mesh.position.y) * Math.min(1, dt*18);
    k.mesh.material.emissiveIntensity = 0.08 + k.pressed*1.6;
  }

  // camera follow (stable behind + above, always looking at the player)
  const cx = pos.x + Math.sin(camYaw)*dist;
  const cz = pos.z + Math.cos(camYaw)*dist;
  const cyT = py + height;
  camera.position.x += (cx - camera.position.x) * Math.min(1, dt*6);
  camera.position.y += (cyT - camera.position.y) * Math.min(1, dt*6);
  camera.position.z += (cz - camera.position.z) * Math.min(1, dt*6);
  camera.lookAt(pos.x, py + 2.4, pos.z);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function pressKey(ti){ const k = keys[ti]; if (!k) return; k.pressed = 1; playClick(k.note); }
function onLand(){ const ti = tileIndexAt(pos.x, pos.z); if (ti !== -1){ pressKey(ti); } }

// place camera initially behind the player
camera.position.set(0, height, dist);
camera.lookAt(0, 2.4, 0);

// ---------- start ----------
$('#play').addEventListener('click', () => {
  $('#start').classList.add('hide');
  try { if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); } catch(e){}
});
requestAnimationFrame(frame);
</script>
</body>
</html>
