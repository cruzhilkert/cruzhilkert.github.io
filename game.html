    if (d < bestDist) { bestDist = d; nearest = t; }
  }
  if (Math.sqrt(bestDist) < HEX_SIZE * 0.95) return nearest;
  return null;
}

function buildCityMap() {
  for (const m of freeMapMeshes) arenaGroup.remove(m);
  freeMapMeshes = []; freeMapBuildings = []; freeMapBuildingMats = []; freeMapStations = []; freeMapRaceSquares = []; freeMapShowOffPads = []; freeMapLastShowPad = null; freeMapMiniGamePads = []; freeMapRaceCountdown = 0; freeMapBorder = null;
  freeMapInRace = false; freeMapRaceRoad = null;
  for (const t of arenaTiles) arenaGroup.remove(t.mesh);
  arenaTiles.length = 0;

  const ROAD_W = 14;   // road width
  const CELL   = 64;   // center-to-center spacing between roads
  const RANGE  = 7;    // roads at -7…+7 each direction
  const SPAN   = RANGE * CELL + ROAD_W / 2 + 2;

  const matAsphalt = new THREE.MeshLambertMaterial({ color: 0x252525 });
  const matBlock   = new THREE.MeshLambertMaterial({ color: 0x141414 });
  const matYellow  = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
  const matWhite   = new THREE.MeshBasicMaterial({ color: 0xdddddd });
  const matCurb    = new THREE.MeshLambertMaterial({ color: 0x3a3a3a });

  // base ground (block areas — slightly darker than road)
  const base = new THREE.Mesh(new THREE.PlaneGeometry(SPAN * 2 + 20, SPAN * 2 + 20), matBlock);
  base.rotation.x = -Math.PI / 2; base.position.y = -0.02;
  arenaGroup.add(base); freeMapMeshes.push(base);

  function addStrip(px, pz, w, d, mat, y = 0) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
    m.rotation.x = -Math.PI / 2; m.position.set(px, y, pz);
    arenaGroup.add(m); freeMapMeshes.push(m);
  }
  function addCurb(px, pz, w, d) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.18, d), matCurb);
    m.position.set(px, 0.09, pz);
    arenaGroup.add(m); freeMapMeshes.push(m);
  }

  // horizontal road strips (run along X axis)
  for (let i = -RANGE; i <= RANGE; i++) {
    const z = i * CELL;
    addStrip(0, z, SPAN * 2, ROAD_W, matAsphalt);           // asphalt
    addStrip(0, z, SPAN * 2, 0.45, matYellow, 0.01);        // yellow centre line
    addStrip(0, z - ROAD_W/2 + 0.3, SPAN*2, 0.3, matWhite, 0.01); // white edge -
    addStrip(0, z + ROAD_W/2 - 0.3, SPAN*2, 0.3, matWhite, 0.01); // white edge +
    addCurb(0, z - ROAD_W/2 - 0.1, SPAN*2, 0.4);            // curb -
    addCurb(0, z + ROAD_W/2 + 0.1, SPAN*2, 0.4);            // curb +
    // dashed lane lines
    for (let x = -SPAN + 3; x < SPAN; x += 10) {
      addStrip(x, z - ROAD_W/4, 5.5, 0.22, matWhite, 0.02);
      addStrip(x, z + ROAD_W/4, 5.5, 0.22, matWhite, 0.02);
    }
  }

  // vertical road strips (run along Z axis)
  for (let i = -RANGE; i <= RANGE; i++) {
    const x = i * CELL;
    addStrip(x, 0, ROAD_W, SPAN * 2, matAsphalt);
    addStrip(x, 0, 0.45, SPAN * 2, matYellow, 0.01);
    addStrip(x - ROAD_W/2 + 0.3, 0, 0.3, SPAN*2, matWhite, 0.01);
    addStrip(x + ROAD_W/2 - 0.3, 0, 0.3, SPAN*2, matWhite, 0.01);
    addCurb(x - ROAD_W/2 - 0.1, 0, 0.4, SPAN*2);
    addCurb(x + ROAD_W/2 + 0.1, 0, 0.4, SPAN*2);
    for (let z = -SPAN + 3; z < SPAN; z += 10) {
      addStrip(x - ROAD_W/4, z, 0.22, 5.5, matWhite, 0.02);
      addStrip(x + ROAD_W/4, z, 0.22, 5.5, matWhite, 0.02);
    }
  }

  // ===== buildings =====
  // Shared geometry constants
  const BHW = 13, BHD = 13;  // half extents
  const BH = 10;              // wall height
  const WT = 0.55;            // wall thickness
  const DW = 6;               // door width
  const DH = 3.8;             // door height
  const _swP = BHW - DW/2;    // side-panel width on south wall

  // Equipment building materials (black)
  const matWall  = new THREE.MeshLambertMaterial({ color: 0x0a0a0a });
  const matWallD = new THREE.MeshLambertMaterial({ color: 0x222222 });
  const matFlr   = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
  const matRoofM = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const matGlass = new THREE.MeshBasicMaterial({ color: 0x99ccff, transparent: true, opacity: 0.30, side: THREE.DoubleSide });

  // Race building materials (checkered + red trim)
  const _checkerTex = (() => {
    const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
    const cx = cv.getContext('2d');
    for (let yy = 0; yy < 8; yy++) for (let xx = 0; xx < 8; xx++) {
      cx.fillStyle = ((xx + yy) % 2 === 0) ? '#ffffff' : '#000000';
      cx.fillRect(xx * 8, yy * 8, 8, 8);
    }
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 3);
    return t;
  })();
  const matWallRace  = new THREE.MeshLambertMaterial({ map: _checkerTex });
  const matWallDRace = new THREE.MeshLambertMaterial({ color: 0xdd2222 });
  const matRoofMRace = new THREE.MeshLambertMaterial({ color: 0xdd2222 });
  const matPodBase   = new THREE.MeshLambertMaterial({ color: 0x222233 });
  // Mini-game building materials — cyan/orange arcade vibe
  const matWallMini  = new THREE.MeshLambertMaterial({ color: 0x1a2a3a });
  const matWallDMini = new THREE.MeshLambertMaterial({ color: 0xff8822 });
  const matRoofMMini = new THREE.MeshLambertMaterial({ color: 0xff8822 });

  freeMapBuildingMats = [matWall, matWallD, matRoofM, matWallRace, matWallDRace, matRoofMRace, matWallMini, matWallDMini, matRoofMMini];

  function addBox(cx, cy, cz, w, h, d, mat) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(cx, cy, cz);
    arenaGroup.add(m); freeMapMeshes.push(m);
  }
  function makeBuildingSign(text, fg, bg, cx_, cy, cz, w = 11, h = 2.2) {
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
    const c2 = cv.getContext('2d');
    c2.fillStyle = bg; c2.fillRect(0, 0, cv.width, cv.height);
    c2.fillStyle = fg; c2.font = 'bold 80px system-ui'; c2.textAlign = 'center'; c2.textBaseline = 'middle';
    c2.fillText(text, cv.width / 2, cv.height / 2 + 4);
    const tex = new THREE.CanvasTexture(cv);
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
    sign.position.set(cx_, cy, cz);
    sign.rotation.y = Math.PI; // face -Z
    arenaGroup.add(sign); freeMapMeshes.push(sign);
  }
  // Shared 4-walls + roof + south-facing door + sign, registered as a speed zone.
  function addBuildingShell(cx, cz, mWall, mDoor, mRoof, label, lblFg, lblBg, lblW, lblH) {
    const flr = new THREE.Mesh(new THREE.PlaneGeometry(BHW*2 - WT, BHD*2 - WT), matFlr);
    flr.rotation.x = -Math.PI/2; flr.position.set(cx, 0.01, cz);
    arenaGroup.add(flr); freeMapMeshes.push(flr);

    addBox(cx, BH/2, cz + BHD, BHW*2, BH, WT, mWall);                  // north
    addBox(cx - 4.5, BH * 0.62, cz + BHD, 5, 2.2, 0.05, matGlass);
    addBox(cx + 4.5, BH * 0.62, cz + BHD, 5, 2.2, 0.05, matGlass);

    addBox(cx - DW/2 - _swP/2, BH/2,           cz - BHD, _swP, BH,      WT, mWall);  // south left
    addBox(cx + DW/2 + _swP/2, BH/2,           cz - BHD, _swP, BH,      WT, mWall);  // south right
    addBox(cx,                 DH + (BH-DH)/2, cz - BHD, DW,   BH - DH, WT, mWall);  // door header

    addBox(cx + BHW, BH/2, cz, WT, BH, BHD*2, mWall);                  // east
    addBox(cx + BHW, BH * 0.62, cz, 0.05, 2.2, 7, matGlass);
    addBox(cx - BHW, BH/2, cz, WT, BH, BHD*2, mWall);                  // west
    addBox(cx - BHW, BH * 0.62, cz, 0.05, 2.2, 7, matGlass);

    addBox(cx, BH + 0.25, cz, BHW*2 + 0.8, 0.5, BHD*2 + 0.8, mRoof);   // roof

    addBox(cx - DW/2 - 0.12, DH/2,     cz - BHD, 0.22,       DH,   0.22, mDoor);
    addBox(cx + DW/2 + 0.12, DH/2,     cz - BHD, 0.22,       DH,   0.22, mDoor);
    addBox(cx,               DH + 0.12, cz - BHD, DW + 0.44, 0.22, 0.22, mDoor);

    makeBuildingSign(label, lblFg, lblBg, cx, BH + 1.6, cz - BHD - 0.05, lblW, lblH);
    freeMapBuildings.push({ x: cx, z: cz, hw: BHW, hd: BHD });
  }

  function addEquipmentBuilding(cx, cz) {
    addBuildingShell(cx, cz, matWall, matWallD, matRoofM, 'EQUIPMENT', '#ffffff', '#000000', 12, 2.0);
    const _stDefs = [
      { x: cx - 4, z: cz + 4, type: 'rocket', padCol: 0x2255ff, itemCol: 0xff5500 },
      { x: cx + 4, z: cz + 4, type: 'reset',  padCol: 0xdd1111, itemCol: 0xff2222 },
    ];
    for (const _sd of _stDefs) {
      const padMat = new THREE.MeshBasicMaterial({ color: _sd.padCol, transparent: true, opacity: 0.75 });
      const pad = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.08, 24), padMat);
      pad.position.set(_sd.x, 0.05, _sd.z);
      arenaGroup.add(pad); freeMapMeshes.push(pad);
      const ped = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.4, 0.9), matPodBase);
      ped.position.set(_sd.x, 0.7, _sd.z + 2.8);
      arenaGroup.add(ped); freeMapMeshes.push(ped);
      const iMat = new THREE.MeshLambertMaterial({ color: _sd.itemCol });
      if (_sd.type === 'rocket') {
        const rb = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.75, 8), iMat);
        rb.position.set(_sd.x, 1.8, _sd.z + 2.8);
        arenaGroup.add(rb); freeMapMeshes.push(rb);
        const rn = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.45, 8), iMat);
        rn.position.set(_sd.x, 2.38, _sd.z + 2.8);
        arenaGroup.add(rn); freeMapMeshes.push(rn);
        const finMat = new THREE.MeshLambertMaterial({ color: 0xcc2200 });
        for (let _a = 0; _a < 4; _a++) {
          const fin = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.35, 0.35), finMat);
          fin.position.set(_sd.x + Math.sin(_a * Math.PI/2) * 0.28, 1.55, _sd.z + 2.8 + Math.cos(_a * Math.PI/2) * 0.28);
          arenaGroup.add(fin); freeMapMeshes.push(fin);
        }
      } else if (_sd.type === 'turbo') {
        const bMat = new THREE.MeshLambertMaterial({ color: 0xffee00 });
        const t1 = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.22, 0.22), bMat);
        t1.rotation.z = -0.6; t1.position.set(_sd.x + 0.1, 2.05, _sd.z + 2.8);
        arenaGroup.add(t1); freeMapMeshes.push(t1);
        const t2 = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.22, 0.22), bMat);
        t2.rotation.z = -0.6; t2.position.set(_sd.x - 0.1, 1.72, _sd.z + 2.8);
        arenaGroup.add(t2); freeMapMeshes.push(t2);
        const t3 = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.18, 0.18), bMat);
        t3.rotation.z = -0.6; t3.position.set(_sd.x + 0.12, 2.35, _sd.z + 2.8);
        arenaGroup.add(t3); freeMapMeshes.push(t3);
      } else if (_sd.type === 'reset') {
        const xMat = new THREE.MeshLambertMaterial({ color: 0xff2222 });
        const xa = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.22, 0.22), xMat);
        xa.rotation.z = Math.PI / 4; xa.position.set(_sd.x, 2.0, _sd.z + 2.8);
        arenaGroup.add(xa); freeMapMeshes.push(xa);
        const xb = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.22, 0.22), xMat);
        xb.rotation.z = -Math.PI / 4; xb.position.set(_sd.x, 2.0, _sd.z + 2.8);
        arenaGroup.add(xb); freeMapMeshes.push(xb);
      }
      freeMapStations.push({ x: _sd.x, z: _sd.z, r: 2.2, type: _sd.type });
    }
  }

  function addMiniGameBuilding(cx, cz, gameId, label) {
    addBuildingShell(cx, cz, matWallMini, matWallDMini, matRoofMMini, label, '#ff8822', '#0a1428', 14, 2.2);
    // Big bright circular pad inside — touching it opens the mini-game.
    // Increased radius so it's easier to drive onto (was 2.8, now 4.2).
    const PR = 4.2;
    const matPadM = new THREE.MeshBasicMaterial({ color: 0xff8822, transparent: true, opacity: 0.82 });
    const pad = new THREE.Mesh(new THREE.CircleGeometry(PR, 36), matPadM);
    pad.rotation.x = -Math.PI / 2; pad.position.set(cx, 0.04, cz);
    arenaGroup.add(pad); freeMapMeshes.push(pad);
    const matRimM = new THREE.MeshBasicMaterial({ color: 0xffd54a });
    const rim = new THREE.Mesh(new THREE.RingGeometry(PR - 0.3, PR, 36), matRimM);
    rim.rotation.x = -Math.PI / 2; rim.position.set(cx, 0.05, cz);
    arenaGroup.add(rim); freeMapMeshes.push(rim);
    // Per-pad game-name sign hovering above the pad so the player knows
    // which mini-game this circle opens.
    const padLabel = gameId === 'flappydunk' ? 'FLAPPY DUNK'
                   : gameId === 'gdwave'     ? 'GEO DASH WAVE'
                   : 'COMING SOON';
    const padFg    = gameId === 'flappydunk' ? '#ffd54a'
                   : gameId === 'gdwave'     ? '#22ddff'
                   : '#888';
    const padBg    = gameId === 'flappydunk' ? '#1a0a00'
                   : gameId === 'gdwave'     ? '#001428'
                   : '#0a1428';
    const _sCv = document.createElement('canvas');
    _sCv.width = 512; _sCv.height = 128;
    const _sCx = _sCv.getContext('2d');
    _sCx.fillStyle = padBg; _sCx.fillRect(0, 0, 512, 128);
    _sCx.strokeStyle = padFg; _sCx.lineWidth = 6; _sCx.strokeRect(6, 6, 500, 116);
    _sCx.fillStyle = padFg; _sCx.font = 'bold 64px sans-serif'; _sCx.textAlign = 'center'; _sCx.textBaseline = 'middle';
    _sCx.fillText(padLabel, 256, 70);
    const _sTx = new THREE.CanvasTexture(_sCv);
    const _sMesh = new THREE.Mesh(new THREE.PlaneGeometry(8, 2),
      new THREE.MeshBasicMaterial({ map: _sTx, transparent: true, side: THREE.DoubleSide }));
    _sMesh.position.set(cx, 3.6, cz);
    arenaGroup.add(_sMesh); freeMapMeshes.push(_sMesh);
    // Joystick icon next to the sign for visual flair
    const joyBase = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.3, 18),
      new THREE.MeshLambertMaterial({ color: 0x444466 }));
    joyBase.position.set(cx, 1.0, cz + 5); arenaGroup.add(joyBase); freeMapMeshes.push(joyBase);
    const joyStick = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.2, 12),
      new THREE.MeshLambertMaterial({ color: 0xff8822 }));
    joyStick.position.set(cx, 1.75, cz + 5); arenaGroup.add(joyStick); freeMapMeshes.push(joyStick);
    const joyBall = new THREE.Mesh(new THREE.SphereGeometry(0.32, 14, 10),
      new THREE.MeshBasicMaterial({ color: 0xff2244 }));
    joyBall.position.set(cx, 2.45, cz + 5); arenaGroup.add(joyBall); freeMapMeshes.push(joyBall);
    freeMapMiniGamePads.push({ x: cx, z: cz, half: PR, gameId });
  }

  function addRaceBuilding(cx, cz) {
    addBuildingShell(cx, cz, matWallRace, matWallDRace, matRoofMRace, 'RACE', '#ff2222', '#ffffff', 10, 2.4);
    // big race-start pads inside — touching one warps the player to the race road map.
    const matRace = new THREE.MeshBasicMaterial({ color: 0x2266ff, transparent: true, opacity: 0.85 });
    const PAD = 6;
    for (const _ox of [-4.5, 4.5]) {
      const sq = new THREE.Mesh(new THREE.BoxGeometry(PAD, 0.06, PAD), matRace);
      sq.position.set(cx + _ox, 0.04, cz);
      arenaGroup.add(sq); freeMapMeshes.push(sq);
      freeMapRaceSquares.push({ x: cx + _ox, z: cz, half: PAD / 2 });
    }
  }

  // Show-off building (blue→purple gradient walls, gold trim).
  // Inside is a single pad that pops up a HUD panel with the player's name,
  // car, and equipped upgrades when you stand on it.
  const _gradTex = (() => {
    const cv = document.createElement('canvas'); cv.width = 64; cv.height = 256;
    const cx2 = cv.getContext('2d');
    const g = cx2.createLinearGradient(0, 0, 0, cv.height);
    g.addColorStop(0,    '#2244ff');
    g.addColorStop(0.5,  '#6633dd');
    g.addColorStop(1,    '#aa22bb');
    cx2.fillStyle = g; cx2.fillRect(0, 0, cv.width, cv.height);
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 1);
    return t;
  })();
  const matWallShow  = new THREE.MeshLambertMaterial({ map: _gradTex });
  const matWallDShow = new THREE.MeshLambertMaterial({ color: 0xffd54a });
  const matRoofMShow = new THREE.MeshLambertMaterial({ color: 0x6633dd });
  freeMapBuildingMats.push(matWallShow, matWallDShow, matRoofMShow);

  function addShowOffBuilding(cx, cz) {
    addBuildingShell(cx, cz, matWallShow, matWallDShow, matRoofMShow, 'SHOW OFF', '#ffd54a', '#1a0a3a', 12, 2.2);
    // Interactive pad — south half of the building (near the door)
    const padX = cx, padZ = cz - 4;
    const matPad = new THREE.MeshBasicMaterial({ color: 0xaa66ff, transparent: true, opacity: 0.85 });
    const pad = new THREE.Mesh(new THREE.CircleGeometry(2.6, 48), matPad);
    pad.rotation.x = -Math.PI / 2; pad.position.set(padX, 0.04, padZ);
    arenaGroup.add(pad); freeMapMeshes.push(pad);
    const matRim = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const rim = new THREE.Mesh(new THREE.RingGeometry(2.3, 2.6, 48), matRim);
    rim.rotation.x = -Math.PI / 2; rim.position.set(padX, 0.05, padZ);
    arenaGroup.add(rim); freeMapMeshes.push(rim);
    // Podium — raised platform in the north half. Your car appears on top when
    // you stand on the pad, and stays for everyone to see.
    const podX = cx, podZ = cz + 5;
    const matPodium = new THREE.MeshLambertMaterial({ color: 0xffd54a });
    const podium = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.7, 1.2, 32), matPodium);
    podium.position.set(podX, 0.6, podZ);
    arenaGroup.add(podium); freeMapMeshes.push(podium);
    const matTop = new THREE.MeshBasicMaterial({ color: 0xff44dd });
    const topDisc = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 0.08, 32), matTop);
    topDisc.position.set(podX, 1.25, podZ);
    arenaGroup.add(topDisc); freeMapMeshes.push(topDisc);
    // Billboard on the inside of the north wall, above the windows. Shows the
    // current player's show-off info to anyone in the building.
    const bbCanvas = document.createElement('canvas');
    bbCanvas.width = 1024; bbCanvas.height = 256;
    const bbCtx = bbCanvas.getContext('2d');
    drawShowOffBillboardIdle(bbCtx, bbCanvas.width, bbCanvas.height);
    const bbTex = new THREE.CanvasTexture(bbCanvas);
    const bb = new THREE.Mesh(new THREE.PlaneGeometry(24, 6),
      new THREE.MeshBasicMaterial({ map: bbTex }));
    bb.position.set(cx, 6.0, cz + BHD - 0.06);
    bb.rotation.y = Math.PI; // face south (toward the door & pad)
    arenaGroup.add(bb); freeMapMeshes.push(bb);
    freeMapShowOffPads.push({
      x: padX, z: padZ, half: 2.6,
      podiumX: podX, podiumY: 1.45, podiumZ: podZ,
      carGroup: null,
      bbCanvas, bbCtx, bbTex,
    });
  }

  // 5 race buildings + 3 show-off buildings + 2 mini-game buildings near spawn
  addRaceBuilding( 32,   32);
  addRaceBuilding(-32,   32);
  addRaceBuilding( 224, -224);
  addRaceBuilding(-224,  224);
  addRaceBuilding(-224, -224);
  addShowOffBuilding( 160,  32);
  addShowOffBuilding(-160, -32);
  addShowOffBuilding(  32, 224);
  addMiniGameBuilding(-64, -32, 'flappydunk', 'MINI GAMES');
  addMiniGameBuilding(  0, -32, 'gdwave',     'MINI GAMES');
  addMiniGameBuilding( 64, -32, 'gdwave',     'MINI GAMES');

  // ===== map border (circular abyss) =====
  // A dark circular void surrounds the city — driving toward the edge feels like
  // falling into an abyss. The player is clamped to MAP_R in the free-map step.
  const MAP_R = SPAN;
  const matVoid = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const voidRing = new THREE.Mesh(new THREE.RingGeometry(MAP_R, MAP_R + 600, 96), matVoid);
  voidRing.rotation.x = -Math.PI / 2;
  voidRing.position.y = -0.04;
  arenaGroup.add(voidRing); freeMapMeshes.push(voidRing);
  // glowing magenta rim highlighting the boundary
  const matRim = new THREE.MeshBasicMaterial({ color: 0xff44dd });
  const rimRing = new THREE.Mesh(new THREE.RingGeometry(MAP_R - 0.8, MAP_R, 96), matRim);
  rimRing.rotation.x = -Math.PI / 2;
  rimRing.position.y = 0.02;
  arenaGroup.add(rimRing); freeMapMeshes.push(rimRing);
  freeMapBorder = { radius: MAP_R };
}

// ===== free map traffic =====
const _FM_SPAN = 7 * 64 + 7 + 2;  // 457 — matches buildCityMap SPAN
const _FM_CELL = 64;
const _FM_RW   = 14;
const _NPC_KINDS = ['sedan','hatch','sport','van','truck'];
const _NPC_COLS  = [0xcc3311,0x2244cc,0x118844,0xccaa22,0x9922aa,0x226688,0xdd7722,0x888888];

function spawnFreeMapNPC(type) {
  // pick a random road slot
  const ri = (Math.floor(Math.random() * 15) - 7); // -7..7
  const laneAxis = Math.random() < 0.5 ? 'x' : 'z';
  const laneCoord = ri * _FM_CELL;
  const dir   = Math.random() < 0.5 ? 1 : -1;
  const laneOff = (Math.random() < 0.5 ? 1 : -1) * _FM_RW / 4;
  const startPos = (Math.random() * 2 - 1) * _FM_SPAN;

  let x, z, heading;
  if (laneAxis === 'x') {
    x = startPos; z = laneCoord + laneOff;
    heading = dir > 0 ? Math.PI / 2 : -Math.PI / 2;
  } else {
    x = laneCoord + laneOff; z = startPos;
    heading = dir > 0 ? 0 : Math.PI;
  }

  let kind, color, accent, speed, hp = 1, fireMin = 2200, fireRand = 1200, damage = 10, bulletCol = 0x00eeff, bulletSize = 0.22;
  if (type === 'police') {
    kind = 'sedan'; color = 0x1144ff; accent = 0xffffff;
    speed = 10 + freeMapStars * 1.8;
  } else if (type === 'swat') {
    kind = 'swat'; color = 0x0d1b3e; accent = 0xeeeeee;
    speed = 13 + freeMapStars * 1.6;
    fireMin = 700; fireRand = 400; damage = 10; bulletCol = 0x66ddff;
  } else if (type === 'tank') {
    kind = 'tank'; color = 0x445533; accent = 0x222222;
    speed = 8; hp = 2; fireMin = 2500; fireRand = 800; damage = 30;
    bulletCol = 0xff8800; bulletSize = 0.4;
  } else if (type === 'rocket_car') {
    kind = 'rocketcar'; color = 0xcc1100; accent = 0xffaa00;
    speed = 12; fireMin = 4500; fireRand = 1000; damage = 50;
    bulletCol = 0xff2200; bulletSize = 0.5;
  } else if (type === 'f1') {
    kind = 'f1'; color = 0xff0044; accent = 0xffdd00; speed = 20;
  } else {
    kind  = _NPC_KINDS[Math.floor(Math.random() * _NPC_KINDS.length)];
    color = _NPC_COLS [Math.floor(Math.random() * _NPC_COLS.length)];
    accent = 0x222222; speed = 6 + Math.random() * 8;
  }

  const mesh = buildCar({ kind, color, accent, isPlayer: false });
  mesh.position.set(x, 0.2, z);
  mesh.rotation.y = heading;
  arenaGroup.add(mesh);

  freeMapNPCs.push({ x, z, y: 0.2, heading, speed, mesh, type, laneAxis, laneCoord, laneOff, dir, shotTimer: 1500 + Math.random() * 2000, alive: true, id: Math.random(), hp, fireMin, fireRand, damage, bulletCol, bulletSize });
}

function fireFreeMapBullet(fromX, fromZ, toX, toZ, damage = 10, color = 0x00eeff, size = 0.22) {
  const _bd = Math.max(0.01, Math.hypot(toX - fromX, toZ - fromZ));
  const spd = 30;
  const vx = (toX - fromX) / _bd * spd;
  const vz = (toZ - fromZ) / _bd * spd;
  const mat  = new THREE.MeshBasicMaterial({ color });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 6, 6), mat);
  mesh.position.set(fromX, 0.7, fromZ);
  arenaGroup.add(mesh);
  freeMapPoliceBullets.push({ x: fromX, z: fromZ, y: 0.7, vx, vz, mesh, life: 3500, damage, size });
}

function updateFreeMapTraffic(dt) {
  const dts = dt / 1000;
  // Free map is server-driven; this client no longer spawns traffic, police, or rivals.
  // Only the player's own missile cooldown ticks here.
  freeMapMissileCooldown = Math.max(0, freeMapMissileCooldown - dt);

  // update NPCs
  for (let i = freeMapNPCs.length - 1; i >= 0; i--) {
    const n = freeMapNPCs[i];
    if (!n.alive) {
      if (n.mesh) arenaGroup.remove(n.mesh);
      freeMapNPCs.splice(i, 1);
      continue;
    }

    if (n.type === 'npc') {
      // drive straight in lane, wrap at edges
      if (n.laneAxis === 'x') {
        n.x += n.speed * n.dir * dts;
        n.z = n.laneCoord + n.laneOff;
        n.heading = n.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
        if (n.x >  _FM_SPAN) n.x = -_FM_SPAN;
        if (n.x < -_FM_SPAN) n.x =  _FM_SPAN;
      } else {
        n.z += n.speed * n.dir * dts;
        n.x = n.laneCoord + n.laneOff;
        n.heading = n.dir > 0 ? 0 : Math.PI;
        if (n.z >  _FM_SPAN) n.z = -_FM_SPAN;
        if (n.z < -_FM_SPAN) n.z =  _FM_SPAN;
      }
    } else if (n.type === 'f1' || n.type === 'police' || n.type === 'swat' || n.type === 'tank' || n.type === 'rocket_car') {
      const _dx = arenaPlayer.x - n.x, _dz = arenaPlayer.z - n.z;
      const _dist = Math.hypot(_dx, _dz);
      const _aggro = n.type !== 'f1' || _dist < 30;
      if (_aggro) {
        const _ta = Math.atan2(_dx, _dz);
        let _hd = _ta - n.heading;
        while (_hd >  Math.PI) _hd -= Math.PI * 2;
        while (_hd < -Math.PI) _hd += Math.PI * 2;
        const _turnRate = n.type === 'f1' ? 3.5 : (n.type === 'tank' ? 1.4 : 2.5);
        n.heading += Math.sign(_hd) * Math.min(Math.abs(_hd), _turnRate * dts);
        const _spd = _dist > 4 ? n.speed : n.speed * 0.3;
        n.x += Math.sin(n.heading) * _spd * dts;
        n.z += Math.cos(n.heading) * _spd * dts;
        // fire at player
        n.shotTimer -= dt;
        if (n.shotTimer <= 0 && _dist < 45) {
          const _fmin = n.fireMin != null ? n.fireMin : 2200;
          const _frnd = n.fireRand != null ? n.fireRand : 1200;
          n.shotTimer = _fmin + Math.random() * _frnd;
          fireFreeMapBullet(n.x, n.z, arenaPlayer.x, arenaPlayer.z, n.damage || 10, n.bulletCol || 0x00eeff, n.bulletSize || 0.22);
        }
      } else {
        // idle cruise (F1 only when out of range)
        n.x += Math.sin(n.heading) * n.speed * 0.4 * dts;
        n.z += Math.cos(n.heading) * n.speed * 0.4 * dts;
        n.heading += (Math.random() - 0.5) * 0.6 * dts;
      }
      // Clamp the chase NPCs to the city border so they can't wander off
      // the playable map. Player follows the same border via freeMapBorder.
      if (freeMapBorder) {
        const _rN = freeMapBorder.radius - 4;
        const _dN = Math.hypot(n.x, n.z);
        if (_dN > _rN) { n.x = (n.x / _dN) * _rN; n.z = (n.z / _dN) * _rN; }
      }
    }

    if (n.mesh) { n.mesh.position.set(n.x, n.y, n.z); n.mesh.rotation.y = n.heading; }
  }

  // update police bullets
  for (let i = freeMapPoliceBullets.length - 1; i >= 0; i--) {
    const b = freeMapPoliceBullets[i];
    b.life -= dt;
    b.x += b.vx * dts; b.z += b.vz * dts;
    if (b.mesh) b.mesh.position.set(b.x, b.y, b.z);
    // hit player
    const _bHitR = 1.5 + (b.size || 0.22);
    if (Math.hypot(b.x - arenaPlayer.x, b.z - arenaPlayer.z) < _bHitR) {
      arenaPlayer.vx *= 0.15; arenaPlayer.vz *= 0.15;  // brief stun
      freeMapTakeDamage(b.damage || 10);
      if (b.mesh) arenaGroup.remove(b.mesh);
      freeMapPoliceBullets.splice(i, 1);
      continue;
    }
    if (b.life <= 0 || Math.hypot(b.x, b.z) > _FM_SPAN * 1.6) {
      if (b.mesh) arenaGroup.remove(b.mesh);
      freeMapPoliceBullets.splice(i, 1);
    }
  }
}

function cleanupFreeMapTraffic() {
  for (const n of freeMapNPCs) { if (n.mesh) arenaGroup.remove(n.mesh); }
  freeMapNPCs = [];
  for (const b of freeMapPoliceBullets) { if (b.mesh) arenaGroup.remove(b.mesh); }
  freeMapPoliceBullets = [];
  freeMapStars = 0; freeMapStarCooldown = 0; freeMapPoliceTimer = 0; freeMapMissileCooldown = 0;
  freeMapSwatTimer = 0; freeMapTankTimer = 0; freeMapRocketCarTimer = 0;
}

function freeMapWarpToClassic() {
  freeMap = false;
  freeMapRaceCountdown = 0;
  cleanupFreeMapTraffic();
  modeIdx = 0; // CLASSIC
  localStorage.setItem('headon_mode', modeIdx);
  startGame();
}

// Spawn one slow rival NPC next to the player — reuses existing NPC update path.
function freeMapSpawnRival() {
  const heading = arenaPlayer.heading || 0;
  const sx = Math.cos(heading) * 4.0;
  const sz = -Math.sin(heading) * 4.0;
  const rx = arenaPlayer.x + sx;
  const rz = arenaPlayer.z + sz;
  const mesh = buildCar({ kind: 'sport', color: 0xffaa22, accent: 0x222222, isPlayer: false });
  mesh.position.set(rx, 0.2, rz);
  mesh.rotation.y = heading;
  arenaGroup.add(mesh);
  // push into freeMapNPCs as a regular 'npc' — existing updateFreeMapTraffic moves it down a lane
  freeMapNPCs.push({
    x: rx, z: rz, y: 0.2,
    heading, speed: 8,
    mesh, type: 'npc',
    laneAxis: Math.abs(Math.sin(heading)) > 0.5 ? 'x' : 'z',
    laneCoord: 0, laneOff: 0,
    dir: 1,
    shotTimer: 99999, alive: true, id: Math.random(),
  });
}

// Tear down the city map and build a single straight road with side barriers.
// Tear down the race map and rebuild the city free-map, dropping the player
// back at the race pad they entered from.
function exitRaceMode() {
  const entry = freeMapRaceEntryPad;
  cleanupFreeMapTraffic();
  for (const m of freeMapMeshes) arenaGroup.remove(m);
  freeMapMeshes = [];
  freeMapBuildings = []; freeMapBuildingMats = [];
  freeMapStations = []; freeMapRaceSquares = []; freeMapShowOffPads = []; freeMapLastShowPad = null;
  freeMapMiniGamePads = [];
  freeMapInRace = false; freeMapRaceRoad = null;
  freeMapRaceLaps = 0; freeMapRaceLapArmed = false; freeMapRaceRival = null;
  freeMapRaceObstacles = [];
  freeMapRaceEntryPad = null;
  raceResultsShown = false; raceResultsData = null;
  raceMapSelectShown = false;
  if (freeMapRacePrevSky !== null) {
    scene.background = new THREE.Color(freeMapRacePrevSky);
    if (scene.fog) { scene.fog.color.set(freeMapRacePrevFog); scene.fog.near = 50; scene.fog.far = 240; }
    freeMapRacePrevSky = null; freeMapRacePrevFog = null;
  }
  buildCityMap();
  if (entry) {
    // Place player just outside the race pad so they don't immediately re-trigger it.
    arenaPlayer.x = entry.x - 5;
    arenaPlayer.z = entry.z;
    arenaPlayer.y = 0.2;
    arenaPlayer.vx = 0; arenaPlayer.vz = 0; arenaPlayer.vy = 0;
  }
}

// Long winding race track — a serpentine "4-rung" loop. Player starts at
// the west end of rung 1 and races clockwise through:
//   rung 1  east  (ramp + REAL GAP — fall = restart)
//   south T → rung 2  west  (zig-zag cone chicane)
//   south T → rung 3  east  (pillar slalom, narrowing)
//   south T → rung 4  west  (long straight, passes UNDER overpass)
//   long north T → back to start.
// Drive surface stays at y=0.2; the overpass is decorative at y=7.
function buildRaceRoadMap(pickedMap) {
  for (const m of freeMapMeshes) arenaGroup.remove(m);
  freeMapMeshes = [];
  freeMapBuildings = []; freeMapBuildingMats = [];
  freeMapStations = []; freeMapRaceSquares = []; freeMapShowOffPads = []; freeMapLastShowPad = null;
  freeMapRaceCountdown = 0; freeMapInBuilding = false;
  freeMapBorder = null;
  cleanupFreeMapTraffic();
  freeMapInRace = true;
  const _theme = (pickedMap && pickedMap.theme) || 'grass';
  const _isMagma = _theme === 'magma';
  // Save sky/fog so exitRaceMode can restore whatever the city had.
  if (freeMapRacePrevSky === null) {
    freeMapRacePrevSky = scene.background ? scene.background.getHex() : 0x6a4a7a;
    freeMapRacePrevFog = scene.fog ? scene.fog.color.getHex() : 0x6a4a7a;
  }
  if (_isMagma) {
    scene.background = new THREE.Color(0x3a0a08);
    if (scene.fog) { scene.fog.color.set(0x3a0a08); scene.fog.near = 40; scene.fog.far = 220; }
  } else {
    scene.background = new THREE.Color(freeMapRacePrevSky);
    if (scene.fog) scene.fog.color.set(freeMapRacePrevFog);
  }

  // ═══════════════════════════════════════════════════════════════════════
  // VOLCANO MAP
  // Course flow (1 lap, clockwise viewed from above):
  //   spawn → approach (east, flat) → UP ramp (climbs to peak y=22) → peak
  //   (short flat summit) → DOWN ramp (back to y=0) → run-out (flat) →
  //   south sweep (right turn south, then west, then north) → merges back
  //   into the west end of the approach. Big volcano cone sits beside the
  //   road as the "mountain" you're driving over.
  // Anti-cheese: ordered checkpoints at peak, run-out, south sweep midpoint,
  //   and west return → backwards/shortcut runs never arm the lap.
  // ═══════════════════════════════════════════════════════════════════════
  if (_isMagma) {
    freeMapRaceObstacles = [];
    freeMapRaceRival = null;
    freeMapRaceLaps = 0;
    freeMapRaceLapArmed = false;

    // ── Materials ──
    const matLava   = new THREE.MeshBasicMaterial({ color: 0xff5522 });
    const matRoad   = new THREE.MeshLambertMaterial({ color: 0x1a1014 });
    const matRamp   = new THREE.MeshLambertMaterial({ color: 0x3a201a });
    const matCone   = new THREE.MeshLambertMaterial({ color: 0x2a1410 });
    const matGlow   = new THREE.MeshBasicMaterial({ color: 0xff5520 });
    const matMagma  = new THREE.MeshBasicMaterial({ color: 0xff7733 });
    const matEmber  = new THREE.MeshBasicMaterial({ color: 0xffaa22 });
    const matFinW   = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const matFinB   = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const matMountain = new THREE.MeshLambertMaterial({ color: 0x3a1410 });

    // ── Helpers ──
    function flat(cx, cz, w, d, mat, y) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
      m.rotation.x = -Math.PI / 2; m.position.set(cx, y, cz);
      arenaGroup.add(m); freeMapMeshes.push(m);
      return m;
    }
    function rampMesh(x0, x1, z0, z1, y0, y1, axis, mat) {
      // Sloped slab. axis=='x' → tilted around z axis; axis=='z' → tilted around x.
      // For axis=x: y1>y0 means +X end higher → positive rotation.z (+X tilts up).
      // For axis=z: y1>y0 means +Z end higher → negative rotation.x (+Z tilts up).
      const w = x1 - x0, d = z1 - z0;
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.4, d), mat);
      m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
      if (axis === 'x') m.rotation.z =  Math.atan2(y1 - y0, w);
      else              m.rotation.x = -Math.atan2(y1 - y0, d);
      arenaGroup.add(m); freeMapMeshes.push(m);
      return m;
    }

    // ── Lava sea covers everything; the road floats over it ──
    const lavaSea = new THREE.Mesh(new THREE.PlaneGeometry(900, 900),
      new THREE.MeshLambertMaterial({ color: 0x2a0808 }));
    lavaSea.rotation.x = -Math.PI / 2; lavaSea.position.y = -1.0;
    arenaGroup.add(lavaSea); freeMapMeshes.push(lavaSea);
    const lavaSurf = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), matLava);
    lavaSurf.rotation.x = -Math.PI / 2; lavaSurf.position.y = -2.0;
    arenaGroup.add(lavaSurf); freeMapMeshes.push(lavaSurf);

    // ── The "mountain" you drive over — a big mass under the up/down ramp.
    // Centered at x=+60, z=+10 with a small flat top at y=22.
    // We use a couple of stacked trapezoids of cones for a chunky look.
    const mountainBase = new THREE.Mesh(new THREE.ConeGeometry(100, 22, 22), matMountain);
    mountainBase.position.set(60, 11, 10); arenaGroup.add(mountainBase); freeMapMeshes.push(mountainBase);
    // small crater visible behind the road
    const crater = new THREE.Mesh(new THREE.CylinderGeometry(14, 22, 4, 22), matGlow);
    crater.position.set(60, 22, 70); arenaGroup.add(crater); freeMapMeshes.push(crater);
    const lavaCap = new THREE.Mesh(new THREE.CircleGeometry(12, 18), matMagma);
    lavaCap.rotation.x = -Math.PI / 2; lavaCap.position.set(60, 24.1, 70);
    arenaGroup.add(lavaCap); freeMapMeshes.push(lavaCap);

    // distant background cones for atmosphere
    const distantPeaks = [
      [ 280,  280, 50,  80], [-280,  260, 55,  90],
      [ 320,  -80, 40,  64], [-320,  -60, 42,  70],
      [ 100, -280, 36,  58], [-120, -280, 38,  60],
    ];
    for (const p of distantPeaks) {
      const c = new THREE.Mesh(new THREE.ConeGeometry(p[2], p[3], 14), matCone);
      c.position.set(p[0], p[3] / 2, p[1]); arenaGroup.add(c); freeMapMeshes.push(c);
    }

    // warm orange ambient glow
    const emberLight = new THREE.PointLight(0xff5520, 1.6, 380);
    emberLight.position.set(60, 60, 60);
    arenaGroup.add(emberLight); freeMapMeshes.push(emberLight);
    const emberLight2 = new THREE.PointLight(0xff7733, 1.0, 260);
    emberLight2.position.set(-80, 20, -80);
    arenaGroup.add(emberLight2); freeMapMeshes.push(emberLight2);

    // ── Road geometry ──
    const RW = 14, HW = RW / 2;
    const segments = [];
    const supports = [];

    // Approach (flat, east-bound) — extends from west of spawn to the foot
    // of the mountain.
    segments.push({ x0: -260, x1: -80, z0: 0, z1: 14 });
    supports.push({ x0: -260, x1: -80, z0: 0, z1: 14, y: 0 });

    // UP ramp — long climb up the mountain.
    segments.push({ x0: -80, x1: 60, z0: 0, z1: 14 });
    supports.push({ x0: -80, x1: 60, z0: 0, z1: 14, axis: 'x', y0: 0, y1: 22 });

    // Peak — short flat summit.
    segments.push({ x0: 60, x1: 80, z0: 0, z1: 14 });
    supports.push({ x0: 60, x1: 80, z0: 0, z1: 14, y: 22 });

    // DOWN ramp — descent back to ground level.
    segments.push({ x0: 80, x1: 200, z0: 0, z1: 14 });
    supports.push({ x0: 80, x1: 200, z0: 0, z1: 14, axis: 'x', y0: 22, y1: 0 });

    // Run-out — flat road east of the descent before the right-turn south.
    segments.push({ x0: 200, x1: 240, z0: 0, z1: 14 });
    supports.push({ x0: 200, x1: 240, z0: 0, z1: 14, y: 0 });

    // South sweep return — surface-level loop back to the approach.
    segments.push({ x0: 180, x1: 240, z0: -100, z1: 0 });
    supports.push({ x0: 180, x1: 240, z0: -100, z1: 0, y: 0 });
    segments.push({ x0: -260, x1: 240, z0: -100, z1: -60 });
    supports.push({ x0: -260, x1: 240, z0: -100, z1: -60, y: 0 });
    segments.push({ x0: -260, x1: -200, z0: -100, z1: 14 });
    supports.push({ x0: -260, x1: -200, z0: -100, z1: 14, y: 0 });

    // ── Lava splash hazards on the surface road. Touching one insta-resets
    // the player to race start. Visuals (drawn below) match the XZ regions.
    const lavaHazards = [
      { cx: -130, cz:  4, r: 2.5, surfaceY: 0 },                            // approach, far west
      { cx:  -50, cz: 10, r: 2.5, surfaceY: 0 },                            // approach
      { cx:  -20, cz:  4, r: 2.5, surfaceY: 22 * (-20 - -80) / 140 },       // lower up-ramp
      { cx:   30, cz:  9, r: 2.5, surfaceY: 22 * (30 - -80) / 140 },        // mid up-ramp
      { cx:  120, cz:  5, r: 2.5, surfaceY: 22 - 22 * (120 - 80) / 120 },   // mid down-ramp
      { cx:  170, cz: 10, r: 2.5, surfaceY: 22 - 22 * (170 - 80) / 120 },   // lower down-ramp
      { cx:  220, cz:  4, r: 2.5, surfaceY: 0 },                            // run-out
    ];
    const lava = [];
    for (const h of lavaHazards) {
      lava.push({ x0: h.cx - h.r, x1: h.cx + h.r, z0: h.cz - h.r, z1: h.cz + h.r });
      // glowing splash visual on the road
      const splash = new THREE.Mesh(new THREE.CircleGeometry(h.r, 18),
        new THREE.MeshBasicMaterial({ color: 0xff5522 }));
      splash.rotation.x = -Math.PI / 2;
      splash.position.set(h.cx, h.surfaceY + 0.06, h.cz);
      arenaGroup.add(splash); freeMapMeshes.push(splash);
      const core = new THREE.Mesh(new THREE.CircleGeometry(h.r * 0.55, 14),
        new THREE.MeshBasicMaterial({ color: 0xffcc44 }));
      core.rotation.x = -Math.PI / 2;
      core.position.set(h.cx, h.surfaceY + 0.08, h.cz);
      arenaGroup.add(core); freeMapMeshes.push(core);
    }

    // ── Visual road surfaces ──
    for (const s of supports) {
      if (s.axis === 'x' || s.axis === 'z') {
        rampMesh(s.x0, s.x1, s.z0, s.z1, s.y0, s.y1, s.axis, matRoad);
      } else {
        flat((s.x0 + s.x1) / 2, (s.z0 + s.z1) / 2, s.x1 - s.x0, s.z1 - s.z0, matRoad, s.y + 0.01);
      }
    }

    // ── Start/finish stripe on the approach ──
    const finishX = -200;
    const checks = 14, checkW = RW / checks;
    for (let i = 0; i < checks; i++) {
      flat(finishX, checkW * (i + 0.5), 0.9, checkW,
           i % 2 === 0 ? matFinW : matFinB, 0.02);
    }

    // ── Decorative magma puddles along the inside of the south sweep ──
    const puddles = [[-100, -80, 6], [-20, -75, 6.5], [60, -78, 5.5],
                     [140, -70, 5], [-180, -70, 5], [-60, -85, 5]];
    for (const p of puddles) {
      const ring = new THREE.Mesh(new THREE.CircleGeometry(p[2], 22),
        new THREE.MeshBasicMaterial({ color: 0xff8833 }));
      ring.rotation.x = -Math.PI / 2; ring.position.set(p[0], 0.06, p[1]);
      arenaGroup.add(ring); freeMapMeshes.push(ring);
      const core = new THREE.Mesh(new THREE.CircleGeometry(p[2] * 0.55, 18), matEmber);
      core.rotation.x = -Math.PI / 2; core.position.set(p[0], 0.08, p[1]);
      arenaGroup.add(core); freeMapMeshes.push(core);
    }

    // ── Rival car parked next to spawn ──
    const _rivalCar = buildCar({ kind: 'sport', color: 0xff3322, accent: 0x550000, isPlayer: false });
    _rivalCar.position.set(-220, 0.2, 11);
    _rivalCar.rotation.y = Math.PI / 2;
    arenaGroup.add(_rivalCar); freeMapMeshes.push(_rivalCar);
    freeMapRaceRival = { mesh: _rivalCar };

    // ── Ordered checkpoints — forward-only progress ──
    const checkpoints = [
      { x0:  60, x1:  80, z0:  0, z1: 14 },     // at the peak
      { x0: 220, x1: 240, z0:  0, z1: 14 },     // run-out east end
      { x0: -40, x1:  40, z0: -100, z1: -60 },  // south sweep middle
      { x0: -260, x1: -200, z0: -40, z1:  0 },  // west spur (re-entering approach)
    ];

    // ── Wire it all up ──
    freeMapRaceRoad = {
      segments,
      supports,
      lava,          // surface hazards that insta-respawn on contact
      launches: [],
      checkpoints,
      spawn:    { x: -220, z: 7, heading: Math.PI / 2 },
      finish:   { x: finishX, z0: 0, z1: 14 },
    };
    freeMapRaceLaps = 0;
    freeMapRaceLapArmed = false;

    arenaPlayer.x = -225; arenaPlayer.z = 7; arenaPlayer.y = 0.2;
    arenaPlayer.vx = 0; arenaPlayer.vz = 0; arenaPlayer.vy = 0; arenaPlayer.fwd = 0;
    arenaPlayer.heading = Math.PI / 2; // east
    arenaPlayer._racePrevX = undefined;
    arenaPlayer._wasOnRamp = false;
    arenaPlayer._prevLaunch = null;
    arenaPlayer._raceCpIdx = 0;
    return;
  }

  const RW = 14, HW = RW / 2;

  // ── Centerline waypoints (clockwise). Adjacent pairs are axis-aligned. ──
  const W1 = { x: -180, z:   0 };   // start
  const W2 = { x:  100, z:   0 };   // end of rung 1 (east)
  const W3 = { x:  100, z:  50 };   // top of T south
  const W4 = { x: -120, z:  50 };   // end of rung 2 (west)
  const W5 = { x: -120, z: 100 };
  const W6 = { x:  140, z: 100 };   // end of rung 3 (east)
  const W7 = { x:  140, z: 150 };
  const W8 = { x: -180, z: 150 };   // end of rung 4 (west)
  // W8 → W1 closes the loop (north up the far west)

  // Build axis-aligned road corridors between consecutive waypoints.
  function corridor(a, b) {
    if (a.z === b.z) {
      return { x0: Math.min(a.x, b.x), x1: Math.max(a.x, b.x), z0: a.z - HW, z1: a.z + HW };
    } else {
      return { x0: a.x - HW, x1: a.x + HW, z0: Math.min(a.z, b.z), z1: Math.max(a.z, b.z) };
    }
  }
  const segs = [
    corridor(W1, W2), // rung 1 east
    corridor(W2, W3), // south T
    corridor(W3, W4), // rung 2 west
    corridor(W4, W5), // south T
    corridor(W5, W6), // rung 3 east
    corridor(W6, W7), // south T
    corridor(W7, W8), // rung 4 west
    corridor(W8, W1), // long north T (back to start)
  ];

  // ── Materials ──
  const matGround   = new THREE.MeshLambertMaterial({ color: 0x6cb04c });
  const matAsphalt  = new THREE.MeshLambertMaterial({ color: 0x252525 });
  const matYellow   = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
  const matWhite    = new THREE.MeshBasicMaterial({ color: 0xdddddd });
  const matBarrierR = new THREE.MeshLambertMaterial({ color: 0xcc2222 });
  const matBarrierW = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
  const matRamp     = new THREE.MeshLambertMaterial({ color: 0x553a22 });
  const matCone     = new THREE.MeshLambertMaterial({ color: 0xff7720 });
  const matConeBand = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const matPillar   = new THREE.MeshLambertMaterial({ color: 0x444455 });
  const matBridge   = new THREE.MeshLambertMaterial({ color: 0x3a3a44 });
  const matBridgeT  = new THREE.MeshLambertMaterial({ color: 0x666677 });
  const matFinishB  = new THREE.MeshBasicMaterial({ color: 0x111111 });
  const matFinishW  = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const matAbyss    = new THREE.MeshLambertMaterial({ color: 0x000000 });

  // ── Helpers ──
  function flat(cx, cz, w, d, mat, y = 0.0) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
    m.rotation.x = -Math.PI / 2; m.position.set(cx, y, cz);
    arenaGroup.add(m); freeMapMeshes.push(m);
    return m;
  }
  function box(cx, cy, cz, w, h, d, mat) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(cx, cy, cz);
    arenaGroup.add(m); freeMapMeshes.push(m);
    return m;
  }

  // Outer ground covering whole track area + padding
  let allX0 = Infinity, allX1 = -Infinity, allZ0 = Infinity, allZ1 = -Infinity;
  for (const s of segs) {
    allX0 = Math.min(allX0, s.x0); allX1 = Math.max(allX1, s.x1);
    allZ0 = Math.min(allZ0, s.z0); allZ1 = Math.max(allZ1, s.z1);
  }
  flat((allX0 + allX1) / 2, (allZ0 + allZ1) / 2,
       (allX1 - allX0) + 200, (allZ1 - allZ0) + 140, matGround, -0.05);

  // ── Asphalt for each segment ──
  for (const s of segs) {
    flat((s.x0 + s.x1) / 2, (s.z0 + s.z1) / 2, s.x1 - s.x0, s.z1 - s.z0, matAsphalt);
  }

  // ── Gap in rung 1: cut a hole in the road by drawing a black "abyss"
  //    rectangle over the asphalt, and skip the boundary/ground for that x range. ──
  const GAP_X0 = -95, GAP_X1 = -85;    // small gap — just a little jump.
  flat((GAP_X0 + GAP_X1) / 2, 0, GAP_X1 - GAP_X0, RW, matAbyss, 0.005);

  // ── Lane markings ──
  // Yellow center stripe along each segment centerline.
  function centerStripe(a, b) {
    if (a.z === b.z) {
      const len = Math.abs(b.x - a.x) - RW * 2;
      if (len > 0) flat((a.x + b.x) / 2, a.z, len, 0.45, matYellow, 0.01);
    } else {
      const len = Math.abs(b.z - a.z) - RW * 2;
      if (len > 0) flat(a.x, (a.z + b.z) / 2, 0.45, len, matYellow, 0.01);
    }
  }
  const waypoints = [W1, W2, W3, W4, W5, W6, W7, W8, W1];
  for (let i = 0; i < waypoints.length - 1; i++) centerStripe(waypoints[i], waypoints[i + 1]);
  // White edge lines along each segment's outer sides — trimmed by HW at
  // each end so the corner overlap zones stay clear of crossing stripes.
  for (const s of segs) {
    const cx = (s.x0 + s.x1) / 2, cz = (s.z0 + s.z1) / 2;
    const ew = s.x1 - s.x0 > s.z1 - s.z0;
    if (ew) {
      const len = (s.x1 - s.x0) - HW * 2;
      if (len > 0) {
        flat(cx, s.z0 + 0.3, len, 0.3, matWhite, 0.01);
        flat(cx, s.z1 - 0.3, len, 0.3, matWhite, 0.01);
      }
    } else {
      const len = (s.z1 - s.z0) - HW * 2;
      if (len > 0) {
        flat(s.x0 + 0.3, cz, 0.3, len, matWhite, 0.01);
        flat(s.x1 - 0.3, cz, 0.3, len, matWhite, 0.01);
      }
    }
  }

  // Striped barriers along the long sides of every segment. The boundary
  // clamp does the real work; these are visual cues for the edges.
  function rail(a0, a1, fixed, axis) {
    const segLen = 6, span = a1 - a0;
    const n = Math.max(1, Math.ceil(span / segLen));
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n;
      const c = a0 + span * t;
      const mat = i % 2 === 0 ? matBarrierR : matBarrierW;
      if (axis === 'x') {
        box(c, 0.6, fixed, (span / n) * 0.94, 1.2, 0.5, mat);
      } else {
        box(fixed, 0.6, c, 0.5, 1.2, (span / n) * 0.94, mat);
      }
    }
  }
  for (const s of segs) {
    const ew = (s.x1 - s.x0) > (s.z1 - s.z0);
    if (ew) {
      rail(s.x0 + HW, s.x1 - HW, s.z0 - 0.4, 'x');
      rail(s.x0 + HW, s.x1 - HW, s.z1 + 0.4, 'x');
    } else {
      rail(s.z0 + HW, s.z1 - HW, s.x0 - 0.4, 'z');
      rail(s.z0 + HW, s.z1 - HW, s.x1 + 0.4, 'z');
    }
  }

  // Outside-corner caps. At each waypoint, close the L-shaped gap between the
  // two trimmed segment rails so the outside of every turn has a continuous wall.
  const _wps = [W1, W2, W3, W4, W5, W6, W7, W8];
  for (let i = 0; i < _wps.length; i++) {
    const prev = _wps[(i - 1 + _wps.length) % _wps.length];
    const w    = _wps[i];
    const next = _wps[(i + 1) % _wps.length];
    const inDx = Math.sign(w.x - prev.x), inDz = Math.sign(w.z - prev.z);
    const outDx = Math.sign(next.x - w.x), outDz = Math.sign(next.z - w.z);
    // Outside-corner direction: continue in incoming axis, opposite outgoing axis.
    const ox = inDx !== 0 ? inDx : -outDx;
    const oz = inDz !== 0 ? inDz : -outDz;
    const cornerX = w.x + ox * (HW + 0.4);
    const cornerZ = w.z + oz * (HW + 0.4);
    // Horizontal arm along z=cornerZ, from waypoint to corner
    box(w.x + ox * (HW + 0.4) / 2, 0.6, cornerZ,
        HW + 0.4, 1.2, 0.5,
        matBarrierR);
    // Vertical arm along x=cornerX, from waypoint to corner
    box(cornerX, 0.6, w.z + oz * (HW + 0.4) / 2,
        0.5, 1.2, HW + 0.4,
        matBarrierW);
  }

  // ── Ramp at start of rung 1 (a little jump, just enough to clear the gap) ──
  const rampL = 10, rampH = 1.5;
  const rampCx = -110, rampX0 = rampCx - rampL / 2, rampX1 = rampCx + rampL / 2;
  const rampY0 = 0.2, rampY1 = 0.2 + rampH;
  const ramp = new THREE.Mesh(new THREE.BoxGeometry(rampL, 0.3, RW * 0.9), matRamp);
  ramp.position.set(rampCx, rampH / 2, 0);
  ramp.rotation.z = Math.atan2(rampH, rampL);
  arenaGroup.add(ramp); freeMapMeshes.push(ramp);

  // Tall side walls around the ramp + gap area so the player can't fly
  // sideways and skip onto another part of the track.
  const matWall = new THREE.MeshLambertMaterial({ color: 0x55556a });
  const wallY = 5, wallH = 9;
  const wallX0 = -140, wallX1 = -70, wallLen = wallX1 - wallX0;
  for (const sz of [-HW - 0.4, HW + 0.4]) {
    box((wallX0 + wallX1) / 2, wallH / 2, sz, wallLen, wallH, 0.6, matWall);
  }

  // Bouncy obstacle list — per-frame collision pushes the car back from these.
  freeMapRaceObstacles = [];

  // ── Zig-zag cone chicane on rung 2 (going west) ──
  function placeCone(x, z) {
    const c = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.7, 12), matCone);
    c.position.set(x, 0.85, z);
    arenaGroup.add(c); freeMapMeshes.push(c);
    const b2 = new THREE.Mesh(new THREE.CylinderGeometry(0.78, 0.78, 0.18, 12), matConeBand);
    b2.position.set(x, 1.05, z);
    arenaGroup.add(b2); freeMapMeshes.push(b2);
    freeMapRaceObstacles.push({ x, z, r: 0.9 });
  }
  for (let i = 0; i < 7; i++) {
    const x = 70 - i * 28;
    const z = 50 + (i % 2 === 0 ? -4 : 4);
    placeCone(x, z);
  }

  // ── Pillar slalom on rung 3 (going east) ──
  for (let i = 0; i < 6; i++) {
    const x = -90 + i * 38;
    const z = 100 + (i % 2 === 0 ? 3 : -3);
    box(x, 1.6, z, 2.2, 3.2, 2.2, matPillar);
    freeMapRaceObstacles.push({ x, z, r: 1.6 });
  }

  // ── Fluffy clouds dotted around the sky ──
  const matCloud = new THREE.MeshLambertMaterial({ color: 0xffffff });
  function cloud(cx, cy, cz, scale) {
    for (const p of [
      [0, 0, 0, 1.0], [2.5, 0.3, 0.5, 0.8], [-2.4, 0.2, -0.4, 0.85],
      [1.0, 0.8, -0.6, 0.7], [-1.2, 0.7, 0.7, 0.75], [3.6, 0.0, -0.2, 0.65],
    ]) {
      const r = 2.0 * scale * p[3];
      const s = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), matCloud);
      s.position.set(cx + p[0] * scale, cy + p[1] * scale, cz + p[2] * scale);
      arenaGroup.add(s); freeMapMeshes.push(s);
    }
  }
  const cloudSpots = [
    [-150,  45, -90, 1.4], [ -40,  60,-120, 1.7], [  80,  50,-100, 1.3],
    [ 180,  55,  20, 1.5], [ 220,  70,  90, 1.8], [ 100,  55, 220, 1.4],
    [-100,  65, 240, 1.6], [-220,  50, 180, 1.5], [-260,  60,  40, 1.7],
    [   0,  80,   0, 2.0], [ 140,  90, 140, 1.9], [-160,  85, -20, 1.6],
  ];
  for (const c of cloudSpots) cloud(c[0], c[1], c[2], c[3]);

  // ── Overpass spanning rung 4 (decorative, drive under it) ──
  const oX = -20, oY = 7;
  box(oX, oY, 150, 18, 0.7, RW + 8, matBridge);
  for (const sx of [-1, 1]) {
    box(oX, oY + 1.1, 150 + sx * (HW + 3.9), 18, 0.18, 0.3, matBridgeT);
    box(oX, oY + 0.4, 150 + sx * (HW + 3.9), 18, 0.18, 0.3, matBridgeT);
  }
  for (const sz of [150 - HW - 3.6, 150 + HW + 3.6]) {
    for (const sx of [-1, 1]) {
      box(oX + sx * 8, oY / 2, sz, 2.4, oY, 2.4, matBridgeT);
    }
  }

  // ── Start/finish checker stripe across rung 1 just east of spawn ──
  const finishX = W1.x + 8;
  const checks = 14, checkW = RW / checks;
  for (let i = 0; i < checks; i++) {
    flat(finishX, -HW + checkW * (i + 0.5), 0.9, checkW,
         i % 2 === 0 ? matFinishW : matFinishB, 0.015);
  }

  // ── Rival car parked next to spawn ──
  const _rivalCar = buildCar({ kind: 'sport', color: 0x22aaff, accent: 0x113355, isPlayer: false });
  _rivalCar.position.set(W1.x, 0.2, 3.5);
  _rivalCar.rotation.y = Math.PI / 2; // face east
  arenaGroup.add(_rivalCar); freeMapMeshes.push(_rivalCar);
  freeMapRaceRival = { mesh: _rivalCar };

  freeMapRaceRoad = {
    segments: segs,
    spawn:    { x: W1.x, z: 0, heading: Math.PI / 2 },
    ramp:     { x0: rampX0, x1: rampX1, zHalf: RW * 0.45, y0: rampY0, y1: rampY1 },
    gap:      { x0: GAP_X0, x1: GAP_X1, zHalf: HW },
    finish:   { x: finishX, z0: -HW, z1: HW, awayX: 50 }, // re-arm once player passes x>awayX
  };
  freeMapRaceLaps = 0;
  freeMapRaceLapArmed = false;

  arenaPlayer.x = W1.x - 6; arenaPlayer.z = 0; arenaPlayer.y = 0.2;
  arenaPlayer.vx = 0; arenaPlayer.vz = 0; arenaPlayer.vy = 0; arenaPlayer.fwd = 0;
  arenaPlayer.heading = Math.PI / 2; // face east (+X)
  arenaPlayer._racePrevX = undefined;
  arenaPlayer._wasOnRamp = false;
}

// Build the body material for a skin. `fx` upgrades the look:

function makeSkinMaterial(skin) {

    return new THREE.MeshStandardMaterial({ color, metalness: 0.98, roughness: 0.16, emissive: color, emissiveIntensity: 0.06 });
  }
  if (skin.fx === 'glow') {
    return new THREE.MeshStandardMaterial({ color, metalness: 0.2, roughness: 0.35, emissive: color, emissiveIntensity: 0.85 });
  }
  if (skin.fx === 'rainbow') {
    return new THREE.MeshStandardMaterial({ color, metalness: 0.45, roughness: 0.28, emissive: color, emissiveIntensity: 0.65 });
  }
  if (skin.fx === 'armor') {
    // Dark gunmetal undersuit; the green plates are added separately as geometry.

}

// Bolt green Spartan armor plates over the (gunmetal) stickman body. `limbs`

function addSpartanArmor(g, limbs, plateColor) {

  const trimMat  = new THREE.MeshStandardMaterial({ color: 0x1c1f23, metalness: 0.6, roughness: 0.5 });
  const plate = (geo, x, y, z, parent) => { const m = new THREE.Mesh(geo, plateMat); m.position.set(x, y, z); (parent || g).add(m); return m; };
  // chest plate + ab plate over the torso (torso centre ≈ y1.30)
  const chest = plate(new THREE.SphereGeometry(1, 16, 12), 0, 1.46, 0.04); chest.scale.set(0.52, 0.42, 0.40);
  const abs   = plate(new THREE.SphereGeometry(1, 14, 10), 0, 1.10, 0.02); abs.scale.set(0.42, 0.30, 0.34);

  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.07, 8, 18), trimMat);
  collar.rotation.x = Math.PI / 2; collar.position.set(0, 1.68, 0); g.add(collar);

  const belt = new THREE.Mesh(new THREE.TorusGeometry(0.40, 0.07, 8, 20), trimMat);
  belt.rotation.x = Math.PI / 2; belt.position.set(0, 0.94, 0); g.add(belt);

  for (const [pivot, sx] of [[limbs.la, -1], [limbs.ra, 1]]) {
    const pauld = new THREE.Mesh(new THREE.SphereGeometry(0.24, 14, 10), plateMat);
    pauld.scale.set(1.0, 0.8, 1.0); pauld.position.set(sx * 0.04, 0.02, 0); pivot.add(pauld);

  for (const [pivot] of [[limbs.ll], [limbs.rl]]) {

  }
}

// "FULL RAINBOW" set bonus — only when skin + helmet + aura + trail are ALL

function buildRainbowSet(g) {

  const basic = () => new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
  const rings = [];
  for (let i = 0; i < 3; i++) {

    r.position.y = 1.1; r.rotation.x = Math.PI / 2 + i * 0.5;

  }

    const o = add(new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), basic()));

}
function animateRainbowSet(s, t) {
  for (const r of s.rings) {
    r.m.material.color.setHSL((t * 0.2 + r.axis * 0.2) % 1, 1, 0.6);
    if (r.axis === 0) r.m.rotation.z = t * r.speed;
    else if (r.axis === 1) r.m.rotation.y = t * r.speed;
    else r.m.rotation.x = Math.PI / 2 + t * r.speed;
  }
  for (let i = 0; i < s.orbs.length; i++) {
    const o = s.orbs[i]; const a = o.a + t * 1.2;
    o.m.position.set(Math.cos(a) * o.r, o.y + Math.sin(t * 2 + o.phase) * 0.25, Math.sin(a) * o.r);
    o.m.material.color.setHSL((t * 0.3 + i / s.orbs.length) % 1, 1, 0.6);

  s.col.material.opacity = 0.1 + Math.abs(Math.sin(t * 1.5)) * 0.08;

      shards.push({ m: sh, a, y: 0.45 + (i % 4) * 0.42, r: 0.68 + (i % 2) * 0.16, spin: i % 2 ? 1 : -1 });
    }
    const mist = new THREE.Mesh(new THREE.SphereGeometry(1.05, 18, 14),
      new THREE.MeshBasicMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0.10, depthWrite: false }));
    mist.position.y = 1.1; ag.add(mist);
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.92, 30),
      new THREE.MeshBasicMaterial({ color: 0x9fe4ff, transparent: true, opacity: 0.55, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.05; ag.add(ring);
    g.userData.aura = { kind: 'ice', shards, ring };
  } else if (aur.id === 'electric') {
    // Crackling bolts orbiting the body + a charged ground ring.
    const ag = new THREE.Group(); g.add(ag);
    const bolts = [];
    const N = 10;
    for (let i = 0; i < N; i++) {
      const a = i / N * Math.PI * 2;
      const r = 0.7;
      const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.95, 5),
        new THREE.MeshBasicMaterial({ color: 0xaef2ff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
      bolt.position.set(Math.cos(a) * r, 1.0, Math.sin(a) * r);
      bolt.rotation.z = (i % 2 ? 1 : -1) * 0.5; bolt.rotation.y = -a;
      ag.add(bolt);
      bolts.push({ m: bolt, phase: i * 1.37, a, r });
    }
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.92, 30),
      new THREE.MeshBasicMaterial({ color: 0x66ddff, transparent: true, opacity: 0.5, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.05; ag.add(ring);
    g.userData.aura = { kind: 'electric', bolts, ring };
  } else if (aur.color != null) {
    // Generic glowing aura: orb + halo + orbiting motes. `rainbow` cycles the hue.
    const ag = new THREE.Group(); g.add(ag);
    const bubble = new THREE.Mesh(new THREE.SphereGeometry(1.25, 20, 16),
      new THREE.MeshBasicMaterial({ color: aur.color, transparent: true, opacity: 0.16, depthWrite: false }));
    bubble.position.set(0, 1.1, 0); ag.add(bubble);
    const ring = new THREE.Mesh(new THREE.RingGeometry(1.0, 1.42, 40),
      new THREE.MeshBasicMaterial({ color: aur.color, transparent: true, opacity: 0.55, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.05; ag.add(ring);
    const motes = [];
    const N = 8;
    for (let i = 0; i < N; i++) {
      const a = i / N * Math.PI * 2;
      const mo = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 6),
        new THREE.MeshBasicMaterial({ color: aur.color, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
      ag.add(mo);
      motes.push({ m: mo, a, y: 0.4 + (i % 3) * 0.5, r: 0.8 + (i % 2) * 0.18 });
    }
    g.userData.aura = { kind: 'glow', bubble, ring, motes, rainbow: !!aur.rainbow };
  }
  // FULL RAINBOW set bonus — all four rainbow pieces equipped → extra crazy FX.
  if (isFullRainbow()) g.userData.rainbowSet = buildRainbowSet(g);
  return g;
}

// Drive the animated aura FX on a stickman group (lobby avatar + podium).
function animateAura(group, t) {
  // Animated skins (rainbow) cycle the body hue even with no aura equipped.
  const sf = group && group.userData && group.userData.skinFX;
  if (sf && sf.type === 'rainbow' && sf.mat) {
    const hue = (t * 0.12) % 1;
    sf.mat.color.setHSL(hue, 0.95, 0.55);
    if (sf.mat.emissive) sf.mat.emissive.setHSL(hue, 0.95, 0.4);
  }
  // animated rainbow helmet
  const hf = group && group.userData && group.userData.helmetFX;
  if (hf && hf.type === 'rainbow' && hf.mat) {
    hf.mat.color.setHSL((t * 0.15 + 0.3) % 1, 0.95, 0.55);
  }
  // crazy "FULL RAINBOW" set bonus FX (built when skin+helmet+trail+aura all rainbow)
  if (group && group.userData && group.userData.rainbowSet) {
    animateRainbowSet(group.userData.rainbowSet, t);
  }
  const au = group && group.userData && group.userData.aura;
  if (!au) return;
  if (au.kind === 'fire') {
    for (const f of au.flames) {
      const fl = 0.7 + Math.sin(t * 9 + f.phase) * 0.3 + Math.sin(t * 17 + f.phase * 2) * 0.12;
      f.m.scale.y = Math.max(0.3, fl);
      f.m.scale.x = f.m.scale.z = 0.82 + Math.sin(t * 11 + f.phase) * 0.16;
      f.m.material.opacity = 0.55 + Math.sin(t * 13 + f.phase) * 0.25;
      const a = f.a + Math.sin(t * 2 + f.phase) * 0.16;
      f.m.position.x = Math.cos(a) * f.r; f.m.position.z = Math.sin(a) * f.r;
    }
    if (au.glow) au.glow.material.opacity = 0.4 + Math.sin(t * 6) * 0.18;
  } else if (au.kind === 'ice') {
    for (let i = 0; i < au.shards.length; i++) {
      const s = au.shards[i];
      const a = s.a + t * 0.6 * s.spin;
      s.m.position.set(Math.cos(a) * s.r, s.y + Math.sin(t * 1.5 + i) * 0.12, Math.sin(a) * s.r);
      s.m.rotation.y += 0.04; s.m.rotation.x = t * 0.5 * s.spin;
    }
    if (au.ring) au.ring.rotation.z = t * 0.5;
  } else if (au.kind === 'electric') {
    for (const b of au.bolts) {
      // flicker each bolt on/off and jitter its length like arcing electricity
      const flick = Math.sin(t * 22 + b.phase) + Math.sin(t * 37 + b.phase * 1.7);
      b.m.material.opacity = flick > 0.4 ? 0.95 : 0.12;
      b.m.scale.y = 0.7 + Math.abs(Math.sin(t * 17 + b.phase)) * 0.7;
      const a = b.a + Math.sin(t * 1.5 + b.phase) * 0.25;
      b.m.position.x = Math.cos(a) * b.r; b.m.position.z = Math.sin(a) * b.r;
    }
    if (au.ring) { au.ring.rotation.z = t * 1.4; au.ring.material.opacity = 0.4 + Math.abs(Math.sin(t * 9)) * 0.35; }
  } else if (au.kind === 'glow') {
    // pulse the orb, spin the halo, orbit the motes; rainbow cycles all hues
    if (au.bubble) au.bubble.material.opacity = 0.12 + Math.sin(t * 2.2) * 0.06;
    if (au.ring) au.ring.rotation.z = t * 0.6;
    for (let i = 0; i < au.motes.length; i++) {
      const mo = au.motes[i];
      const a = mo.a + t * 0.9;
      mo.m.position.set(Math.cos(a) * mo.r, mo.y + Math.sin(t * 2 + i) * 0.18, Math.sin(a) * mo.r);
    }
    if (au.rainbow) {
      const hue = (t * 0.1) % 1;
      const set = (m) => { if (m && m.material && m.material.color) m.material.color.setHSL(hue, 0.95, 0.6); };
      set(au.bubble); set(au.ring); au.motes.forEach(mo => set(mo.m));
    }
  }
}

function buildCar(opts) {
  const { kind = 'sedan', color = 0xff4444, accent = 0x222222, isPlayer = false } = opts;
  const g = new THREE.Group();

  // l=length w=width gc=ground-clearance lh=lower-body-height ch=cabin-height
  // cw=cabin-width cl=cabin-length cz=cabin Z offset from car centre
  const S = {
    sedan: { l:4.2, w:1.82, gc:0.16, lh:0.52, ch:0.50, cw:1.72, cl:2.02, cz:-0.12 },
    sport: { l:4.0, w:1.90, gc:0.13, lh:0.44, ch:0.40, cw:1.78, cl:1.66, cz:-0.06 },
    hatch: { l:3.8, w:1.76, gc:0.16, lh:0.54, ch:0.56, cw:1.66, cl:2.28, cz:-0.20 },
    van:   { l:4.5, w:1.92, gc:0.20, lh:0.68, ch:0.80, cw:1.86, cl:3.20, cz:-0.10 },
    truck: { l:5.0, w:2.20, gc:0.26, lh:0.78, ch:0.70, cw:2.04, cl:1.70, cz: 0.80 },
    f1:         { l:5.2, w:1.78, gc:0.06, lh:0.28, ch:0.28, cw:0.58, cl:0.88, cz:-0.18 },
    swat:       { l:4.6, w:2.10, gc:0.22, lh:0.70, ch:0.72, cw:2.0,  cl:3.0,  cz:-0.05 },
    tank:       { l:5.0, w:2.60, gc:0.28, lh:0.52, ch:0.42, cw:2.4,  cl:3.0,  cz: 0.0  },
    rocketcar:  { l:5.0, w:2.20, gc:0.24, lh:0.70, ch:0.56, cw:2.04, cl:1.70, cz: 0.80 },
  }[kind] || { l:4.2, w:1.82, gc:0.16, lh:0.52, ch:0.50, cw:1.72, cl:2.02, cz:-0.12 };

  const { l, w, gc, lh, ch, cw, cl, cz } = S;
  const wl = gc + lh;   // window-line Y (top of lower body = bottom of cabin)
  const rl = wl + ch;   // roof-line Y
  const wr = 0.34;      // wheel radius
  const ww = 0.22;      // wheel width

  // keep a compat dim object so the rest of the codebase doesn't break
  const dim = { l, w, h: lh + ch, roofL: cl, roofW: cw, roofH: ch, roofZ: cz };

  // ── Materials ─────────────────────────────────────────────────────────────────
  const bodyMat    = new THREE.MeshPhongMaterial({ color, shininess:100, specular:0x334466 });
  const accentMat  = new THREE.MeshPhongMaterial({ color:accent, shininess:60 });
  const glassMat   = new THREE.MeshPhongMaterial({ color:0x0e1820, shininess:120, transparent:true, opacity:0.88 });
  const darkMat    = new THREE.MeshLambertMaterial({ color:0x0e0e0e });
  const tireMat    = new THREE.MeshLambertMaterial({ color:0x111111 });
  const rimMat     = new THREE.MeshPhongMaterial({ color:0xe4e4e4, shininess:90 });
  const caliperMat = new THREE.MeshLambertMaterial({ color:0xcc1111 });
  const lightMat   = new THREE.MeshBasicMaterial({ color:0xfffae0 });
  const tailMat    = new THREE.MeshBasicMaterial({ color:0xff1818 });

  // ── Lower body (chassis) — full car length & width ────────────────────────────
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, lh, l), bodyMat);
  body.position.y = gc + lh / 2;
  g.add(body);

  // ── Cabin — sits flush on top of lower body ────────────────────────────────────
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(cw, ch, cl), bodyMat);
  cabin.position.set(0, wl + ch / 2, cz);
  g.add(cabin);

  // ── Roof panel (thin cap) ──────────────────────────────────────────────────────
  const roof = new THREE.Mesh(new THREE.BoxGeometry(cw, 0.05, cl), bodyMat);
  roof.position.set(0, rl - 0.02, cz);
  g.add(roof);

  // ── Glass ─────────────────────────────────────────────────────────────────────
  let glass = null;
  if (kind !== 'truck' && kind !== 'f1' && kind !== 'tank') {
    const wsH = ch * 0.82;
    const wsAngle = kind === 'van' ? -0.08 : kind === 'sport' ? -0.42 : -0.30;
    const ws = new THREE.Mesh(new THREE.BoxGeometry(cw * 0.86, wsH, 0.05), glassMat);
    ws.position.set(0, wl + wsH * 0.5 + ch * 0.03, cz + cl / 2);
    ws.rotation.x = wsAngle;
    g.add(ws);
    glass = ws;

    const rwH = ch * (kind === 'hatch' ? 0.88 : 0.72);
    const rw = new THREE.Mesh(new THREE.BoxGeometry(cw * 0.80, rwH, 0.05), glassMat);
    rw.position.set(0, wl + rwH * 0.5 + ch * 0.06, cz - cl / 2);
    rw.rotation.x = kind === 'hatch' ? 0.50 : 0.28;
    g.add(rw);

    for (const sx of [-1, 1]) {
      const sw = new THREE.Mesh(new THREE.BoxGeometry(0.05, ch * 0.70, cl * 0.78), glassMat);
      sw.position.set(sx * (cw / 2 + 0.01), wl + ch * 0.42, cz);
      g.add(sw);
    }
  }

  // ── Wheels ─────────────────────────────────────────────────────────────────────
  const wxOff = w / 2 + ww / 2 - 0.04;
  for (const wx of [-wxOff, wxOff]) {
    for (const wz of [l / 2 - 0.76, -l / 2 + 0.76]) {
      const wg = new THREE.Group();
      wg.position.set(wx, wr, wz);

      const tire = new THREE.Mesh(new THREE.CylinderGeometry(wr, wr, ww, 20), tireMat);
      tire.rotation.z = Math.PI / 2;
      wg.add(tire);

      const rim = new THREE.Mesh(new THREE.CylinderGeometry(wr * 0.72, wr * 0.72, ww + 0.01, 20), rimMat);
      rim.rotation.z = Math.PI / 2;
      wg.add(rim);

      for (let i = 0; i < 10; i++) {
        const spoke = new THREE.Mesh(new THREE.BoxGeometry(wr * 1.2, 0.04, 0.034), rimMat);
        spoke.rotation.x = (i / 10) * Math.PI * 2;
        wg.add(spoke);
      }

      const cal = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.15, 0.10), caliperMat);
      cal.position.set(wx < 0 ? 0.07 : -0.07, 0.07, 0);
      wg.add(cal);

      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, ww + 0.02, 8), rimMat);
      hub.rotation.z = Math.PI / 2;
      wg.add(hub);

      g.add(wg);
    }
  }

  // ── Lights ─────────────────────────────────────────────────────────────────────
  let tailLeft = null, tailRight = null, brakeStrip = null;
  if (isPlayer) {
    const tailBar = new THREE.Mesh(new THREE.BoxGeometry(w * 0.70, 0.05, 0.07), tailMat);
    tailBar.position.set(0, wl - 0.09, -l / 2 - 0.01);
    g.add(tailBar);
    for (const sx of [-1, 1]) {
      const tl = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.20, 0.07), tailMat);
      tl.position.set(sx * (w / 2 - 0.17), wl - 0.20, -l / 2 - 0.01);
      g.add(tl);
      if (sx === -1) tailLeft = tl; else tailRight = tl;
    }
    brakeStrip = new THREE.Mesh(new THREE.BoxGeometry(w * 0.48, 0.05, 0.06),
      new THREE.MeshBasicMaterial({ color:0xff5050 }));
    brakeStrip.position.set(0, wl - 0.03, -l / 2 - 0.01);
    g.add(brakeStrip);
  } else {
    for (const sx of [-1, 1]) {
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.06, 0.07), lightMat);
      hl.position.set(sx * (w / 2 - 0.23), wl - 0.09, l / 2 + 0.01);
      g.add(hl);
      const drl = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.04, 0.06), lightMat);
      drl.position.set(sx * (w / 2 - 0.23), wl - 0.21, l / 2 + 0.01);
      g.add(drl);
    }
    const grilleBg   = new THREE.MeshLambertMaterial({ color:0x080808 });
    const grilleEdge = new THREE.MeshLambertMaterial({ color:0x222222 });
    const gH = lh * 0.52, gW = w * 0.20;
    for (const sx of [-1, 1]) {
      const gx = sx * w * 0.14, gY = gc + lh * 0.40;
      const frame = new THREE.Mesh(new THREE.BoxGeometry(gW + 0.08, gH + 0.07, 0.09), grilleEdge);
      frame.position.set(gx, gY, l / 2 + 0.01);
      g.add(frame);
      const fill = new THREE.Mesh(new THREE.BoxGeometry(gW, gH, 0.09), grilleBg);
      fill.position.set(gx, gY, l / 2 + 0.015);
      g.add(fill);
      for (let b = 0; b < 4; b++) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(gW - 0.02, 0.025, 0.10), grilleEdge);
        bar.position.set(gx, gY - gH / 2 + (b + 0.8) * gH / 4.5, l / 2 + 0.015);
        g.add(bar);
      }
    }
    const intake = new THREE.Mesh(new THREE.BoxGeometry(w * 0.66, 0.09, 0.07),
      new THREE.MeshLambertMaterial({ color:0x0a0a0a }));
    intake.position.set(0, gc + 0.07, l / 2 + 0.01);
    g.add(intake);
  }

  // ── Bumpers — body-coloured, flush with front/rear faces ──────────────────────
  const frontBumper = new THREE.Mesh(new THREE.BoxGeometry(w + 0.06, lh * 0.36, 0.14), bodyMat);
  frontBumper.position.set(0, gc + lh * 0.18, l / 2 + 0.07);
  frontBumper.userData.initY = frontBumper.position.y;
  g.add(frontBumper);

  const rearBumper = new THREE.Mesh(new THREE.BoxGeometry(w + 0.06, lh * 0.32, 0.13), bodyMat);
  rearBumper.position.set(0, gc + lh * 0.16, -l / 2 - 0.06);
  g.add(rearBumper);

  // ── Side skirts ───────────────────────────────────────────────────────────────
  const skirtH = lh * 0.22;
  const skirtL = new THREE.Mesh(new THREE.BoxGeometry(0.05, skirtH, l * 0.76), accentMat);
  skirtL.position.set(-w / 2 - 0.015, gc + skirtH / 2, 0);
  g.add(skirtL);
  const skirtR = new THREE.Mesh(new THREE.BoxGeometry(0.05, skirtH, l * 0.76), accentMat);
  skirtR.position.set(w / 2 + 0.015, gc + skirtH / 2, 0);
  g.add(skirtR);

  // ── Mirrors — mounted on cabin sides ─────────────────────────────────────────
  const mirrorMat = new THREE.MeshLambertMaterial({ color:0x111111 });
  const mirrorL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.11, 0.18), mirrorMat);
  mirrorL.position.set(-cw / 2 - 0.06, wl + ch * 0.78, cz + cl * 0.32);
  g.add(mirrorL);
  const mirrorR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.11, 0.18), mirrorMat);
  mirrorR.position.set(cw / 2 + 0.06, wl + ch * 0.78, cz + cl * 0.32);
  g.add(mirrorR);

  // ── Exhaust ────────────────────────────────────────────────────────────────────
  const exMat  = new THREE.MeshLambertMaterial({ color:0x888888 });
  const exGeom = new THREE.CylinderGeometry(0.055, 0.055, 0.16, 8);
  for (const exX of [w * 0.22, w * 0.34]) {
    const pipe = new THREE.Mesh(exGeom, exMat);
    pipe.rotation.x = Math.PI / 2;
    pipe.position.set(exX, gc + 0.04, -l / 2 - 0.07);
    g.add(pipe);
  }

  // ── License plate ─────────────────────────────────────────────────────────────
  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.13, 0.03),
    new THREE.MeshBasicMaterial({ color:0xe0e0e0 }));
  plate.position.set(0, gc + lh * 0.28, isPlayer ? -l / 2 - 0.07 : l / 2 + 0.07);
  g.add(plate);

  // ── Truck trailer ─────────────────────────────────────────────────────────────
  if (kind === 'truck') {
    const tl = 5.5;
    const trailer = new THREE.Mesh(new THREE.BoxGeometry(w * 0.95, (lh + ch) * 0.85, tl),
      new THREE.MeshLambertMaterial({ color:0xcccccc }));
    trailer.position.set(0, gc + (lh + ch) * 0.425, -l / 2 - tl / 2 - 0.25);
    g.add(trailer);
    const txOff = w / 2 + ww / 2 - 0.04;
    for (const tx of [-txOff, txOff]) {
      for (const tz of [-l / 2 - 1.5, -l / 2 - 4.5]) {
        const tw = new THREE.Mesh(new THREE.CylinderGeometry(wr, wr, ww, 12), tireMat);
        tw.rotation.z = Math.PI / 2;
        tw.position.set(tx, wr, tz);
        g.add(tw);
      }
    }
  }

  // ── F1 car extras: front wing, rear wing, halo, sidepods, airbox ──────────────
  if (kind === 'f1') {
    const carbonMat = new THREE.MeshPhongMaterial({ color: accent, shininess: 120 });
    const f1BodyMat = new THREE.MeshPhongMaterial({ color, shininess: 140 });
    // front wing — wide flat plane at nose
    const fwMain = new THREE.Mesh(new THREE.BoxGeometry(w * 1.55, 0.04, 0.50), carbonMat);
    fwMain.position.set(0, gc + 0.06, l / 2 + 0.12);
    g.add(fwMain);
    // front wing end plates
    for (const sx of [-1, 1]) {
      const fwEp = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.14, 0.52), carbonMat);
      fwEp.position.set(sx * w * 0.79, gc + 0.10, l / 2 + 0.12);
      g.add(fwEp);
    }
    // front wing second flap
    const fwFlap = new THREE.Mesh(new THREE.BoxGeometry(w * 1.40, 0.035, 0.28), f1BodyMat);
    fwFlap.position.set(0, gc + 0.12, l / 2 + 0.04);
    g.add(fwFlap);
    // sidepods (two rectangular pods flanking the cockpit)
    for (const sx of [-1, 1]) {
      const pod = new THREE.Mesh(new THREE.BoxGeometry(0.28, lh * 0.90, l * 0.40), f1BodyMat);
      pod.position.set(sx * (w / 2 + 0.10), gc + lh * 0.45, -0.05);
      g.add(pod);
    }
    // airbox — intake scoop above cockpit
    const airbox = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.20, 0.30), carbonMat);
    airbox.position.set(0, wl + ch * 0.70, cz + cl * 0.15);
    g.add(airbox);
    // halo bar — U-shaped safety bar over cockpit (3 segments)
    const haloMat = new THREE.MeshPhongMaterial({ color: 0xd4af37, shininess: 130 });
    const haloTop = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.05, 0.60), haloMat);
    haloTop.position.set(0, wl + ch + 0.08, cz);
    g.add(haloTop);
    for (const sx of [-1, 1]) {
      const haloPillar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.26, 0.06), haloMat);
      haloPillar.position.set(sx * 0.22, wl + ch - 0.04, cz);
      g.add(haloPillar);
    }
    // rear wing main plane
    const rwMain = new THREE.Mesh(new THREE.BoxGeometry(w * 1.14, 0.05, 0.44), carbonMat);
    rwMain.position.set(0, wl + ch + 0.30, -l / 2 + 0.30);
    g.add(rwMain);
    // rear wing second flap
    const rwFlap = new THREE.Mesh(new THREE.BoxGeometry(w * 1.10, 0.04, 0.22), f1BodyMat);
    rwFlap.position.set(0, wl + ch + 0.20, -l / 2 + 0.22);
    g.add(rwFlap);
    // rear wing end plates
    for (const sx of [-1, 1]) {
      const rwEp = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.44, 0.52), carbonMat);
      rwEp.position.set(sx * w * 0.58, wl + ch + 0.14, -l / 2 + 0.26);
      g.add(rwEp);
    }
    // rear wing struts
    for (const sx of [-1, 1]) {
      const strut = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.36, 0.05), carbonMat);

function applyDamageVisual(group, dmgLevel) {
  const d = Math.max(0, Math.min(1, dmgLevel));
  const u = group.userData;
  // body color darken
  const baseColor = new THREE.Color(getPlayerBodyColor());
  baseColor.multiplyScalar(1 - d * 0.5);
  u.bodyMat.color.copy(baseColor);
  // mirrors snap off
  if (u.mirrorL) u.mirrorL.visible = d < 0.6;
  if (u.mirrorR) u.mirrorR.visible = d < 0.8;
  // bumper hangs / tears off
  if (u.frontBumper) {
    u.frontBumper.rotation.x = d * 0.6;
    u.frontBumper.position.y = (u.frontBumper.userData.initY ?? 0.26) - d * 0.15;
    u.frontBumper.visible = d < 0.95;
  }
  if (u.rearBumper) {
    u.rearBumper.rotation.x = -d * 0.5;
    u.rearBumper.visible = d < 0.92;
  }
  // tail lights die
  if (u.tailLeft) u.tailLeft.visible = d < 0.5;
  if (u.tailRight) u.tailRight.visible = d < 0.75;
  if (u.brakeStrip) u.brakeStrip.visible = d < 0.6;
  // roof tilts at extreme damage
  if (u.roof) u.roof.rotation.x = d > 0.6 ? (d - 0.6) * 0.4 : 0;
  if (u.glass) u.glass.rotation.x = d > 0.6 ? (d - 0.6) * 0.4 : 0;
  // plate falls off
  if (u.plate) u.plate.visible = d < 0.7;
  // skirts crack off
  if (u.skirtL) u.skirtL.visible = d < 0.55;
  if (u.skirtR) u.skirtR.visible = d < 0.7;
  // stripe (accent) fades — set opacity? Lambert doesn't support transparency by default; set color toward black
  if (u.stripe && u.stripe.material) {
    const ac = new THREE.Color(CARS[carIdx].accent);
    ac.multiplyScalar(Math.max(0.2, 1 - d * 1.2));
    u.stripe.material.color.copy(ac);
  }
}

function rebuildPlayerCar() {

    scene.remove(playerCarGroup);

  // plus add a coloured point-light parented to the car for the bloom feel.

    if (typeof _col !== 'number') _col = 0x00ffff;

      const m = obj.material;
      if (!m || !m.color) return;
      if (m.emissive && typeof m.color.getHex === 'function') {

        if (hex === _col) { m.emissive.setHex(_col); m.emissiveIntensity = 0.9; }

  const idle = playing ? speed * 6 : 200; // map to feel
  const tFreq = 45 + idle / 14;
  const sFreq = 30 + idle / 60;
  const cutoff = 500 + idle * 0.35;
  const tGain = playing ? 0.07 : 0.025;
  const sGain = playing ? 0.05 : 0.018;
  const t = audioCtx.currentTime;
  engineOsc.frequency.setTargetAtTime(tFreq, t, 0.06);
  engineSub.frequency.setTargetAtTime(sFreq, t, 0.08);
  engineFilter.frequency.setTargetAtTime(cutoff, t, 0.08);
  engineGain.gain.setTargetAtTime(tGain, t, 0.08);
  engineSubGain.gain.setTargetAtTime(sGain, t, 0.08);
}
function playCrashSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * 0.6);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) { const env = Math.pow(1 - i/len, 1.6); d[i] = (Math.random()*2-1) * env; }
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const filt = audioCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value = 800;
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  src.connect(filt); filt.connect(g); g.connect(audioOut()); src.start(t);
  const o = audioCtx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.45);
  const og = audioCtx.createGain(); og.gain.setValueAtTime(0.45, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
  o.connect(og); og.connect(audioOut()); o.start(t); o.stop(t + 0.6);
}

// ===== lifecycle =====
function startGame() {
  if (MODES[modeIdx] === 'ARENA') { state = STATE.ARENA_SELECT; return; }
  if (MODES[modeIdx] === 'FREE MAP') {
    freeMap = true; battleRoyale = false; champActive = false;
    freeMapHP = FREE_MAP_MAX_HP; freeMapGrip = Math.min(freeMapGrip, freeMapGripCap());
    startArena();
    return;
  }
  freeMap = false;
  // remove all enemy meshes
  for (const e of enemies) scene.remove(e.mesh);
  enemies = [];
  particles = [];
  const d = DIFFICULTIES[difficultyIdx];
  score = 0;
  speed = d.startSpeed;
  speedBoost = 0;
  spawnTimer = 0;
  wave = 0; dodged = 0; waveBanner = 1500;
  player.worldX = 0; player.vx = 0;
  lastEarned = 0;
  dmg = { body:0, tires:0, engine:0 };
  invulnTime = 0; crashes = 0; smokeTimer = 0; damageBanner = 0;
  gameTime = 0; distanceM = 0; speedingTime = 0; maxSpeed = 0; earnings = null; crashAutoTimer = 0;
  diffSpeedWarning = 0;
  bgCycleTimer = 25000 + Math.random() * 20000; // first switch in 25-45s
  rebuildPlayerCar();
  state = STATE.PLAYING;
}
function levelCleanup() {

  for (const b of levelBullets3D) { if (b.mesh) scene.remove(b.mesh); }
  levelEnemies = [];
  levelBullets3D = [];
  rebuildPlayerCar(); // restore regular car mesh after leaving level mode
}

  levelPlayerVx = 0;

  levelPhaseTimer = 0;

  // shootCooldown = ms between shots, driftSpeed = units/sec lateral slide
