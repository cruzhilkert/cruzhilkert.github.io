// ===== lifecycle =====
function startGame() {
  if (MODES[modeIdx] === 'ARENA') { state = STATE.ARENA_SELECT; return; }
  if (MODES[modeIdx] === 'FREE MAP') {
    freeMap = true; battleRoyale = false; champActive = false;
    freeMapHP = FREE_MAP_MAX_HP; freeMapGrip = Math.min(freeMapGrip, freeMapGripCap());
    startArena();
    return;
  }
  freeMap = false;
  // remove all enemy meshes
  for (const e of enemies) scene.remove(e.mesh);
  enemies = [];
  particles = [];
  const d = DIFFICULTIES[difficultyIdx];
  score = 0;
  speed = d.startSpeed;
  speedBoost = 0;
  spawnTimer = 0;
  wave = 0; dodged = 0; waveBanner = 1500;
  player.worldX = 0; player.vx = 0;
  lastEarned = 0;
  dmg = { body:0, tires:0, engine:0 };
  invulnTime = 0; crashes = 0; smokeTimer = 0; damageBanner = 0;
  gameTime = 0; distanceM = 0; speedingTime = 0; maxSpeed = 0; earnings = null; crashAutoTimer = 0;
  diffSpeedWarning = 0;
  bgCycleTimer = 25000 + Math.random() * 20000; // first switch in 25-45s
  rebuildPlayerCar();
  state = STATE.PLAYING;
}
function levelCleanup() {
  for (const e of levelEnemies) { if (e.mesh) scene.remove(e.mesh); }
  for (const b of levelBullets3D) { if (b.mesh) scene.remove(b.mesh); }
  levelEnemies = [];
  levelBullets3D = [];
  rebuildPlayerCar(); // restore regular car mesh after leaving level mode
}

function startLevelGame(n) {
  levelCleanup();
  currentLevel = n;
  const healthBonus = (levelCarIdx === SWAT_IDX) ? HEALTH_BONUSES[swatHealthTier] : 0;
  levelLives = CARS[levelCarIdx].hitsToKill + healthBonus;
  levelPlayerX = 0;
  levelPlayerVx = 0;
  levelShootCooldown = 0;
  levelInvuln = 0;
  levelPhase = 'playing';
  levelPhaseTimer = 0;
  rebuildLevelCar();

  // shootCooldown = ms between shots, driftSpeed = units/sec lateral slide
  function spawnSwat(wx, wz, timer, driftSpeed = 3, shootCooldown = 3000) {
    const m = buildCar({ kind: 'swat', color: 0x0d1b3e, accent: 0x1a3a6e });
    m.position.set(wx, 0, wz); scene.add(m);
    levelEnemies.push({ mesh: m, worldX: wx, worldZ: wz, hp: 3,
      flash: 0, kind: 'swat_runner', cycleTimer: timer, aimX: wx, drifting: false,
      driftSpeed, shootCooldown });
  }
  function spawnTank(wx, wz, timer, driftSpeed = 3, shootCooldown = 2000) {
    const m = buildCar({ kind: 'tank', color: 0x4e6741, accent: 0x2d3b25 });
    m.position.set(wx, 0, wz); scene.add(m);
    levelEnemies.push({ mesh: m, worldX: wx, worldZ: wz, hp: 5,
      flash: 0, kind: 'tank_runner', cycleTimer: timer, aimX: wx, drifting: false,
      driftSpeed, shootCooldown });
  }
  function spawnRocket(wx, wz, timer, driftSpeed = 3, shootCooldown = 3000) {
    const m = buildCar({ kind: 'rocketcar', color: 0xff1744, accent: 0x7a0020 });
    m.position.set(wx, 0, wz); scene.add(m);
    levelEnemies.push({ mesh: m, worldX: wx, worldZ: wz, hp: 4,
      flash: 0, kind: 'rocket_runner', cycleTimer: timer, aimX: wx, drifting: false,
      driftSpeed, shootCooldown });
  }

  const L = LEVEL_3D_LANES; // [-9,-6,-3, 0, 3, 6, 9]
  if (n === 1) {
    spawnSwat(L[3], 38, 3000);
  }
  if (n === 2) {
    spawnSwat(L[1], 35, 2800);
    spawnSwat(L[5], 50, 4200);
  }
  if (n === 3) {
    spawnSwat(L[0], 32, 2600);
    spawnSwat(L[3], 44, 3400);
    spawnSwat(L[6], 56, 4800);
  }
  if (n === 4) {
    spawnSwat(L[0], 30, 2400);
    spawnSwat(L[2], 40, 3000);
    spawnSwat(L[4], 50, 3800);
    spawnSwat(L[6], 62, 5200);
  }
  if (n === 5) {
    spawnSwat(L[0], 30, 2200);
    spawnSwat(L[1], 38, 2900);
    spawnSwat(L[3], 46, 3500);
    spawnSwat(L[5], 56, 4300);
    spawnSwat(L[6], 64, 5600);
  }
  if (n === 6) {
    spawnSwat(L[0], 32, 2000, 5, 2000);
    spawnSwat(L[3], 44, 2600, 5, 2000);
    spawnSwat(L[6], 56, 3200, 5, 2000);
    spawnTank(L[4], 64, 4000, 1.5, 3000);
  }
  if (n === 7) {
    spawnSwat(L[0], 30, 2200);
    spawnSwat(L[3], 40, 3000);
    spawnSwat(L[6], 50, 3800);
    spawnTank(L[2], 60, 4400);
    spawnTank(L[5], 66, 5200);
  }
  if (n === 8) {
    spawnRocket(L[3], 40, 3000);
  }

  state = STATE.LEVEL;
}

function updateLevel(dt) {
  levelShootCooldown = Math.max(0, levelShootCooldown - dt);
  levelInvuln        = Math.max(0, levelInvuln - dt);

  // Continuous steering — identical to regular game
  const dts = dt / 1000;
  const car = CARS[levelCarIdx];
  const dir = ((keys['arrowleft'] || keys['a']) ? 1 : 0) - ((keys['arrowright'] || keys['d']) ? 1 : 0);
  const speedUpg = (levelCarIdx === SWAT_IDX && swatSpeedTier > 0) ? 1.25 : 1;
  const maxVx = 14 * car.steerMul * speedUpg;
  levelPlayerVx += (dir * maxVx - levelPlayerVx) * Math.min(1, dts * 9 * car.steerMul * speedUpg);
  levelPlayerX += levelPlayerVx * dts;
  const limit = ROAD_HALF - 0.5;
  if (levelPlayerX < -limit) { levelPlayerX = -limit; levelPlayerVx *= -0.2; }
  if (levelPlayerX >  limit) { levelPlayerX =  limit; levelPlayerVx *= -0.2; }

  if (levelPhase !== 'playing') {
    levelPhaseTimer -= dt;
    if (levelPhaseTimer <= 0) { levelCleanup(); state = STATE.MISSIONS; }
    return;
  }

  // ---- enemies ----
  for (const e of levelEnemies) {
    e.flash = Math.max(0, e.flash - dt);

    // Drift forward at road speed so they don't approach the player
    e.worldZ += 6 * dts;
    if (e.worldZ > 72) e.worldZ = 28;

    // Shared scan → drift → shoot cycle
    if (!e.drifting) {
      e.cycleTimer -= dt;
      if (e.cycleTimer <= 0) {
        e.aimX = levelPlayerX;
        e.drifting = true;
      }
    } else {
      const diff = e.aimX - e.worldX;
      const step = (e.driftSpeed || 3) * dts;
      if (Math.abs(diff) <= step) {
        e.worldX = e.aimX;
        e.drifting = false;

        // fire based on kind; reset cycle using per-enemy shootCooldown
        e.cycleTimer = e.shootCooldown;

        if (e.kind === 'swat_runner') {
          const bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4400 }));
          bMesh.position.set(e.worldX, 0.6, e.worldZ - 2);
          scene.add(bMesh);
          levelBullets3D.push({ mesh: bMesh, worldX: e.worldX, worldZ: e.worldZ - 2, velZ: -68, dmg: 1 });

        } else if (e.kind === 'tank_runner') {
          const bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.38, 8, 8), new THREE.MeshBasicMaterial({ color: 0x88ff00 }));
          bMesh.position.set(e.worldX, 0.6, e.worldZ - 2);
          scene.add(bMesh);
          levelBullets3D.push({ mesh: bMesh, worldX: e.worldX, worldZ: e.worldZ - 2, velZ: -60, dmg: 3 });

        } else if (e.kind === 'rocket_runner') {
          const missile = new THREE.Group();
          // tube body
          const mBody = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.12, 0.80, 8),
            new THREE.MeshPhongMaterial({ color: 0x999999, shininess: 80 }));
          mBody.rotation.x = Math.PI / 2;
          missile.add(mBody);
          // nose cone (points in -Z = direction of travel toward player)
          const mNose = new THREE.Mesh(new THREE.ConeGeometry(0.10, 0.22, 8),
            new THREE.MeshPhongMaterial({ color: 0xff3300, shininess: 100 }));
          mNose.rotation.x = Math.PI / 2;
          mNose.position.z = -0.51;
          missile.add(mNose);
          // fire exhaust (expands in +Z, away from direction of travel)
          const mFire = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.32, 8),
            new THREE.MeshBasicMaterial({ color: 0xff7700 }));
          mFire.rotation.x = -Math.PI / 2;
          mFire.position.z = 0.55;
          missile.add(mFire);
          const mFireInner = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.20, 8),
            new THREE.MeshBasicMaterial({ color: 0xffee00 }));
          mFireInner.rotation.x = -Math.PI / 2;
          mFireInner.position.z = 0.52;
          missile.add(mFireInner);
          missile.position.set(e.worldX, 0.6, e.worldZ - 2);
          scene.add(missile);
          levelBullets3D.push({ mesh: missile, worldX: e.worldX, worldZ: e.worldZ - 2, velZ: -28, dmg: 5, rocket: true });
        }
      } else {
        e.worldX += Math.sign(diff) * step;
      }
    }

    if (e.mesh) e.mesh.position.set(e.worldX, 0, e.worldZ);
  }

  // ---- move bullets ----
  levelBullets3D = levelBullets3D.filter(b => {
    const vel = b.velZ !== undefined ? b.velZ : 75; // default: player bullet goes forward
    b.worldZ += vel * dts;
    if (b.mesh) b.mesh.position.set(b.worldX, 0.6, b.worldZ);
    // cull out-of-range
    if (b.worldZ > 130 || b.worldZ < -5) { scene.remove(b.mesh); return false; }
    return true;
  });

  // ---- player bullets hit enemy ----
  levelBullets3D = levelBullets3D.filter(b => {
    if ((b.velZ || 75) < 0) return true; // skip enemy bullets
    for (let i = levelEnemies.length - 1; i >= 0; i--) {
      const e = levelEnemies[i];
      if (Math.abs(b.worldX - e.worldX) < 3 && Math.abs(b.worldZ - e.worldZ) < 5) {
        e.hp--;
        e.flash = 200;
        if (e.hp <= 0) {
          spawnExplosion3D(e.worldX, 1, e.worldZ);
          playCrashSound();
          scene.remove(e.mesh);
          levelEnemies.splice(i, 1);
        }
        scene.remove(b.mesh);
        return false;
      }
    }
    return true;
  });

  // ---- enemy bullets hit player ----
  // rocket bullets explode (splash) at detonation Z regardless of whether they hit the player
  levelBullets3D = levelBullets3D.filter(b => {
    if ((b.velZ || 75) >= 0 || !b.rocket) return true; // only rocket enemy bullets
    if (b.worldZ > 4) return true; // not close enough yet
    // detonate: explosion + wide splash
    spawnExplosion3D(b.worldX, 1, b.worldZ);
    addShake(0.2, 200);
    scene.remove(b.mesh);
    if (levelInvuln <= 0 && Math.abs(b.worldX - levelPlayerX) < 4.5) {
      levelLives -= (b.dmg || 5);
      if (levelLives < 0) levelLives = 0;
      levelInvuln = 1200;
      addShake(0.3, 400);
      playCrashSound();
      if (levelLives <= 0) { levelPhase = 'lose'; levelPhaseTimer = 2200; }
    }
    return false;
  });

  if (levelInvuln <= 0) {
    const hitIdx = levelBullets3D.findIndex(
      b => (b.velZ || 75) < 0 && !b.rocket && b.worldZ <= 4 && Math.abs(b.worldX - levelPlayerX) < 2.8
    );
    if (hitIdx !== -1) {
      const hitB = levelBullets3D[hitIdx];
      scene.remove(hitB.mesh);
      levelBullets3D.splice(hitIdx, 1);
      levelLives -= (hitB.dmg || 1);
      if (levelLives < 0) levelLives = 0;
      levelInvuln = 1200;
      addShake(0.3, 400);
      playCrashSound();
      if (levelLives <= 0) { levelPhase = 'lose'; levelPhaseTimer = 2200; }
    }
  }

  // ---- win ----
  if (levelEnemies.length === 0 && levelPhase === 'playing') {
    levelPhase = 'win';
    levelPhaseTimer = 2000;
    if (levelProgress < currentLevel + 1) {
      levelProgress = currentLevel + 1;
      localStorage.setItem('headon_level_progress', levelProgress);
    }
    if (!levelRewardsClaimed.has(currentLevel)) {
      levelRewardsClaimed.add(currentLevel);
      localStorage.setItem('headon_level_rewards', JSON.stringify([...levelRewardsClaimed]));
      const reward = currentLevel * 100;
      setCoins(coins + reward);
      levelLastReward = reward;
    } else {
      levelLastReward = 0;
    }
  }
}

function tryBuy() {
  const car = CARS[carIdx];
  if (isUnlocked(carIdx)) return;
  if (coins < car.cost) return;
  setCoins(coins - car.cost);
  unlockCar(carIdx);
}

function randomAliveTilePos() {
  const alive = arenaTiles.filter(t => t.state === 'alive');
  if (!alive.length) return { x: 0, z: 0 };
  const t = alive[Math.floor(Math.random() * alive.length)];
  return { x: t.x, z: t.z };
}

function updateBot(bot, dt) {
  if (bot.frozenTimer > 0) { bot.frozenTimer -= dt; return; }
  if (bot.mfBlastTimer > 0) {
    bot.mfBlastTimer -= dt;
    const dts2 = dt / 1000;
    // Flee toward outer edge — drive directly away from centre
    const outAngle = Math.atan2(bot.x, bot.z);
    let diff2 = outAngle - bot.heading;
    while (diff2 >  Math.PI) diff2 -= Math.PI * 2;
    while (diff2 < -Math.PI) diff2 += Math.PI * 2;
    bot.heading += Math.sign(diff2) * Math.min(Math.abs(diff2), 5 * dts2);
    bot.fwd = Math.min(22, bot.fwd + 22 * dts2);
    bot.x += Math.sin(bot.heading) * bot.fwd * dts2 + bot.vx * dts2;
    bot.z += Math.cos(bot.heading) * bot.fwd * dts2 + bot.vz * dts2;
    bot.vx *= Math.pow(0.3, dts2);
    bot.vz *= Math.pow(0.3, dts2);
    if (!bot.onGround) { bot.vy -= 18 * dts2; bot.y += bot.vy * dts2; if (bot.y <= 0) { bot.y = 0; bot.vy = 0; bot.onGround = true; } }
    if (arenaLevel <= 5) {
      const bd = Math.hypot(bot.x, bot.z);
      if (bd > BARRIER_RADIUS - 0.5) { const nx = bot.x/bd, nz = bot.z/bd; bot.x = nx*(BARRIER_RADIUS-0.5); bot.z = nz*(BARRIER_RADIUS-0.5); bot.vx -= nx*6; bot.vz -= nz*6; }
    }
    if (bot.mesh) { bot.mesh.position.set(bot.x, bot.y, bot.z); bot.mesh.rotation.set(0, bot.heading, 0); }
    return;
  }
  const dts = dt / 1000;
  bot.jumpCooldown = Math.max(0, bot.jumpCooldown - dt);

  // level-scaled parameters (battle royale overrides for smarter, faster bots)
  const botTopSpeed   = battleRoyale ? 22 : 15 + arenaLevel * 2;
  const jumpProb      = battleRoyale ? 0.85 : 0.28 + arenaLevel * 0.065;
  const chaseProb     = battleRoyale ? 0.92 : Math.max(0, (arenaLevel - 3) / 7);
  const lookAhead     = battleRoyale ? 6   : 3 + arenaLevel * 0.4;
  const targetRefresh = battleRoyale ? 900 : Math.max(700, 3400 - arenaLevel * 270);
  const jumpCooldownT = battleRoyale ? 600 : Math.max(500, 1600 - arenaLevel * 110);

  // pick a new target when old one is reached or timer expires
  bot.targetTimer -= dt;
  const tdx = bot.targetX - bot.x, tdz = bot.targetZ - bot.z;
  if (bot.targetTimer <= 0 || (tdx*tdx + tdz*tdz) < 4) {
    if (Math.random() < chaseProb) {
      if (battleRoyale) {
        // Smart BR AI: hunt nearest OTHER BOT first; only target player as last resort
        let nearX = null, nearZ = null, nearDist = Infinity;
        for (const other of arenaBots) {
          if (other === bot || other.state !== 'alive') continue;
          const d = Math.hypot(other.x - bot.x, other.z - bot.z);
          if (d < nearDist) { nearDist = d; nearX = other.x; nearZ = other.z; }
        }
        // only fall back to player if no bots are within 30 units
        if (nearDist > 30 && !arenaElimOrder.includes('player')) {
          nearX = arenaPlayer.x; nearZ = arenaPlayer.z;
        }
        if (nearX !== null) {
          bot.targetX = nearX + (Math.random()-0.5) * 3;
          bot.targetZ = nearZ + (Math.random()-0.5) * 3;
        }
      } else {
        // chase player with slight random offset
        const spread = Math.max(0.5, 5 - arenaLevel * 0.4);
        bot.targetX = arenaPlayer.x + (Math.random()-0.5) * spread;
        bot.targetZ = arenaPlayer.z + (Math.random()-0.5) * spread;
      }
    } else {
      const pos = randomAliveTilePos();
      bot.targetX = pos.x + (Math.random()-0.5) * 6;
      bot.targetZ = pos.z + (Math.random()-0.5) * 6;
    }
    bot.targetTimer = targetRefresh * (0.7 + Math.random() * 0.6);
  }

  // High-priority overrides: zone escape + tile danger
  if (battleRoyale) {
    const botDist = Math.hypot(bot.x, bot.z);
    if (botDist > brCollapseRadius - 12) {
      bot.targetX = (Math.random() - 0.5) * 10;
      bot.targetZ = (Math.random() - 0.5) * 10;
      bot.targetTimer = Math.min(bot.targetTimer, 800);
    }
  }
  const _myTile = arenaTileAt(bot.x, bot.z);
  if (_myTile && _myTile.state === 'fading' && _myTile.timer > 400) {
    let _safeT = null, _safeD = Infinity;
    for (const t of arenaTiles) {
      if (t.state !== 'alive') continue;
      const d = Math.hypot(t.x - bot.x, t.z - bot.z);
      if (d < _safeD) { _safeD = d; _safeT = t; }
    }
    if (_safeT) { bot.targetX = _safeT.x; bot.targetZ = _safeT.z; bot.targetTimer = Math.min(bot.targetTimer, 500); }
  }

  // ice patch check
  if (bot.iceTimer <= 0) {
    for (const ip of icePatches) {
      if (ip.life > 0 && Math.hypot(bot.x - ip.wx, bot.z - ip.wz) < 1.8) {
        bot.iceTimer = 600;
        const perp = bot.heading + Math.PI / 2 * (Math.random() < 0.5 ? 1 : -1);
        bot.vx += Math.sin(perp) * 3.5;
        bot.vz += Math.cos(perp) * 3.5;
        break;
      }
    }
  }
  if (bot.iceTimer > 0) bot.iceTimer -= dt;

  // steer toward target
  const angleToTarget = Math.atan2(bot.targetX - bot.x, bot.targetZ - bot.z);
  let diff = angleToTarget - bot.heading;
  while (diff >  Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  const iceTurnMul = bot.iceTimer > 0 ? 0.45 : 1;
  bot.heading += Math.sign(diff) * Math.min(Math.abs(diff), 2.8 * iceTurnMul * dts);

  // drive forward
  bot.fwd += botTopSpeed * dts;
  bot.fwd *= Math.pow(0.55, dts);
  bot.fwd = Math.min(botTopSpeed, bot.fwd);
  bot.x += Math.sin(bot.heading) * bot.fwd * dts + bot.vx * dts;
  bot.z += Math.cos(bot.heading) * bot.fwd * dts + bot.vz * dts;
  const vDecay = bot.iceTimer > 0 ? Math.pow(0.30, dts) : Math.pow(0.1, dts);
  bot.vx *= vDecay;
  bot.vz *= vDecay;

  // barrier collision (levels 1-5)
  if (arenaLevel <= 5) {
    const bd = Math.hypot(bot.x, bot.z);
    if (bd > BARRIER_RADIUS) {
      const bnx = bot.x / bd, bnz = bot.z / bd;
      bot.x = bnx * BARRIER_RADIUS;
      bot.z = bnz * BARRIER_RADIUS;
      const bdot = bot.vx * bnx + bot.vz * bnz;
      if (bdot > 0) { bot.vx -= bdot * 1.2 * bnx; bot.vz -= bdot * 1.2 * bnz; }
    }
  }

  // gravity / tile support
  const bt = arenaTileAt(bot.x, bot.z);
  const botOnSolid = bt && (bt.state === 'alive' || bt.state === 'fading');
  const botSupportY = bt ? bt.mesh.position.y + 0.2 : -100;
  if (botOnSolid && bot.y <= botSupportY + 0.05 && bot.vy <= 0) {
    bot.y = botSupportY; bot.vy = 0; bot.onGround = true;
  } else {
    bot.onGround = false;
    bot.vy -= 18 * dts;
    bot.y += bot.vy * dts;
  }

  // trigger tile (only when grounded on alive tile)
  if (bt && bt.state === 'alive' && bot.onGround) {
    bt.state = 'fading'; bt.timer = 0;
  }

  // hole-detection: look ahead (distance and jump prob scale with level)
  if (bot.onGround && bot.jumpCooldown <= 0) {
    const lx = bot.x + Math.sin(bot.heading) * lookAhead;
    const lz = bot.z + Math.cos(bot.heading) * lookAhead;
    const ahead = arenaTileAt(lx, lz);
    if (!ahead || ahead.state === 'gone' ||
        (ahead.state === 'fading' && ahead.timer > 700)) {
      if (Math.random() < jumpProb) {
        bot.vy = 10; bot.onGround = false; bot.jumpCooldown = jumpCooldownT;
      }
    }
  }

  // bot rocket: fire if charged and aimed at target
  if (bot.rocketCharges > 0) {
    bot.rocketCooldown -= dt;
    if (bot.rocketCooldown <= 0) {
      const _rtdx = bot.targetX - bot.x, _rtdz = bot.targetZ - bot.z;
      const _rAngle = Math.atan2(_rtdx, _rtdz);
      let _rdiff = _rAngle - bot.heading;
      while (_rdiff >  Math.PI) _rdiff -= Math.PI * 2;
      while (_rdiff < -Math.PI) _rdiff += Math.PI * 2;
      if (Math.abs(_rdiff) < 0.45) {
        bot.rocketCharges--;
        bot.rocketCooldown = 2500;
        const _brg = new THREE.Group();
        const _brb = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.1, 8),
          new THREE.MeshPhongMaterial({ color: 0xff3300, emissive: 0xaa1100, emissiveIntensity: 0.6 }));
        _brb.rotation.x = Math.PI / 2; _brg.add(_brb);
        const _brn = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.35, 8),
          new THREE.MeshPhongMaterial({ color: 0xffcc00, emissive: 0xff8800, emissiveIntensity: 0.9 }));
        _brn.rotation.x = Math.PI / 2; _brn.position.z = -0.72; _brg.add(_brn);
        _brg.rotation.y = bot.heading;
        _brg.position.set(bot.x, bot.y + 0.4, bot.z);
        arenaGroup.add(_brg);
        arenaRockets.push({ mesh: _brg, x: bot.x, y: bot.y + 0.4, z: bot.z,
          vx: Math.sin(bot.heading) * 38, vz: Math.cos(bot.heading) * 38, life: 3500, firedBy: bot.id });
      }
    }
  }

  // sync mesh
  if (bot.mesh) {
    bot.mesh.position.set(bot.x, bot.y, bot.z);
    bot.mesh.rotation.set(0, bot.heading, 0);
  }

  // death
  if (bot.y < -3) {
    bot.state = 'dead';
    if (!arenaElimOrder.includes(bot.id)) arenaElimOrder.push(bot.id);
    if (bot.mesh) bot.mesh.visible = false;
  }
}

function startArena() {
  const isChampFinal = champActive && champRound === 4;
  if (freeMap) {
    freeMapLastSafeX = 0; freeMapLastSafeZ = 0;
    freeMapInfiniteRockets = false; freeMapInfiniteTurbo = false;
    cleanupFreeMapTraffic();
    buildCityMap();
    for (const m of mountainMeshes) m.visible = false;
    // No client-side spawns: traffic, police, and rivals are server-driven.
  } else {
    cleanupFreeMapTraffic();
    for (const m of freeMapMeshes) arenaGroup.remove(m);
    freeMapMeshes = []; freeMapBuildings = []; freeMapBorder = null;
    freeMapInRace = false; freeMapRaceRoad = null;
    freeMapRaceLaps = 0; freeMapRaceLapArmed = false; freeMapRaceRival = null;
    freeMapRaceObstacles = [];
    buildArena(battleRoyale ? 80 : isChampFinal ? 22 : HEX_RADIUS);
    for (const m of mountainMeshes) m.visible = true;
  }
  for (const t of arenaTiles) {
    t.baseY = 0; t.infected = false; t.infectTimer = 0; t.spreadTimer = 0; t.zoneKilled = false;
  }
  // clean up and spawn bombs
  for (const b of arenaBombs) { if (b.mesh) arenaGroup.remove(b.mesh); }
  arenaBombs = [];
  if (isChampFinal) {
    const bombTiles = [...arenaTiles]
      .filter(t => Math.hypot(t.x, t.z) > 6)
      .sort(() => Math.random() - 0.5)
      .slice(0, 22);
    for (const tile of bombTiles) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.44, 8, 8),
        new THREE.MeshPhongMaterial({ color: 0x111111, emissive: 0xdd1100, emissiveIntensity: 0.7, shininess: 70 })
      );
      g.add(body);
      const fuse = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 0.4, 6),
        new THREE.MeshBasicMaterial({ color: 0x555555 })
      );
      fuse.position.y = 0.52;
      g.add(fuse);
      const spark = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xffcc00 })
      );
      spark.position.y = 0.75;
      g.add(spark);
      g.position.set(tile.x, 0.15, tile.z);
      arenaGroup.add(g);
      arenaBombs.push({ mesh: g, x: tile.x, z: tile.z, triggered: false });
    }
  }
  arenaPlayer.x = 0; arenaPlayer.z = 0; arenaPlayer.y = 0;
  arenaPlayer.vy = 0; arenaPlayer.vx = 0; arenaPlayer.vz = 0;
  arenaPlayer.heading = 0; arenaPlayer.fwd = 0; arenaPlayer.onGround = false;
  // remove any leftover enemies/bots
  for (const e of enemies) scene.remove(e.mesh);
  for (const b of arenaBots) { if (b.mesh) scene.remove(b.mesh); }
  enemies = []; particles = [];
  // barrier visibility based on level (never in BR or free map — open map)
  const hasBarrier = !battleRoyale && !freeMap && arenaLevel <= 5;
  arenaBarrierMesh.visible = hasBarrier;
  arenaBarrierRingB.visible = hasBarrier;
  arenaBarrierRingT.visible = hasBarrier;
  // build bots — 50 for Battle Royale, 3 otherwise, none for free map
  if (freeMap) {
    arenaBots = [];
  } else if (battleRoyale) {
    const brKinds = ['sedan','hatch','sport','van','truck','f1'];
    // 50 cars spread across 5 rings, 10 per ring, starting far from center
    const RING_RADII = [30, 44, 56, 66, 74];
    arenaBots = BR_COLORS.map((col, i) => {
      const ring = Math.floor(i / 10);
      const posInRing = i % 10;
      const r = RING_RADII[ring];
      const angle = (posInRing / 10) * Math.PI * 2 + ring * (Math.PI / 10);
      const sx = Math.sin(angle) * r, sz = Math.cos(angle) * r;
      const mesh = buildCar({ kind: brKinds[i % brKinds.length], color: col, accent: BR_ACCENTS[i] });
      mesh.position.set(sx, 0, sz);
      scene.add(mesh);
      return {
        id: 'brbot' + i,
        x: sx, z: sz,
        y: 0, vy: 0, vx: 0, vz: 0,
        heading: angle + Math.PI,
        fwd: 0, onGround: false,
        state: 'alive',
        mesh,
        targetX: 0, targetZ: 0, targetTimer: 0, jumpCooldown: 0, frozenTimer: 0, berserkTimer: 0, iceTimer: 0, mfBlastTimer: 0, rocketCharges: 0, rocketCooldown: 0,
      };
    });
  } else {
    arenaBots = BOT_COLORS.map((col, i) => {
      const mesh = buildCar({ kind: 'sedan', color: col, accent: BOT_ACCENTS[i] });
      mesh.position.set(BOT_STARTS[i][0], 0, BOT_STARTS[i][1]);
      scene.add(mesh);
      return {
        id: 'bot' + i,
        x: BOT_STARTS[i][0], z: BOT_STARTS[i][1],
        y: 0, vy: 0, vx: 0, vz: 0,
        heading: Math.random() * Math.PI * 2,
        fwd: 0, onGround: false,
        state: 'alive',
        mesh,
        targetX: 0, targetZ: 0, targetTimer: 0, jumpCooldown: 0, frozenTimer: 0, berserkTimer: 0, iceTimer: 0, mfBlastTimer: 0, rocketCharges: 0, rocketCooldown: 0,
      };
    });
  }
  arenaElimOrder = []; arenaPlacement = null; skidMarks = []; icePatches = [];
  for (const mb of mcBlocks) { if (mb.mesh) arenaGroup.remove(mb.mesh); }
  mcBlocks = []; mcBlockTimer = 2000;
  // battle royale collapse ring setup
  if (battleRoyale) {
    brCollapseRadius = Math.max(...arenaTiles.map(t => Math.hypot(t.x, t.z)));
    brCollapseTimer = 5000;
  }
  // reset nitro
  if (nitroPickup) { arenaGroup.remove(nitroPickup.mesh); nitroPickup = null; }
  nitroSpawnTimer = 0; nitroTime = 0;
  if (rocketPickup) { arenaGroup.remove(rocketPickup.mesh); rocketPickup = null; }
  for (const r of arenaRockets) { if (r.mesh) arenaGroup.remove(r.mesh); }
  arenaRockets = []; rocketCharges = 0; rocketSpawnTimer = 30000;
  rocketLockTarget = null; rocketLockTimer = 0; rocketLocked = false;
  dmg = { body: 0, tires: 0, engine: 0 };
  invulnTime = 0; crashes = 0; gameTime = 0; score = 0;
  earnings = null; lastEarned = 0;
  nitroCollectedThisGame = 0;
  mfCharges = 3; mfCooldown = 0; mfWaveTimer = 0;
  rebuildPlayerCar();
  state = STATE.ARENA;
}

function updateArena(dt) {
  const dts = dt / 1000;
  gameTime += dts;
  score = Math.floor(gameTime * 10);
  if (mfCooldown > 0) mfCooldown -= dt;
  if (mfWaveTimer > 0) {
    mfWaveTimer -= dt;
    if (mfWaveTimer <= 0) {
      mfWaveTimer = 0;
      for (const bot of arenaBots) {
        if (bot.state === 'alive') bot.mfBlastTimer = 2000;
      }
    }
  }

  // ── THE ZONE: full outer ring slowly turns red then collapses every 5s ──────
  if (battleRoyale && brCollapseRadius > HEX_SIZE * 3) {
    brCollapseTimer -= dt;
    // ringW must cover the full hex outer ring — hex outer ring spans
    // from 0.866*maxR (face midpoints) to maxR (corners), so ~13.4% of maxR
    const ringW = brCollapseRadius * 0.15 + HEX_SIZE;
    const warmFrac = Math.max(0, 1 - brCollapseTimer / 5000);
    for (const t of arenaTiles) {
      if (t.state !== 'alive') continue;
      if (Math.hypot(t.x, t.z) >= brCollapseRadius - ringW) {
        t.mesh.material.color.setRGB(1, 1 - warmFrac * 0.9, 1 - warmFrac * 0.9);
      }
    }
    if (brCollapseTimer <= 0) {
      brCollapseTimer = 5000;
      for (const t of arenaTiles) {
        if (t.state === 'gone' || t.state === 'fading') continue;
        if (Math.hypot(t.x, t.z) >= brCollapseRadius - ringW) {
          t.state = 'fading'; t.timer = 0; t.zoneKilled = true;
        }
      }
      brCollapseRadius -= HEX_SIZE * Math.sqrt(3); // step one ring inward
    }
  }

  // free driving input — frozen while the map-select or post-race overlay is up.
  const _frozen = raceResultsShown || raceMapSelectShown;
  const turn  = _frozen ? 0 : (((keys['arrowleft']||keys['a']) ? 1 : 0) - ((keys['arrowright']||keys['d']) ? 1 : 0));
  const accel = _frozen ? 0 : (((keys['arrowup']||keys['w']) ? 1 : 0) - ((keys['arrowdown']||keys['s']) ? 1 : 0));
  if (_frozen) { arenaPlayer.vx = 0; arenaPlayer.vz = 0; }

  // drift physics: velocity vector is separate from heading
  const speed = Math.hypot(arenaPlayer.vx, arenaPlayer.vz);
  const turnRate = 1.6 + Math.min(1.4, speed / 10);
  arenaPlayer.heading += turn * turnRate * dts;

  // accelerate in the heading direction (free-map scales by car accel)
  const _fmAccelMul = freeMap ? effAccel(carIdx) : 1;
  arenaPlayer.vx += Math.sin(arenaPlayer.heading) * accel * 22 * _fmAccelMul * dts;
  arenaPlayer.vz += Math.cos(arenaPlayer.heading) * accel * 22 * _fmAccelMul * dts;

  // grip: gradually bleed lateral velocity back toward heading (low = more slide)
  if (speed > 0.2) {
    const _gripRates = [0.3, 0.9, 2.2, 5.0, 11.0];
    const gripRate = freeMap ? (freeMapInBuilding ? _gripRates[4] : _gripRates[freeMapGrip - 1]) : 2.2;
    const f = 1 - Math.exp(-gripRate * dts);
    const alignedVx = Math.sin(arenaPlayer.heading) * speed;
    const alignedVz = Math.cos(arenaPlayer.heading) * speed;
    arenaPlayer.vx += (alignedVx - arenaPlayer.vx) * f;
    arenaPlayer.vz += (alignedVz - arenaPlayer.vz) * f;
  }

  // friction & speed cap (nitro overrides both)
  const _arenaCar = CARS[carIdx];
  const _brakeMul = effBrake(carIdx);
  const frictionBase = nitroTime > 0 ? Math.pow(0.97, dts) : Math.pow(0.55, dts * _brakeMul);
  arenaPlayer.vx *= frictionBase;
  arenaPlayer.vz *= frictionBase;
  const newSpeed = Math.hypot(arenaPlayer.vx, arenaPlayer.vz);
  const _prevInBuilding = freeMapInBuilding;
  freeMapInBuilding = false;
  if (freeMap) {
    for (const _fb of freeMapBuildings) {
      if (Math.abs(arenaPlayer.x - _fb.x) < _fb.hw && Math.abs(arenaPlayer.z - _fb.z) < _fb.hd) {
        freeMapInBuilding = true; break;
      }
    }
  }
  // station interactions (freeMap only)
  if (freeMap) {
    for (const _fst of freeMapStations) {
      if (Math.hypot(arenaPlayer.x - _fst.x, arenaPlayer.z - _fst.z) < _fst.r) {
        if (_fst.type === 'rocket') freeMapInfiniteRockets = true;
        else if (_fst.type === 'turbo')  freeMapInfiniteTurbo   = true;
        else if (_fst.type === 'reset')  {
          freeMapInfiniteRockets = false; freeMapInfiniteTurbo = false;
          rocketCharges = 0; nitroTime = 0;
          freeMapHP = FREE_MAP_MAX_HP;
        }
      }
    }
    if (freeMapInfiniteRockets) rocketCharges = 5;
    if (freeMapInfiniteTurbo)   nitroTime = Math.max(nitroTime, 4500);

    // Race-square trigger: touching a blue pad pops up the map-select screen.
    // The actual race map is built once the player confirms the selection.
    if (!raceMapSelectShown && !raceResultsShown) {
      for (const _sq of freeMapRaceSquares) {
        if (Math.abs(arenaPlayer.x - _sq.x) < _sq.half && Math.abs(arenaPlayer.z - _sq.z) < _sq.half) {
          raceMapSelectShown = true;
          raceMapSelectIdx = 0;
          freeMapRaceEntryPad = { x: _sq.x, z: _sq.z };
          arenaPlayer.vx = 0; arenaPlayer.vz = 0;
          break;
        }
      }
    }
    // show-off pad detection — stepping onto a pad places your car on that
    // pad's podium and publishes your loadout to the building's billboard.
    // Both stay after you drive away so others can see them.
    freeMapOnShowOff = false;
    let _activeShow = null;
    for (const _sp of freeMapShowOffPads) {
      const _dx = arenaPlayer.x - _sp.x, _dz = arenaPlayer.z - _sp.z;
      if (_dx * _dx + _dz * _dz < _sp.half * _sp.half) { freeMapOnShowOff = true; _activeShow = _sp; break; }
    }
    // Fire on every change of active pad — including walking directly from
    // pad A onto pad B — so each pad always shows the most recent visitor.
    if (_activeShow && _activeShow !== freeMapLastShowPad) {
      if (_activeShow.carGroup) arenaGroup.remove(_activeShow.carGroup);
      let _col = getPlayerBodyColor();
      if (typeof _col !== 'number') _col = CARS[carIdx].body;
      const _showCar = buildCar({
        kind: CARS[carIdx].kind || 'sedan',
        color: _col,
        accent: CARS[carIdx].accent,
        isPlayer: false,
      });
      _showCar.position.set(_activeShow.podiumX, _activeShow.podiumY, _activeShow.podiumZ);
      arenaGroup.add(_showCar);
      freeMapMeshes.push(_showCar);
      _activeShow.carGroup = _showCar;
      // Publish current player loadout onto this building's billboard.
      drawShowOffContent(_activeShow.bbCtx, _activeShow.bbCanvas.width, _activeShow.bbCanvas.height);
      _activeShow.bbTex.needsUpdate = true;
    }
    freeMapLastShowPad = _activeShow;
    // Slowly rotate every showcased car on every podium
    for (const _sp of freeMapShowOffPads) {
      if (_sp.carGroup) _sp.carGroup.rotation.y += dts * 0.6;
    }
  }

  // toggle wall transparency when crossing building threshold
  if (freeMapInBuilding !== _prevInBuilding) {
    for (const _bm of freeMapBuildingMats) {
      _bm.transparent = freeMapInBuilding;
      _bm.opacity = freeMapInBuilding ? 0.15 : 1.0;
      _bm.needsUpdate = true;
    }
  }
  const _fmTopMul = freeMap ? effTop(carIdx) : 1;
  let speedCap = freeMapInBuilding ? 8 : (nitroTime > 0 ? 80 * _fmTopMul : 28 * _fmTopMul);
  // free-map hard cap: 250 km/h ≈ 69.4 m/s
  if (freeMap && !freeMapInBuilding) speedCap = Math.min(speedCap, 69.4);
  if (newSpeed > speedCap) { arenaPlayer.vx *= speedCap / newSpeed; arenaPlayer.vz *= speedCap / newSpeed; }

  // keep fwd as signed speed for camera/compat
  arenaPlayer.fwd = (Math.sin(arenaPlayer.heading) * arenaPlayer.vx +
                     Math.cos(arenaPlayer.heading) * arenaPlayer.vz);

  arenaPlayer.x += arenaPlayer.vx * dts;
  arenaPlayer.z += arenaPlayer.vz * dts;
  // race road: keep the player inside the union of road corridors. Active
  // even during jumps so the side walls actually stop sideways escapes.
  if (freeMap && freeMapInRace && freeMapRaceRoad && freeMapRaceRoad.segments) {
    const _segs = freeMapRaceRoad.segments;
    let _in = false;
    for (let i = 0; i < _segs.length; i++) {
      const s = _segs[i];
      if (arenaPlayer.x >= s.x0 && arenaPlayer.x <= s.x1 &&
          arenaPlayer.z >= s.z0 && arenaPlayer.z <= s.z1) { _in = true; break; }
    }
    if (!_in) {
      let _bd = Infinity, _bcx = 0, _bcz = 0;
      for (let i = 0; i < _segs.length; i++) {
        const s = _segs[i];
        const cx = Math.max(s.x0, Math.min(s.x1, arenaPlayer.x));
        const cz = Math.max(s.z0, Math.min(s.z1, arenaPlayer.z));
        const d = (arenaPlayer.x - cx) * (arenaPlayer.x - cx) +
                  (arenaPlayer.z - cz) * (arenaPlayer.z - cz);
        if (d < _bd) { _bd = d; _bcx = cx; _bcz = cz; }
      }
      const _dx = arenaPlayer.x - _bcx, _dz = arenaPlayer.z - _bcz;
      arenaPlayer.x = _bcx; arenaPlayer.z = _bcz;
      const _len = Math.hypot(_dx, _dz);
      if (_len > 0.0001) {
        const _nx = _dx / _len, _nz = _dz / _len;
        const _vd = arenaPlayer.vx * _nx + arenaPlayer.vz * _nz;
        if (_vd > 0) { arenaPlayer.vx -= _vd * 1.4 * _nx; arenaPlayer.vz -= _vd * 1.4 * _nz; }
      }
    }
  }
  // Race obstacle bounce-back — cones and pillars push the player out
  // and reflect inward velocity on contact.
  if (freeMap && freeMapInRace && freeMapRaceObstacles.length) {
    for (let i = 0; i < freeMapRaceObstacles.length; i++) {
      const _o = freeMapRaceObstacles[i];
      const _dx = arenaPlayer.x - _o.x;
      const _dz = arenaPlayer.z - _o.z;
      const _d2 = _dx * _dx + _dz * _dz;
      const _cr = _o.r + 1.1;
      if (_d2 < _cr * _cr) {
        const _d = Math.sqrt(_d2) || 0.01;
        const _nx = _dx / _d, _nz = _dz / _d;
        arenaPlayer.x = _o.x + _nx * _cr;
        arenaPlayer.z = _o.z + _nz * _cr;
        const _vd = arenaPlayer.vx * _nx + arenaPlayer.vz * _nz;
        if (_vd < 0) {
          arenaPlayer.vx -= _vd * 1.7 * _nx;
          arenaPlayer.vz -= _vd * 1.7 * _nz;
        }
      }
    }
  }
  _trailT += dts;

  // free map: player bumps NPC → +1 star
  if (freeMap && freeMapStarCooldown <= 0) {
    const _pspd = Math.hypot(arenaPlayer.vx, arenaPlayer.vz);
    if (_pspd > 3) {
      for (const _fn of freeMapNPCs) {
        if (!_fn.alive || _fn.type !== 'npc') continue;
        if (Math.hypot(arenaPlayer.x - _fn.x, arenaPlayer.z - _fn.z) < 2.5) {
          _fn.alive = false;
          spawnExplosion3D(_fn.x, 0.5, _fn.z);
          freeMapStars = Math.min(5, freeMapStars + 1);
          freeMapStarCooldown = 2500;
          freeMapTakeDamage(20);
          break;
        }
      }
    }
  }

  // barrier collision (levels 1-5 only, never in free map)
  if (!freeMap && arenaLevel <= 5) {
    const bd = Math.hypot(arenaPlayer.x, arenaPlayer.z);
    if (bd > BARRIER_RADIUS) {
      const bnx = arenaPlayer.x / bd, bnz = arenaPlayer.z / bd;
      arenaPlayer.x = bnx * BARRIER_RADIUS;
      arenaPlayer.z = bnz * BARRIER_RADIUS;
      const bdot = arenaPlayer.vx * bnx + arenaPlayer.vz * bnz;
      if (bdot > 0) { arenaPlayer.vx -= bdot * 1.6 * bnx; arenaPlayer.vz -= bdot * 1.6 * bnz; }
    }
  }


  // ground support
  if (freeMap) {
    // clamp to circular map border (the visual abyss begins at this radius)
    if (freeMapBorder && !freeMapInRace) {
      const _d2 = arenaPlayer.x * arenaPlayer.x + arenaPlayer.z * arenaPlayer.z;
      const _r  = freeMapBorder.radius;
      if (_d2 > _r * _r) {
        const _d = Math.sqrt(_d2);
        const _nx = arenaPlayer.x / _d, _nz = arenaPlayer.z / _d;
        arenaPlayer.x = _nx * _r;
        arenaPlayer.z = _nz * _r;
        const _vdot = arenaPlayer.vx * _nx + arenaPlayer.vz * _nz;
        if (_vdot > 0) { arenaPlayer.vx -= _vdot * 1.6 * _nx; arenaPlayer.vz -= _vdot * 1.6 * _nz; }

    let _groundY = 0.2;

    if (freeMapInRace && freeMapRaceRoad) {

          Math.abs(arenaPlayer.z) < _rp.zHalf) {
        const _t = (arenaPlayer.x - _rp.x0) / (_rp.x1 - _rp.x0);

      const _gp = freeMapRaceRoad.gap;

          arenaPlayer.x > _gp.x0 && arenaPlayer.x < _gp.x1 &&
          Math.abs(arenaPlayer.z) < _gp.zHalf) {

    }
    if (arenaPlayer.y <= _groundY && arenaPlayer.vy <= 0) {
      arenaPlayer.y = _groundY; arenaPlayer.vy = 0; arenaPlayer.onGround = true;
    } else {
      arenaPlayer.onGround = false;
      arenaPlayer.vy -= 18 * dts;
      arenaPlayer.y += arenaPlayer.vy * dts;
      if (arenaPlayer.y < _groundY) { arenaPlayer.y = _groundY; arenaPlayer.vy = 0; arenaPlayer.onGround = true; }
    }
    // Launch boost — if the player just rolled off the top of the ramp going
    // east, kick them up in proportion to their forward speed.
    if (arenaPlayer._wasOnRamp && !_onRamp && freeMapInRace && freeMapRaceRoad && freeMapRaceRoad.ramp) {
      const _spd = Math.hypot(arenaPlayer.vx, arenaPlayer.vz);
      if (_spd > 4 && arenaPlayer.x >= freeMapRaceRoad.ramp.x1 - 0.5) {
        arenaPlayer.vy = Math.max(arenaPlayer.vy, Math.min(_spd * 0.3, 9));
        arenaPlayer.onGround = false;
      }
    }
    arenaPlayer._wasOnRamp = _onRamp;
    if (arenaPlayer.onGround) { freeMapLastSafeX = arenaPlayer.x; freeMapLastSafeZ = arenaPlayer.z; }
    if (arenaPlayer.y < -4) {
      if (freeMapInRace && freeMapRaceRoad && freeMapRaceRoad.spawn) {
        const _sp = freeMapRaceRoad.spawn;
        arenaPlayer.x = _sp.x - 4; arenaPlayer.z = _sp.z;
        arenaPlayer.heading = _sp.heading;
      } else {
        arenaPlayer.x = freeMapLastSafeX; arenaPlayer.z = freeMapLastSafeZ;

      arenaPlayer.y = 0.5; arenaPlayer.vy = 0; arenaPlayer.vx = 0; arenaPlayer.vz = 0;

          freeMapRaceLapArmed &&

        freeMapRaceLapArmed = false;

          const _newRank = getRank(raceWins);

            oldRank:  _oldRank,
            newRank:  _newRank,

      arenaPlayer.y += arenaPlayer.vy * dts;
    }
    if (tile && tile.state === 'alive' && arenaPlayer.onGround) {
      if (equippedPaint === 'paint_obsidian' && !tile.infected) {
        tile.infected = true; tile.infectTimer = 0; tile.spreadTimer = 0;
      } else if (!tile.infected) {
        tile.state = 'fading'; tile.timer = 0;
      }
    }
  }

  // tile state machine
  for (const t of arenaTiles) {
    // obsidian infection — purple creep, spreads, then drops. Tuned faster.
    if (t.infected && t.state === 'alive') {
      t.infectTimer += dt;
      t.spreadTimer  += dt;
      // lerp color white → deep purple over 1.2s
      const p = Math.min(1, t.infectTimer / 1200);
      t.mesh.material.color.setRGB(0.08 + (1-p)*0.85, 0, 0.12 + p*0.45);
      // spread to a random adjacent alive uninfected tile every ~1s (capped at 9 total infected)
      if (t.spreadTimer >= 1000) {
        t.spreadTimer = 0;
        const totalInfected = arenaTiles.filter(o => o.infected).length;
        if (totalInfected < 9) {
          const neighbors = arenaTiles.filter(o =>
            o !== t && !o.infected && o.state === 'alive' &&
            Math.hypot(o.x - t.x, o.z - t.z) < HEX_SIZE * 2.2
          );
          if (neighbors.length > 0) {

            pick.infected = true; pick.infectTimer = 0; pick.spreadTimer = 0;
          }

      }
    }
    if (t.state === 'fading') {
      t.timer += dt;
      const p = Math.min(1, t.timer / 1800);
      const flash = Math.min(1, p / 0.4);
      t.mesh.material.color.setRGB(1, 1 - flash * 0.85, 1 - flash * 0.85);
      const holdFrac = 0.39;
      const drop = p < holdFrac ? 0 : Math.pow((p - holdFrac) / (1 - holdFrac), 2) * 38;
      t.mesh.position.y = -drop;
      if (t.timer > 1800) {
        t.state = 'gone';
        t.timer = 0;
        t.mesh.visible = false;
      }
    } else if (t.state === 'gone') {
      if (!t.zoneKilled) {
        t.timer += dt;
        if (t.timer >= 5000) {
          t.state = 'rising';
          t.timer = 0;
          t.mesh.position.y = -5;
          t.mesh.material.color.setHex(0xfafafa);
          t.mesh.visible = true;
        }
      }
    } else if (t.state === 'rising') {

      const p = Math.min(1, t.timer / 500);
      t.mesh.position.y = -5 * (1 - p);
      if (p >= 1) {

        t.infected = false; t.infectTimer = 0; t.spreadTimer = 0;
      }
    }
  }

  // update free-map traffic (NPCs, police, bullets)
  if (freeMap) updateFreeMapTraffic(dt);

  // update bots

  }

  // player-bot collision (soft circle push)
  const COLL_R = 1.4;
  for (const bot of arenaBots) {
    if (bot.state !== 'alive') continue;

    const dz = arenaPlayer.z - bot.z;
    const dist = Math.hypot(dx, dz);
    if (dist < COLL_R * 2 && dist > 0.001) {
      const nx = dx / dist, nz = dz / dist;
      const overlap = COLL_R * 2 - dist;
      arenaPlayer.x += nx * overlap * 0.55;
      arenaPlayer.z += nz * overlap * 0.55;
      bot.x -= nx * overlap * 0.45;
      bot.z -= nz * overlap * 0.45;
      const relVx = arenaPlayer.vx - bot.vx;
      const relVz = arenaPlayer.vz - bot.vz;

      if (dot < 0) {
        const impulse = dot * 0.6;
        arenaPlayer.vx -= impulse * nx;
        arenaPlayer.vz -= impulse * nz;
        bot.vx += impulse * nx;
        bot.vz += impulse * nz;

        }
        if (equippedPaint === 'paint_moneyforever' && mfCharges > 0 && mfCooldown <= 0 && mfWaveTimer === 0) {

  }
  // bot-bot collision in battle royale

        if (b.state !== 'alive') continue;

          b.x -= nx * overlap * 0.5; b.z -= nz * overlap * 0.5;

          const relVz = (a.vz + Math.cos(a.heading) * a.fwd) - (b.vz + Math.cos(b.heading) * b.fwd);

  }

  // drift trail: emit skid marks when sliding sideways

  // ice trail: leave sticky patches when equipped
  const _iceTrailSpec = SHOP_TRAILS.find(x => x.id === equippedTrail);
  if (_iceTrailSpec && _iceTrailSpec.special === 'ice' && arenaPlayer.onGround) {

    if (_iceSpd > 0.5 && Math.random() < 0.4) {

  // ── Minecraft paint: spawn a block every 5s that knocks back bots ─────────
  if (equippedPaint === 'paint_minecraft' && !arenaElimOrder.includes('player')) {

        new THREE.MeshLambertMaterial({ color: 0x6b4226 }), // -y bottom (dirt)

      // knock back all alive bots within radius 5

    }

  }

  // ── nitro boost tick ──────────────────────────────────────────────────────
  if (nitroTime > 0) {

  // ── nitro pickup spawn (once per 60s, only while game is live) ───────────
  if (!nitroPickup && !arenaElimOrder.includes('player')) {

      const aliveTiles = arenaTiles.filter(t => t.state === 'alive');

        // build mesh: glowing hex pad + spinning torus
        const padGeo  = new THREE.CylinderGeometry(0.72, 0.72, 0.18, 6);

        const pad     = new THREE.Mesh(padGeo, padMat);

        const ring    = new THREE.Mesh(ringGeo, ringMat);
        ring.position.y = 0.55;
        ring.rotation.x = Math.PI / 2;
        ring.name = 'nitroRing';
        const g = new THREE.Group();
        g.add(pad); g.add(ring);
        g.position.set(tile.x, 0.22, tile.z);
        arenaGroup.add(g);

      }
      nitroSpawnTimer = 30000;
    }
  }

  // ── spin & collect pickup ─────────────────────────────────────────────────
  if (nitroPickup) {
    const ring = nitroPickup.mesh.getObjectByName('nitroRing');
    if (ring) ring.rotation.z += dts * 3.5;
    nitroPickup.mesh.position.y = 0.22 + Math.sin(gameTime * 3.5) * 0.12;
    const pdx = arenaPlayer.x - nitroPickup.x;
    const pdz = arenaPlayer.z - nitroPickup.z;
    if (Math.hypot(pdx, pdz) < 1.6 && arenaPlayer.onGround) {
      // collected — big speed blast forward
      const fwd = Math.hypot(arenaPlayer.vx, arenaPlayer.vz) < 1 ? 1 : Math.hypot(arenaPlayer.vx, arenaPlayer.vz);
      const nx = Math.sin(arenaPlayer.heading), nz = Math.cos(arenaPlayer.heading);
      arenaPlayer.vx = nx * Math.max(fwd * 2.5, 38);
      arenaPlayer.vz = nz * Math.max(fwd * 2.5, 38);
      nitroTime = 5000;
      nitroCollectedThisGame++;
      arenaGroup.remove(nitroPickup.mesh);
      nitroPickup = null;
      addShake(0.15, 300);
      // burst particles
      for (let i = 0; i < 18; i++) {
        particles.push({ x: W/2 + (Math.random()-0.5)*60, y: H/2 + (Math.random()-0.5)*60,
          vx: (Math.random()-0.5)*6, vy: -(1+Math.random()*5),
          life: 400+Math.random()*400, max: 800,
          size: 4+Math.random()*8, color: Math.random()<0.5?'#ffee00':'#ff9900', gravity: 0.04, kind: 'spark' });
      }
    }
  }

  // ---- bomb mines ----
  const _bombT = gameTime;
  for (const bomb of arenaBombs) {
    if (bomb.triggered) continue;
    // pulse spark so it looks alive
    const spark = bomb.mesh.children[2];
    if (spark) spark.position.y = 0.75 + Math.sin(_bombT * 6 + bomb.x) * 0.08;
    // detect proximity
    const TRIG = 1.8;
    let hit = false;
    if (Math.hypot(arenaPlayer.x - bomb.x, arenaPlayer.z - bomb.z) < TRIG) hit = true;
    for (const bot of arenaBots) {
      if (bot.state !== 'alive') continue;
      if (Math.hypot(bot.x - bomb.x, bot.z - bomb.z) < TRIG) hit = true;
    }
    if (!hit) continue;
    bomb.triggered = true;
    arenaGroup.remove(bomb.mesh);
    // launch and knock everything within radius
    const BX = bomb.x, BZ = bomb.z, KRAD = 8, KFORCE = 18;
    const pdx = arenaPlayer.x - BX, pdz = arenaPlayer.z - BZ, pd = Math.hypot(pdx, pdz);
    if (pd < KRAD) {
      arenaPlayer.vy = Math.max(arenaPlayer.vy, 11);
      arenaPlayer.onGround = false;

    }
    for (const bot of arenaBots) {
      if (bot.state !== 'alive') continue;
      const dx = bot.x - BX, dz = bot.z - BZ, d = Math.hypot(dx, dz);
      if (d < KRAD) {
        bot.vy = Math.max(bot.vy, 11); bot.onGround = false;
        if (d > 0) { const f = (1 - d/KRAD) * KFORCE; bot.vx += (dx/d)*f; bot.vz += (dz/d)*f; }

    }

    addShake(0.35, 300);
    playCrashSound();
  }

  // ── Rocket lock-on targeting ─────────────────────────────────────────────
  if (rocketCharges > 0 && !arenaElimOrder.includes('player')) {
    // sticky: keep current target while alive AND its screen projection is still on the canvas
    let _keep = false;
    const _tgtAlive = rocketLockTarget && (rocketLockTarget.state === 'alive' || rocketLockTarget.alive === true);
    if (_tgtAlive) {
      const _ty = (rocketLockTarget.y != null ? rocketLockTarget.y : 0.2) + 0.8;
      const _cp = project3D(rocketLockTarget.x, _ty, rocketLockTarget.z);
      if (!_cp.behind && _cp.x >= 0 && _cp.x <= W && _cp.y >= 0 && _cp.y <= H) _keep = true;

    } else {

        ? freeMapNPCs.filter(n => n.alive)
        : arenaBots.filter(b => b.state === 'alive');
      let _best = null, _bestDist = Infinity;
      for (const c of _candidates) {

        const _proj = project3D(c.x, _cy, c.z);
        if (_proj.behind) continue;
        const _sd = Math.hypot(_proj.x - W / 2, _proj.y - (H / 2 - 95));
        const _wd = Math.hypot(c.x - arenaPlayer.x, c.z - arenaPlayer.z);

  } else {
    rocketLockTarget = null; rocketLockTimer = 0; rocketLocked = false;
  }

  // ── Rocket pickup: spawns every 60s ──────────────────────────────────────
  if (!freeMap && !rocketPickup && !arenaElimOrder.includes('player')) {
    rocketSpawnTimer -= dt;
    if (rocketSpawnTimer <= 0) {
      const aliveTiles = arenaTiles.filter(t => t.state === 'alive' && Math.hypot(t.x, t.z) < brCollapseRadius - 4);
      if (aliveTiles.length > 0) {
        const tile = aliveTiles[Math.floor(Math.random() * aliveTiles.length)];
        const rg = new THREE.Group();

        rg.add(base);
        // rocket body on top
        const rbody = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.85, 8),
          new THREE.MeshPhongMaterial({ color: 0xff3300, emissive: 0xcc1100, emissiveIntensity: 0.7 }));
        rbody.position.y = 0.62; rbody.rotation.x = 0;
        rg.add(rbody);
        const rnose = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.30, 8),
          new THREE.MeshPhongMaterial({ color: 0xffcc00, emissive: 0xff8800, emissiveIntensity: 1.0 }));
        rnose.position.y = 1.19;
        rg.add(rnose);
        // glow ring
        const glowR = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.07, 8, 18),
          new THREE.MeshPhongMaterial({ color: 0xff4400, emissive: 0xff2200, emissiveIntensity: 1.2 }));
        glowR.position.y = 0.28; glowR.name = 'rocketRing';
        rg.add(glowR);
        rg.position.set(tile.x, 0.15, tile.z);

  }
  if (rocketPickup) {
    const rring = rocketPickup.mesh.getObjectByName('rocketRing');
    if (rring) rring.rotation.z += dts * 4;
    rocketPickup.mesh.position.y = 0.15 + Math.sin(gameTime * 2.8) * 0.14;
    const rdx = arenaPlayer.x - rocketPickup.x, rdz = arenaPlayer.z - rocketPickup.z;
    if (Math.hypot(rdx, rdz) < 1.8) {
      rocketCharges = Math.min(rocketCharges + 5, 5);
      arenaGroup.remove(rocketPickup.mesh);
      rocketPickup = null;
      addShake(0.1, 200);
    }
    // bots can also collect the pickup
    if (rocketPickup) {
      for (const bot of arenaBots) {
        if (bot.state !== 'alive') continue;
        if (Math.hypot(bot.x - rocketPickup.x, bot.z - rocketPickup.z) < 1.8) {
          bot.rocketCharges = Math.min((bot.rocketCharges || 0) + 5, 5);
          bot.rocketCooldown = 1500;
          arenaGroup.remove(rocketPickup.mesh);
          rocketPickup = null;
          break;
        }
      }
    }
  }

  // ── Active rocket projectiles ─────────────────────────────────────────────
  for (let ri = arenaRockets.length - 1; ri >= 0; ri--) {
    const r = arenaRockets[ri];
    r.life -= dt;
    const rdts = dt / 1000;
    // homing: steer toward locked target
    if (r.target && (r.target.state === 'alive' || r.target.alive === true)) {
      const _htdx = r.target.x - r.x, _htdz = r.target.z - r.z;
      const _hAngle = Math.atan2(_htdx, _htdz);
      const _rAngle = Math.atan2(r.vx, r.vz);

      while (_hdiff >  Math.PI) _hdiff -= Math.PI * 2;

      const _spd = Math.hypot(r.vx, r.vz);

      r.vz = Math.cos(_newA) * _spd;

    r.z += r.vz * rdts;
    if (r.mesh) {

    if (freeMap) {

    }

    // hit bots — pass through, apply knockback
    for (const bot of arenaBots) {
      if (bot.state !== 'alive') continue;

      if (Math.hypot(r.x - bot.x, r.z - bot.z) < 1.6) {
        const nx = (bot.x - r.x) / Math.max(0.01, Math.hypot(bot.x - r.x, bot.z - r.z));
        const nz = (bot.z - r.z) / Math.max(0.01, Math.hypot(bot.x - r.x, bot.z - r.z));

    if (r.firedBy !== 'player' && Math.hypot(r.x - arenaPlayer.x, r.z - arenaPlayer.z) < 1.6) {

      if (r.mesh) arenaGroup.remove(r.mesh);
      arenaRockets.splice(ri, 1);
      if (!freeMap) { killArenaPlayer(arenaBots.length + 1); }
      continue;
    }
    // remove when life expires or off arena
    const _rRange = battleRoyale ? 90 : freeMap ? 700 : 30;
    if (r.life <= 0 || Math.hypot(r.x, r.z) > _rRange) {
      if (r.mesh) arenaGroup.remove(r.mesh);
      arenaRockets.splice(ri, 1);
    }
  }

  const allBotsDead = !freeMap && arenaBots.every(b => b.state === 'dead');

  function calcArenaEarnings(placement) {
    // placement base — 1st gets noticeably more
    const placeBase = [80, 25, 10, 4][placement - 1] || 4;
    // gentle level multiplier: L1=1, L5=2.5, L10=2 (soft bell)
    const LVL_MULS = [1.0, 1.3, 1.6, 2.0, 2.5, 2.4, 2.3, 2.2, 2.1, 2.0];
    const lvlMul = LVL_MULS[Math.min(arenaLevel - 1, LVL_MULS.length - 1)];
    // survival time bonus (flat — no level scaling)
    const timeCoin = Math.floor(gameTime * 0.4);
    // eliminated bots bonus
    const botsDown = arenaBots.filter(b => b.state === 'dead').length;
    const botBonus  = botsDown * 6;
    const carMul = CARS[carIdx].coinMul || 1.0;
    const base  = Math.floor(placeBase * lvlMul) + timeCoin + botBonus;
    let masterBonus = 0;
    // unlock next level + award master bonus for first-time L10 clear
    if (placement === 1 && arenaLevel > arenaProgress) {
      arenaProgress = arenaLevel;
      localStorage.setItem('headon_arena_progress', arenaProgress);
      if (arenaLevel === 10) masterBonus = 1000;
    }
    const total = Math.floor(base * carMul) + masterBonus;
    const gemEarned = Math.random() < (CARS[carIdx].gemChance || 0);
    if (gemEarned) addGems(1);
    return { placeBase, lvlMul, timeCoin, botBonus, botsDown, base, total, carMul, gemEarned, masterBonus };
  }

  const totalCars = arenaBots.length + 1; // bots + player
  // player wins — all bots eliminated first
  if (allBotsDead && !arenaElimOrder.includes('player')) {
    arenaElimOrder.push('player');
    arenaPlacement = totalCars - arenaElimOrder.indexOf('player');
    state = STATE.DEAD;
    if (score > getBest()) { saveBest(Math.floor(score)); }
    const e = calcArenaEarnings(arenaPlacement);
    earnings = {
      distanceKm:0, distanceCoins:0, speedingSec:gameTime,
      speedCoins: e.timeCoin, overtakes:0, overtakeCoins:0,
      waves:0, waveCoins:0, topSpeedKmh:0, topSpeedBonus: Math.floor(e.placeBase * e.lvlMul),
      total: e.total, mode:'ARENA', placement: arenaPlacement,
      carMul: e.carMul, gemEarned: e.gemEarned,
      lvlMul: e.lvlMul, botBonus: e.botBonus, botsDown: e.botsDown, masterBonus: e.masterBonus,
    };
    lastEarned = e.total; if (e.total > 0) setCoins(coins + e.total);
    addQP('arena_3', 1); if (arenaPlacement === 1) addQP('arena_win', 1);
    return;
  }

  // player death by falling
  if (!freeMap && arenaPlayer.y < -3 && !arenaElimOrder.includes('player')) {
    killArenaPlayer(totalCars);
  }
}

function killArenaPlayer(totalCars) {
  if (freeMap || arenaElimOrder.includes('player')) return;
  arenaElimOrder.push('player');
  arenaPlacement = (totalCars || (arenaBots.length + 1)) - arenaElimOrder.indexOf('player');
  state = STATE.DEAD;
  addShake(0.4, 600); playCrashSound(); crashes = 1;
  if (score > getBest()) { saveBest(Math.floor(score)); }
  // calcArenaEarnings lives inside updateArena's scope; recompute placement-based stub here
  const placeBase = [80, 25, 10, 4][arenaPlacement - 1] || 4;
  const LVL_MULS = [1.0, 1.3, 1.6, 2.0, 2.5, 2.4, 2.3, 2.2, 2.1, 2.0];
  const lvlMul = LVL_MULS[Math.min(arenaLevel - 1, LVL_MULS.length - 1)];
  const timeCoin = Math.floor(gameTime * 0.4);
  const botsDown = arenaBots.filter(b => b.state === 'dead').length;
  const botBonus = botsDown * 6;
  const carMul = CARS[carIdx].coinMul || 1.0;
  const base = Math.floor(placeBase * lvlMul) + timeCoin + botBonus;
  const total = Math.floor(base * carMul);
  const gemEarned = Math.random() < (CARS[carIdx].gemChance || 0);
  if (gemEarned) addGems(1);
  earnings = {
    distanceKm:0, distanceCoins:0, speedingSec:gameTime,
    speedCoins: timeCoin, overtakes:0, overtakeCoins:0,
    waves:0, waveCoins:0, topSpeedKmh: arenaPlayer.fwd * 3.6, topSpeedBonus: Math.floor(placeBase * lvlMul),
    total, mode:'ARENA', placement: arenaPlacement,
    carMul, gemEarned, lvlMul, botBonus, botsDown, masterBonus: 0,
  };
  lastEarned = total; if (total > 0) setCoins(coins + total);
  addQP('arena_3', 1); if (arenaPlacement === 1) addQP('arena_win', 1);
}

function spawnPulse(count, truck) {
  const lanes = [];
  for (let i = 0; i < LANE_COUNT; i++) lanes.push(i);
  for (let i = lanes.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lanes[i], lanes[j]] = [lanes[j], lanes[i]];
  }
  for (let i = 0; i < count; i++) {
    const lane = lanes[i % lanes.length];
    const zOff = i >= lanes.length ? 30 + Math.random() * 20 : 0;
    spawnEnemy({ lane, truck, zOffset: zOff });
  }

function takeDamage(e) {
  spawnExplosion3D(e.worldX, 1.2, e.worldZ);
  spawnExplosion3D(player.worldX, 1.2, 0);
  addShake(0.2 + Math.min(0.4, speed / 100), 400);
  playCrashSound();
  crashes++;
  invulnTime = 1500;
  damageBanner = 1200;
  const speedFactor = 1 + Math.max(0, (speed - 25) / 50);
  const hitsToKill = CARS[carIdx].hitsToKill || 4;
  const per = (1.0 / hitsToKill) * speedFactor;
  const noise = () => 0.85 + Math.random() * 0.3;
  dmg.body   = Math.min(1, dmg.body   + per * noise());
  dmg.tires  = Math.min(1, dmg.tires  + per * noise());
  dmg.engine = Math.min(1, dmg.engine + per * noise());
  speedBoost = Math.max(-5, speedBoost - 6);
  if (dmg.body >= 0.99 && dmg.tires >= 0.99 && dmg.engine >= 0.99) {
    state = STATE.DEAD;
    addShake(0.6, 900);
    crashAutoTimer = 3000;
    if (score > getBest()) { saveBest(Math.floor(score)); }
    earnings = computeEarnings();
    lastEarned = earnings.total;
    if (lastEarned > 0) setCoins(coins + lastEarned);
    triggerQP('earn_500', lastEarned); addQP('dodge_50', dodged); addQP('dist_5km', Math.floor(distanceM));
    if (MODES[modeIdx]==='HEAD ON') triggerQP('score_100', Math.floor(score));
    triggerQP('survive_2m', Math.floor(gameTime/1000));
  }
}

function computeEarnings() {
  const km = distanceM / 1000;
  const distanceCoins = Math.floor(km * 18);
  const speedCoins = Math.floor((speedingTime / 1000) * 1);
  const overtakeCoins = dodged * 1;
  const waveCoins = wave * 25;
  const topSpeedKmh = maxSpeed * 3.6;
  const topSpeedBonus = Math.floor(Math.max(0, topSpeedKmh - 100) * 0.2);
  const diffMul = [0.7, 1.0, 2.0][difficultyIdx];
  const carMul  = CARS[carIdx].coinMul || 1.0;
  const base = distanceCoins + speedCoins + overtakeCoins + waveCoins + topSpeedBonus;
  const total = Math.floor(base * diffMul * carMul);
  // gem drop roll
  const gemEarned = Math.random() < (CARS[carIdx].gemChance || 0);
  if (gemEarned) addGems(1);
  return {
    distanceKm: km, distanceCoins,
    speedingSec: speedingTime / 1000, speedCoins,
    overtakes: dodged, overtakeCoins,
    waves: wave, waveCoins,
    topSpeedKmh, topSpeedBonus,
    total, diffMul, carMul, gemEarned,
  };
}
