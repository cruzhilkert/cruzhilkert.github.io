  const contentY=RB+72, contentH=H-contentY-40;

  if(garageTab==='cars'){
    const cardH=44, gap=5, visibleCount=6;
    const maxScroll=Math.max(0,CARS.length-visibleCount);
    garageCarScroll=Math.max(0,Math.min(garageCarScroll,maxScroll));
    const startIdx=Math.floor(garageCarScroll);
    const endIdx=Math.min(CARS.length,startIdx+visibleCount);
    // scroll hint arrows
    if(startIdx>0){ctx.fillStyle='rgba(255,213,74,0.7)';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('▲',W/2,contentY+6);}
    if(endIdx<CARS.length){ctx.fillStyle='rgba(255,213,74,0.7)';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('▼',W/2,contentY+contentH+4);}
    for(let i=startIdx;i<endIdx;i++){
      const car=CARS[i];
      const cy=contentY+(i-startIdx)*(cardH+gap);
      const owned_=isUnlocked(i);
      const equipped=carIdx===i;
      // card bg
      ctx.fillStyle=equipped?'rgba(255,68,221,0.18)':'rgba(255,255,255,0.04)';
      roundedRect(14,cy,W-28,cardH,7); ctx.fill();
      ctx.strokeStyle=equipped?'#ff44dd':'rgba(255,255,255,0.12)';
      ctx.lineWidth=equipped?2:1; roundedRect(14,cy,W-28,cardH,7); ctx.stroke();
      // color swatch
      ctx.fillStyle='#'+car.body.toString(16).padStart(6,'0');
      ctx.beginPath(); ctx.roundRect(22,cy+cardH/2-10,20,20,4); ctx.fill();
      // name & desc
      ctx.textAlign='left'; ctx.fillStyle=owned_?'#ffd54a':'#aaa';
      ctx.font='bold 12px system-ui';
      ctx.fillText(car.name,50,cy+cardH/2-3);
      ctx.fillStyle='#888'; ctx.font='10px system-ui';
      ctx.fillText(car.desc,50,cy+cardH/2+10);
      // cost for locked cars
      if(!owned_){
        const gc=car.gemCost||0;
        ctx.fillStyle=coins>=car.cost?'#aaffaa':'#ff8888'; ctx.font='9px system-ui';
        ctx.fillText('● '+car.cost,50,cy+cardH/2+21);
        if(gc>0){
          ctx.fillStyle=gems>=gc?'#cc99ff':'#ff6688';
          ctx.fillText('  ◆ '+gc,50+ctx.measureText('● '+car.cost).width+2,cy+cardH/2+21);
        }
      }
      // action button
      const bw=76,bh=24,bx=W-14-bw-4,by_=cy+cardH/2-bh/2;
      if(equipped){
        garageBtn('EQUIPPED',bx,by_,bw,bh,null,{active:true,small:true});
      }else if(owned_){
        garageBtn('EQUIP',bx,by_,bw,bh,()=>{carIdx=i;localStorage.setItem('headon_car',i);rebuildPlayerCar();},{small:true});
      }else{
        const gc=car.gemCost||0;
        const canAfford=coins>=car.cost && gems>=gc;
        const buyLabel=gc>0?'BUY ◆'+gc:'BUY ●'+car.cost;
        garageBtn(buyLabel,bx,by_,bw,bh,canAfford?()=>{setCoins(coins-car.cost);if(gc>0)addGems(-gc);unlockCar(i);}:null,{disabled:!canAfford,small:true});
      }
    }
  }

  if(garageTab==='paint'){
    const cols=4, swW=(W-28-cols*6)/cols, swH=78, gap=5;
    SHOP_PAINTS.forEach((paint,i)=>{
      const col=i%cols, row=Math.floor(i/cols);
      const px=14+col*(swW+gap), py=contentY+row*(swH+gap);
      const owned_=isOwned(paint.id);
      const equipped=equippedPaint===paint.id;
      // card
      ctx.fillStyle=equipped?'rgba(255,68,221,0.2)':'rgba(255,255,255,0.04)';
      roundedRect(px,py,swW,swH,7); ctx.fill();
      ctx.strokeStyle=equipped?'#ff44dd':'rgba(255,255,255,0.12)';
      ctx.lineWidth=equipped?2:1; roundedRect(px,py,swW,swH,7); ctx.stroke();
      // secret obsidian treatment — hide details until owned
      const isSecret = paint.id === 'paint_obsidian' && !owned_;
      // color swatch
      const swatchColor=paint.color!=null?'#'+paint.color.toString(16).padStart(6,'0'):'#'+CARS[carIdx].body.toString(16).padStart(6,'0');
      const swX=px+swW/2-18, swY=py+8, swW2=36, swH2=28;
      if(isSecret){
        // mystery swatch
        ctx.fillStyle='#0a0010';
        ctx.beginPath(); ctx.roundRect(swX,swY,swW2,swH2,4); ctx.fill();
        ctx.fillStyle='#440066'; ctx.font='bold 14px system-ui'; ctx.textAlign='center';
        ctx.fillText('?',px+swW/2,swY+swH2/2+5);
      } else if(paint.special==='ocean'){
        // animated water ripple gradient
        const wt=(Date.now()/900)%1;
        const wg=ctx.createLinearGradient(swX,swY,swX+swW2,swY+swH2);
        wg.addColorStop(0,'#1565c0'); wg.addColorStop(wt,'#80deea'); wg.addColorStop(1,'#1976d2');
        ctx.fillStyle=wg;
      } else if(paint.special==='gold'){
        const gg=ctx.createLinearGradient(swX,swY,swX+swW2,swY+swH2);
        gg.addColorStop(0,'#bfa000'); gg.addColorStop(0.4,'#fff176'); gg.addColorStop(0.7,'#ffd54a'); gg.addColorStop(1,'#b8860b');
        ctx.fillStyle=gg;
      } else if(paint.special==='emerald'){
        const eg=ctx.createLinearGradient(swX,swY,swX+swW2,swY+swH2);
        eg.addColorStop(0,'#1b5e20'); eg.addColorStop(0.45,'#69ff47'); eg.addColorStop(1,'#2e7d32');
        ctx.fillStyle=eg;
      } else if(paint.special==='inferno'){
        const ig=ctx.createLinearGradient(swX,swY,swX,swY+swH2);
        ig.addColorStop(0,'#ffee00'); ig.addColorStop(0.5,'#ff6600'); ig.addColorStop(1,'#880000');
        ctx.fillStyle=ig;
      } else if(paint.special==='obsidian'){
        const og=ctx.createLinearGradient(swX,swY,swX+swW2,swY+swH2);
        const ot=(Date.now()/1200)%1;
        og.addColorStop(0,'#0a0010'); og.addColorStop(ot,'#6600aa'); og.addColorStop(1,'#1a0030');
        ctx.fillStyle=og;
      } else {
        ctx.fillStyle=swatchColor;
      }
      if(!isSecret){ ctx.beginPath(); ctx.roundRect(swX,swY,swW2,swH2,4); ctx.fill(); }
      if(!isSecret && paint.color==null){ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(swX,swY,swW2,swH2,4);ctx.stroke();}
      // special fx badge
      if(!isSecret && paint.special){ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.roundRect(swX+swW2-14,swY+1,13,10,2);ctx.fill();ctx.fillStyle='#fff';ctx.font='7px system-ui';ctx.textAlign='left';ctx.fillText('FX',swX+swW2-12,swY+9);}
      // name
      ctx.textAlign='center'; ctx.fillStyle= isSecret ? '#660099' : '#eee'; ctx.font='bold 10px system-ui';
      ctx.fillText(isSecret ? '??? SECRET' : paint.name, px+swW/2, py+48);
      // cost/owned
      ctx.fillStyle='#aaa'; ctx.font='9px system-ui';
      ctx.fillText(isSecret ? '●'+paint.cost : (paint.cost===0?'FREE':'●'+paint.cost), px+swW/2, py+60);
      // button
      const bw2=swW-12,bh2=18,bx2=px+6,by2=py+swH-22;
      const obsidianLocked = paint.id==='paint_obsidian' && !owned_ &&
        !(equippedPaint==='paint_ocean' && equippedTrail==='trail_fire');
      if(equipped){
        garageBtn('ON',bx2,by2,bw2,bh2,null,{active:true,small:true});
      }else if(owned_){
        garageBtn('EQUIP',bx2,by2,bw2,bh2,()=>equipPaint(paint.id),{small:true});
      }else if(obsidianLocked){
        garageBtn('LOCKED',bx2,by2,bw2,bh2,null,{disabled:true,small:true});
      }else{
        const canAfford=coins>=paint.cost;
        garageBtn('BUY',bx2,by2,bw2,bh2,canAfford?()=>{setCoins(coins-paint.cost);ownItem(paint.id);equipPaint(paint.id);}:null,{disabled:!canAfford,small:true});
      }
    });
  }

  if(garageTab==='trails'){
    const tH=33, gap=3;
    SHOP_TRAILS.forEach((trail,i)=>{
      const ty=contentY+i*(tH+gap);
      const owned_=isOwned(trail.id);
      const equipped=equippedTrail===trail.id;
      ctx.fillStyle=equipped?'rgba(255,68,221,0.2)':'rgba(255,255,255,0.04)';
      roundedRect(14,ty,W-28,tH,7); ctx.fill();
      ctx.strokeStyle=equipped?'#ff44dd':'rgba(255,255,255,0.12)';
      ctx.lineWidth=equipped?2:1; roundedRect(14,ty,W-28,tH,7); ctx.stroke();
      // trail preview (dots)
      for(let d=0;d<6;d++){
        const a=0.15+d*0.14;
        ctx.globalAlpha=a;
        ctx.fillStyle=trail.color;
        ctx.beginPath(); ctx.ellipse(28+d*14,ty+tH/2,4,2.5,0,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
      // name + cost
      ctx.textAlign='left'; ctx.fillStyle='#eee'; ctx.font='bold 11px system-ui';
      ctx.fillText(trail.name,112,ty+12);
      ctx.fillStyle='#aaa'; ctx.font='9px system-ui';
      ctx.fillText(trail.cost===0?'FREE':'● '+trail.cost+' coins',112,ty+23);
      // button
      const bw3=66,bh3=22,bx3=W-14-bw3-4,by3=ty+tH/2-bh3/2;
      if(equipped){
        garageBtn('ACTIVE',bx3,by3,bw3,bh3,null,{active:true,small:true});
      }else if(owned_){
        garageBtn('EQUIP',bx3,by3,bw3,bh3,()=>equipTrail(trail.id),{small:true});
      }else{
        const canAfford=coins>=trail.cost;
        garageBtn('BUY',bx3,by3,bw3,bh3,canAfford?()=>{setCoins(coins-trail.cost);ownItem(trail.id);equipTrail(trail.id);}:null,{disabled:!canAfford,small:true});
      }
    });
  }

  // back button
  const backW=120,backH=32,backX=W/2-60,backY=H-42;
  garageBtn('← BACK',backX,backY,backW,backH,()=>{state=STATE.MENU;});
  ctx.textAlign='left';
}

function drawGemShop() {
  ctx.fillStyle = 'rgba(0,0,0,0.88)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  // title
  ctx.font = 'bold 30px system-ui';
  ctx.fillStyle = '#b39ddb';
  ctx.fillText('◆  GEM  SHOP  ◆', W/2, 52);

  // balance
  ctx.font = '14px system-ui';
  ctx.fillStyle = '#ffd54a';
  ctx.fillText('● ' + coins.toLocaleString() + '  coins', W/2 - 60, 82);
  ctx.fillStyle = '#b39ddb';
  ctx.fillText('◆ ' + gems + '  gems', W/2 + 60, 82);

  ctx.font = '11px system-ui';
  ctx.fillStyle = '#888';
  ctx.fillText('Spend coins to buy gems. Gems unlock premium cars.', W/2, 102);

  // deals
  const DEALS = [
    { coins: 20000,  gems: 1,  label: '1 GEM' },
    { coins: 55000,  gems: 3,  label: '3 GEMS' },
    { coins: 85000,  gems: 5,  label: '5 GEMS' },
    { coins: 150000, gems: 10, label: '10 GEMS' },
  ];

  gemShopButtons = [];
  const bw = 320, bh = 52, bx = (W - bw) / 2;
  DEALS.forEach((deal, i) => {
    const by = 128 + i * (bh + 10);
    const canAfford = coins >= deal.coins;
    const hov = mouse.x >= bx && mouse.x <= bx+bw && mouse.y >= by && mouse.y <= by+bh;
    ctx.fillStyle = canAfford
      ? (hov ? 'rgba(179,157,219,0.30)' : 'rgba(179,157,219,0.15)')
      : 'rgba(40,40,50,0.5)';
    roundedRect(bx, by, bw, bh, 8); ctx.fill();
    ctx.strokeStyle = canAfford ? '#b39ddb' : '#444';
    ctx.lineWidth = canAfford ? 1.5 : 1;
    roundedRect(bx, by, bw, bh, 8); ctx.stroke();

    // gem icons
    ctx.font = 'bold 18px system-ui';
    ctx.fillStyle = canAfford ? '#b39ddb' : '#555';
    ctx.textAlign = 'left';
    ctx.fillText('◆'.repeat(Math.min(deal.gems, 5)) + (deal.gems > 5 ? '…' : ''), bx + 16, by + 31);

    // label + cost
    ctx.textAlign = 'right';
    ctx.font = 'bold 15px system-ui';
    ctx.fillStyle = canAfford ? '#ffffff' : '#666';
    ctx.fillText(deal.label, bx + bw - 16, by + 24);
    ctx.font = '12px system-ui';
    ctx.fillStyle = canAfford ? '#ffd54a' : '#555';
    ctx.fillText('● ' + deal.coins.toLocaleString(), bx + bw - 16, by + 42);

    if (canAfford) {
      gemShopButtons.push({ x: bx, y: by, w: bw, h: bh, action: () => {
        setCoins(coins - deal.coins);
        addGems(deal.gems);
      }});
    }
  });

  // back button
  const backW = 130, backH = 32, backX = (W - backW) / 2, backY = H - 52;
  const backHov = mouse.x >= backX && mouse.x <= backX+backW && mouse.y >= backY && mouse.y <= backY+backH;
  ctx.fillStyle = backHov ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.07)';
  roundedRect(backX, backY, backW, backH, 6); ctx.fill();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
  roundedRect(backX, backY, backW, backH, 6); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px system-ui';
  ctx.fillStyle = '#ccc';
  ctx.fillText('← BACK', W/2, backY + 21);
  gemShopButtons.push({ x: backX, y: backY, w: backW, h: backH, action: () => { state = STATE.MENU; } });

  ctx.textAlign = 'left';
}

function drawHelp() {
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd54a';
  ctx.font = 'bold 28px system-ui';
  ctx.fillText('HOW TO PLAY', W/2, 60);
  ctx.fillStyle = '#fff';
  ctx.font = '13px system-ui';
  const lines = [
    'Drive your car. Dodge oncoming traffic!',
    '',
    '←  →  /  A  D     steer (smooth)',
    '↑  ↓  /  W  S     accelerate / brake (Head On)',
    'R                 restart after totaled',
    'Space             confirm / back',
    '',
    'Crashes damage BODY, TIRES, ENGINE.',
    'Each crash worsens speed, handling, and accel.',
    'Better cars survive more hits before being TOTALED.',
    'Faster crashes do more damage.',
    '',
    'CARS — earn coins, unlock better rides:',
    '  CRUISER  free starter (sluggish)',
    '  BLAZE    100 ● top speed +',
    '  NIMBLE   150 ● handling +',
    '  BRUTE    200 ● acceleration +',
    '  GHOST    400 ● top-tier all-rounder',
  ];
  lines.forEach((l, i) => ctx.fillText(l, W/2, 95 + i * 20));
  ctx.fillStyle = '#888'; ctx.font = '12px system-ui';
  ctx.fillText('click anywhere or press Space to go back', W/2, H - 25);
  ctx.textAlign = 'left';
}

function drawCrash() {
  if (earnings && earnings.mode === 'ARENA') { drawArenaCrash(); return; }
  const diffMul  = earnings && earnings.diffMul  || 1;
  const carMul   = earnings && earnings.carMul   || 1;
  const gemEarned= earnings && earnings.gemEarned|| false;
  const extraLines = (diffMul !== 1 ? 1 : 0) + (carMul > 1 ? 1 : 0) + (gemEarned ? 1 : 0);
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, H/2 - 110, W, 230 + extraLines * 18);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff5555';
  ctx.font = 'bold 42px system-ui';
  ctx.fillText('TOTALED', W/2, H/2 - 50);
  ctx.fillStyle = '#fff'; ctx.font = '14px system-ui';
  ctx.fillText('Crashes survived: ' + crashes, W/2, H/2 - 24);
  ctx.fillText('Score: ' + Math.floor(score), W/2, H/2 - 6);
  let lineY = H/2 + 12;
  if (diffMul !== 1) {
    ctx.fillStyle = diffMul > 1 ? '#ff9944' : '#888';
    ctx.font = 'bold 12px system-ui';
    ctx.fillText(DIFFICULTIES[difficultyIdx].name + ' difficulty  ×' + diffMul + ' coins', W/2, lineY);
    lineY += 16;
  }
  if (carMul > 1) {
    ctx.fillStyle = '#aaddff';
    ctx.font = 'bold 12px system-ui';
    ctx.fillText(CARS[carIdx].name + ' bonus  ×' + carMul + ' coins', W/2, lineY);
    lineY += 16;
  }
  ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 18px system-ui';
  ctx.fillText('+ ' + lastEarned + ' coins', W/2, lineY + 4);
  lineY += 22;
  if (gemEarned) {
    ctx.fillStyle = '#b39ddb';
    ctx.font = 'bold 14px system-ui';
    ctx.fillText('◆ GEM FOUND!  ◆ ' + gems + ' total', W/2, lineY + 4);
    lineY += 20;
  }
  ctx.fillStyle = '#bbb'; ctx.font = '12px system-ui';
  ctx.fillText('● ' + coins + '  ◆ ' + gems, W/2, lineY + 4);
  lineY += 20;
  ctx.fillStyle = '#fff'; ctx.font = '14px system-ui';
  ctx.fillText('R to restart · Space for menu', W/2, lineY + 16);
  ctx.textAlign = 'left';
}

function drawArenaCrash() {
  const placement = earnings.placement || 4;
  const labels = ['', '1ST PLACE!', '2ND PLACE', '3RD PLACE', '4TH PLACE'];
  const colors  = ['', '#ffd700',   '#c0c0c0',  '#cd7f32',  '#ff5555'];
  const lvlMul  = earnings.lvlMul || 1;
  const aCarMul = earnings.carMul || 1;
  const masterBonus = earnings.masterBonus || 0;
  const extraH  = (aCarMul > 1 ? 16 : 0) + (earnings.gemEarned ? 18 : 0) + (masterBonus ? 22 : 0);
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, H/2 - 134, W, 290 + extraH);
  ctx.textAlign = 'center';
  ctx.fillStyle = colors[placement];
  ctx.font = 'bold 44px system-ui';
  ctx.fillText(labels[placement], W/2, H/2 - 72);
  // level badge
  ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 13px system-ui';
  ctx.fillText('LEVEL ' + arenaLevel + '  ×' + lvlMul + ' level bonus' + (arenaLevel <= 5 ? '  🔒 barrier' : '  🔓 open'), W/2, H/2 - 50);
  ctx.fillStyle = '#ccc'; ctx.font = '12px system-ui';
  ctx.fillText('Survived ' + Math.floor(gameTime) + 's  ·  ' + (earnings.botsDown || 0) + ' / 3 bots down', W/2, H/2 - 30);
  // earnings breakdown
  ctx.fillStyle = '#aaa'; ctx.font = '11px system-ui';
  ctx.fillText(
    'place ●' + (earnings.topSpeedBonus || 0) +
    '  +  time ●' + (earnings.speedCoins || 0) +
    '  +  bots ●' + (earnings.botBonus || 0),
    W/2, H/2 - 10);
  if (aCarMul > 1) {
    ctx.fillStyle = '#aaddff'; ctx.font = 'bold 11px system-ui';
    ctx.fillText(CARS[carIdx].name + ' car bonus  ×' + aCarMul, W/2, H/2 + 6);
  }
  ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 22px system-ui';
  ctx.fillText('+ ' + lastEarned + ' coins', W/2, H/2 + 28);
  let lineY2 = H/2 + 46;
  if (masterBonus) {
    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 14px system-ui';
    ctx.fillText('🏆 ALL LEVELS COMPLETE!  + ' + masterBonus + ' bonus!', W/2, lineY2);
    lineY2 += 20;
  }
  if (earnings.gemEarned) {
    ctx.fillStyle = '#b39ddb'; ctx.font = 'bold 13px system-ui';
    ctx.fillText('◆ GEM FOUND!  ◆ ' + gems + ' total', W/2, lineY2);
    lineY2 += 18;
  }
  ctx.fillStyle = '#bbb'; ctx.font = '12px system-ui';
  ctx.fillText('● ' + coins + '  ◆ ' + gems, W/2, lineY2);
  ctx.fillStyle = '#fff'; ctx.font = '14px system-ui';
  ctx.fillText('R  retry same level  ·  Space  change level / menu', W/2, H/2 + 94);
  ctx.textAlign = 'left';
}

// ===== loop =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(50, now - last);
  last = now;
  update(dt);
  syncScene();
  renderer.render(scene, camera);
  drawHud2D();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
